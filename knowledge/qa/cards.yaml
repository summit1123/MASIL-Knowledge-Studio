        a: 정확한 지적이고, 방향은 저희 가정이며 반대일 수 있습니다. 그래서 방향을 주장하지 않습니다 — eps를 전국 단일값으로 바꿔 재판정해도 판정 변화가 사실상 없어서(고정 기준 0/180 · rolling 재검증 3/180 경계) 그 논쟁이 결과를 바꾸지 않습니다. 실제 방향은 파일럿 산포 측정이 정합니다.
