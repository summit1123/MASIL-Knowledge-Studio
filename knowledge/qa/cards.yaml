  - question_ko: "'루프'라는 표현 — 원하는 결과가 나올 때까지 돌리는 것 아닌가"
    topic: 루프-용어
    source: "sources/02_마스터답변안_전항목.md#9-루프loop-용어-사용 · sources/07_근거지도.md#9-루프-용어"
    direct_answer_ko: "지적을 수용해 단어를 폐기하고 덱 문구를 'multi-agent pipeline(생성→검토→승인 체인)'으로 교체 확정했다(덱 반영은 팀 액션 진행 중 — 미완). 그 단어가 있었던 이유는 체인이 실재했기 때문이다: 레거시 설계 단계의 생성(candidate_rules.json)→크리틱(rule_review.json)→승인(simulation_summary.json) 3단 체인이 실제로 돌았고 산출물이 저장소에 감사 가능한 형태로 남아 있다 — 다만 한 방향으로 흐르는 체인이지 목표치에 수렴할 때까지 되도는 반복이 아니어서 'loop'은 부정확한 명명이었다. 현재 판정은 결정론 엔진이다(시드 sha256(전역시드|driver_id|month), 같은 입력이면 비트 동일 출력, 판정 계약 테스트 27건으로 상시 고정). 에이전트가 남은 자리는 판정 밖 두 곳뿐 — 페르소나 프로파일 1회 생성 후 고정 커밋(mobility_profiles.json), 리포트 문안 생성(숫자는 엔진 확정값 인용만·재계산 금지·실패 시 결정론 폴백). 재시도는 JSON 구조 계약 위반 시에만 최대 3회이고, 판정 결과는 재시도 판단의 입력이 아니다 — '원하는 결과가 나올 때까지 반복'이 구조적으로 불가능하다."
    spoken_answer_ko: "지적해주신 대로 용어가 부정확했고, 덱에서 바로잡고 있습니다. 저희 구조는 원하는 결과가 나올 때까지 되도는 반복이 아니라, 생성에서 검토, 승인으로 한 번 흐르는 체인이었습니다. 그래서 'multi-agent loop'을 'multi-agent pipeline — 생성·검토·승인'으로 바꿨습니다. 배경만 짧게 말씀드리면, 초기 설계 단계에서 후보 규칙을 만들고, 크리틱이 위험과 후속 과제를 적어 돌려주고, 마지막에 승인 게이트를 통과시키는 3단 체인이 실제로 돌았고, 그 산출물이 지금도 저장소에 파일로 남아 있습니다. 크리틱이 \"30명 합성 픽스처만으로 일반화하지 말라\"는 위험을 스스로 기록해 둔 것까지 그 안에 있습니다. 다만 지금은 판정을 결정론 엔진으로 옮겼습니다. 보험 판정은 같은 입력이면 같은 결과가 나와야 하고 감사가 가능해야 하기 때문에, 시드를 고정하고 판정 계약 테스트 27건으로 묶어뒀습니다. 현재 에이전트가 하는 일은 두 가지뿐입니다 — 페르소나의 이동 프로필을 한 번 만들어 캐시로 커밋하는 것, 그리고 고객과 직원이 읽을 리포트 문안을 쓰는 것. 판정에는 관여하지 않습니다. 이 축소는 후퇴가 아니라, 상품으로 내보내기 위한 선택이었습니다."
    do_not_say:
      - 루프
      - multi-agent loop
      - Agent–Validator Loop
    evidence_ref:
      - 재시도 구조(코드)
      - mobility_profiles.json 고정 커밋
      - 레거시 체인 산출물(candidate_rules.json·rule_review.json·simulation_summary.json)
      - 덱 문구 교체(미완)
    followups:
      - q: (내부 체크) 덱은 고쳤나
        a: "미완 — 발표 자료에 '루프'가 남아 있으면 이 답변이 무의미해지므로 최우선 확인."
    flags:
      - "덱 문구 교체 미완(근거지도 §9 ✕ 등급) — 논리 고리는 전부 ◎인데 덱만 안 고쳐짐. 발표 자료에 '루프' 잔존 여부 최우선 확인"
    duplicate_of: "[9번] '루프'는 원하는 결과가 나올 때까지 반복하는"
