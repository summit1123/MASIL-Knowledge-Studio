  - question_ko: eps(260m)를 바꾸면 생활권이 커지나요?
    direct_answer_ko: 아니요. 거점이 몇 개로 묶이는지만 달라지고 원 크기는 그대로입니다. 260m는 원의 크기에 들어가지 않습니다 — 원 공식은 500m와 P90과 2km로만 구성됩니다.
