  - question_ko: 생활권이 여러 개면 위험한 것 아닌가?
    topic: 복수생활권-판정
    source: "sources/부록D_해설_팀원용.md#3절 ⑤ 복수 생활권형 · sources/안전운전자_매력도_정리.md#5절 실측"
    direct_answer_ko: "아닙니다. 거점 수가 아니라 행동으로 판정합니다. ⑤ 복수 생활권형(월 42방문, 거점 여러 개)은 바로 '생활권이 여러 개면 위험하다'는 오판을 방지하기 위해 설계된 시험 유형이고, 실측 우대 30 전원입니다. 규칙성은 거점 개수가 아니라 각 거점 방문의 반복성으로 측정합니다(서지 확정 전엔 문헌명 없이 '이동패턴 연구의 규칙성 정의'로 언급 — Goulet-Langlois et al. 2017 정의 계열). 월 42방문이라는 값 자체도 기능적 필요입니다 — 거점 2~3개가 각각 '서로 다른 3일' 문턱을 넘어 형성되려면 방문이 많아야 하고, 해외 코호트 평균대(35~44) 안입니다. 할인율 실측으로도 복수 생활권형은 기존 마일리지 19.5% → 후보(오버레이) 24.3%로 오히려 올라갑니다."
    do_not_say:
      - Goulet-Langlois et al. 2017을 서지 확정 전에 문헌명으로 인용
    evidence_ref:
      - final/근거자료/부록D_해설_팀원용.md 3절 ⑤
      - 복수 생활권형 우대 30/30 실측
      - 평균 할인율 19.5% → 24.3%(안전운전자_매력도_정리 5절)
