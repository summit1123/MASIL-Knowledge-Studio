    direct_answer_ko: "데이터는 3경로 단계 확보(계획, 실행 전 — ✕): ① 기존 UBI 채널 — 국내 UBI는 앱이 산정한 점수만 동의하에 보험사로 전송하는 구조(보험연구원 KIRI리포트 2024.7)라 원좌표 반출 없이 시작 가능 ② 특약 동의 기반 신규 수집 — 필요한 것은 궤적이 아니라 도착지 좌표+방문 날짜뿐이라 동의 범위가 통상 UBI보다 좁음 ③ 공공·제휴(TAAS·노인실태조사·건보·지자체). 파일럿은 기준선 2개월+관찰 6개월, 지역 유형 2개 이상 코호트, N은 UBI 가입 고령 고객 모수 확인 후 확정. 사고잦은곳은 판정 (−)요소가 아니라 케어 리포트의 안전 안내로 채택(설계 결정, 미구현) — 감점으로 넣으면 사고다발지 인근 거주자가 행동과 무관하게 감점돼 위치 중립(location_penalty 0.0)과 3환경 케어 60/60 실측이 함께 무너진다. 도로 위계는 현재 미반영 — 도로 등급 파악에 맵매칭(궤적 재구성)이 필요해 최소수집 거버넌스와 충돌(능력이 아니라 우선순위 판단)하며, 2단계로 평균속도·시간대 경량 추정과 동일값 대 차등값 재무 비교를 파일럿 과제로 올린다(비교 도구인 요율 샌드박스는 이미 작동). 공공데이터 출처는 링크 19개로 문서 중 가장 충실(○)."
