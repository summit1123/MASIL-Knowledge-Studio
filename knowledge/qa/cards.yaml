  - question_ko: 평소 패턴 대비 변화를 기준으로 삼으면, 평소 안전하던 사람이 단 한 번의 예외적 운행만으로 보험료가 오를 수 있지 않습니까? 안전 운전자에게 매력 없는 상품 아닌가요? (7/24 심사 5번)
    direct_answer_ko: 최악의 경우가 할증이 아니라 할인 축소다(할증 경로 부재, 하한 = 기준 요율). 단 한 번의 예외 운행은 월 집계 비율·AND 게이트·사람 검토의 3중 구조에서 판정에 진입조차 못 한다(1건 = 약 3.1%p, 임계의 1/8). 다만 현행 any 규칙에서 한 달 발동으로 연간 13%p 감액이 걸리는 한계는 정직하게 고지하고, 발생 월수 비례를 권고 중.
    spoken_answer_ko: "타당한 우려이고, 저희가 가장 조심해서 설계한 지점입니다.\n\n먼저 상품의 지위입니다. 저희는 요율표가 아니라 기존 마일리지 할인 위에 얹히는 할인 자격 점수입니다. 코드에 할증 경로가 아예 없어서 최악의 경우가 할증이 아니라 할인 축소이고, 하한은 기준 요율입니다.\n\n다음은 산수입니다. 판정은 트립이 아니라 월 집계 비율이고, 직전 두 달 평균 대비 이동이 25%p, 위험행동이 20%p 동시에 올라야 열립니다. 저희 데이터의 월 운행 중앙값이 32건이니 명절에 한 번 멀리 다녀오신 것이 움직이는 폭은 약 3%p, 임계의 8분의 1입니다. 게다가 명절·병원·여행은 이동 축만 건드려서 AND 게이트에서 걸리지 않습니다. 이동만 크게 변한 대조군 30건에서 이동 지표가 임계를 넘은 달이 191 케이스-월인데도 케어가 한 번도 열리지 않았고, 평균 할인은 21.2%에서 26.7%로 오히려 올라갔습니다.\n\n정직하게 한 가지 더 말씀드리겠습니다. 현재 규칙은 열두 달 중 한 달만 케어가 열려도 그 해 할인이 13%p 줄어듭니다. 실측에서 케어 대상 30건 전원이 한 달 발동이라 이 사례가 바로 실측의 전형입니다. 산식으로 계산해보면, 열한 달을 잘 타고 한 달 급변한 고객이 열두 달 내내 애매했던 고객보다 13%p 불리해지는 역전이 나옵니다. 그래서 감지는 유지하되 요율 반영을 발생 월수에 비례시키는 방향으로 보고 있습니다. 선언 파라미터라 손익까지 즉시 재계산됩니다."
    do_not_say:
      - "\"우리 시뮬레이션에 그런 사례가 없다\"를 안전의 근거로"
      - "\"벌점\"(→ 할인 축소)"
      - "대조군 \"30명\"(→ 10명 × 3환경 = 30 시나리오)"
    followups:
      - q: 그래서 전 달보다 내는 돈이 늘 수 있습니까?
        a: "네, 할인이 줄면 그렇습니다. 다만 할증은 구조상 없어 최악이 기준 요율이고, 조건은 '한 번의 운행'이 아니라 '지속된 동시 급변 + 사람 검수'입니다."
      - q: 케어가 한 달만 떠도 1년치 감액인가요?
        a: 현 규칙은 그렇고, 유효한 지적입니다. rolling 실측에서 케어 30건 전원이 한 달 발동이라 이 사례가 실측의 전형이고, 13%p 역전도 그대로 확인됩니다. 발생 월수 비례(1개월 시 1.08%p)가 저희 권고안입니다.
      - q: 안전한 사람은 이미 마일리지 할인을 받는데 왜 이 특약을 삽니까?
        a: 마일리지는 거리만 봅니다. Candrive/Ozcandrive(Langford et al. 2013, AAP)는 연 5,000km 미만 저주행 고령 집단의 km당 사고 위험이 오히려 높다고 보고했고, 거리만 보는 체계에서는 실제로 안전한 분이 그렇지 않은 분과 같은 할인을 받습니다. 저희 실측에서 안정 저주행형은 33.8%에서 38.9%로 올라갑니다.
      - q: 이사하면 모든 길이 낯설어져 불리해지지 않나요? (1차 CSC)
        a: 이동만 변하고 운전이 안전하면 게이트가 열리지 않습니다. 이사형 대조군 30건에서 케어 발동 0건이고 평균 할인은 21.2%→26.7%로 올랐습니다. 생활권은 기준선 재학습으로 새 거처 기준으로 다시 잡힙니다.
    evidence_ref:
      - "engine.py:1069-1070"
      - "engine.py:1187"
      - 안전운전자_매력도_정리.md 2·3·6·7절
  - question_ko: Safe Zone이 반경(거리) 기준으로만 설정돼 있는데, 도시와 농촌의 1km는 의미가 다릅니다. 지역 유형에 따라 차등을 두었습니까? (7/24 심사 4번)
    direct_answer_ko: 지역을 사람이 분류하지 않는다. 판정은 도착지가 개인 생활권 원 안인지만 보고, 원의 크기는 개인 방문 분포(P90)가 정해 지역 특성을 자동 흡수한다(광역 813m vs 도심 500m). 지역 설정이 판정을 좌우하지 않음을 실험 A(단일 eps 재판정)·실험 B(3지형 판정)로 확인했고, 운영에서 지역을 나눌지까지 실데이터 측정이 결정한다.
    spoken_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 세 가지로 말씀드리겠습니다.\n\n첫째, 저희가 보는 것은 도착지 하나입니다. 원장에 출발점이나 경로 컬럼이 아예 없습니다. 어떤 지형을 지났는지가 아니라 '평소 가던 곳인가'만 보기 때문에 지형 분류가 판정에 개입할 통로가 없습니다.\n\n둘째, 지역 차이는 개인 실측이 흡수합니다. 생활권 원의 크기는 그 사람 방문 분포의 P90이 정합니다. 같은 규칙인데 광역 거주자는 813m, 도심 거주자는 500m로 갈립니다 — 저희가 나눈 게 아니라 데이터가 나눈 겁니다.\n\n셋째, 실측으로 두 번 확인했습니다. 저희 설정을 바꿔서, 지역별로 다르게 주던 eps를 전국 하나로 통일해 180건을 재판정했더니 판정 변화가 사실상 없었습니다(고정 기준 0건 · 갱신형 재검증 경계 3건). 그리고 고객 쪽을 바꿔서, 같은 60명을 도심·교외·광역 세 지형에 각각 놓았더니 케어는 60명 전원, 우대는 54명이 동일했습니다. 지역이 사람의 판정을 바꾸지 않는다는 뜻이고, 농촌 거주자나 정기 통원자가 구조적으로 불이익받지 않는다는 공정성 증거이기도 합니다.\n\neps 260m는 장소 인식 문헌의 통용 대역 200~300m의 중앙값으로 잡은 설계값입니다. 운영에서는 이 값을 정하지 않고 잽니다 — 재방문 산포를 실측하는 절차가 구현돼 있고, 지역을 나눌지 여부와 그 방향까지 측정이 결정합니다."
    do_not_say:
      - "\"지역별로 eps를 차등했다\"를 성과로"
      - "\"이미 3층으로 차등돼 있습니다\"(종전 답변 — 실제 구조와 반대)"
      - 실험 A와 B 혼용
      - 260/520/1,100 숫자를 슬라이드에 크게
    followups:
      - q: 도심이 오히려 주차가 어려워 산포가 클 텐데 왜 도심 eps가 작은가?
        a: 정확한 지적입니다. 방향은 저희 가정이고 반대일 수 있습니다. 그래서 방향을 주장하지 않습니다 — eps를 전국 단일값으로 바꿔 재판정해도 180건 판정이 동일해서, 그 논쟁이 결과를 바꾸지 않습니다. 실제 방향은 파일럿 산포 측정이 정합니다.
      - q: 그럼 지역 차등을 한 게 아니지 않나?
        a: "사람이 지역을 분류해 다른 잣대를 주는 방식은 하지 않습니다. 대신 개인 실측이 지역 특성을 흡수해 결과적으로 원 크기가 갈립니다(광역 813m vs 도심 500m). 심사에서 지적하신 \"도심 1km와 농촌 1km의 의미 차이\"는 이 층에서 반영됩니다."
      - q: 260m는 어디서 나온 값인가?
        a: 장소 인식 연구의 공간 임계 대역입니다 — Zheng 2009가 200m, Montoliu 2013이 250m(권장 200~300m)를 씁니다. 260m는 그 대역의 중앙이고, 절대값을 주는 문헌은 없으므로 설계값임을 인정합니다. 운영값은 실데이터 k-거리로 재도출합니다.
      - q: HDBSCAN을 쓰면 eps가 필요 없지 않나?
        a: "HDBSCAN의 핵심 계산(k번째 이웃까지 거리)은 저희도 씁니다. 다만 개인마다 매번 추정하지 않고 전체에서 한 번 측정해 고정값으로 씁니다. 개인당 점이 100개 수준이라 개인 추정은 우연에 흔들리지만 수천 명을 모으면 안정적이기 때문이고, 그래야 \"반경 260m\"라는 말할 수 있는 숫자가 남습니다."
      - q: 경로 중 절반만 익숙한 길이면 어떻게 되나? (1차 CSC)
        a: "저희는 경로를 수집하지 않습니다. 도착지 기준이라 \"20km 중 10km\" 같은 구분이 발생하지 않습니다. 경로 반영은 맵매칭이 필요해 최소수집 원칙과 충돌하므로 로드맵 과제입니다."
