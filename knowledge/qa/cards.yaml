    source: "sources/02_마스터답변안_전항목.md#§9('루프(Loop)' 용어 사용) · sources/07_근거지도.md#§9"
    direct_answer_ko: "지적을 전면 수용해 '루프'를 철회하고, 덱 문구를 \"multi-agent pipeline(생성→검토→승인 체인)\"(대안: \"agent-assisted design process\")으로 교체 확정했다(덱 반영은 팀 액션으로 진행 중). 현재 판정 경로에는 반복 탐색이 존재하지 않는다 — 판정은 시드 고정 결정론 엔진(sha256(전역시드|driver_id|month), 같은 입력이면 비트 동일 출력)으로 이관돼 판정 계약 테스트 27건(전체 pytest 254·JS 22)으로 상시 고정되며, 에이전트가 남은 자리는 판정 밖 두 곳 — 페르소나 이동 프로필 1회 생성 후 캐시 커밋, 리포트 문안 생성(엔진 확정값 인용만) — 뿐이다. 프로필 재시도(최대 3회)는 JSON 구조 계약 위반일 때만 발동하고 판정 결과는 재시도 판단의 입력이 아니므로 '원하는 결과가 나올 때까지 반복'이 구조적으로 불가능하다. 레거시 생성→크리틱→승인 3단 체인의 산출물(candidate_rules.json → rule_review.json → simulation_summary.json)은 저장소에 감사 가능한 형태로 남아 있다."
    spoken_answer_ko: "지적해주신 대로 용어가 부정확했고, 덱에서 바로잡고 있습니다. 저희 구조는 원하는 결과가 나올 때까지 되도는 반복이 아니라, 생성에서 검토, 승인으로 한 번 흐르는 체인이었습니다. 그래서 'multi-agent loop'을 'multi-agent pipeline — 생성·검토·승인'으로 바꿨습니다. 배경만 짧게 말씀드리면, 초기 설계 단계에서 후보 규칙을 만들고, 크리틱이 위험과 후속 과제를 적어 돌려주고, 마지막에 승인 게이트를 통과시키는 3단 체인이 실제로 돌았고, 그 산출물이 지금도 저장소에 파일로 남아 있습니다. 크리틱이 \"30명 합성 픽스처만으로 일반화하지 말라\"는 위험을 스스로 기록해 둔 것까지 그 안에 있습니다. 다만 지금은 판정을 결정론 엔진으로 옮겼습니다. 보험 판정은 같은 입력이면 같은 결과가 나와야 하고 감사가 가능해야 하기 때문에, 시드를 고정하고 판정 계약 테스트 27건으로 묶어뒀습니다. 현재 에이전트가 하는 일은 두 가지뿐입니다 — 페르소나의 이동 프로필을 한 번 만들어 캐시로 커밋하는 것, 그리고 고객과 직원이 읽을 리포트 문안을 쓰는 것. 판정에는 관여하지 않습니다. 이 축소는 후퇴가 아니라, 상품으로 내보내기 위한 선택이었습니다."
    followups:
      - q: 그럼 가중치 30/30/20/20은 에이전트가 고른 겁니까?
        a: "아닙니다. 그 격자는 레거시 비교 실험 도구였고 결정자가 아니었습니다. 격자 1위 후보의 값이 현 값과 같지만, 현 값의 근거는 격자 순위가 아니라 문제정의 4축에 1:1로 매핑된 선언값(노출 30 / 생활권 안 행동 30 / 밖 행동 20 / 패턴 변화 20)이며, 뒷받침은 재무 실측(위험 세그먼트 평균 할인 19.6%→7.9%, 안정군 +4~6%p)과 공개된 캘리브레이션 절차입니다."
      - q: 에이전트 역할을 줄이면 AI 활용도가 떨어지는 것 아닙니까?
        a: 재현성이 필요한 곳(판정)은 결정론, 다양성과 서술이 필요한 곳(삶의 맥락 생성·설명 문안)은 에이전트로 역할을 나눈 것입니다. 판정을 LLM이 하면 감사·규제 대응이 불가능해집니다.
      - q: 리포트를 LLM이 쓰면 숫자가 틀릴 수 있지 않습니까?
        a: 프롬프트가 재계산·수치 생성을 금지하고 엔진 확정값 인용만 허용하며, 호출 실패 시 동일 스키마의 결정론 문안으로 폴백합니다.
    do_not_say:
