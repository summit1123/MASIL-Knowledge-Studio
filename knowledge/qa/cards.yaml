    followups:
      - q: 젊은 층에서 해보긴 했나
        a: 안 해봤고, 방법론적 예측입니다.
  - question_ko: 대부분의 사고는 생활권 안에서 나지 않나
    direct_answer_ko: "동의한다 — 사고 건수는 생활권 안에 몰린다(NMVCCS 70%가 자택 5마일 이내). 그러나 그건 위험의 지도가 아니라 노출의 지도다(Burdett 2017: 자택 11km 이내가 주행 절반). 노출을 통제하면 오히려 익숙함이 보호적이다(Ehsani & Tefft 2021: 처음 도로 2.5배). 그래서 위치로 벌하지 않고, 실제로 안(30)을 밖(20)보다 무겁게 같은 잣대로 채점한다(location_penalty 0.0 하드코딩, _safety_score 동일 함수). 12개 항목 중 가장 단단하다."
    evidence_ref:
      - NMVCCS 70% 자택 5마일
      - Burdett 2017
      - Ehsani & Tefft 2021
      - location_penalty 0.0 하드코딩
      - DEFAULT_PRODUCT_RULES + _safety_score 동일 함수
      - 밖축 제외 실측(56건/33건)
      - ② 유형 실측(안 15.8점·우대 0/30)
    followups:
      - q: 밖 주행이 없는 고객은?
        a: 밖 없으면 축 제외 — 180건 중 56건이 밖축 없이 판정됐고 그중 33건이 우대됐다(rolling 실측).
      - q: 생활권 안의 위험은 놓치지 않나?
        a: ② 유형에서 안 안전점수 15.8점, 우대 0/30 — 안의 위험도 잡힌다.
  - question_ko: "시뮬레이션 방법론이 뭔가 — 'data'라고 했는데"
