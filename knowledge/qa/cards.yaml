    topic: 사고심도
    source: "sources/07_근거지도.md#12. 사고 심도 논리 · sources/02_마스터답변안_전항목.md#12. 사고 심도(severity) 논리"
    direct_answer_ko: "심도는 예측하지 않는다. 4축 산식(weights 4개)에 심도 항이 없고, 판정 입력 계약(decision_feature_contract.allowed_inputs 8개 — 4축 점수·변화지수 2·zone_available·data_coverage_pct)에도 없다. 심도가 등장하는 자리는 셋이고 전부 판정 밖: ① 문제 배경 — 75세 이상 동일 운전량 사망위험 5배(ERSO)·TAAS 치명률 배수 고령운전자 사고 1.40배·노인 사고 2.52배는 '사후 보상보다 사전 개입'이라는 필요성 근거로만 쓰고 개인 판정에는 미사용 ② 위험 이벤트 유형 분해의 야간 치명률 가중 — 표시 전용으로 코드에 역할 선언·테스트 고정, 가중치 교체 후 180건 판정 diff 0 ③ 손익 감도 분석 — 심도 상대계수 1.0×/1.2× 두 시나리오이며 심도 가산 없는 1.0×로도 요구 절감률 12.4% 성립, 요율식·판정식 미투입. 예측하지 않는 이유: 심도는 사고 후의 결과 변수이고, 데이터에 손해액 라벨이 없으며, 신체 취약성 기반 심도 예측은 인수차별 논란으로 직결된다. 두 고리 전부 ◎(코드 즉시 증명) — 12개 항목 중 가장 단순하고 안전한 항목."
    do_not_say:
      - 심도를 예측·판정에 반영한다는 취지
      - 생활권 밖 = 사고 심도 증가(인과 서술)
      - "'300만원' 통계(원출처 미확인 — 덱 제거 확정)"
