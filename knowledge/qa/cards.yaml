    topic: 가중치
    source: "sources/07_근거지도.md#11. 가중치 30/30/20/20의 근거 · sources/브리핑_0803_이슈정리.md#6. 민감도 (가중치 30/30/20/20 방어) · sources/00_확정수치카드.md#산식·가중치"
    direct_answer_ko: "요율이 아니라 기존 마일리지 할인 위에 얹는 할인 자격 점수의 배분이다(오버레이 — 할증 경로가 코드에 없고 180건 전건 할증 0, 150건이 기존 대비 동등 이상 유리). 네 축은 순보험료 분해에 1:1 대응한다: 노출=주행 30, 단위노출당 빈도율=안 30+밖 20=50(행동 축 합계가 최대 블록), 장래위험=패턴 20 — 노출을 30에서 멈춘 건 저주행 고령 집단의 km당 위험이 오히려 높다는 문헌(Candrive/Ozcandrive) 때문. 안 30 > 밖 20은 신뢰도(credibility) 원리를 따른 보수적 근사 — 생활권 안 주행 비중 전건 집계 86.0%로 관측이 두껍고 교란이 적은 쪽에 무게(뷜만 추정은 하지 않음). 값의 위치는 회랑(관측량 비례 35:15 ↔ 균등 25:25)의 중간인 설계값(▽ 먼저 인정)이며, 주장하는 것은 값이 아니라 순서다. 방어는 969개 조합 전수 민감도 실측(8/2 rolling): ±5 이웃 판정 변화 중앙 3·최대 9건, 현행 30이 두 지배 축(주행 ≤30·안 ≥25) 모두의 최저점(주행 5.4·안 7.4건). 최종 값은 파일럿 손해율 적합으로 재보정한다."
