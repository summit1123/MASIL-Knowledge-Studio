  - question_ko: eps(260m)를 바꾸면 생활권이 커지나요?
    topic: eps-원크기-무관
    source: "sources/부록B_해설_팀원용.md#1부-C·파라미터-사전(세-반경-구분) · sources/생활권반경_eps_정리.md#§2-층을-나눠-보면"
    direct_answer_ko: "아니요. eps(260m)는 흩어진 방문점을 한 거점으로 묶는 눈금(탐지 전용)이고, 원 크기는 거점 확정 다음의 별도 단계다 — 원 공식 r = max(500m, min(개인 P90, 2km))에 260m는 들어가지 않는다. 세 반경은 역할이 다르다: 260m = 점을 묶는 자(탐지) · 500m = 보호 하한(측정이 고객에게 불리하게 작동하지 않게 하는 약속) · P90 = 개인 실측(장날 한 번의 원거리 주차에 원이 커지지 않게 90퍼센타일) · 2km = 상한 가드레일. 실측으로도 확인 — eps를 260/520/1,100으로 바꿔도 원 반경은 도심 500m·교외 500m·광역 813m로 완전히 동일. eps를 바꾸면 거점이 몇 개로 묶이는지만 달라진다."
    spoken_answer_ko: 아니요, 거점이 몇 개로 묶이는지만 달라지고 원 크기는 그대로입니다. 260m는 원의 크기에 들어가지 않습니다 — 원 공식은 500m와 P90과 2km로만 구성됩니다.
    do_not_say:
      - eps가 원 크기에 영향을 준다
    evidence_ref:
      - final/근거자료/부록B_해설_팀원용.md 1부(세 반경을 절대 섞지 말 것)
      - 생활권반경_eps_정리 §2 실측 표 — eps 260/520/1,100 무관 원 반경 500/500/813m 동일
  - question_ko: (eps는 왜 260m이고 지역별로 다른 값이 코드에 있나? — 질문 문구는 문서에 없음, §5 축척 프레임 표준답)
    topic: eps-축척프레임
    source: "sources/브리핑_0803_이슈정리.md#§5-eps-정리(축척-프레임) · sources/생활권반경_eps_정리.md#§5-eps-260의-근거 · sources/00_확정수치카드.md#생활권-탐지-기준거리"
    direct_answer_ko: "채택 기준값은 260m 단일 — Zheng 2009 200m·Montoliu 2013 250m(권장 200~300m) 대역의 한가운데이며, 절대값을 주는 문헌은 없으므로 설계값임을 먼저 인정한다. 코드의 260/520/1,100은 지역 차등이 아니라 합성 지리 축척(×2/×4.2) 정합용 — 환경 설계 전체(트립 5.4/11/24km, 도달반경 900/1,500/3,000m)와 같은 비율 규칙이라 실세계 260 단일과 등가다. 등가 근거: 단일 260 재판정 고정 기준 0/180 · rolling 재검증 3/180(경계 사례) — '0건' 단독 인용 금지, '고정 기준' 단서 필수. 현 값 실측: 과병합 0%, 반복거점 누락 1.6~3.1%. 운영값은 파일럿 k-거리 실측(k=2 — 3일 규칙에서 유도, 다른 날 2번째 이웃 거리, 지역 풀링, 4~6개월차 1회 → 이후 연 1회)으로 재도출하며, 지역을 나눌지 여부와 그 방향까지 측정이 결정한다. eps는 판정 경계가 아님 — 최종 반경 max(500m, min(개인 P90, 2km))에 eps는 들어가지 않는다."
    do_not_say:
      - eps 150m
      - 전역 eps 폐기·지역별 차등 채택
      - "\"0건\" 단독 인용(\"고정 기준\" 단서 필수)"
      - "'도심이 작고 농촌이 크다'는 방향 주장(검증된 바 없는 가정 — 방향을 방어하지 않는다)"
    evidence_ref:
      - Zheng 2009 200m · Montoliu 2013 250m(권장 200~300m)
      - 합성 축척 규칙 ×2/×4.2 (트립 5.4/11/24km · 도달반경 900/1,500/3,000m와 동일 비율)
      - 단일 260 재판정(고정 0/180 · rolling 3/180 경계 사례)
      - 과병합 0% · 반복거점 누락 1.6~3.1% 실측
      - k-거리 실측 계획(k=2, 지역 풀링, 파일럿 4~6개월차 → 연 1회)
    flags:
      - Zheng/Montoliu 원문 미확인 — 확정수치카드 팩트체크 목록에 등재(발표 전 확인 필요)
      - 이 카드 전용 발표 전문 없음 — 생활권반경_eps_정리 §8의 60~90초 답변은 7/24 심사 4번(지역 차등) 질문용이라 그대로 옮기지 않음
    followups:
      - q: 도심이 오히려 주차가 어려워 산포가 클 텐데 왜 도심 eps가 작은가?
        a: 정확한 지적 — 방향은 우리 가정이고 반대일 수 있어 방향을 주장하지 않는다. eps를 전국 단일값으로 바꿔 재판정해도 판정이 사실상 동일(고정 0/180)해 논쟁이 결과를 바꾸지 않고, 실제 방향은 파일럿 산포 측정이 정한다.
  - question_ko: 합성 데이터를 eTAS 임계로 생성했나?
    topic: etas-taas-구분
    source: "sources/00_확정수치카드.md#표기 금지·주의 · sources/데이터생성_상세정리.md#5. 4단계 — 위험 유형 분해 (표시 전용)"
    direct_answer_ko: "아니오. 합성 엔진에 eTAS 임계(g값) 구현은 없음 — '합성을 eTAS 임계로 생성했다'고 말하지 말 것. 역할 구분: eTAS(한국교통안전공단 운행기록분석시스템)는 위험운전행동 '정의'의 표준(실재 명칭, 써머리 표기 유지)이고, 합성 빈도는 LongROAD 0.35g 앵커를 따르며, eTAS 임계 적용은 실서비스 단계다. TAAS(도로교통공단 교통사고분석시스템)는 별개로 위험 이벤트 유형 '구성비' 유도에만 쓰이며 표시 전용·판정 미진입. 이전 카드의 'eTAS는 없는 명칭' 표기는 오류였음(정정 완료)."
    spoken_answer_ko: 유형 정의는 eTAS 표준, 합성 빈도는 LongROAD 0.35g 앵커, 실서비스에서 eTAS 임계 적용
    do_not_say:
      - 합성을 eTAS 임계로 생성했다
      - eTAS는 없는 명칭 (구 카드 표기 — 오류로 정정됨)
      - 임계값(g) 없이 급제동 빈도 인용 (0.35g와 0.75g는 1,000배 차이)
    evidence_ref:
      - final/00_확정수치카드.md 표기 금지·주의 절
      - 데이터생성_상세정리.md 5절(위험 유형 분해)·7절(인용 시 주의)
      - AAA LongROAD RDE 브리프 2020 — 0.35g, 5.3±6.2건/1,000mile (출처부록 5장)
  - question_ko: 국내 라운드 때는 매달 갱신 아니었나요? (국내 심사위원 겹칠 때)
    topic: rolling-국내정합
    source: "sources/생활권_형성주기_이슈정리.md#3절(국내 심사위원 겹칠 때)·1절"
    direct_answer_ko: "네, 원안과 같은 매달 갱신(직전 2개월)입니다. 배경: 원안(국내)은 매달 직전 60일 재형성이었는데 원안 문서 자체가 상충('첫 2개월 고정' vs '최근 2개월')해 결선 엔진이 팀 합의 없이 한때 '가입 후 첫 2개월 고정'으로 넘어와 있었고, 8/2 회의에서 rolling(원안 방식)을 복원해 엔진 이식(커밋 4bdf119)·번들 재생성까지 완료했습니다. 원안과 달라진 점은 하나 — 변화 감지가 무뎌지지 않도록 케어의 평소값·해제 기준은 갱신에서 분리해 기준선에 고정했습니다. 지도는 현실을 따라가고, 위험 판정의 잣대는 흔들리지 않습니다."
    spoken_answer_ko: 네, 원안과 같은 매달 갱신(직전 2개월)입니다. 다만 변화 감지가 무뎌지지 않도록 케어의 평소값·해제 기준은 갱신에서 분리해 기준선에 고정했습니다 — 지도는 현실을 따라가고, 위험 판정의 잣대는 흔들리지 않습니다.
    evidence_ref:
      - 생활권_형성주기_이슈정리.md 3절
      - 생활권_형성주기_이슈정리.md 1절(충돌 경위 — monthly_zone_snapshots.json 실물)
      - engine.py 커밋 4bdf119
    flags:
      - "동일 주제 카드 '국내 라운드 때 매달 갱신이라 하지 않았나?'(요약판) 존재 — 본 카드가 3절 표준답 전문이라 정본으로 판단"
  - question_ko: 지도가 흔들리지(명멸) 않나?
    topic: rolling-명멸
    source: "sources/브리핑_0803_이슈정리.md#1. 생활권 형성 주기 (베이스라인 이슈) · sources/00_확정수치카드.md#생활권 형성 주기 행 · sources/생활권_형성주기_이슈정리.md#4. 파일럿 검토안"
    direct_answer_ko: "실측 명멸 85/2,160 드라이버-월(3.9%), 군집 실패 폴백 0건(rolling 재검증). 명멸이 나도 위치 무벌점·동일 잣대라 판정 불이익이 없다. 저주행자의 거점 명멸 대응(데이터 충분성·거점 지속성 확인, 부족 시 기존 유지/보류)은 파일럿 안전장치 6종 검토안의 '생활권 흔들림' 항목이며, 8/2 결정에서 신규 메커니즘 추가가 금지돼 현 시점 계약에는 넣지 않았다 — 지속성 보강은 파일럿 항목."
    spoken_answer_ko: 실측 3.9% 드라이버-월, 폴백 0. 무벌점·동일 잣대라 판정 불이익이 없고, 지속성 보강은 파일럿 항목입니다.
    evidence_ref:
      - 명멸 85/2,160 드라이버-월(3.9%) · 폴백 0 실측
      - 생활권_형성주기_이슈정리.md §4 안전장치 6종(생활권 흔들림 행 — 파일럿 검토안)
  - question_ko: 이사 가면?
    topic: rolling-이사
    source: "sources/브리핑_0803_이슈정리.md#1. 생활권 형성 주기 (베이스라인 이슈) · sources/생활권_형성주기_이슈정리.md#2. 두 설계는 각자 다른 고객에서 실패한다 · sources/안전운전자_매력도_정리.md#8. 예상 후속질문"
    direct_answer_ko: "두 달 안에 새 동네가 생활권으로 재형성된다(매달 직전 2개월 재군집). 그 사이에도 위치 벌점이 없고(위치 벌점 0·동일 잣대 채점·안 축 미관측 시 재정규화) 같은 잣대로 채점돼 안전하면 우대를 받는다 — 이사·가족돌봄(이동변화군) 30 시나리오 전원 우대 실측. 이동만 변하고 운전이 안전하면 케어 게이트도 열리지 않는다(이사형 대조군 30건 케어 발동 0건, 평균 할인 21.2%→26.7% 상승). '기준선 서울로 고정된 채 부산 이주 고객의 지도가 1년 내내 틀리는' 케이스가 고정 방식의 실패 사례로, rolling 채택(8/2)의 논거였다."
    spoken_answer_ko: 두 달 안에 새 동네가 생활권이 됩니다. 그 사이에도 위치 벌점이 없고 같은 잣대로 채점돼 이사·가족돌봄 30 시나리오 전원 우대 실측입니다.
    followups:
      - q: 이사하면 모든 길이 낯설어져 불리해지지 않나요? (1차 CSC)
        a: 이동만 변하고 운전이 안전하면 게이트가 열리지 않습니다. 이사형 대조군 30건에서 케어 발동 0건이고 평균 할인은 21.2%→26.7%로 올랐습니다. 생활권은 기준선 재학습으로 새 거처 기준으로 다시 잡힙니다.
    evidence_ref:
      - 이동변화군(이사·가족돌봄) 30 시나리오 전원 우대 실측
      - 이사형 대조군 케어 0건 · 평균 할인 21.2%→26.7%
      - "생활권_형성주기_이슈정리.md §2 '이사 간 순자님' 실패 케이스"
  - question_ko: 생활권 지도가 매달 갱신되면 케어도 자동 해제되나?
    topic: rolling-케어분리
    source: "sources/00_확정수치카드.md#생활권 (형성 주기 행) · sources/생활권_형성주기_이슈정리.md#✅ 결정 (2026-08-02 회의) · sources/브리핑_0803_이슈정리.md#1. 생활권 형성 주기"
    direct_answer_ko: "아니오. 케어는 갱신·해제 분리(2026-08-02 회의 결정) — 지도는 갱신형(rolling)으로 매달 직전 2개월(60일) 기록으로 재형성(해당 월 제외, 군집 실패 시 직전 지도 폴백)하지만, 케어의 평소값·해제 기준은 가입 초기 기준선에 고정돼 지도 갱신만으로 자동 해제되지 않음(사람 검토·복귀 시에만 해제). 분리하는 이유는 무장치 rolling에서는 위험행동이 두 달 지속되면 '새로운 평소'로 흡수되는 위험의 정상화가 생기기 때문. 발송 답변서 5번의 '이후 12개월 내내 고정되는 비교 기준값'은 케어 평소값에 대한 서술이라 rolling과 모순 없음(정합). 단 rolling 실측에서 케어 월수는 전원 1개월 — 지도가 새 목적지를 흡수하면서 유지 조건(기준선 대비 이탈)이 조기 해제되기 때문이며, 발동 정확성(동시변화 30/30·오탐 0/30)·연간 케어 30·요율 영향은 그대로다."
    do_not_say:
      - 가입 시 1회 형성
      - 케어는 5개월 이상 지속(5~7개월)
      - 지도 갱신으로 케어가 자동 해제된다
    evidence_ref:
      - final/00_확정수치카드.md 형성 주기 행
      - 발송 답변서 5번
      - 생활권_형성주기_이슈정리.md 결정·4절(위험의 정상화)
      - 브리핑_0803_이슈정리.md 1·2절
      - engine.py rolling 이식 커밋 4bdf119
    flags:
      - "발송 답변서 5번 원문은 sources/ 11종에 미포함 — 확정수치카드·형성주기 정리·브리핑의 전언('고정되는 비교 기준값' = 케어 평소값 서술)으로만 확인"
