  - question_ko: Candrive 고위험군은 얼마나 위험한가?
    direct_answer_ko: 최대 5배. 같은 70세+ 코호트에서 저위험군 대비 at-fault 사고 위험(주행거리 보정)이 중위험 2.47배 · 고위험 5.26배(95% CI 2.81–9.84, 인년의 2.9%).
    do_not_say:
      - 동일 연령대 3배
      - "사고빈도(→'사고 위험(거리 보정)'으로)"
    evidence_ref:
      - Marshall et al. 2023, J Gerontol A 78(12)
  - question_ko: 케어 상태가 되면 보험료는 어떻게 되나?
    direct_answer_ko: 보너스 정지 + 할인 13%p 축소. 전보다 낼 수 있음은 정직하게 표기한다. 월수 비례로 개선 방침. 할인 상한 45%, 할증 경로 없음, 하한은 기준 요율.
    evidence_ref:
      - final/00_확정수치카드.md 요율·케어 표
  - question_ko: 생활권 지도가 매달 갱신되면 케어도 자동 해제되나?
    direct_answer_ko: "아니오. 케어는 분리 — 감지는 직전 2개월 지표 비교이지만 케어 평소값·해제 기준은 고정이라 지도 갱신만으로 자동 해제되지 않음(발송 답변서 5번 '고정되는 비교 기준값'과 정합)."
    evidence_ref:
      - final/00_확정수치카드.md 형성 주기 행
