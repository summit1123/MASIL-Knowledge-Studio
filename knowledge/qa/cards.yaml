  - question_ko: (발송 답변서 수치가 지금 수치와 다른데? — 질문 문구는 문서에 없음, §7 한 줄 답)
    topic: 발송답변서-수치어긋남
    source: "sources/브리핑_0803_이슈정리.md#§7-발송-답변서와의-어긋남"
    direct_answer_ko: "발송본(7/30)에 '우대 56/60'·'114건' 등 고정 기준 수치가 잔존하나 회수 불가. 처리: 발송본 3종(통합·1차·현장) 원문 보존 + 상단 '수치 시점 고지' 배너. 이후 8/2 회의에서 생활권 형성 방식을 갱신형(rolling)으로 확정하며 재검증 — 판정 변화는 180건 중 4건(우대 4·케어 0)뿐이고, 재검증 코드는 저장소 main e2d2e49(맥스튜디오 공개 데모·확정수치카드·문서 전체와 동일 상태)에 있다."
    spoken_answer_ko: 발송 답변서 수치는 당시 고정 기준 검증 결과이고, 이후 형성 방식을 갱신형으로 확정하며 재검증했습니다. 판정 변화는 180건 중 4건, 케어는 동일하며 재검증 코드는 저장소에 있습니다.
