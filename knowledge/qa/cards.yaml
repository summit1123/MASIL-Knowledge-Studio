  - question_ko: "[#5] 평소 패턴 대비 변화를 기준으로 삼으면, 평소 매우 안전한 사람이 명절·병원 방문 같은 단 한 번의 예외 운행으로 보험료가 오를 수 있다. 안전 운전자에게는 비매력적인 상품 아닌가. (1차 Q6 '이사하면 어떻게 되나'의 연장)"
    direct_answer_ko: 저희는 요율표가 아니라 기존 마일리지 할인 위에 얹히는 할인 자격 점수(오버레이)라 할증 경로가 코드에 존재하지 않고(180 시나리오 전건 candidate_surcharge_rate_pct = 0), 단발 운행은 월 집계·AND 게이트·사람 검토의 3중 구조에서 판정에 진입조차 하지 못합니다 — 실측 180 시나리오 중 150건이 기존 마일리지 특약과 같거나 낮은 보험료, 그중 113건은 더 낮습니다.
    spoken_answer_ko: "타당한 우려이고, 저희가 가장 조심해서 설계한 지점입니다. 먼저 상품의 지위인데, 저희는 요율표가 아니라 기존 마일리지 할인 위에 얹히는 '할인 자격 점수'입니다. 코드에 할증 경로가 아예 없어서 최악의 경우가 할증이 아니라 할인 축소이고, 하한은 기준 요율입니다. 다음은 산수입니다. 판정은 트립이 아니라 월 집계 비율이고, 직전 두 달 평균 대비 이동이 25%p, 위험행동이 20%p 동시에 올라야 열립니다. 저희 데이터의 월 운행 중앙값이 32건이니 명절에 한 번 멀리 다녀오신 것이 움직이는 폭은 약 3%p, 임계의 8분의 1입니다. 게다가 명절·병원·여행은 이동 축만 건드려서 AND 게이트에서 걸리지 않습니다. 실제로 이동만 크게 변한 대조군 10명, 세 환경 30 시나리오에서는 이동 지표가 임계를 넘은 달이 191 케이스-월인데도 케어가 한 번도 열리지 않았고, 평균 할인은 21.2%에서 26.7%로 올라갔습니다. 케어가 열려도 그건 자동 요율이 아니라 사람이 확인하라는 권유이고, 지표가 정상으로 돌아오면 그 달에 닫힙니다. 정직하게 말씀드리면 케어가 확정되면 할인이 13%p 줄어 전보다 내는 돈이 늘 수 있습니다. 다만 그 조건은 한 번의 운행이 아니라 여러 달 지속된 동시 급변과 사람 검수이고, 실측에서도 케어는 급변 달에 정확히 발동했고(30/30), 이동만 변한 대조군에서는 한 번도 열리지 않았습니다(0/30)."
    followups:
      - q: 그래서 전 달보다 내는 돈이 늘 수 있습니까?
        a: "네, 할인이 줄면 그렇습니다. 다만 할증은 구조상 없어 최악이 기준 요율이고, 조건은 '한 번의 운행'이 아니라 '지속된 동시 급변 + 사람 검수'입니다."
      - q: 케어가 한 달만 떠도 1년치 감액인가요?
        a: 현 규칙은 그렇고, 유효한 지적입니다. rolling 실측에서 케어 30건 전원이 1개월 발동이라 이 사례가 실측의 전형이고, 13.0%p 역전도 그대로 확인됩니다. 감액을 발생 월수에 비례시키는 것(1개월 시 1.08%p)이 저희 권고안이며 선언 파라미터 수정이라 즉시 재계산됩니다.
      - q: 안전한 사람은 이미 마일리지 할인을 받는데 왜 이 특약을 삽니까?
        a: 마일리지는 거리만 봅니다. Candrive/Ozcandrive(Langford et al. 2013, AAP)는 연 5,000km 미만 저주행 고령 집단의 km당 사고 위험이 오히려 높다고 보고했고, 거리만 보는 체계에서는 실제로 안전한 분이 그렇지 않은 분과 같은 할인을 받습니다. 저희 실측에서 안정 저주행형은 33.8%에서 38.9%로 올라갑니다.
    do_not_say:
      - 할증 가능 시사
      - 감액 13%p를 최종 요율로(illustrative_economics_sandbox_not_final_tariff — 손익 예시값)
      - 돈이 늘 수 있다는 사실 은폐(정직 고지 필수)
    evidence_ref:
      - "src/gaip_simulation/engine.py:1069-1070"
      - "engine.py:1180-1182"
      - Candrive PubMed 23477415
