    direct_answer_ko: "'data'는 부정확한 표현이었고 '합성 시나리오(synthetic scenarios)'로 전면 교체했다 — 1차 자료의 '실제 드라이빙 로그를 바탕으로'라는 서술도 정정 대상이며, 실제 로그의 경험적 분포를 직접 사용한 적이 없다. 실물은 6유형 60명 로스터 × 3환경 = 180 시나리오 × 14개월(80,032 트립, 연 주행 중앙값 2,829km). 생성은 4단계 — (a) 사람이 문헌 3축(이동범위 축소·만성 위험행동·패턴 변화)으로 6유형 정의(personas.py) (b) LLM 에이전트가 이동 프로파일 생성: 구조 계약 위반 시에만 최대 3회 재생성, 통과본 1회 생성 후 mobility_profiles.json 고정 커밋, 임계·가중치는 에이전트가 정하지 않음 (c) 결정론 엔진이 시드 sha256(전역시드|driver_id|month)로 방문 이벤트 전개 — 비트 동일 재현 (d) TAAS 2010–2024 유도 가중치로 위험 유형 분해 — 표시 전용·판정 미진입(가중치 교체 후 180건 판정 diff 0). 채점 엔진은 유형 라벨을 보지 못하므로(decision_feature_contract 허용목록 8개) 검증 대상은 예측력이 아니라 판정 로직의 일관성이다 — 케어형 30/30 발동, 이동만 급변한 이사형 오탐 0/30. 다만 월 방문 13~42회·위험률 3%/72% 같은 절대값은 방향성만 문헌인 설계값이고, 파일럿에서 실주행 경험분포로 대체한다."
    spoken_answer_ko: "먼저 용어를 바로잡겠습니다. 저희가 'data'라고 말씀드린 것은 실주행 데이터가 아니라 합성 시나리오입니다. 1차 자료의 '실제 드라이빙 로그를 바탕으로'라는 표현도 부정확했습니다 — 실제 로그의 경험 분포를 쓴 적이 없습니다. 현재 규모는 6유형 60명 로스터를 3개 지역환경에 둔 180개 시나리오, 14개월입니다.\n\n생성은 네 단계입니다. 사람이 문헌 3축으로 6유형을 정의하고, LLM 에이전트가 생활권 프로필을 만들되 구조 계약 검증을 통과한 결과만 저장소에 고정합니다 — 임계·가중치는 에이전트가 손대지 않습니다. 그다음 결정론 엔진이 시드를 sha256(전역시드·운전자·월)로 고정해 방문 이벤트를 전개하고, 마지막으로 위험 이벤트의 유형 분해에만 TAAS 통계에서 유도한 가중치를 씁니다 — 이 값은 표시 전용이라 판정에 들어가지 않습니다.\n\n왜 이 방식이 타당한가. 채점 함수가 유형 라벨을 아예 받지 않습니다. 그래서 '설계 의도가 파이프라인을 통과해 발현되는가'가 검증 대상이 되고, 나야 할 케어 30건은 전부 나고 나면 안 되는 이사형 30건은 0건입니다. 다만 방문 횟수·위험률의 절대값은 설계값이며, 파일럿에서 실주행 로그의 경험 분포로 대체하겠습니다."
    do_not_say:
      - data(합성 산출물 지칭)
      - "'실제 드라이빙 로그를 바탕으로'"
      - 파라미터 절대값이 근거 있는 것처럼 말하기
    evidence_ref:
