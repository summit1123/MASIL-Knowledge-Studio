        a: 현 규칙은 그렇고, 유효한 지적입니다. rolling 실측에서 케어 30건 전원이 1개월 발동이라 이 사례가 실측의 전형이고, 13.0%p 역전도 그대로 확인됩니다. 감액을 발생 월수에 비례시키는 것(1개월 시 1.08%p)이 저희 권고안이며 선언 파라미터 수정이라 즉시 재계산됩니다.
      - q: 안전한 사람은 이미 마일리지 할인을 받는데 왜 이 특약을 삽니까?
        a: 마일리지는 거리만 봅니다. Candrive/Ozcandrive(Langford et al. 2013, AAP)는 연 5,000km 미만 저주행 고령 집단의 km당 사고 위험이 오히려 높다고 보고했고, 거리만 보는 체계에서는 실제로 안전한 분이 그렇지 않은 분과 같은 할인을 받습니다. 저희 실측에서 안정 저주행형은 33.8%에서 38.9%로 올라갑니다.
