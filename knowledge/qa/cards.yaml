  - question_ko: "[#7] 생활권 학습 기준선을 왜 하필 2개월로 잡았는가. 근거가 선언적으로 보인다. (제안: 1년 단위 평균 운행거리 통계를 찾아 역산하면 근거가 될 것)"
    direct_answer_ko: "2개월은 '월 2회급 가장 뜸한 생활 거점까지 서로 다른 3일 문턱을 넘길 확률이 4분의 3을 넘어서는 최소 관찰 기간'이며, 방문 일수 기준을 확립한 통신 위치데이터 연구(Isaacman 2011)의 관찰 창 60일과 정확히 같으며, 연구 기준선(2주~1개월)보다 보수적이면서 업계 요율 관행(3~6개월)보다 신속한 중간값이다."
    spoken_answer_ko: "두 가지로 답하겠습니다. 먼저 제안 주신 역산 — 방향에 동의합니다. 다만 국내 고령 운전자의 연령별 연평균 주행거리는 공개된 공식 통계가 없어서, 저희는 같은 역산을 거리 대신 방문 빈도로 했습니다. 방문일을 푸아송으로 두면, 월 2회밖에 가지 않는 가장 뜸한 생활 거점이 '서로 다른 3일' 문턱을 넘을 확률이 1개월에서는 32%, 2개월에서 76%, 3개월에서 94%입니다. 1개월은 진짜 거점 셋 중 둘을 놓치고, 3개월은 18%포인트를 더 얻는 대신 개입이 한 달 늦습니다. 빈도 가정은 건강보험 통계 월 3.75일 내원, 노인실태조사 경로당 이용자 주 2.9회, 소비자원 조사 주 3에서 5회 운전으로 앵커했습니다. 둘째, 선례입니다. 통신 데이터로 중요 장소를 식별한 Isaacman 2011이 60일 관찰에서 '전체 일수의 5퍼센트, 즉 서로 다른 3일'을 같은 목적으로 썼습니다 — 관찰 창도, 임계값도, 방문 횟수가 아니라 방문한 날 수로 센다는 논리까지 저희와 같습니다. 자연주행 연구 기준선인 2주에서 1개월보다는 보수적이고, 업계 요율 산정 관행으로 알려진 3에서 6개월보다는 신속한 중간값입니다. 다만 기준선 1·2·3개월 민감도 실측은 아직 돌리지 않았습니다. 파라미터라 반나절이면 180건 재판정 표로 제출할 수 있고, 파일럿에서는 실데이터 방문 빈도 분포로 다시 잽니다."
    followups:
      - q: 1개월로 줄여도 크게 안 달라지지 않나?
        a: "병의원처럼 잦은 거점은 1개월에도 72% 성립하지만, 월 2회급 뜸한 거점은 32%까지 떨어집니다. 그 거점이 빠지면 그 사람의 생활권 지도 자체가 좁게 잡혀 '밖 비중'이 실제보다 부풀려집니다 — 관측의 질 문제이지 위치 벌점 문제가 아닙니다."
      - q: 업계 관행이 3~6개월인데 왜 굳이 빨리 가나?
        a: 요율 산정 관행은 보험료를 확정하기 위한 기간이고, 저희 2개월은 요율이 아니라 채점 구획을 그리는 학습 기간입니다. 목적이 달라 더 짧게 가도 되고, 실제 우대 판정은 12개월 중 9개월 충족을 요구해 관행보다 오히려 긴 관찰 위에서 확정됩니다.
      - q: Isaacman은 운전 연구가 아니지 않나?
        a: "맞습니다, 휴대폰 통신 위치데이터 연구입니다. 저희가 이 논문에서 가져온 것은 고령자 운전 행태가 아니라 \"위치 점에서 반복 방문지를 어떻게 식별하는가\"라는 방법론입니다 — 데이터가 통신이든 차량이든 같은 문제이고, 관찰 창 60일과 \"전체 일수의 5% = 서로 다른 3일\"이라는 도출이 저희와 일치합니다. 기준선 기간의 운전 연구 선례는 따로 있습니다 — UMTRI 2주, DRIVES 첫 1개월, Candrive 4개월 재평가 주기이고 저희 2개월은 그 사이입니다."
      - q: 습관이 2개월에 자리 잡는다는 근거는?
        a: 그 주장은 하지 않습니다. Lally 2010의 66일은 일반 행동 습관 연구(그것도 새 습관의 형성 기간, 범위 18~254일)라 시간 스케일 참고로만 언급했고, 저희 2개월의 근거는 습관 형성이 아니라 거점 검출에 필요한 관측량입니다.
    do_not_say:
      - "'3일 고정'('관찰 창의 5%'로 말할 것)"
      - 운전 연구 계열과 Isaacman 통신 데이터 계열 혼용
      - "업계 3~6개월 단정(원문 미확인 — '관행상 알려진'으로만)"
      - Lally 66일을 기준선 근거로
      - 경로당·복지관 수치를 전체 노인 통계처럼
      - 합성 실측으로 오탐 방어 주장(확률 논리로만)
    evidence_ref:
      - Isaacman et al. Pervasive 2011
      - 건보공단 2022 주요통계
      - 2023 노인실태조사
      - 한국소비자원 2024
      - UMTRI PubMed 29584495
      - DRIVES PMC9535782
      - Candrive PubMed 23541299
      - Lally et al. 2010
  - question_ko: [8번] 주행 로그 생성 로직의 근거가 약하다. 실제 고령 운전자 로그를 군집화한 경험적 분포인가, 사전 정의 유형별 파라미터 설정인가? 후자라면 각 파라미터의 데이터·문헌 근거는? (모델 퍼포먼스가 예측력이 아니라 시나리오 설계의 결과일 가능성 — 순환논증)
    direct_answer_ko: 후자(사전 정의 파라미터 기반 합성)가 맞고 결과가 설계의 산물이라는 지적도 맞지만, 페르소나는 결과를 만드는 입력이 아니라 판정 로직의 전 경로를 시험하는 테스트 집합이므로 여기서 검증되는 것은 예측력이 아니라 로직 일관성이다.
    spoken_answer_ko: "먼저 정정하겠습니다. 1차 자료의 '실제 드라이빙 로그 기반 30명'은 부정확한 표현이었고, 저희 데이터는 합성 데이터입니다. 질문 주신 분류로는 후자 — 사전 정의한 6개 유형에 파라미터를 설정해 생성했고, 규모는 60명 로스터를 3개 지역환경에 둔 180 시나리오입니다. 그리고 결과가 시나리오 설계의 산물이라는 지적도 맞습니다. 그게 이 단계의 목적입니다. 저희가 합성으로 검증하는 건 예측력이 아니라 로직 일관성입니다. 케어가 나야 할 설계에서 나는가보다, 나면 안 되는 설계에서 안 나는가가 더 중요합니다. 그래서 페르소나에 실패해야 할 케이스를 넣었습니다 — 이동만 커지고 안전은 그대로인 이사형 30건은 케어가 나오면 안 되는 대조군이고, 실측 오탐 0입니다. 채점 엔진은 유형 라벨을 모릅니다. 파라미터 중 위험행동 유형 가중치는 TAAS 원천 통계에서 엔진이 직접 계산하고 — 이 값은 유형 분해 표시용이라 판정에는 들어가지 않습니다 — 방문 빈도는 건강보험 통계와 노인실태조사로 방향을 앵커했습니다. 다만 발생확률의 절대값은 설계값이고 통계 앵커는 보강 중이라고 정직하게 말씀드립니다. 경험 분포로의 대체는 파일럿의 몫이며, 지금의 계약 테스트가 그대로 실데이터 검증 하네스가 됩니다."
    do_not_say:
      - 실제 드라이빙 로그 기반 30명
      - 예측력이 검증됐다
      - 발생확률 절대값에 통계 근거가 확보됐다
    evidence_ref:
      - LongROAD 이동범위 (n=2,990)
      - CMT 2023 UBI 백서
      - DRIVES (Neurology 2025)
      - Bayat et al. 2021
      - LongROAD 자기규제 (n=1,557)
      - TAAS 2010–2024
      - 국민건강보험공단 2022
      - 2023 노인실태조사
      - 한국소비자원 2024
      - Candrive/Ozcandrive (Langford et al. 2013)
    followups:
      - q: 확률 분포 기반으로 바꾸면 뭐가 달라지나?
        a: 구조는 이미 확률 축적이라 바뀌는 것은 모수의 출처뿐입니다. 파일럿 로그에서 방문 간격·거리·이벤트율의 경험 분포를 추정해 현재 설계값을 갈아끼우면 파이프라인과 테스트는 그대로 돕니다.
      - q: LLM이 만든 데이터면 LLM 편향이 들어가지 않나?
        a: LLM은 생활권 프로필(장소·방향·비중·변화 시점)만 쓰고 임계·가중치는 정하지 않습니다. 산출물은 1회 생성 후 저장소에 고정 커밋되고 이후 전 단계가 시드 고정이라 비트 단위로 재현됩니다.
      - q: 유형별 10명은 실제 인구 비율과 다르지 않나?
        a: 판정이 개인 단위라 옆에 누가 몇 명이든 한 사람의 결과는 동일합니다. 비율이 영향을 주는 것은 포트폴리오 합계 하나뿐이라 구성비별 재계산으로 따로 제시합니다.
  - question_ko: "[9번] '루프'는 원하는 결과가 나올 때까지 반복하는 것을 의미하는데, 현재 방식은 이에 해당하지 않아 보인다. 용어 사용에 신중할 필요가 있다."
    direct_answer_ko: "지적을 전면 수용해 '루프'를 철회하고, 덱 문구를 \"multi-agent pipeline(생성→검토→승인 체인)\"(대안: \"agent-assisted design process\")으로 교체 확정했다(덱 반영은 팀 액션으로 진행 중). 현재 판정 경로에는 반복 탐색이 존재하지 않는다."
    spoken_answer_ko: "지적해주신 대로 용어가 부정확했고, 덱에서 바로잡고 있습니다. 저희 구조는 원하는 결과가 나올 때까지 되도는 반복이 아니라, 생성에서 검토, 승인으로 한 번 흐르는 체인이었습니다. 그래서 'multi-agent loop'을 'multi-agent pipeline — 생성·검토·승인'으로 바꿨습니다. 배경만 짧게 말씀드리면, 초기 설계 단계에서 후보 규칙을 만들고, 크리틱이 위험과 후속 과제를 적어 돌려주고, 마지막에 승인 게이트를 통과시키는 3단 체인이 실제로 돌았고, 그 산출물이 지금도 저장소에 파일로 남아 있습니다. 크리틱이 \"30명 합성 픽스처만으로 일반화하지 말라\"는 위험을 스스로 기록해 둔 것까지 그 안에 있습니다. 다만 지금은 판정을 결정론 엔진으로 옮겼습니다. 보험 판정은 같은 입력이면 같은 결과가 나와야 하고 감사가 가능해야 하기 때문에, 시드를 고정하고 판정 계약 테스트 27건으로 묶어뒀습니다. 현재 에이전트가 하는 일은 두 가지뿐입니다 — 페르소나의 이동 프로필을 한 번 만들어 캐시로 커밋하는 것, 그리고 고객과 직원이 읽을 리포트 문안을 쓰는 것. 판정에는 관여하지 않습니다. 이 축소는 후퇴가 아니라, 상품으로 내보내기 위한 선택이었습니다."
    do_not_say:
      - 루프
      - multi-agent loop
      - Agent–Validator Loop
    evidence_ref:
      - 저장소 레거시 체인 산출물 (data/fixtures/candidate_rules.json · rule_review.json · simulation_summary.json)
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    followups:
      - q: 그럼 가중치 30/30/20/20은 에이전트가 고른 겁니까?
        a: "아닙니다. 그 격자는 레거시 비교 실험 도구였고 결정자가 아니었습니다. 격자 1위 후보의 값이 현 값과 같지만, 현 값의 근거는 격자 순위가 아니라 문제정의 4축에 1:1로 매핑된 선언값(노출 30 / 생활권 안 행동 30 / 밖 행동 20 / 패턴 변화 20)이며, 뒷받침은 재무 실측(위험 세그먼트 평균 할인 19.6%→7.9%, 안정군 +4~6%p)과 공개된 캘리브레이션 절차입니다."
      - q: 에이전트 역할을 줄이면 AI 활용도가 떨어지는 것 아닙니까?
        a: 재현성이 필요한 곳(판정)은 결정론, 다양성과 서술이 필요한 곳(삶의 맥락 생성·설명 문안)은 에이전트로 역할을 나눈 것입니다. 판정을 LLM이 하면 감사·규제 대응이 불가능해집니다.
      - q: 리포트를 LLM이 쓰면 숫자가 틀릴 수 있지 않습니까?
        a: 프롬프트가 재계산·수치 생성을 금지하고 엔진 확정값 인용만 허용하며, 호출 실패 시 동일 스키마의 결정론 문안으로 폴백합니다.
  - question_ko: [10번] 생활권 설정에 DBSCAN을 쓰는 것이 안전한가? 도시·농촌 점 밀도 차이가 커서 하나의 기준거리로는 생활권을 못 잡는다. ⓐ행렬 변환 균일 밀도 보정 ⓑ좌표계 변환 후 클러스터링 ⓒ비유클리드 공간 개념 ⓓrisk-neutral 할인율 활용을 검토하라.
    direct_answer_ko: "지적하신 밀도 한계는 DBSCAN 원논문이 스스로 자인한 문제이고, 그 문장을 출발점으로 ①기준거리 260m(문헌 대역, 합성 3환경 260/520/1,100m는 지리 축척 ×2 정합) ②밀도 단독 거점 불인정('서로 다른 3일' AND) ③원의 크기를 군집 모양에서 분리(중심권 500m + 개인 P90)의 3층을 설계했으며, 실측 과병합 0/60·정기거점 누락 1~2/60이다."
    spoken_answer_ko: "먼저 동의합니다. 밀도가 다르면 전역 기준거리 하나로는 안 됩니다 — 이건 DBSCAN 원논문이 229쪽에 스스로 적어둔 한계입니다. 저희는 그 문장을 출발점으로 세 겹을 만들었습니다. 첫째, 기준거리는 260미터입니다 — 장소인식 문헌의 임계 대역 200~300미터 한가운데입니다. 저희 합성 3환경은 지리 자체가 두 배씩 스케일돼 있어 엔진값도 260·520·1,100으로 축척을 맞췄지만, 이는 지역 보정이 아니라 합성 세계의 축척 정합이고, 전국 단일 260으로 재판정해도 판정 변화가 사실상 없습니다. 둘째, 밀도만으로는 거점을 인정하지 않습니다. '서로 다른 3일'을 AND로 요구하고 같은 날 중복은 하루로 셉니다 — 밀도가 높아도 하루 몰림은 생활권이 되지 못합니다. 셋째, 결정적으로 원의 크기는 군집 모양이 아니라 중심권 500미터와 그분 개인 방문거리의 90퍼센타일로 정합니다. 그래서 군집이 몇 조각으로 갈라져도 최종 생활권은 거의 같습니다. 실측으로 세 환경 180건 전부 과병합 0, 정기거점 누락은 환경당 한두 건입니다. 제안하신 좌표 변환은 저희 3단 차등의 연속화 버전으로 이해했고 로드맵으로 받겠습니다. 지금 단계에서 변환을 쓰면 고객께 '당신의 생활권 반경 485미터'를 설명할 수 없게 되어 설명가능성을 우선했습니다. 다만 risk-neutral 할인율은, 저희가 공간 밀도 보정과 연결하는 경로를 찾지 못했습니다. 어떤 의도이신지 여쭙고 반영하겠습니다."
    do_not_say:
      - HDBSCAN은 커버리지 72%로 기각
      - MDPI 방법을 이식했다
      - 260m는 확정 절대값
    evidence_ref:
      - Ester et al. 1996 (DBSCAN KDD-96)
      - Zheng et al. 2009 · Montoliu et al. 2013
      - "MDPI Applied Sciences 15(22):12278"
      - Isaacman et al. 2011
      - "arXiv:1807.00546"
      - 활동공간 체계적 리뷰 47편 (PMC6737923)
      - Birant & Kut 2007 (ST-DBSCAN)
      - data/fixtures/gaip_algorithm_lab.json
      - DEGURBA (UN)
    followups:
      - q: 그래도 260m는 결국 임의값 아닌가?
        a: 절대값을 주는 문헌이 없다는 점은 인정합니다. 다만 기준값 하나를 문헌 대역(200~300m) 안에서 잡고 나머지를 ×2 축척으로 파생한 구조라 임의 숫자 3개가 아니며, 파일럿에서 k-거리 실측으로 대체됩니다.
      - q: 도시·농촌을 무엇으로 나누고, 경계에 사는 사람은 어떻게 되나?
        a: 운영 분류는 DEGURBA(인구밀도 1,500/300)를 씁니다. 경계 사례의 관건은 판정이 뒤집히느냐인데, 같은 사람을 세 환경에 통째로 옮긴 통제 비교에서 케어 판정 60/60이 동일해 티어가 한 칸 달라져도 결론이 바뀌지 않는다는 실측이 있습니다.
      - q: HDBSCAN이 일부 지표에서 낫다면 왜 안 쓰나?
        a: 맞습니다, 적정 설정에서 정답 존 모양 적합도는 HDBSCAN이 더 높습니다(0.879~0.935 대 저희 0.715~0.880). 대신 거점 파편화는 저희가 낮습니다(3.1% 대 11.8%). 저희 채택 기준은 지표 우열이 아니라 반경의 근거를 약관과 고객에게 설명할 수 있는가이고, 지금 데이터는 사람당 점 수십 개라 HDBSCAN의 파라미터가 소표본 추정에 기대게 됩니다. 파일럿에서 승격 후보로 두고 전환 조건을 정의해 뒀습니다.
  - question_ko: [11번] 통합 점수의 가중치 30/30/20/20은 무엇을 근거로 정한 값인가? (사전 정의 파라미터의 데이터·문헌 근거, 위험↔생활권 연결의 상관·익스포저 교란 우려와 같은 뿌리)
    direct_answer_ko: "30/30/20/20은 요율이 아니라 기존 요율체계 위에 얹는 할인 자격 점수의 배분이고, 네 축은 순보험료 분해에 1:1 대응하며, 안 30 > 밖 20은 신뢰도(credibility) 원리를 따른 보수적 근사다. 주장하는 것은 값이 아니라 순서이며, 값 자체는 파일럿 손해율로 재보정될 사전 설계값이다."
    spoken_answer_ko: 먼저 지위를 말씀드리겠습니다. 30/30/20/20은 요율이 아니라 기존 마일리지 할인 위에 얹는 할인 자격 점수의 배분입니다. 할증 항목 자체가 코드에 없고, 실측으로 180건 전건 할증 0, 150건이 기존 대비 동등 이상 유리합니다. 축은 순보험료 분해에 그대로 대응합니다 — 노출이 주행 30, 단위노출당 빈도율이 안전 축 50(안 30·밖 20), 장래위험이 패턴 20입니다. 노출을 30에서 멈춘 건 저주행 고령 집단의 km당 위험이 오히려 높다는 문헌 때문입니다. 안이 밖보다 무거운 이유는 위치가 아니라 신뢰도입니다. 주행의 85%가 생활권 안에서 관측되고 교란이 적으니 큰 가중, 표본이 작고 난이도 교란이 큰 밖은 작은 가중, 안 나가면 배점에서 빼고 재정규화합니다. 다만 정확히 말씀드리면 뷜만 신뢰도를 계산한 것이 아니라 원리를 따른 것이고, 파일럿에서 채널별 분산을 재면 정식 추정으로 대체됩니다. 값의 위치도 자의적이지 않습니다 — 관측량 비례면 35대15, 균등이면 25대25, 저희는 그 사이 30대20으로 균등 쪽에 보수적으로 두었습니다. 저희가 주장하는 건 값이 아니라 순서입니다. 마지막으로 이건 사전 설계값이고, 파일럿 손해율과 위험군 식별력에 맞춰 재적합해 갱신하겠습니다.
    do_not_say:
      - 뷜만 신뢰도를 적용했다
      - AI가 가중치 30/30/20/20을 선정
      - "사고분포 유도식(80:20 × 2.5배)"
      - 완전 지역 중립
    evidence_ref:
      - Candrive/Ozcandrive (Langford et al. 2013)
      - data/fixtures/gaip_algorithm_lab.json
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    followups:
      - q: 왜 주행이 30인가, 안전이 더 커야 하지 않나
        a: 안전 축은 안 30 + 밖 20 = 50으로 이미 단일 최대 블록입니다. 주행 30은 이 특약이 마일리지 위에 얹히는 오버레이라는 구조적 연속성을 반영한 값입니다.
      - q: 신뢰도 이론을 적용했다는 뜻인가
        a: 아닙니다. Z = n/(n+k)를 수치로 추정한 적이 없고, 원리(관측량·교란도에 따른 가중)만 따랐습니다. 현행은 연속 z 대신 관측/미관측 두 단만 쓰는 보수적 근사이며, 파일럿의 채널별 분산 실측으로 정식 추정에 의해 대체됩니다.
      - q: 25/25로 바꾸면 결과가 달라지나
        a: 순서가 유지되는 범위에서는 판정이 둔감하다는 것이 저희 입장이고, 969개 조합 전수 민감도 실측이 이를 뒷받침합니다(±5 이웃 판정 변화 중앙 3·최대 9건). 다만 최종 값은 논쟁으로 정할 게 아니라 파일럿 손해율 적합으로 정할 대상입니다.
  - question_ko: "[12번] 사고 심도(severity) 논리 — 문제정의는 '생활권 밖 = 사고 심도 증가' 인과를 서술했는데 그 심도가 산식 어디로 들어가는지 없다. 논리가 떠 있다."
    direct_answer_ko: "저희는 심도를 예측하지 않습니다. 4축 산식에도 판정 입력 계약에도 심도 항이 없고, 심도는 개인 판정이 아니라 \"왜 지금 예방인가\"라는 필요성 근거와 경제성 감도 확인에만 씁니다."
    spoken_answer_ko: "먼저 분명히 하겠습니다. 저희는 사고 심도를 예측하지 않습니다. 지적 주신 대로 1차 자료에서는 심도가 문제정의에 인과처럼 들어가 있었는데, 산식에는 심도 항이 없습니다. 판정에 들어갈 수 있는 입력이 코드에 화이트리스트로 고정돼 있고 여덟 개뿐입니다 — 네 축 점수와 두 변화 지수, 관측 가능 여부, 데이터 커버리지. 심도도 손해액도 사고 라벨도 없습니다. 결과도 할인 자격뿐이고, 할인율이 음수가 될 수 없게 코드에서 막혀 있어 할증 경로 자체가 존재하지 않습니다.\n\n심도가 나오는 자리는 셋인데 전부 판정 밖입니다. 첫째는 문제 배경입니다 — 75세 이상은 같은 운전량에서도 사망위험이 5배 높고, TAAS 실측으로도 전체 평균 대비 치명률 배수가 고령운전자 사고 1.4배, 노인 사고 2.5배입니다. 이건 '그래서 사후 보상보다 사전 점검이 남는 장사'라는 필요성 근거이지 개인 판정에 쓰는 값이 아닙니다. 둘째는 위험 이벤트를 급제동·과속·야간으로 나눠 보여주는 표시용 분해인데, 여기에 야간 치명률 가중이 한 번 들어갑니다. 이 값은 표시 전용이고 판정 불변이라 코드에 역할을 선언하고 테스트로 고정했으며, 가중치를 바꿔도 180건 판정이 비트 단위로 동일함을 diff로 확인했습니다. 셋째는 손익 시뮬레이션의 감도 분석입니다 — 심도 계수를 1.0배와 1.2배로 놓고 손익분기가 얼마나 움직이는지만 봤고, 요율식에는 넣지 않았습니다.\n\n예측하지 않는 이유는 명확합니다. 심도는 사고 후의 결과 변수라 상대 차량과 충돌 상황이 대부분을 결정하고, 개인 행동으로 예측하려 들면 결국 '고령이라 다치기 쉬우니 비싸게 받는다'가 되어 인수차별 문제가 됩니다. 저희가 다루는 건 빈도뿐입니다. 심도는 파일럿에서 실손해가 쌓인 뒤, 요율 변수가 아니라 케어 개입의 효과를 재는 지표로 쓰는 것이 맞다고 봅니다."
    do_not_say:
      - 생활권 밖 = 사고 심도 증가(인과 서술)
      - 300만원 통계
      - 심도를 예측한다
    evidence_ref:
      - ERSO
      - TAAS 2010–2024
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    followups:
      - q: 심도가 큰 세그먼트면 오히려 요율에 반영해야 하는 것 아닌가?
        a: 심도는 대인배상 등 담보·한도 체계가 이미 다루는 영역이고, 저희는 그 위에 얹히는 할인 오버레이라 같은 변수를 두 번 쓰지 않습니다. 저희가 더하는 값은 빈도를 줄일 여지 하나입니다.
      - q: 그럼 TAAS 치명률은 왜 엔진에 들어가 있나?
        a: 위험 이벤트를 유형으로 쪼개 리포트에 보여주는 분포에만 쓰입니다. 역할이 코드에 문자열로 선언돼 테스트로 고정돼 있고, 가중치를 교체해도 180건 판정이 동일합니다(독립 재계산 테스트 4건 포함, pytest 254건 통과).
      - q: 손익 자료에 심도 1.2배가 있던데, 결국 심도를 쓰는 것 아닌가?
        a: "그건 요율식이 아니라 손익분기 감도 분석의 가정입니다. 심도 가산 없이(1.0×) 계산해도 요구 절감률이 12.4%로 성립하고, 1.2×는 '심도를 반영하면 오히려 더 쉬워진다'는 방향만 확인한 것입니다. 어느 쪽이든 개인 요율에는 들어가지 않습니다."
      - q: 심도를 안 보면 큰 사고 리스크를 놓치는 것 아닌가?
        a: 놓치는 게 아니라 담당을 나눈 것입니다. 심도는 담보와 한도가 보고, 빈도는 저희 축이 봅니다. 케어는 사고 건수 자체를 줄이는 개입이라 결과적으로 심각 사고의 기대 건수도 함께 줄어듭니다.
  - question_ko: [13번] 실현 가능성 — 고령자 운행데이터 확보 방안은? 익숙한 경로의 사고잦은곳을 (−)요소로 반영하라. 도로 위계별 건수·심도 차이 반영과 동일값 대 차등값 재무 비교분석을 하라.
    direct_answer_ko: 데이터는 3경로 단계 확보로 가고, 사고잦은곳은 판정 벌점이 아니라 케어 리포트의 안전 안내로 채택하며, 도로 위계는 맵매칭(궤적 재구성)이 최소수집 거버넌스와 충돌해 현재 미반영이되 경량 추정과 재무 비교를 파일럿 과제로 올린다.
    spoken_answer_ko: "세 건 다 받겠습니다. 데이터는 3경로입니다 — 국내 UBI가 앱이 산정한 점수만 보험사로 넘기는 구조라(보험연구원 2024) 원좌표 반출 없이 기존 채널에서 시작할 수 있고, 신규 수집은 궤적이 아니라 '도착지 좌표와 날짜'뿐이라 동의 범위가 통상 UBI보다 좁습니다. 여기에 TAAS·공공 통계를 얹어 지역 유형 두 곳 이상 코호트에 기준선 2개월 + 관찰 6개월 파일럿을 겁니다. 지금 데이터는 전부 합성이고, 실데이터 확보가 파일럿의 1차 과제입니다.\n\n사고잦은곳은 채택하되 자리를 바꿔 채택합니다. 공개 데이터고 저희는 도착지 좌표가 있어 거점 주변 포함 여부는 궤적을 더 받지 않고도 뽑을 수 있습니다. 다만 이걸 감점으로 넣으면 그 동네에 사는 것만으로 감점이 됩니다 — 위치 중립 원칙과 '지역이 달라도 결론이 같다'는 60/60 실측이 함께 무너집니다. 그래서 감점이 아니라 케어 리포트의 안전 안내로 넣겠습니다.\n\n도로 위계는 현재 미반영입니다. 도로 등급을 알려면 맵매칭, 곧 궤적 재구성이 필요해 최소수집 원칙과 충돌하기 때문이고, 능력이 아니라 우선순위 판단입니다. 2단계로 평균속도·시간대로 도로 유형을 추정하는 경량 대안과, 말씀 주신 동일값 대 차등값 재무 비교를 파일럿 과제로 올리겠습니다 — 비교 도구인 요율 샌드박스는 이미 작동합니다."
    do_not_say:
      - 국내 도로 위계별 건수·심도 수치
      - 파일럿 N 숫자(모수 확인 전)
      - 사고잦은곳을 판정 감점으로
    evidence_ref:
      - 보험연구원 KIRI리포트 2024.7
      - NHTSA 2021 (DOT HS 813 488)
      - TAAS 2010–2024
      - data/fixtures/gaip_algorithm_lab.json
    followups:
      - q: 정보 제공용이면 상품에 무슨 도움이 되나?
        a: "케어 리포트의 실행 가능성이 올라갑니다. 지금은 '점검하세요'까지인데 지점을 특정하면 담당자 상담과 지자체 안전 프로그램 연계가 구체화됩니다 — 감점보다 이쪽이 예방 효용이 큽니다."
      - q: 파일럿 N과 예산은?
        a: 귀사 UBI 가입 고령 고객 모수를 확인해야 확정할 수 있어 지금 숫자를 말씀드리지 않겠습니다. 필요한 필드가 도착지 이벤트뿐이라 단말·수집 부담은 통상 UBI 파일럿보다 낮게 잡힙니다.
      - q: 평균속도로 고속도로를 구분하는 게 신뢰할 만한가?
        a: 단독으로는 부정확합니다. 그래서 판정 축이 아니라 관측·리포트 지표로 먼저 넣고, 맵매칭 표본과 대조해 정확도를 잰 뒤 채점 편입 여부를 결정하는 순서로 제안합니다 — 정할 수 없는 동안은 원리로 시작하고, 잴 수 있게 되면 잽니다.
  - question_ko: 왜 고령자로만 한정했나
    direct_answer_ko: "우리 방식은 '개인의 평소'를 학습해 변화를 보므로 평소가 안정적이어야 한다. 고령층은 생활 반경이 좁고 반복적이라 기준선이 가장 잘 선다(LongROAD: 야간 회피 58.8%, 이웃 마을 밖 안 나감 22.6%). 젊은 층의 패턴 다양성은 우리 방식에선 신호가 아니라 노이즈이며, 확장에 필요한 건 알고리즘 교체가 아니라 학습 창 재조정이다(학습 창은 코드에서 파라미터로 분리돼 있음)."
    do_not_say:
