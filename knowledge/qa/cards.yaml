  - question_ko: 베이스라인 2개월의 근거는
    topic: 기준선-2개월
    source: "sources/02_마스터답변안_전항목.md#7-베이스라인-기간2개월-설정-근거 · sources/07_근거지도.md#7-베이스라인-2개월의-근거"
    direct_answer_ko: "역산 4단계로 답한다: ① 거점 인정 = 서로 다른 3일 이상 방문(Isaacman 2011: 60일 관찰의 5% = 3일, 총 횟수가 아니라 call-days로 세는 단위까지 동일) ② 가장 뜸한 생활 거점 빈도는 월 2회 수준(앵커: 건보 65세+ 월평균 입내원 3.75일·경로당 이용자 주 2.9회·복지관 이용자 주 1.5회) ③ 관찰 창 1개월이면 방문 2일로 3일 미달 → 거점 탈락(푸아송 포착 확률 32.3% — 3곳 중 2곳 누락) ④ 2개월이면 4일로 충족(76.2%; 3개월은 93.8%지만 개입 1개월 지연). ∴ 2개월 = 저빈도 생활 거점을 놓치지 않는 최소 창. 창과 임계는 한 쌍 — 2개월 창에서 우연 방문지 오인율이 임계 2일 26.4% → 3일 8.0% → 4일 1.9%이고, 임계를 4일로 올리면 진짜 거점 포착이 56.7%로 급락하므로 3일이 오인·누락을 동시에 억제하는 최소 정수다. 보조 확인: 2개월이면 운전 26~43회로 표본 충분(소비자원 2024, n=300). 선례 스펙트럼에서 우리 위치: UMTRI 2주·DRIVES 1개월(운전 연구 기준선)보다 보수적, Candrive 재평가 4개월 이내 — 운전 연구 계열(왜 2개월)과 Isaacman 통신 계열(왜 3일)은 담당 질문이 다르므로 섞지 않는다. 우리 데이터 실측: 369개 목적지 그룹 중 3일 미만 6개(1.6%), 진짜 거점 탈락 0. 기준선 1/2/3개월 민감도 재판정은 아직 안 돌린 백로그(반나절이면 표 제출 가능)이며, 파일럿에서 실데이터 방문 빈도 분포로 재보정한다."
    spoken_answer_ko: "방문 빈도로 역산했습니다. 월 2회 가는 뜸한 거점은 한 달 관찰로 잡힐 확률이 32%지만, 두 달이면 76%입니다. 세 달은 94%지만 반영이 한 달 늦습니다. Isaacman 2011도 중요 장소를 찾을 때 60일과 서로 다른 3일을 사용했습니다. 그래서 두 달을 시작값으로 두고 파일럿에서 다시 재겠습니다."
    do_not_say:
      - KTDB 2013 트립당 14.0km(원문 링크 미확보)
      - "'2개월이 최적값'('합리적 균형값'으로 — 브리핑_0803 §1·§10 금지 표현)"
      - "'3일 고정'('관찰 창의 5%'로 말할 것)"
      - 경로당·복지관 수치를 전체 노인 통계처럼(해당 시설 이용자 기준)
      - Lally 66일을 기준선 근거로
      - 합성 실측으로 오탐 방어 주장(확률 논리로만)
    evidence_ref:
      - Isaacman 2011
      - 푸아송 오류율 계산
      - 빈도 앵커(건보·경로당·복지관)
      - 소비자원 2024
      - 관찰 창 선례 5건
      - 369개 목적지 그룹 실측
    followups:
      - q: 왜 3일이 임계인가
        a: "Isaacman 2011(60일의 5%=3일, call-days 단위 동일) + 푸아송 계산: 2일=오인 26%, 3일=8%, 4일=진짜 거점 절반 누락."
