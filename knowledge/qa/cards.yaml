  - question_ko: "[#2] 사고의 대부분이 생활권 안에서 발생한다는 통계가 있는데, 생활권 밖을 문제 삼는 전제가 맞느냐. (1차: 위험↔생활권 연결이 부자연스러움 — 단순 상관, 고속도로 비중·운행거리 익스포저 교란 가능성)"
    topic: 생활권-안-사고통계
    source: "sources/02_마스터답변안_전항목.md#2. \"대부분의 사고는 생활권 안에서 난다\""
    direct_answer_ko: "동의합니다. 그리고 그 동의가 이미 저희 설계입니다 — 산식에 위치 벌점이 없고(location_penalty: 0.0), 생활권 안을 밖보다 더 무겁게(30 vs 20) 같은 잣대(100km당 위험행동률, _safety_score 동일 함수)로 채점합니다. 사고가 안에 몰리는 것은 위험의 지도가 아니라 노출의 지도(Burdett 2017: 자택 11km 이내가 통행의 절반·사고의 62%)이고, 노출을 통제하면 방향이 반대 — Ehsani & Tefft 2021의 사례-대조에서 노출(대조군의 자택 5마일 이내) 58% vs 사고 50%, 거리별 위험 +28%/+47%/+77%(6~10·11~20·>20마일), 처음 가는 도로 운전자의 사고 연루 2.5배·월 1회 미만 +27%. 밖에 안 나가면 그 축은 채점에서 빠지고(180 시나리오 중 56건이 밖 축 없이 판정, 그중 33건 우대), 생활권 안에서만 위험한 유형 30 시나리오는 안 안전점수 평균 15.8점·30건 전부 우대 탈락 — 안이 안전지대라는 전제로는 나올 수 없는 결과다. 결론은 '밖이 위험하다'가 아니라 '그 사람의 평소가 무너졌는가'(동시 급변)를 본다는 것."
    spoken_answer_ko: "맞습니다. 사고 대부분은 생활권 안에서 납니다 — 저희도 그 통계를 문제정의에 그대로 씁니다. 다만 그건 위험의 지도가 아니라 노출의 지도입니다. 주행의 절반가량이 자택 11km 안에서 일어나므로 사고도 거기 몰립니다. 노출을 통제하면 방향이 오히려 반대입니다. Ehsani & Tefft 2021은 같은 사고 현장 안에서 사고를 유발한 운전자와 그렇지 않은 운전자를 비교합니다. 도로도, 속도도, 시간대도 같은 조건이죠. 그 안에서 처음 가는 도로 운전자가 사고에 연루될 가능성이 2.5배였습니다. 그래서 저희 결론은 '밖이 위험하다'가 아닙니다. 저희 산식에는 위치 벌점이 아예 없고, 오히려 생활권 안의 가중치가 30으로 밖의 20보다 높습니다. 두 축의 잣대는 100km당 위험행동률로 완전히 동일하고, 밖에 안 나가면 그 축은 채점에서 빠집니다 — 실제로 180 시나리오 중 56건이 밖 축 없이 판정됐고 그중 33건이 우대를 받았습니다. 실증이 하나 더 있습니다. 저희 데이터에는 '생활권 안에서만 위험하게 운전하는' 유형이 10명, 세 환경 30 시나리오 있습니다. 이분들의 생활권 안 안전점수는 평균 15.8점이고, 30건 전부 우대를 받지 못합니다. 안이 안전지대라는 전제였다면 나올 수 없는 결과입니다. 저희가 보는 건 '밖에 나갔는가'가 아니라 '그 사람의 평소가 무너졌는가'입니다."
    do_not_say:
      - "'밖이 위험하다'는 결론"
      - 친숙도 분석을 quasi-induced exposure 가정 병기 없이 인용
      - Burdett 2017 반대 결과·Intini 2019 리뷰 불확실성 생략
      - 심도 예측 시사
    evidence_ref:
      - Ehsani & Tefft 2021 CHANCE
      - Burdett et al. 2017
      - Intini, Colonna & Ryeng 2019
      - 180 시나리오 실측
    followups:
      - q: 그러면 왜 안/밖을 굳이 나누나?
        a: "벌점을 주려는 게 아니라 증거의 밀도와 해석 난이도가 다르기 때문입니다. 안은 행동 증거가 가장 많이 쌓이는 주 무대라 30, 밖은 표본이 작고 불가피한 외출이 과대평가되지 않도록 20으로 뒀으며, \"같은 행동도 낯선 곳에선 난이도가 다르다\"는 Ehsani & Tefft의 관찰을 분리 채점으로 반영한 것입니다. 부수 효과로 농촌 거주자·정기 통원자가 불이익을 받지 않는 지역 중립성이 확보됩니다(광역 이동·안전형 26/30, 복수 생활권형 30/30 우대)."
      - q: 안이 더 위험하다면 안 가중치를 더 올려야 하는 것 아닌가?
        a: 저희가 주장하는 것은 절대값이 아니라 순서이고, 순서는 이미 안(30) > 밖(20)입니다. 절대값은 선언적 파라미터라 공개·조정 가능하고, 969개 조합 전수 민감도 실측에서 ±5 이웃의 판정 변화가 중앙 3·최대 9건 — 현행 30이 지배 축(주행·안)의 최저점입니다.
      - q: 생활권 밖 사고는 더 크게 다치지 않나?
        a: "저희는 심도를 예측하지 않습니다. 케어의 목적은 심도 예측이 아니라 '사람이 점검할 시점'의 감지입니다. 요율 영향은 할증이 아니라 할인 축소입니다 — 기존 마일리지 할인 위에 얹히는 오버레이라 할증 경로가 구조상 없고(180 시나리오 전건 candidate_surcharge_rate_pct = 0, 하한 = 기준 요율), 케어가 확정되면 보너스가 정지되고 할인이 13%p 줄어(care_discount_reduction_pct: 13.0, 실측 30건 적용) 전보다 내는 돈이 늘 수 있다는 점은 정직하게 말씀드립니다. 조건은 한 번의 운행이 아니라 지속된 동시 급변과 사람 검토이고, 실측에서 케어는 동시 급변 달에 정확히 발동했고(30/30), 오탐 대조군에서는 0건이었습니다."
  - question_ko: 페르소나를 먼저 정하니 결과가 예쁘게 나올 수밖에 없는 구조 아닌가 (순환논증)?
    topic: 순환논증-검증설계
    source: "sources/부록D_해설_팀원용.md#1절·6절 · sources/데이터생성_상세정리.md#6절 검증 · sources/02_마스터답변안_전항목.md#8절"
    direct_answer_ko: "케어형이 케어로 나온 건(30/30) 증명이 아니고, 케어로 설계 안 한 유형이 케어로 새지 않은 것(0/30)이 증명입니다. '기대 등급 = 판정 등급' 일치가 증명이 되려면 세 조건이 필요하고, 셋 다 갖춰져 있습니다: ① 판정이 라벨을 모른다 — 판정 함수는 유형·시나리오 라벨(designed_type)을 입력받지 않음(블라인드) ② 실패해야 할 케이스가 실패한다 — ③ 이동변화·안전유지형 오탐 대조군은 이동 임계 초과 191 케이스-월에도 케어 발동 0건 ③ 규칙이 데이터에 적합되지 않았다 — 산식(임계·가중치)은 페르소나에서 도출된 적 없는 선언값(숨은 튜닝 없음)이고, 파티션 108/36/36, 시드 고정 재현. 유형별 10명 균등 배분도 인구 비율이 아니라 각 판정 경로를 같은 검증력으로 시험하는 통제 설계입니다. 단, 이 검증이 보이는 것은 예측력이 아니라 판정 로직의 일관성입니다(Simulated — 실제 사고·손해율 효과 미검증)."
    spoken_answer_ko: "먼저 정정하겠습니다. 1차 자료의 '실제 드라이빙 로그 기반 30명'은 부정확한 표현이었고, 저희 데이터는 합성 데이터입니다. 질문 주신 분류로는 후자 — 사전 정의한 6개 유형에 파라미터를 설정해 생성했고, 규모는 60명 로스터를 3개 지역환경에 둔 180 시나리오입니다. 그리고 결과가 시나리오 설계의 산물이라는 지적도 맞습니다. 그게 이 단계의 목적입니다. 저희가 합성으로 검증하는 건 예측력이 아니라 로직 일관성입니다. 케어가 나야 할 설계에서 나는가보다, 나면 안 되는 설계에서 안 나는가가 더 중요합니다. 그래서 페르소나에 실패해야 할 케이스를 넣었습니다 — 이동만 커지고 안전은 그대로인 이사형 30건은 케어가 나오면 안 되는 대조군이고, 실측 오탐 0입니다. 채점 엔진은 유형 라벨을 모릅니다. 파라미터 중 위험행동 유형 가중치는 TAAS 원천 통계에서 엔진이 직접 계산하고 — 이 값은 유형 분해 표시용이라 판정에는 들어가지 않습니다 — 방문 빈도는 건강보험 통계와 노인실태조사로 방향을 앵커했습니다. 다만 발생확률의 절대값은 설계값이고 통계 앵커는 보강 중이라고 정직하게 말씀드립니다. 경험 분포로의 대체는 파일럿의 몫이며, 지금의 계약 테스트가 그대로 실데이터 검증 하네스가 됩니다."
    do_not_say:
      - 기대=판정 일치 자체가 증명이다
      - 예측력이 검증됐다
      - 10명 배분이 인구 비율이라는 취지(테스트 설계다)
