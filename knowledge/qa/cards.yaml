  - question_ko: "[#7] 생활권 학습 기준선을 왜 하필 2개월로 잡았는가. 근거가 선언적으로 보인다. (제안: 1년 단위 평균 운행거리 통계를 찾아 역산하면 근거가 될 것)"
    topic: 기준선-2개월
    source: "sources/02_마스터답변안_전항목.md#§7(베이스라인 기간 2개월 설정 근거) · sources/07_근거지도.md#§7 · sources/부록B_해설_팀원용.md#2부(왜 2개월인가 4단계) · sources/08_출처부록_주제별.md#5장(기준선 관찰 기간 선례)"
    direct_answer_ko: "2개월은 월 2회급의 뜸한 생활 거점도 서로 다른 3일 문턱을 넘길 확률이 4분의 3을 넘어서는 최소 관찰 기간이다. 방문일을 푸아송으로 두면 성립 확률이 1개월 32.3% → 2개월 76.2% → 3개월 93.8%다. 1개월의 누락을 크게 줄이면서 3개월보다 한 달 빠르다. Isaacman 2011도 중요 장소 식별에 60일 관찰과 서로 다른 3일을 사용했다. 기준선 1·2·3개월 민감도는 파일럿에서 실데이터로 다시 검증한다."
    spoken_answer_ko: "방문 빈도로 역산했습니다. 월 2회 가는 뜸한 거점은 한 달 관찰로 잡힐 확률이 32%지만, 두 달이면 76%입니다. 세 달은 94%지만 반영이 한 달 늦습니다. Isaacman 2011도 중요 장소를 찾을 때 60일과 서로 다른 3일을 사용했습니다. 그래서 두 달을 시작값으로 두고 파일럿에서 다시 재겠습니다."
    followups:
      - q: 1개월로 줄여도 크게 안 달라지지 않나?
        a: "병의원처럼 잦은 거점은 1개월에도 72% 성립하지만, 월 2회급 뜸한 거점은 32%까지 떨어집니다. 그 거점이 빠지면 그 사람의 생활권 지도 자체가 좁게 잡혀 '밖 비중'이 실제보다 부풀려집니다 — 관측의 질 문제이지 위치 벌점 문제가 아닙니다."
      - q: Isaacman은 운전 연구가 아니지 않나?
        a: "맞습니다, 휴대폰 통신 위치데이터 연구입니다. 저희가 이 논문에서 가져온 것은 고령자 운전 행태가 아니라 \"위치 점에서 반복 방문지를 어떻게 식별하는가\"라는 방법론입니다 — 데이터가 통신이든 차량이든 같은 문제이고, 관찰 창 60일과 \"전체 일수의 5% = 서로 다른 3일\"이라는 도출이 저희와 일치합니다. 기준선 기간의 운전 연구 선례는 따로 있습니다 — UMTRI 2주, DRIVES 첫 1개월, Candrive 4개월 재평가 주기이고 저희 2개월은 그 사이입니다."
      - q: 습관이 2개월에 자리 잡는다는 근거는?
        a: 그 주장은 하지 않습니다. Lally 2010의 66일은 일반 행동 습관 연구(그것도 새 습관의 형성 기간, 범위 18~254일)라 시간 스케일 참고로만 언급했고, 저희 2개월의 근거는 습관 형성이 아니라 거점 검출에 필요한 관측량입니다.
