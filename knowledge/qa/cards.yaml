  - question_ko: "[#4] Safe Zone이 반경(거리) 하나로만 정의돼 있다. 도심 1km와 농촌 1km는 의미가 다르니 GPS로 도시형/교외형/농촌형 지역유형을 나눠 기준을 차등화해야 현실성이 올라간다. (+CSC: 경로 단위인가 존 단위인가, 20km 경로 중 10km가 익숙하면 어떻게 반영하나)"
    direct_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 판정 경계는 그 사람의 실제 방문 분포(P90)가 정하고, 지역 특성은 저희가 주입하는 것이 아니라 개인 실측이 자동으로 흡수합니다. 지역 설정이 판정을 좌우하지 않는다는 것을 서로 다른 두 실험(실험 A: 단일 eps 재판정 0/180 변화, 실험 B: 3지형 케어 60/60·우대 54/60)으로 확인했습니다."
    spoken_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 세 가지로 말씀드리겠습니다. 첫째, 저희가 보는 것은 도착지 하나입니다. 원장에 출발점이나 경로 컬럼이 아예 없습니다. 어떤 지형을 지났는지가 아니라 '평소 가던 곳인가'만 보기 때문에, 지형 분류가 판정에 개입할 통로가 없습니다. 둘째, 지역 차이는 개인 실측이 흡수합니다. 생활권 원의 크기는 그 사람 방문 분포의 90퍼센타일이 정합니다. 같은 규칙인데 광역 거주자는 813m, 도심 거주자는 500m로 갈립니다 — 저희가 나눈 게 아니라 데이터가 나눈 겁니다. 셋째, 실측으로 두 번 확인했습니다. 저희 설정을 바꿔서, 지역별로 다르게 주던 기준거리를 전국 하나로 통일해 180건을 재판정했더니 판정이 한 건도 달라지지 않았습니다. 그리고 고객 쪽을 바꿔서, 같은 60명을 도심·교외·광역 세 지형에 각각 놓았더니 케어는 60명 전원, 우대는 54명이 동일했습니다. 지역이 사람의 판정을 바꾸지 않는다는 뜻이고, 농촌 거주자나 정기 통원자가 구조적으로 불이익받지 않는다는 공정성 증거이기도 합니다. 기준거리 260m는 장소 인식 문헌의 통용 대역 200~300m의 중앙값으로 잡은 설계값입니다. 운영에서는 이 값을 정하지 않고 잽니다 — 재방문 산포를 실측하는 절차가 구현돼 있고, 지역을 나눌지 여부와 그 방향까지 측정이 결정합니다."
    followups:
      - q: 도심이 오히려 주차가 어려워 산포가 클 텐데 왜 도심 eps가 작은가
        a: 정확한 지적이고, 방향은 저희 가정이며 반대일 수 있습니다. 그래서 방향을 주장하지 않습니다 — eps를 전국 단일값으로 바꿔 재판정해도 180건 판정이 동일해서 그 논쟁이 결과를 바꾸지 않습니다. 실제 방향은 파일럿 산포 측정이 정합니다.
      - q: 그럼 지역 차등을 한 게 아니지 않나
        a: "사람이 지역을 분류해 다른 잣대를 주는 방식은 하지 않습니다. 대신 개인 실측이 지역 특성을 흡수해 결과적으로 원 크기가 갈립니다(광역 813m vs 도심 500m). 지적하신 \"도심 1km와 농촌 1km의 의미 차이\"는 이 층에서 반영됩니다."
      - q: HDBSCAN을 쓰면 eps가 필요 없지 않나
        a: "핵심 계산(k번째 이웃까지 거리)은 저희도 씁니다. 다만 개인마다 매번 추정하지 않고 전체에서 한 번 측정해 고정값으로 씁니다. 개인당 점이 100개 수준이라 개인 추정은 우연에 흔들리지만 수천 명을 모으면 안정적이고, 그래야 \"반경 260m\"라는 말할 수 있는 숫자가 남습니다."
    do_not_say:
      - "'도심이 작고 농촌이 크다'는 eps 방향 방어"
      - 실험 A와 실험 B 혼용
      - 경로 미수집을 능력 한계로 설명(최소수집 거버넌스 설계)
    evidence_ref:
      - gaip_visit_events.csv
