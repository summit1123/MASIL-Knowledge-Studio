  - question_ko: 케어 상태가 되면 보험료는 어떻게 되나?
    topic: 케어-요율
    source: "sources/00_확정수치카드.md#요율·케어 · sources/안전운전자_매력도_정리.md#6. 정직 고지 — 연간 케어 any 규칙"
    direct_answer_ko: 보너스 정지 + 할인 13%p 축소. 우대 보너스(1~7%p 점수 비례, 75점=1·100점=7)가 멈추고 할인이 13%p 줄어 전보다 낼 수 있음은 정직하게 표기한다. 다만 할증 경로는 구조상 없어(180 시나리오 전건 candidate_surcharge_rate_pct = 0) 최악이 할증이 아니라 할인 축소이고, 하한은 기준 요율·할인 상한은 45%다. 13%p는 요율 샌드박스의 손익 예시값(illustrative_economics_sandbox_not_final_tariff)이며, 케어는 자동 요율이 아니라 사람 검토(care_review)로 이어지고 해제는 신청 없이 지표가 정상으로 돌아온 그 달에 닫힌다. 현 규칙(any)은 케어 월이 1개만 있어도 그 해 감액이 걸리는데, rolling 실측에서 케어 30건 전원이 1개월 발동이라 감액을 발생 월수에 비례(13.0×발생월수÷12, 1개월 시 1.08%p)시키는 월수 비례 개선이 방침(선언 파라미터라 손익까지 즉시 재계산).
    do_not_say:
      - 케어는 5개월 이상 지속(케어 5~7개월 — 고정 기준 구수치, 인용 금지)
      - 감액 13%p를 최종 요율로(손익 예시값)
      - 벌점(→ 할인 축소)
    evidence_ref:
