  - question_ko: 안전 운전자에게 매력 없는 상품 아닌가 (할증 우려)
    topic: 안전운전자-매력도
    source: "sources/02_마스터답변안_전항목.md#5-안전-운전자-대상-상품-매력도 · sources/안전운전자_매력도_정리.md#7-발표-답변-6090초 · sources/안전운전자_매력도_정리.md#6-정직-고지 · sources/07_근거지도.md#5-안전-운전자에게-매력-없는-상품-아닌가"
    direct_answer_ko: "할증 경로가 코드에 존재하지 않는다 — 요율표가 아니라 기존 마일리지 할인 위에 얹히는 할인 자격 점수(오버레이)라 pricing_sandbox가 max(0, min(45, ·))로 잘라 하한이 기준 요율이고, 180 시나리오 전건 candidate_surcharge_rate_pct = 0. 단발 운행은 판정에 진입하지 못한다 — 판정 단위가 트립이 아니라 월 집계 비율이고(월 트립 중앙값 32건에서 예외 운행 1건 ≈ 3.1%p, 임계의 1/8), 직전 2개월 평균 대비 이동 25%p AND 위험행동 20%p 동시 급변이라야 발동하며, 그 위에 사람 검토가 있다. 실측: ③ 이동변화·안전유지형 30 시나리오에서 이동 임계 초과 191 케이스-월인데 케어 0건, 평균 할인은 21.2%→26.7%로 상승. 전체 180건 중 150건이 기존 마일리지 특약과 같거나 낮은 보험료, 그중 113건은 더 낮다. 정직 고지: '케어 월 1개만 있어도 연간 감액(할인 축소 13.0%p)'은 사실이고, rolling 실측에서 케어 30건 전원이 1개월 발동이라 이 사례가 실측의 전형 — 11개월 우수 + 1개월 급변 고객이 12개월 내내 애매한 고객보다 13.0%p 불리해지는 역전이 실측 전건에 해당하므로, 감지는 유지하되 감액을 발생 월수에 비례(13.0×월수÷12, 1개월 시 1.08%p)시키는 것이 권고안이다(선언 파라미터라 즉시 재계산)."
    spoken_answer_ko: "타당한 우려이고, 저희가 가장 조심해서 설계한 지점입니다.\n\n먼저 상품의 지위입니다. 저희는 요율표가 아니라 기존 마일리지 할인 위에 얹히는 할인 자격 점수입니다. 코드에 할증 경로가 아예 없어서 최악의 경우가 할증이 아니라 할인 축소이고, 하한은 기준 요율입니다.\n\n다음은 산수입니다. 판정은 트립이 아니라 월 집계 비율이고, 직전 두 달 평균 대비 이동이 25%p, 위험행동이 20%p 동시에 올라야 열립니다. 저희 데이터의 월 운행 중앙값이 32건이니 명절에 한 번 멀리 다녀오신 것이 움직이는 폭은 약 3%p, 임계의 8분의 1입니다. 게다가 명절·병원·여행은 이동 축만 건드려서 AND 게이트에서 걸리지 않습니다. 이동만 크게 변한 대조군 30건에서 이동 지표가 임계를 넘은 달이 191 케이스-월인데도 케어가 한 번도 열리지 않았고, 평균 할인은 21.2%에서 26.7%로 오히려 올라갔습니다.\n\n정직하게 한 가지 더 말씀드리겠습니다. 현재 규칙은 열두 달 중 한 달만 케어가 열려도 그 해 할인이 13%p 줄어듭니다. 실측에서 케어 대상 30건 전원이 한 달 발동이라 이 사례가 바로 실측의 전형입니다. 산식으로 계산해보면, 열한 달을 잘 타고 한 달 급변한 고객이 열두 달 내내 애매했던 고객보다 13%p 불리해지는 역전이 나옵니다. 그래서 감지는 유지하되 요율 반영을 발생 월수에 비례시키는 방향으로 보고 있습니다. 선언 파라미터라 손익까지 즉시 재계산됩니다."
