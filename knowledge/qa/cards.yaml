  - question_ko: Safe Zone이 반경 기준뿐인데 지역 차등이 필요하지 않나
    topic: SafeZone-지역차등
    source: "sources/02_마스터답변안_전항목.md#4-safe-zone-정의-방식--지역-유형별-차등 · sources/생활권반경_eps_정리.md#8-발표-답변-6090초 · sources/07_근거지도.md#4-safe-zone이-반경-기준뿐--지역-차등-필요 · sources/브리핑_0803_이슈정리.md#5-eps-정리-축척-프레임--82-확정"
    direct_answer_ko: "지역을 사람이 분류하지 않는다. 판정이 보는 것은 도착지 하나뿐이고(원장에 출발점·경로 컬럼이 없음 — 도착지 존 단위라 '20km 중 10km 익숙' 문제가 구조적으로 발생하지 않음), 반경은 두 층이다: eps(기준 260m)는 흩어진 방문점을 거점으로 묶는 눈금일 뿐 판정 경계가 아니고, 판정 경계인 생활권 원은 max(코어 500m, min(개인 P90, 2km))로 개인 방문 분포가 정해 지역 차이를 자동 흡수한다(같은 규칙인데 광역 813m vs 도심 500m — 데이터가 나눔). 실측 두 건: 실험 A(우리 설정) — 지역별 eps를 전국 단일 260m로 통일해 재판정해도 판정 변화 사실상 없음(고정 기준 0/180 · rolling 재검증 3/180 경계 사례). 실험 B(고객 지형) — 같은 60명을 3지형에 배치해도 케어 60/60 유지·우대 54/60(갈림 6명 = 케어 발동 5·문턱 근접 1, 사유 실측 — 벌점 아님). 운영값은 실데이터 k-거리로 재고, 지역을 나눌지 여부와 그 방향까지 측정이 정한다(운영 분류는 DEGURBA 채택 — 결정만 있고 미구현)."
    spoken_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 세 가지로 말씀드리겠습니다.\n\n첫째, 저희가 보는 것은 도착지 하나입니다. 원장에 출발점이나 경로 컬럼이 아예 없습니다. 어떤 지형을 지났는지가 아니라 '평소 가던 곳인가'만 보기 때문에 지형 분류가 판정에 개입할 통로가 없습니다.\n\n둘째, 지역 차이는 개인 실측이 흡수합니다. 생활권 원의 크기는 그 사람 방문 분포의 P90이 정합니다. 같은 규칙인데 광역 거주자는 813m, 도심 거주자는 500m로 갈립니다 — 저희가 나눈 게 아니라 데이터가 나눈 겁니다.\n\n셋째, 실측으로 두 번 확인했습니다. 저희 설정을 바꿔서, 지역별로 다르게 주던 eps를 전국 하나로 통일해 180건을 재판정했더니 판정 변화가 사실상 없었습니다(고정 기준 0건 · 갱신형 재검증 경계 3건). 그리고 고객 쪽을 바꿔서, 같은 60명을 도심·교외·광역 세 지형에 각각 놓았더니 케어는 60명 전원, 우대는 54명이 동일했습니다. 지역이 사람의 판정을 바꾸지 않는다는 뜻이고, 농촌 거주자나 정기 통원자가 구조적으로 불이익받지 않는다는 공정성 증거이기도 합니다.\n\neps 260m는 장소 인식 문헌의 통용 대역 200~300m의 중앙값으로 잡은 설계값입니다. 운영에서는 이 값을 정하지 않고 잽니다 — 재방문 산포를 실측하는 절차가 구현돼 있고, 지역을 나눌지 여부와 그 방향까지 측정이 결정합니다."
    do_not_say:
      - 지역별 3단 eps 차등을 검증된 성과로 내세우기
      - 도심 소·농촌 대 방향을 검증된 것처럼 방어
      - "'0건' 단독 인용 — '고정 기준' 단서와 rolling 재검증 3/180 병기 필수(브리핑_0803 §5)"
      - 실험 A(우리 설정)와 실험 B(고객 지형) 혼용
    evidence_ref:
      - 원장 구조(도착지만 봄)
      - "eps 등가·단일 eps 재판정: 고정 기준 0/180 · rolling 재검증 3/180(경계)"
      - 3지형 판정 실측
      - 개인별 원 갈림(813m vs 500m)
      - Zheng 2009 / Montoliu 2013
      - ENVIRONMENTS 순환 위험 고지
    followups:
      - q: 합성으로 검증한 것 아닌가(순환)?
        a: ENVIRONMENTS에 생성 파라미터(visit_jitter_m)와 분석 파라미터(dbscan_eps_m)가 공존해 합성 검증은 순환을 피할 수 없다 — 그래서 운영값은 실데이터 k-거리로 재도출한다고 먼저 말한다.
      - q: 지역 분류 기준은?
        a: 운영 시 DEGURBA(UN 표준) 채택 — 결정만 있고 미구현이다.
