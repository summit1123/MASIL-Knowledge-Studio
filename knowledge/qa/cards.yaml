  - question_ko: "[#5] 평소 패턴 대비 변화를 기준으로 삼으면, 평소 매우 안전한 사람이 명절·병원 방문 같은 단 한 번의 예외 운행으로 보험료가 오를 수 있다. 안전 운전자에게는 비매력적인 상품 아닌가. (1차 Q6 '이사하면 어떻게 되나'의 연장)"
