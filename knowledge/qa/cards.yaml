    spoken_answer_ko: 네, 생성 과정에 AI가 있습니다 — 다만 AI는 생활 구조까지만 만들고, 통계적 성질은 사람이 문헌에서, 개별 레코드는 고정 엔진이 만듭니다. AI가 판정에 유리하게 개입할 층이 구조적으로 없고, 그것을 대조군 오탐 0건으로 확인했습니다.
