    followups:
      - q: 법무 검토는 받았나
        a: "받은 적이 없다 — '법무 검토는 파일럿 전 필수 절차로 잡혀 있습니다'로 답한다. 심사에 법률 전문가가 있으면 위험한 지점."
      - q: 제출한 시뮬레이션 파일에는 12개월 좌표가 다 들어 있던데?
        a: 맞다 — 심사 재현·판정 검증용으로 14개월 이벤트를 원본 그대로 남긴 아카이브다. 운영 보존 설계와는 별개고, 운영에서 12개월간 남는 것은 파생값과 월 집계다.
