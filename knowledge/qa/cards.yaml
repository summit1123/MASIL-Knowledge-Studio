  - question_ko: "[12번] 사고 심도(severity) 논리 — 문제정의는 '생활권 밖 = 사고 심도 증가' 인과를 서술했는데 그 심도가 산식 어디로 들어가는지 없다. 논리가 떠 있다."
    topic: 사고심도
    source: "sources/02_마스터답변안_전항목.md#§12(사고 심도 severity 논리) · sources/07_근거지도.md#§12"
    direct_answer_ko: "저희는 심도를 예측하지 않습니다. 4축 산식에도 판정 입력 계약에도 심도 항이 없고 — 판정 입력은 화이트리스트 8개(4축 점수·2 변화지수·관측 가능 여부·데이터 커버리지)로 코드에 고정, 심도·손해액·사고 라벨 부재 — 심도는 개인 판정이 아니라 \"왜 지금 예방인가\"라는 필요성 근거와 경제성 감도 확인에만 씁니다. 심도가 등장하는 자리는 셋 다 판정 밖 — ①문제 배경(ERSO 75세+ 동일 운전량 사망위험 5배, TAAS 치명률 가중 고령운전자 사고 1.40배·노인 사고 2.52배) ②표시 전용 유형 분해(야간 치명률 가중 — 가중치 교체 후 180건 판정 diff 0 검증) ③손익 감도 분석(심도 계수 1.0×/1.2× — 1.0×에서도 요구 절감률 12.4%로 손익분기 성립). 예측하지 않는 이유는 심도가 사고 후의 결과 변수라 상대 차량·충돌 상황이 대부분을 결정하고, 개인 행동으로 예측하면 '고령이라 다치기 쉬우니 비싸게 받는다'는 인수차별로 직결되기 때문이며, 문제정의 장표의 심도 인과 서술은 최종안에서 제거했다. 심도는 파일럿에서 요율 변수가 아니라 케어 개입의 효과 측정 지표로 쓴다."
    spoken_answer_ko: "먼저 분명히 하겠습니다. 저희는 사고 심도를 예측하지 않습니다. 지적 주신 대로 1차 자료에서는 심도가 문제정의에 인과처럼 들어가 있었는데, 산식에는 심도 항이 없습니다. 판정에 들어갈 수 있는 입력이 코드에 화이트리스트로 고정돼 있고 여덟 개뿐입니다 — 네 축 점수와 두 변화 지수, 관측 가능 여부, 데이터 커버리지. 심도도 손해액도 사고 라벨도 없습니다. 결과도 할인 자격뿐이고, 할인율이 음수가 될 수 없게 코드에서 막혀 있어 할증 경로 자체가 존재하지 않습니다.\n\n심도가 나오는 자리는 셋인데 전부 판정 밖입니다. 첫째는 문제 배경입니다 — 75세 이상은 같은 운전량에서도 사망위험이 5배 높고, TAAS 실측으로도 전체 평균 대비 치명률 배수가 고령운전자 사고 1.4배, 노인 사고 2.5배입니다. 이건 '그래서 사후 보상보다 사전 점검이 남는 장사'라는 필요성 근거이지 개인 판정에 쓰는 값이 아닙니다. 둘째는 위험 이벤트를 급제동·과속·야간으로 나눠 보여주는 표시용 분해인데, 여기에 야간 치명률 가중이 한 번 들어갑니다. 이 값은 표시 전용이고 판정 불변이라 코드에 역할을 선언하고 테스트로 고정했으며, 가중치를 바꿔도 180건 판정이 비트 단위로 동일함을 diff로 확인했습니다. 셋째는 손익 시뮬레이션의 감도 분석입니다 — 심도 계수를 1.0배와 1.2배로 놓고 손익분기가 얼마나 움직이는지만 봤고, 요율식에는 넣지 않았습니다.\n\n예측하지 않는 이유는 명확합니다. 심도는 사고 후의 결과 변수라 상대 차량과 충돌 상황이 대부분을 결정하고, 개인 행동으로 예측하려 들면 결국 '고령이라 다치기 쉬우니 비싸게 받는다'가 되어 인수차별 문제가 됩니다. 저희가 다루는 건 빈도뿐입니다. 심도는 파일럿에서 실손해가 쌓인 뒤, 요율 변수가 아니라 케어 개입의 효과를 재는 지표로 쓰는 것이 맞다고 봅니다."
    followups:
      - q: 심도가 큰 세그먼트면 오히려 요율에 반영해야 하는 것 아닌가?
        a: 심도는 대인배상 등 담보·한도 체계가 이미 다루는 영역이고, 저희는 그 위에 얹히는 할인 오버레이라 같은 변수를 두 번 쓰지 않습니다. 저희가 더하는 값은 빈도를 줄일 여지 하나입니다.
      - q: 그럼 TAAS 치명률은 왜 엔진에 들어가 있나?
        a: 위험 이벤트를 유형으로 쪼개 리포트에 보여주는 분포에만 쓰입니다. 역할이 코드에 문자열로 선언돼 테스트로 고정돼 있고, 가중치를 교체해도 180건 판정이 동일합니다(독립 재계산 테스트 4건 포함, pytest 254건 통과).
      - q: 손익 자료에 심도 1.2배가 있던데, 결국 심도를 쓰는 것 아닌가?
        a: "그건 요율식이 아니라 손익분기 감도 분석의 가정입니다. 심도 가산 없이(1.0×) 계산해도 요구 절감률이 12.4%로 성립하고, 1.2×는 '심도를 반영하면 오히려 더 쉬워진다'는 방향만 확인한 것입니다. 어느 쪽이든 개인 요율에는 들어가지 않습니다."
      - q: 심도를 안 보면 큰 사고 리스크를 놓치는 것 아닌가?
        a: 놓치는 게 아니라 담당을 나눈 것입니다. 심도는 담보와 한도가 보고, 빈도는 저희 축이 봅니다. 케어는 사고 건수 자체를 줄이는 개입이라 결과적으로 심각 사고의 기대 건수도 함께 줄어듭니다.
    do_not_say:
      - 생활권 밖 = 사고 심도 증가(인과 서술)
      - 300만원 통계
      - 심도를 예측한다
