  - question_ko: 대부분의 사고는 생활권 안에서 나지 않나
    topic: 노출vs위험-생활권내사고
    source: "sources/02_마스터답변안_전항목.md#2-대부분의-사고는-생활권-안에서-난다 · sources/07_근거지도.md#2-대부분의-사고는-생활권-안에서-난다"
    direct_answer_ko: "동의한다 — 사고 건수는 생활권 안에 몰린다(NMVCCS 70%가 자택 5마일 이내). 그러나 그건 위험의 지도가 아니라 노출의 지도다: 주행 자체가 자택 근처에 집중되고(Burdett 2017: 자택 11km 이내가 주행 절반), Ehsani & Tefft 2021 사례-대조에서 노출(대조군)은 자택 5마일 이내 58%인데 사고는 50% — 집 근처는 노출이 커서 건수가 많을 뿐 단위 위험은 오히려 낮다(5마일 이내 대비 6~10마일 +28%, 11~20마일 +47%, 20마일 초과 +77%; 처음 가는 도로는 매일 다니는 도로 대비 사고 연루 2.5배). 다만 Burdett 2017은 '집 11km 이내가 통행의 절반, 사고의 62%'라는 반대 결과를 보고하고 표준 리뷰(Intini 2019)도 '부분적 확인'에 그친다 — 이 불확실성이 우리가 위치로 판단하지 않는 이유다. 그래서 산식에 위치 벌점이 없고(location_penalty 0.0 하드코딩, outer_zone_policy: context_only_no_location_penalty), 실제로 안(30)을 밖(20)보다 무겁게 같은 잣대(_safety_score 동일 함수, 100km당 위험행동률)로 채점한다. 밖에 안 나가면 그 축은 채점에서 빠진다 — 180 시나리오 중 56건이 밖축 없이 판정됐고 그중 33건이 우대(rolling 실측). 안의 위험도 잡힌다 — ② 생활권 내 위험행동형은 안 안전점수 평균 15.8점, 우대 0/30. 12개 항목 중 가장 단단하다(전 고리 ○·◎)."
    spoken_answer_ko: "맞습니다. 사고 대부분은 생활권 안에서 납니다 — 저희도 그 통계를 문제정의에 그대로 씁니다. 다만 그건 위험의 지도가 아니라 노출의 지도입니다. 주행의 절반가량이 자택 11km 안에서 일어나므로 사고도 거기 몰립니다. 노출을 통제하면 방향이 오히려 반대입니다. Ehsani & Tefft 2021은 같은 사고 현장 안에서 사고를 유발한 운전자와 그렇지 않은 운전자를 비교합니다. 도로도, 속도도, 시간대도 같은 조건이죠. 그 안에서 처음 가는 도로 운전자가 사고에 연루될 가능성이 2.5배였습니다. 그래서 저희 결론은 '밖이 위험하다'가 아닙니다. 저희 산식에는 위치 벌점이 아예 없고, 오히려 생활권 안의 가중치가 30으로 밖의 20보다 높습니다. 두 축의 잣대는 100km당 위험행동률로 완전히 동일하고, 밖에 안 나가면 그 축은 채점에서 빠집니다 — 실제로 180 시나리오 중 56건이 밖 축 없이 판정됐고 그중 33건이 우대를 받았습니다. 실증이 하나 더 있습니다. 저희 데이터에는 '생활권 안에서만 위험하게 운전하는' 유형이 10명, 세 환경 30 시나리오 있습니다. 이분들의 생활권 안 안전점수는 평균 15.8점이고, 30건 전부 우대를 받지 못합니다. 안이 안전지대라는 전제였다면 나올 수 없는 결과입니다. 저희가 보는 건 '밖에 나갔는가'가 아니라 '그 사람의 평소가 무너졌는가'입니다."
    do_not_say:
      - "'밖이 위험하다'는 결론"
      - 친숙도 분석을 quasi-induced exposure 가정 병기 없이 인용
      - Burdett 2017 반대 결과·Intini 2019 리뷰 불확실성 생략
    evidence_ref:
      - NMVCCS 70% 자택 5마일
      - Burdett 2017
      - Ehsani & Tefft 2021
      - location_penalty 0.0 하드코딩
      - DEFAULT_PRODUCT_RULES + _safety_score 동일 함수
      - 밖축 제외 실측(56건/33건)
      - ② 유형 실측(안 15.8점·우대 0/30)
    followups:
      - q: 밖 주행이 없는 고객은?
        a: 밖 없으면 축 제외 — 180건 중 56건이 밖축 없이 판정됐고 그중 33건이 우대됐다(rolling 실측).
      - q: 생활권 안의 위험은 놓치지 않나?
        a: ② 유형에서 안 안전점수 15.8점, 우대 0/30 — 안의 위험도 잡힌다.
    flags:
      - "'NMVCCS 70% 자택 5마일'은 확정수치카드 기준 원문 미확인 수치('사고 70% 자택 8km(5마일)' 팩트체크 표시 필요) — 마스터답변안 §2 본문은 이 70% 대신 58%/50% 대비를 쓴다. 발표 인용 전 확인 필요"
