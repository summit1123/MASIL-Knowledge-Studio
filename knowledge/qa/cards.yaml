    duplicate_of: 평소 패턴 대비 변화를 기준으로 삼으면, 평소 안전하던
    direct_answer_ko: "저희는 요율표가 아니라 기존 마일리지 할인 위에 얹히는 할인 자격 점수(오버레이)라 할증 경로가 코드에 존재하지 않고(180 시나리오 전건 candidate_surcharge_rate_pct = 0, 하한 = 기준 요율), 단발 운행은 월 집계·AND 게이트·사람 검토의 3중 구조에서 판정에 진입조차 하지 못합니다 — 감지식은 직전 2개월 평균 대비 이동 +25%p AND 위험행동 +20%p 동시이고, 월 트립 중앙값 32건에서 예외 운행 1건이 움직이는 폭은 약 3.1%p(임계의 1/8)라 25%p를 넘기려면 같은 달 예외 운행 8건 + 위험 트립 6~7건이 필요하다. 명절·병원·여행은 이동 축만 건드려 AND 게이트에 걸리지 않으며, 오탐 대조군 30 시나리오는 이동 지표 임계 초과 191 케이스-월에도 케어 0건(평균 할인 21.2%→26.7% 상승). 실측 180 시나리오 중 150건이 기존 마일리지 특약과 같거나 낮은 보험료, 그중 113건은 더 낮다(안정 저주행형 33.8%→38.9%). 정직 고지: 케어 확정 시 할인 13%p 축소로 전보다 낼 수 있고, 현행 any 규칙에서 rolling 실측 케어 30건 전원이 1개월 발동이라 감액의 발생 월수 비례(1개월 시 1.08%p)가 팀 권고안."
    spoken_answer_ko: "타당한 우려이고, 저희가 가장 조심해서 설계한 지점입니다. 먼저 상품의 지위인데, 저희는 요율표가 아니라 기존 마일리지 할인 위에 얹히는 '할인 자격 점수'입니다. 코드에 할증 경로가 아예 없어서 최악의 경우가 할증이 아니라 할인 축소이고, 하한은 기준 요율입니다. 다음은 산수입니다. 판정은 트립이 아니라 월 집계 비율이고, 직전 두 달 평균 대비 이동이 25%p, 위험행동이 20%p 동시에 올라야 열립니다. 저희 데이터의 월 운행 중앙값이 32건이니 명절에 한 번 멀리 다녀오신 것이 움직이는 폭은 약 3%p, 임계의 8분의 1입니다. 게다가 명절·병원·여행은 이동 축만 건드려서 AND 게이트에서 걸리지 않습니다. 실제로 이동만 크게 변한 대조군 10명, 세 환경 30 시나리오에서는 이동 지표가 임계를 넘은 달이 191 케이스-월인데도 케어가 한 번도 열리지 않았고, 평균 할인은 21.2%에서 26.7%로 올라갔습니다. 케어가 열려도 그건 자동 요율이 아니라 사람이 확인하라는 권유이고, 지표가 정상으로 돌아오면 그 달에 닫힙니다. 정직하게 말씀드리면 케어가 확정되면 할인이 13%p 줄어 전보다 내는 돈이 늘 수 있습니다. 다만 그 조건은 한 번의 운행이 아니라 한 달 안에 이동과 행동이 함께 무너진 상태 + 사람 검수(실측: 케어 30건 전원 1개월 발동)과 사람 검수이고, 실측에서도 케어는 급변 달에 정확히 발동했고(30/30), 이동만 변한 대조군에서는 한 번도 열리지 않았습니다(0/30)."
