  - question_ko: Safe Zone이 반경(거리) 기준으로만 설정돼 있는데, 도시와 농촌의 1km는 의미가 다릅니다. 지역 유형에 따라 차등을 두었습니까? (7/24 심사 4번)
    topic: SafeZone-지역차등
    source: "sources/생활권반경_eps_정리.md#0~6절·8절 발표 답변 · sources/02_마스터답변안_전항목.md#4절"
    direct_answer_ko: "지역을 사람이 분류하지 않습니다. ① 판정이 보는 것은 도착지 하나 — 원장(gaip_visit_events.csv)의 좌표 컬럼은 latitude/longitude 한 쌍뿐이고 출발점·경로 컬럼이 없어, 지형이 판정에 개입할 통로 자체가 없습니다. ② 판정 경계는 개인 생활권 원 max(코어 500m, min(개인 P90, 2km))이고 eps는 거점을 묶는 탐지 전용이라 원 크기에 들어가지 않습니다 — 지역 차이는 개인 방문 분포(P90)가 자동 흡수합니다(같은 규칙에서 광역 813m vs 도심 500m — 우리가 나눈 게 아니라 데이터가 나눔). ③ 실측 두 건: 실험 A(지역별로 다르게 주던 eps를 전국 단일 260m로 통일해 180건 재판정)는 판정 변화 사실상 없음(고정 기준 0/180 · rolling 재검증 경계 3건), 실험 B(같은 60명을 도심·교외·광역 3지형에 배치)는 케어 60/60·우대 54/60 동일(갈린 6명 = 케어 발동 5 + 문턱 근접 1 — 지역 페널티 아님, 농촌 거주자·정기 통원자가 구조적으로 불이익받지 않는 공정성 증거). eps 260m는 Zheng 2009 200m·Montoliu 2013 200~300m 대역의 중앙값으로 잡은 설계값이며, '도심이 작고 농촌이 크다'는 방향은 방어하지 않습니다(합성 데이터는 우리가 넣은 산포를 다시 읽는 순환이라 방향 확인 불가 — 실험 A가 방향 논쟁 자체를 무의미하게 만듦). 운영값은 파일럿 k-거리(재방문 산포) 실측으로 재도출하며, 지역을 나눌지 여부와 그 방향까지 측정이 결정합니다."
    spoken_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 세 가지로 말씀드리겠습니다.\n\n첫째, 저희가 보는 것은 도착지 하나입니다. 원장에 출발점이나 경로 컬럼이 아예 없습니다. 어떤 지형을 지났는지가 아니라 '평소 가던 곳인가'만 보기 때문에 지형 분류가 판정에 개입할 통로가 없습니다.\n\n둘째, 지역 차이는 개인 실측이 흡수합니다. 생활권 원의 크기는 그 사람 방문 분포의 P90이 정합니다. 같은 규칙인데 광역 거주자는 813m, 도심 거주자는 500m로 갈립니다 — 저희가 나눈 게 아니라 데이터가 나눈 겁니다.\n\n셋째, 실측으로 두 번 확인했습니다. 저희 설정을 바꿔서, 지역별로 다르게 주던 eps를 전국 하나로 통일해 180건을 재판정했더니 판정 변화가 사실상 없었습니다(고정 기준 0건 · 갱신형 재검증 경계 3건). 그리고 고객 쪽을 바꿔서, 같은 60명을 도심·교외·광역 세 지형에 각각 놓았더니 케어는 60명 전원, 우대는 54명이 동일했습니다. 지역이 사람의 판정을 바꾸지 않는다는 뜻이고, 농촌 거주자나 정기 통원자가 구조적으로 불이익받지 않는다는 공정성 증거이기도 합니다.\n\neps 260m는 장소 인식 문헌의 통용 대역 200~300m의 중앙값으로 잡은 설계값입니다. 운영에서는 이 값을 정하지 않고 잽니다 — 재방문 산포를 실측하는 절차가 구현돼 있고, 지역을 나눌지 여부와 그 방향까지 측정이 결정합니다."
