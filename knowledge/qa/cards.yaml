  - question_ko: 베이스라인 2개월의 근거는
    direct_answer_ko: "역산 4단계로 답한다: ① 거점 인정 = 서로 다른 3일 이상 방문(Isaacman 2011: 60일의 5% = 3일) ② 가장 뜸한 생활 거점 빈도는 월 2회 수준 ③ 관찰 창 1개월이면 방문 2일로 3일 미달 → 거점 탈락 ④ 2개월이면 4일로 충족. ∴ 2개월 = 저빈도 생활 거점을 놓치지 않는 최소 창. 보조 확인: 2개월이면 운전 26~43회로 표본 충분(소비자원 2024). 우리 데이터 실측: 369개 목적지 그룹 중 3일 미만 6개(1.6%), 진짜 거점 탈락 0."
    do_not_say:
