  - question_ko: HDBSCAN이랑 뭐가 다르냐?
    direct_answer_ko: "좋은 질문이고, 재는 양은 같습니다(HDBSCAN의 core distance가 바로 k번째 이웃 거리). 차이는 그 값을 어디에 두느냐: HDBSCAN은 점마다·판정할 때마다 달리 써서 장소마다 기준이 달라지고, 우리는 전체에서 한 번 재서 모든 고객에게 같은 상수로 씁니다. 지키려는 게 '모든 고객에게 같은 문장'이라는 판정의 일관성이라서요. 덤으로 우리 k=2는 고르는 값이 아니라 3일 규칙에서 유도되므로 설명 사슬이 끊기지 않습니다."
