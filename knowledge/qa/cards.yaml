  - question_ko: "[#6] 위치데이터에는 보존 제약이 있어 6개월 안에 지워야 하는데, 기준선 2개월에 평가 12개월 구조가 성립하느냐. (회의록 표제 'UBI 유형·위치데이터 6개월 삭제'; 1차 CSC '데이터·연계·개인정보', 자동차보험상품파트 '운행 데이터 확보'의 연장)"
    direct_answer_ko: "전제부터 교정드리면 '6개월 삭제 의무'라는 조항은 없고 원칙은 목적 달성 시 즉시 파기(위치정보법 제23조)이며, 저희 설계는 이미 그 원칙에 맞춰져 있습니다 — 판정에 위치가 필요한 원본은 어느 시점에도 직전 2개월분이고, 평가 12개월이 붙잡고 있는 것은 좌표가 아니라 거점 중심·반경이라는 파생값과 월별 카운트입니다."
    spoken_answer_ko: "먼저 사실관계를 하나 정리하겠습니다. 위치데이터를 6개월 안에 삭제하라는 조항은 없습니다. 위치정보법 제23조의 원칙은 목적을 달성하면 즉시 파기하라는 것이고, 말씀하신 6개월은 방송통신위원회 고시가 취급대장을 최소 6개월 '보관'하라고 정한 의무여서 성격이 반대입니다. 통신비밀보호법의 12개월은 기지국 자료를 통신사가 보관하는 규정이라 저희와 무관합니다. 저희가 맞춰야 하는 기준은 기간이 아니라 목적입니다.\n\n그 원칙에 맞춰 설계는 이미 이렇게 돼 있습니다. 궤적을 받지 않고 트립당 도착지 좌표와 날짜만 받습니다. POI 조회를 하지 않아 그곳이 어디인지도 모릅니다. 생활권 지도는 매달 직전 두 달 방문으로 다시 그리고, 그때그때 남는 건 거점 중심과 반경이라는 파생값입니다. 이후 12개월은 트립마다 그 원 안인지 밖인지 한 번 대조하고, 남기는 것은 월별 안·밖 횟수와 위험행동 비율입니다. 케어 판정도 이 월별 숫자를 직전 두 달 평균과 비교할 뿐입니다.\n\n그래서 위치 원본이 실제로 필요한 것은 언제나 직전 두 달분입니다. 매달 지도를 갱신하고 지난 좌표는 파기 대상이라, 가장 보수적으로 6개월 한도를 잡아도 여유 있게 들어갑니다. 평가가 12개월이라는 말이 좌표를 12개월 들고 있다는 뜻이 아닙니다.\n\n그리고 이건 저희만의 특이한 구조가 아닙니다. 보험연구원 리포트가 정리한 대로 국내 UBI는 앱이 계산한 점수만 보험사로 전송합니다. 저희 구조는 그 선례 위에 그대로 얹힙니다."
    followups:
      - q: 그래도 매달 좌표를 보기는 보는 것 아닌가?
        a: 봅니다. 다만 원 안팎을 대조하는 그 순간에만 필요하고, 대조에 필요한 건 중심·반경뿐이라 단말에서 처리하면 보험사로는 좌표가 오지 않습니다.
      - q: 제출한 시뮬레이션 파일에는 12개월 좌표가 다 들어 있던데?
        a: 맞습니다. 심사 재현과 판정 검증을 위해 14개월 이벤트를 원본 그대로 남긴 아카이브입니다. 운영 보존 설계와는 별개고, 운영에서 12개월간 남는 것은 파생값과 월 집계입니다.
      - q: 이사하거나 생활이 바뀌면 고정된 원이 틀리지 않나?
        a: 틀리지 않게 따라갑니다 — 생활권은 매달 직전 2개월 방문으로 재군집되어 이사 두 달 안에 새 동네가 반영됩니다(케어 평소값·해제 기준은 기준선 고정). 이동변화·안전유지형 30 시나리오(10명 × 3환경)에서 케어 발동 0건이었고, 필요한 원본은 갱신 창 2개월분뿐이라 보유 기간이 늘지 않습니다.
      - q: 네비게이션 데이터는 플랫폼마다 흩어져 있는데?
        a: "저희가 요구하는 건 도착지 이벤트 한 줄이라 플랫폼 간 스키마 차이가 작고, 궤적 표준화를 기다릴 필요가 없습니다. 커버리지가 80% 미만인 달은 우대·케어 모두 '보류'로 빠져(min_data_coverage_pct: 80.0) 결측이 불이익이 되지도 않습니다."
    do_not_say:
      - "'6개월 삭제 의무' 인정"
      - "조문 해석 단정(대신 '어느 해석의 보존 한도에도 부합')"
      - "'위치정보법 때문에 위치를 안 쓴다'는 인과 주장"
      - "월 점수가 규제 밖이라는 주장('개인정보 일반 체계로 관리'까지만)"
