  - question_ko: "[#1] 생활권 안/밖 위험도 차이가 고령자에게만 발생할 것 같지 않다. 출퇴근·레저·학원 라이딩·장보기로 패턴이 다양한 30~50세대에서 운행 페르소나별 위험분류가 더 유의미할 것 같다. 왜 전 고객이 아닌 고령자에게만 한정했는가. (+CSC: 익숙한 도로 선호는 모두에게 해당 — 일반 대상 확대 그림도 필요)"
    direct_answer_ko: 고령자 한정은 시장을 좁힌 선택이 아니라 개인 기준선이 성립하는 조건을 고른 방법론적 선택이며, 확장에 필요한 것은 알고리즘 교체가 아니라 기준선 학습 창의 재조정입니다. 30~50대의 패턴 다양성은 우리 방식에서는 신호가 아니라 노이즈다.
    spoken_answer_ko: "30~50대의 패턴 다양성이 위험 구분에 유의미하다는 데는 동의합니다. 다만 저희가 재는 것은 위험의 절대 수준이 아니라 그 사람의 평소 대비 변화라, 평소가 매주 바뀌는 집단에서는 기준선 자체가 서지 않습니다. 말씀하신 그 다양성이 저희 방식에서는 신호가 아니라 노이즈가 됩니다. 반대로 고령층은 야간 회피 58.8%, 22.6%가 생활 반경을 스스로 좁힌 상태라 기준선이 가장 잘 서는 집단입니다. 고령자 한정은 시장을 좁힌 게 아니라 방법론이 성립하는 조건을 고른 것입니다. 여기에 둘이 더해집니다 — 고령 사고는 치명률 가중 1.4배, 노인 사고는 2.5배라 조기 개입의 값이 구조적으로 크고, 개인 내 변화가 조기 신호라는 문헌도 저희가 확인한 범위에서는 고령 코호트에만 쌓여 있습니다. CSC에서 주신 일반 확대는 로드맵에 넣었습니다. 다음 대상은 연령이 아니라 '기준선이 서는가'로 고르며, 요일 리듬이 일정한 정기 통근자가 후보입니다. 필요한 건 알고리즘 교체가 아니라 학습 창을 요일별로 나누는 재조정입니다."
    followups:
      - q: 다중 기준선이면 30~50대도 지금 되는 것 아닌가
        a: "엔진은 동일합니다. 다만 기준선이 둘 이상이면 '어느 기준선 대비 급변인가'의 귀속 규칙과 오탐 검증을 새로 해야 해서, 단일 기준선으로 규칙을 먼저 증명하는 것이 순서입니다."
      - q: 고령자만 골라 관리하는 낙인 아닌가
        a: 나이·위치에 벌점이 없고, 안전이 유지되면 우대로 갑니다. 급변해도 할증은 없고, 보너스 정지와 연간 할인 13%p 축소 범위에서 점검 권유로 이어집니다. 고령을 고른 이유도 위험군이어서가 아니라 기준선이 서기 때문입니다.
      - q: 시니어 시장이 작지 않나
        a: 고령운전자 사고 비중은 5.6%(2010)→21.6%(2024)로 14년 새 약 4배가 됐고, 저주행 고령 집단은 km당 위험이 오히려 높다는 보고가 있어(Candrive) 기존 마일리지 체계가 구조적으로 잘못 할인하는 미충족 구간입니다.
    do_not_say:
      - "30~50대 문헌 부재 단정('저희가 확인한 범위에서' 한정 필수)"
      - 합성 실측으로 오탐 방어 주장
    evidence_ref:
      - LongROAD PMC8968289
      - LongROAD PMC7317610
      - TAAS 2010~2024 원천
      - DRIVES PMC12662389
      - LongROAD ML PMC8167558
      - Candrive PubMed 23477415
  - question_ko: "[#2] 사고의 대부분이 생활권 안에서 발생한다는 통계가 있는데, 생활권 밖을 문제 삼는 전제가 맞느냐. (1차: 위험↔생활권 연결이 부자연스러움 — 단순 상관, 고속도로 비중·운행거리 익스포저 교란 가능성)"
    direct_answer_ko: "동의합니다. 그리고 그 동의가 이미 저희 설계입니다 — 산식에 위치 벌점이 없고(location_penalty: 0.0), 생활권 안을 밖보다 더 무겁게(30 vs 20) 같은 잣대로 채점합니다."
    spoken_answer_ko: "맞습니다. 사고 대부분은 생활권 안에서 납니다 — 저희도 그 통계를 문제정의에 그대로 씁니다. 다만 그건 위험의 지도가 아니라 노출의 지도입니다. 주행의 절반가량이 자택 11km 안에서 일어나므로 사고도 거기 몰립니다. 노출을 통제하면 방향이 오히려 반대입니다. Ehsani & Tefft 2021은 같은 사고 현장 안에서 사고를 유발한 운전자와 그렇지 않은 운전자를 비교합니다. 도로도, 속도도, 시간대도 같은 조건이죠. 그 안에서 처음 가는 도로 운전자가 유발 쪽일 가능성이 2.5배였습니다. 그래서 저희 결론은 '밖이 위험하다'가 아닙니다. 저희 산식에는 위치 벌점이 아예 없고, 오히려 생활권 안의 가중치가 30으로 밖의 20보다 높습니다. 두 축의 잣대는 100km당 위험행동률로 완전히 동일하고, 밖에 안 나가면 그 축은 채점에서 빠집니다 — 실제로 180 시나리오 중 56건이 밖 축 없이 판정됐고 그중 33건이 우대를 받았습니다. 실증이 하나 더 있습니다. 저희 데이터에는 '생활권 안에서만 위험하게 운전하는' 유형이 10명, 세 환경 30 시나리오 있습니다. 이분들의 생활권 안 안전점수는 평균 15.8점이고, 30건 전부 우대를 받지 못합니다. 안이 안전지대라는 전제였다면 나올 수 없는 결과입니다. 저희가 보는 건 '밖에 나갔는가'가 아니라 '그 사람의 평소가 무너졌는가'입니다."
    followups:
      - q: 그러면 왜 안/밖을 굳이 나누나?
        a: "벌점을 주려는 게 아니라 증거의 밀도와 해석 난이도가 다르기 때문입니다. 안은 행동 증거가 가장 많이 쌓이는 주 무대라 30, 밖은 표본이 작고 불가피한 외출이 과대평가되지 않도록 20으로 뒀으며, \"같은 행동도 낯선 곳에선 난이도가 다르다\"는 Ehsani & Tefft의 관찰을 분리 채점으로 반영한 것입니다. 부수 효과로 농촌 거주자·정기 통원자가 불이익을 받지 않는 지역 중립성이 확보됩니다(광역 이동·안전형 26/30, 복수 생활권형 30/30 우대)."
      - q: 안이 더 위험하다면 안 가중치를 더 올려야 하는 것 아닌가?
        a: 저희가 주장하는 것은 절대값이 아니라 순서이고, 순서는 이미 안(30) > 밖(20)입니다. 절대값은 선언적 파라미터라 공개·조정 가능하고, 969개 조합 전수 민감도 실측에서 ±5 이웃의 판정 변화가 중앙 3·최대 9건 — 현행 30이 지배 축(주행·안)의 최저점입니다.
      - q: 생활권 밖 사고는 더 크게 다치지 않나?
        a: "저희는 심도를 예측하지 않습니다. 케어의 목적은 심도 예측이 아니라 '사람이 점검할 시점'의 감지입니다. 요율 영향은 할증이 아니라 할인 축소입니다 — 기존 마일리지 할인 위에 얹히는 오버레이라 할증 경로가 구조상 없고(180 시나리오 전건 candidate_surcharge_rate_pct = 0, 하한 = 기준 요율), 케어가 확정되면 보너스가 정지되고 할인이 13%p 줄어(care_discount_reduction_pct: 13.0, 실측 30건 적용) 전보다 내는 돈이 늘 수 있다는 점은 정직하게 말씀드립니다. 조건은 한 번의 운행이 아니라 지속된 동시 급변과 사람 검토이고, 실측에서 케어는 동시 급변 달에 정확히 발동했고(30/30), 오탐 대조군에서는 0건이었습니다."
    do_not_say:
      - "'밖이 위험하다'는 결론"
      - 친숙도 분석을 quasi-induced exposure 가정 병기 없이 인용
      - Burdett 2017 반대 결과·Intini 2019 리뷰 불확실성 생략
      - 심도 예측 시사
    evidence_ref:
      - Ehsani & Tefft 2021 CHANCE
      - Burdett et al. 2017
      - Intini, Colonna & Ryeng 2019
      - 180 시나리오 실측
  - question_ko: "[#3] 시뮬레이션 방법론 설명이 부족했고, 발표에서 'data'라고 표현해 실주행 데이터로 오인될 소지가 있었다. (1차: 경험분포인가 사전 정의 파라미터인가, 후자면 근거는 — 퍼포먼스가 예측력이 아니라 시나리오 설계의 결과일 가능성)"
    direct_answer_ko: "'data'를 합성 시나리오(synthetic scenarios)로 전면 교체하고, 생성 체인 4단계와 그 재현성 장치를 공개해 \"검증 대상은 예측력이 아니라 판정 로직의 일관성\"임을 명시한다."
    spoken_answer_ko: "먼저 용어를 바로잡겠습니다. 저희가 'data'라고 말씀드린 것은 실주행 데이터가 아니라 합성 시나리오입니다. 1차 자료의 '실제 드라이빙 로그를 바탕으로'라는 표현도 부정확했습니다 — 실제 로그의 경험 분포를 쓴 적이 없습니다. 현재 규모는 6유형 60명 로스터를 3개 지역환경에 둔 180개 시나리오, 14개월입니다.\n\n생성은 네 단계입니다. 사람이 문헌 3축으로 6유형을 정의하고, LLM 에이전트가 생활권 프로필을 만들되 구조 계약 검증을 통과한 결과만 저장소에 고정합니다 — 임계·가중치는 에이전트가 손대지 않습니다. 그다음 결정론 엔진이 시드를 sha256(전역시드·운전자·월)로 고정해 방문 이벤트를 전개하고, 마지막으로 위험 이벤트의 유형 분해에만 TAAS 통계에서 유도한 가중치를 씁니다 — 이 값은 표시 전용이라 판정에 들어가지 않습니다.\n\n왜 이 방식이 타당한가. 채점 함수가 유형 라벨을 아예 받지 않습니다. 그래서 '설계 의도가 파이프라인을 통과해 발현되는가'가 검증 대상이 되고, 나야 할 케어 30건은 전부 나고 나면 안 되는 이사형 30건은 0건입니다. 다만 방문 횟수·위험률의 절대값은 설계값이며, 파일럿에서 실주행 로그의 경험 분포로 대체하겠습니다."
    followups:
      - q: LLM이 만든 데이터면 LLM 편향이 들어가지 않나
        a: LLM은 생활권 프로필(장소·방향·비중·변화 시점)만 쓰고 임계·가중치는 정하지 않습니다. 구조 계약은 코드가 검증하고 위반일 때만 재생성시킵니다(최대 3회) — 판정 결과는 재시도 판단의 입력이 아니라, 원하는 판정이 나올 때까지 돌리는 구조 자체가 성립하지 않습니다. 산출물은 1회 생성 후 고정 커밋이라 이후 전 단계가 비트 단위로 재현됩니다.
      - q: 합성으로 검증했다는 게 무슨 의미가 있나
        a: 예측력이 아니라 로직 일관성의 검증입니다. 실데이터가 확보되면 지금의 판정 계약 테스트 27건이 그대로 실데이터 검증 하네스가 됩니다.
      - q: 30명에서 60명으로 바뀐 이유는
        a: "1차 이후 데이터 파이프라인을 전면 재설계하면서 로스터를 다시 짰습니다. 30명은 6유형으로 나누면 유형당 5명이라 '나오면 안 된다'를 보여야 하는 대조군 셀이 얇았고, 당시 설계 단계의 크리틱 산출물에도 \"승인 근거가 30명 합성 픽스처뿐\"이라는 위험이 스스로 기록돼 있습니다(rule_review.json). 그래서 유형당 10명으로 올리고 같은 로스터를 3환경에 배치하는 통제 비교를 더해 180 시나리오가 됐습니다."
    do_not_say:
      - "'data' 단독 표기"
      - "'실제 드라이빙 로그를 바탕으로'"
      - 절대값(월 방문 13~42회, 위험률 3%/72%)을 실증치처럼 제시(설계값 고지 필수)
    evidence_ref:
      - personas.py
      - mobility_profiles.json
      - taas_risk_weights.py
      - rule_review.json
