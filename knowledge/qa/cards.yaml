  - question_ko: "[11번] 통합 점수의 가중치 30/30/20/20은 무엇을 근거로 정한 값인가? (사전 정의 파라미터의 데이터·문헌 근거, 위험↔생활권 연결의 상관·익스포저 교란 우려와 같은 뿌리)"
    topic: 가중치-30302020
    source: "sources/02_마스터답변안_전항목.md#§11(가중치 30/30/20/20의 근거) · sources/07_근거지도.md#§11 · sources/브리핑_0803_이슈정리.md#§6(민감도) · sources/00_확정수치카드.md#산식·가중치"
    direct_answer_ko: "30/30/20/20은 요율이 아니라 기존 요율체계 위에 얹는 할인 자격 점수의 배분이고, 네 축은 순보험료 분해에 1:1 대응하며(노출=주행 30, 단위노출당 빈도율=안전 축 50(안 30·밖 20), 장래위험=패턴 20), 안 30 > 밖 20은 신뢰도(credibility) 원리를 따른 보수적 근사다. 주장하는 것은 값이 아니라 순서이며, 값 자체는 파일럿 손해율로 재보정될 사전 설계값이다. 노출을 30에서 멈춘 근거는 저주행 고령 집단의 km당 위험이 오히려 높다는 Candrive 보고이고, 값의 위치는 관측량 비례(35:15)와 균등(25:25) 사이 회랑에서 균등 쪽으로 당긴 30:20이다(생활권 안 주행 비중 실측 전건 집계 86.0%). 실측 뒷받침: 180건 전건 할증 0·150건 기존 대비 동등 이상 유리(113건은 더 낮음 — 가중치 오차의 최대 피해가 '덜 깎임'이지 '더 냄'이 아님), 969개 조합 전수 민감도에서 ±5 이웃 판정 변화 중앙 3·최대 9건, 현행 30이 지배 축(주행·안)의 최저점."
    spoken_answer_ko: 먼저 지위를 말씀드리겠습니다. 30/30/20/20은 요율이 아니라 기존 마일리지 할인 위에 얹는 할인 자격 점수의 배분입니다. 할증 항목 자체가 코드에 없고, 실측으로 180건 전건 할증 0, 150건이 기존 대비 동등 이상 유리합니다. 축은 순보험료 분해에 그대로 대응합니다 — 노출이 주행 30, 단위노출당 빈도율이 안전 축 50(안 30·밖 20), 장래위험이 패턴 20입니다. 노출을 30에서 멈춘 건 저주행 고령 집단의 km당 위험이 오히려 높다는 문헌 때문입니다. 안이 밖보다 무거운 이유는 위치가 아니라 신뢰도입니다. 주행의 86%(전건 집계 86.0%)가 생활권 안에서 관측되고 교란이 적으니 큰 가중, 표본이 작고 난이도 교란이 큰 밖은 작은 가중, 안 나가면 배점에서 빼고 재정규화합니다. 다만 정확히 말씀드리면 뷜만 신뢰도를 계산한 것이 아니라 원리를 따른 것이고, 파일럿에서 채널별 분산을 재면 정식 추정으로 대체됩니다. 값의 위치도 자의적이지 않습니다 — 관측량 비례면 35대15, 균등이면 25대25, 저희는 그 사이 30대20으로 균등 쪽에 보수적으로 두었습니다. 저희가 주장하는 건 값이 아니라 순서입니다. 마지막으로 이건 사전 설계값이고, 파일럿 손해율과 위험군 식별력에 맞춰 재적합해 갱신하겠습니다.
    followups:
      - q: 왜 주행이 30인가, 안전이 더 커야 하지 않나
        a: 안전 축은 안 30 + 밖 20 = 50으로 이미 단일 최대 블록입니다. 주행 30은 이 특약이 마일리지 위에 얹히는 오버레이라는 구조적 연속성을 반영한 값입니다.
      - q: 신뢰도 이론을 적용했다는 뜻인가
        a: 아닙니다. Z = n/(n+k)를 수치로 추정한 적이 없고, 원리(관측량·교란도에 따른 가중)만 따랐습니다. 현행은 연속 z 대신 관측/미관측 두 단만 쓰는 보수적 근사이며, 파일럿의 채널별 분산 실측으로 정식 추정에 의해 대체됩니다.
      - q: 25/25로 바꾸면 결과가 달라지나
        a: 순서가 유지되는 범위에서는 판정이 둔감하다는 것이 저희 입장이고, 969개 조합 전수 민감도 실측이 이를 뒷받침합니다(±5 이웃 판정 변화 중앙 3·최대 9건). 다만 최종 값은 논쟁으로 정할 게 아니라 파일럿 손해율 적합으로 정할 대상입니다.
