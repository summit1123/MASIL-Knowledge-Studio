    followups:
      - q: 케어가 한 달만 떠도 1년치 감액인가요?
        a: 현 규칙은 그렇고 유효한 지적입니다. rolling 실측에서 케어 30건 전원이 한 달 발동이라 이 사례가 실측의 전형이고, 발생 월수 비례(1개월 시 1.08%p)가 저희 권고안입니다 — 선언 파라미터라 즉시 재계산됩니다.
  - question_ko: 케어가 한 달만 떠도 1년 감액?
    topic: 케어-월수비례
    source: "sources/브리핑_0803_이슈정리.md#2. 케어 월수 — 어제 새로 확인된 실측 · sources/안전운전자_매력도_정리.md#6. 정직 고지 — 연간 케어 any 규칙과, 그 검증이 실패한 이유 · sources/02_마스터답변안_전항목.md#5. 안전 운전자 대상 상품 매력도(⑥ 정직 고지)"
    direct_answer_ko: "현 규칙은 그렇고 유효한 지적이다 — _annual_state는 평가 12개월 중 하나라도 care_review면 연간 care_review라 한 달 발동으로도 그 해 할인 13%p 축소가 걸린다. rolling 실측에서 케어 30건 전원이 1개월 발동(케어 월수 분포: 0개월 150건/1개월 30건 — 지도가 새 목적지를 흡수해 유지 조건이 조기 해제, 구 고정 기준의 '5~7개월'은 금지 표현)이라 이 사례가 실측의 전형이 됐고, k≥2 보수화만으로 감액이 전건 소멸한다(연간 케어 30→0건, 동시변화형 평균 할인 7.93%→19.57%). 산식상 11개월 우수+1개월 급변 고객이 12개월 내내 애매한 고객보다 13.0%p 불리(받았어야 할 보너스 포함 17.6%p)해지는 역전이 실측 케어 전건에 해당한다. 그래서 감지(발동 30/30·오탐 0/30)는 유지하되 감액을 발생 월수에 비례(13.0×발생월수÷12, 1개월 시 1.08%p)시키는 것이 팀 권고안 — 선언 파라미터라 손익까지 즉시 재계산된다."
    spoken_answer_ko: 현 규칙은 그렇고 유효한 지적입니다. 실측에서도 전원 1개월 발동이라 이 사례가 전형이며, 월수 비례 감액이 저희 권고안입니다 — 선언 파라미터라 즉시 재계산됩니다.
    do_not_say:
      - 케어는 5개월 이상 지속
      - 케어 5~7개월 지속
      - "13%p 감액을 '벌점'으로(→ 할인 축소)"
      - "'우리 시뮬레이션에 그런 사례가 없다'를 안전의 근거로"
    evidence_ref:
      - "rolling 실측 케어 월수 전원 1개월(분포: 0개월 150건/1개월 30건)"
      - k≥2 재판정 — 연간 케어 0건·동시변화형 평균 할인 19.57%
      - 13.0%p 역전 산식(보너스 포함 17.6%p)
      - 월수 비례 권고(13.0×월수÷12 → 1개월 1.08%p)
    flags:
      - 월수 비례 감액은 권고안(채택 미결) — 8/3 회의 결정 항목(브리핑 §9-6, 파일럿 항목으로 둘지 결정 대기)
      - 상세 근거로 인용된 산식_구조이슈_3건_검토.md는 sources/ 승인 11종에 미포함 — 앵커 불가라 evidence_ref에서 제외
  - question_ko: HDBSCAN이랑 뭐가 다르냐?
    topic: 클러스터링-HDBSCAN비교
    source: "sources/부록B_해설_팀원용.md#1부 보충(k-거리 재산정) · sources/생활권반경_eps_정리.md#7절 HDBSCAN과의 관계 · sources/02_마스터답변안_전항목.md#10절"
    direct_answer_ko: "좋은 질문이고, 재는 양은 같습니다 — HDBSCAN의 core distance가 바로 k번째 이웃 거리이고, 우리 k-거리 측정도 같은 계산('다른 날 방문 중 2번째로 가까운 점까지의 거리')입니다. 차이는 그 값을 어디에 두느냐입니다. HDBSCAN은 점마다·판정할 때마다 달리 써서(재료가 그 사람 100여 점 — 소표본이라 우연에 흔들림) 장소마다 기준이 달라지고 말할 숫자가 남지 않습니다. 우리는 파일럿에서 수천 명 수만 점을 모아 한 번 재서 모든 고객에게 같은 상수로 고정합니다 — 그래야 '반경 260m'라는 약관·민원에 쓸 수 있는 숫자가 남고, '모든 고객에게 같은 문장'이라는 판정의 일관성이 지켜집니다. 우리 k=2는 고르는 값이 아니라 '서로 다른 3일' 규칙에서 유도됩니다(거점이 되려면 자기 날 외에 다른 날 이웃 2개 필요) — 설명 사슬이 끊기지 않습니다. 전환 조건도 정의돼 있습니다: 파일럿 측정에서 산포가 사람마다 크게 널뛰어 고정값이 위험하다고 나오면 그때 HDBSCAN으로 갑니다 — 같은 측정이 eps 값과 '고정값으로 될 일인가'를 동시에 알려줍니다."
    spoken_answer_ko: "좋은 질문이고, 재는 양은 같습니다(HDBSCAN의 core distance가 바로 k번째 이웃 거리). 차이는 그 값을 어디에 두느냐입니다: HDBSCAN은 점마다, 판정할 때마다 달리 써서 장소마다 기준이 달라지고, 우리는 전체에서 한 번 재서 모든 고객에게 같은 상수로 씁니다. 지키려는 게 \"모든 고객에게 같은 문장\"이라는 판정의 일관성이라서요. 덤으로 우리 k=2는 고르는 값이 아니라 3일 규칙에서 유도되므로, 설명 사슬이 끊기지 않습니다."
    evidence_ref:
      - final/근거자료/부록B_해설_팀원용.md 보충
      - 생활권반경_eps_정리 7절 비교표(언제/재료/산출/말할 숫자)
      - 마스터답변안 10절 적정 설정 비교(모양 적합도 0.879~0.935 vs 0.715~0.880 · 중복 거점 3.1% vs 11.8%)
    followups:
      - q: HDBSCAN이 일부 지표에서 낫다면 왜 안 쓰나?
        a: 맞습니다, 적정 설정에서 정답 존 모양 적합도는 HDBSCAN이 더 높습니다(0.879~0.935 대 저희 0.715~0.880). 대신 거점 파편화는 저희가 낮습니다(3.1% 대 11.8%). 저희 채택 기준은 지표 우열이 아니라 반경의 근거를 약관과 고객에게 설명할 수 있는가이고, 지금 데이터는 사람당 점 수십 개라 HDBSCAN의 파라미터가 소표본 추정에 기대게 됩니다. 파일럿에서 승격 후보로 두고 전환 조건을 정의해 뒀습니다.
    flags:
      - "부록B 보충은 '판정의 일관성' 프레임, 마스터답변안 10절은 '유리한 쪽으로 말하지 않겠다'며 모양 적합도는 HDBSCAN 우위·파편화는 우리 우위로 세분 — 집요한 추궁 시 마스터답변안 프레임 사용"
      - "구 슬라이드의 'HDBSCAN 커버리지 72%로 기각'은 철회된 주장(적정 설정에서 동급) — 인용 금지"
  - question_ko: "페르소나가 '예쁘게' 나오는 구조 아닌가"
    topic: 페르소나-순환논증
    source: "sources/02_마스터답변안_전항목.md#8-주행-로그-생성-로직과-페르소나-근거 · sources/07_근거지도.md#8-페르소나가-예쁘게-나오는-구조-아닌가 · sources/데이터생성_상세정리.md"
    direct_answer_ko: "맞다 — 파라미터 기반 합성이고 결과는 설계의 산물이다. 그러나 페르소나는 결과 생성기가 아니라 판정 로직의 전 경로를 시험하는 테스트 집합이다: 각 유형은 사전 선언된 가설과 기대 결과를 갖고, 채점 엔진은 유형 라벨(designed_type)을 인자로 받지 않으며(decision_feature_contract 허용목록 8개 — 라벨 누출이 코드로 차단), 산식의 임계·가중치는 페르소나에서 도출된 적 없는 선언값이라 샌드박스에서 바꾸면 즉시 재계산된다(숨은 튜닝 없음). 실패해야 할 케이스(③ 이동변화·안전유지형)가 포함돼 있고 실제로 실패했다 — 이동 임계 초과 191 케이스-월(최대 73.9%p)에 케어 0건, 이것이 AND 게이트가 실제로 작동한다는 반증 가능한 최강 증거다. 나야 할 것은 났다 — ④ 케어 발동 30/30·규칙 위반 0, ② 만성 위험행동형은 안 안전점수 15.8점·우대 0/30(만성은 변화가 아님). 유형별 10명 균등 배분은 인구 비율이 아니라 각 판정 경로를 같은 검증력으로 시험하는 통제 설계다. 검증되는 것은 예측력이 아니라 로직 일관성이다."
    spoken_answer_ko: "먼저 정정하겠습니다. 1차 자료의 '실제 드라이빙 로그 기반 30명'은 부정확한 표현이었고, 저희 데이터는 합성 데이터입니다. 질문 주신 분류로는 후자 — 사전 정의한 6개 유형에 파라미터를 설정해 생성했고, 규모는 60명 로스터를 3개 지역환경에 둔 180 시나리오입니다. 그리고 결과가 시나리오 설계의 산물이라는 지적도 맞습니다. 그게 이 단계의 목적입니다. 저희가 합성으로 검증하는 건 예측력이 아니라 로직 일관성입니다. 케어가 나야 할 설계에서 나는가보다, 나면 안 되는 설계에서 안 나는가가 더 중요합니다. 그래서 페르소나에 실패해야 할 케이스를 넣었습니다 — 이동만 커지고 안전은 그대로인 이사형 30건은 케어가 나오면 안 되는 대조군이고, 실측 오탐 0입니다. 채점 엔진은 유형 라벨을 모릅니다. 파라미터 중 위험행동 유형 가중치는 TAAS 원천 통계에서 엔진이 직접 계산하고 — 이 값은 유형 분해 표시용이라 판정에는 들어가지 않습니다 — 방문 빈도는 건강보험 통계와 노인실태조사로 방향을 앵커했습니다. 다만 발생확률의 절대값은 설계값이고 통계 앵커는 보강 중이라고 정직하게 말씀드립니다. 경험 분포로의 대체는 파일럿의 몫이며, 지금의 계약 테스트가 그대로 실데이터 검증 하네스가 됩니다."
    do_not_say:
      - 10명 배분이 인구 비율이라는 취지(테스트 설계다)
      - 예측력이 검증됐다
    evidence_ref:
      - decision_feature_contract 허용목록 8개
      - ③ 유형 오탐 대조군(191 케이스-월/케어 0)
      - ④ 케어 발동 30/30
      - ② 유형 실측(안 15.8점·우대 0/30)
      - 유형 실재 문헌 ①②④
      - 유형 실재 문헌 ③⑤⑥
    followups:
      - q: 유형이 실재하나
        a: ①②④는 LongROAD·CMT·Candrive·DRIVES·Bayat로 뒷받침(링크 확보). ③⑤⑥은 Hirsch 2014/Ji 2023/KIRI인데 링크 미확보 — 발표에서 쓰지 않는다.
    flags:
      - 유형 실재 문헌 중 ③⑤⑥(Hirsch 2014/Ji 2023/KIRI)은 링크 미확보(△) — 발표 인용 금지 유지
    duplicate_of: "[8번] 주행 로그 생성 로직의 근거가 약하다. 실제 "
  - question_ko: 76.2%는 실측인가요?
    topic: 포착확률-76.2
    source: "sources/부록B_해설_팀원용.md#2부-3단계-확률계산·자주-나오는-질문"
    direct_answer_ko: "아니요 — 실측이 아니라 가정 위의 계산(내부 추정)이다. 평균 월 2회(λ=2) 푸아송 분포로 관찰 기간 T 동안 3일 이상 방문할 확률 P(N≥3)을 계산한 값: 1개월 32.3% · 2개월 76.2% · 3개월 93.8%. '월 2회' 가정은 국내 공식 통계에 앵커 — 건강보험 통계 2022(65세+ 월평균 입내원 3.75일) · 노인실태조사 2023(경로당 이용자 주 2.9회) · 소비자원 2024(고령운전자 최빈 운전 빈도 주 3~5회, 36.7%). 단 '3일 문턱'과 '월 2회'를 정해놓고 역산한 것이라 그 두 값 자체가 옳다는 증명은 아니며, 실측 포착률은 파일럿에서 잰다."
    spoken_answer_ko: 아니요, 내부 추정입니다. 가정(월 2회)은 국내 통계에 앵커했고, 실측 포착률은 파일럿에서 잽니다.
    do_not_say:
      - 실측 포착률이다
      - 최적값이 증명됐다
    evidence_ref:
      - "푸아송 계산 P(N≥3): 1개월 32.3% / 2개월 76.2% / 3개월 93.8%"
      - 건강보험 통계 2022 — 65세+ 월평균 입내원 3.75일
      - 노인실태조사 2023 — 경로당 주 2.9회
      - 소비자원 2024 — 최빈 운전 빈도 주 3~5회(36.7%)
  - question_ko: "[#3] 시뮬레이션 방법론 설명이 부족했고, 발표에서 'data'라고 표현해 실주행 데이터로 오인될 소지가 있었다. (1차: 경험분포인가 사전 정의 파라미터인가, 후자면 근거는 — 퍼포먼스가 예측력이 아니라 시나리오 설계의 결과일 가능성)"
    topic: 합성-시나리오-용어
    source: "sources/02_마스터답변안_전항목.md#3. 시뮬레이션 방법론과 'data' 용어"
    direct_answer_ko: "'data'를 합성 시나리오(synthetic scenarios)로 전면 교체하고, 생성 체인 4단계와 그 재현성 장치를 공개해 \"검증 대상은 예측력이 아니라 판정 로직의 일관성\"임을 명시한다. 1차 자료의 '실제 드라이빙 로그를 바탕으로'도 정정 대상 — 실제 로그의 경험적 분포를 직접 사용한 적이 없다. 규모는 6유형 60명 로스터 × 3환경 = 180 시나리오 × 14개월(80,032 트립, 연 주행 중앙값 2,829km). 4단계: (a) 사람이 문헌 3축으로 6유형 정의(personas.py 선언) (b) LLM 에이전트가 생활권 프로필 생성 — 구조 계약 검증 통과본만 1회 생성 후 캐시 커밋(mobility_profiles.json), 임계·가중치는 에이전트가 정하지 않음 (c) 결정론 엔진이 시드 sha256(전역시드|driver_id|month)로 방문 이벤트 전개(비트 동일 재현) (d) 위험 이벤트 유형 분해만 TAAS 유도 가중치 사용 — 표시 전용·판정 미진입(교체 후 180건 판정 diff 0). 판정 함수는 유형 라벨을 받지 않으며(decision_feature_contract 허용 입력 8개·허용목록 DTO) 검증은 실패해야 할 케이스 포함 — 케어형 30/30 발동, 이사형 오탐 0/30. 월 방문 13~42회·위험률 3%/72% 같은 절대값은 설계값이며 파일럿에서 실주행 경험 분포로 대체한다."
    spoken_answer_ko: "먼저 용어를 바로잡겠습니다. 저희가 'data'라고 말씀드린 것은 실주행 데이터가 아니라 합성 시나리오입니다. 1차 자료의 '실제 드라이빙 로그를 바탕으로'라는 표현도 부정확했습니다 — 실제 로그의 경험 분포를 쓴 적이 없습니다. 현재 규모는 6유형 60명 로스터를 3개 지역환경에 둔 180개 시나리오, 14개월입니다.\n\n생성은 네 단계입니다. 사람이 문헌 3축으로 6유형을 정의하고, LLM 에이전트가 생활권 프로필을 만들되 구조 계약 검증을 통과한 결과만 저장소에 고정합니다 — 임계·가중치는 에이전트가 손대지 않습니다. 그다음 결정론 엔진이 시드를 sha256(전역시드·운전자·월)로 고정해 방문 이벤트를 전개하고, 마지막으로 위험 이벤트의 유형 분해에만 TAAS 통계에서 유도한 가중치를 씁니다 — 이 값은 표시 전용이라 판정에 들어가지 않습니다.\n\n왜 이 방식이 타당한가. 채점 함수가 유형 라벨을 아예 받지 않습니다. 그래서 '설계 의도가 파이프라인을 통과해 발현되는가'가 검증 대상이 되고, 나야 할 케어 30건은 전부 나고 나면 안 되는 이사형 30건은 0건입니다. 다만 방문 횟수·위험률의 절대값은 설계값이며, 파일럿에서 실주행 로그의 경험 분포로 대체하겠습니다."
    do_not_say:
      - "'data' 단독 표기"
      - "'실제 드라이빙 로그를 바탕으로'"
      - 절대값(월 방문 13~42회, 위험률 3%/72%)을 실증치처럼 제시(설계값 고지 필수)
    evidence_ref:
      - personas.py
      - mobility_profiles.json
      - taas_risk_weights.py
      - rule_review.json
      - pytest 254·JS 22
    followups:
      - q: LLM이 만든 데이터면 LLM 편향이 들어가지 않나
        a: LLM은 생활권 프로필(장소·방향·비중·변화 시점)만 쓰고 임계·가중치는 정하지 않습니다. 구조 계약은 코드가 검증하고 위반일 때만 재생성시킵니다(최대 3회) — 판정 결과는 재시도 판단의 입력이 아니라, 원하는 판정이 나올 때까지 돌리는 구조 자체가 성립하지 않습니다. 산출물은 1회 생성 후 고정 커밋이라 이후 전 단계가 비트 단위로 재현됩니다.
      - q: 합성으로 검증했다는 게 무슨 의미가 있나
        a: 예측력이 아니라 로직 일관성의 검증입니다. 실데이터가 확보되면 지금의 판정 계약 테스트 27건이 그대로 실데이터 검증 하네스가 됩니다.
      - q: 30명에서 60명으로 바뀐 이유는
        a: "1차 이후 데이터 파이프라인을 전면 재설계하면서 로스터를 다시 짰습니다. 30명은 6유형으로 나누면 유형당 5명이라 '나오면 안 된다'를 보여야 하는 대조군 셀이 얇았고, 당시 설계 단계의 크리틱 산출물에도 \"승인 근거가 30명 합성 픽스처뿐\"이라는 위험이 스스로 기록돼 있습니다(rule_review.json). 그래서 유형당 10명으로 올리고 같은 로스터를 3환경에 배치하는 통제 비교를 더해 180 시나리오가 됐습니다."
    flags:
      - "같은 1차 지적(경험분포 vs 파라미터·순환논증)의 파라미터 근거 쪽 상세는 [8번] 카드(마스터답변안 §8)가 담당 — 마스터답변안 계보표 기준 3·8은 별도 항목이라 duplicate로 묶지 않음"
  - question_ko: AI가 만든 데이터 아니냐?
    topic: 합성데이터-AI생성
    source: "sources/브리핑_0803_이슈정리.md#§4-시뮬레이션-데이터-생성-방식(핵심-방어선) · sources/부록D_해설_팀원용.md#§5-AI의-경계"
    direct_answer_ko: "첫마디 \"네.\"로 인정하고 시작(문서 명시 규칙). 3층 구조로 통제한다: ① 통계적 성질 = 사람(문헌) — 방문 빈도 회랑(국내 12.5~13.1회 ↔ 해외 35~44회), 위험행동 빈도 LongROAD 앵커, 외출일 건보 3.75일·경로당 주 2.9회 ② 지리 구조 = AI 에이전트 — 페르소나 삶의 맥락에서 생활권·변화 시점 추론, 오프라인 1회 생성 후 캐시 고정(데모 완전 결정론) ③ 개별 레코드 = 결정론 엔진 — 시드 sha256(전역시드|driver|month), 같은 입력 = 비트 동일 출력. 판정 엔진은 유형 라벨을 모른 채 분석하며 라벨 유출 차단이 코드로 강제됨(판정 입력 허용목록 decision_feature_contract에 유형·시나리오 정보 없음) — 결과는 창발이고 목표값을 심지 않았다. 무결성 실측: 80,032트립 전수 — 중복 0·이상치 0·18셀×10명 정확, 연 주행 중앙값 2,829km(일본 65세+ 실측 정합). 실좌표·실인물 아님, 좌표는 화면 미노출."
    spoken_answer_ko: 네. 다만 무엇을 만들지(생활 맥락)는 AI가, 얼마나 위험한지는 엔진이 통제하고, 판정 엔진은 유형 라벨을 모른 채 분석합니다 — 결과는 창발이고 목표값을 심지 않았습니다.
    duplicate_of: 주행로그, AI가 만든 것 아니냐?
    evidence_ref:
      - decision_feature_contract(라벨 유출 차단 코드 강제)
      - 3층 구조(문헌/AI 에이전트 캐시 고정/결정론 엔진)
      - 무결성 실측 80,032트립 전수 — 중복 0·이상치 0
    followups:
      - q: 첫마디는 어떻게 시작하나?
        a: "첫마디는 반드시 '네'로 인정하고 시작한다(부록D 5절 명시 규칙 — 부인으로 시작 금지)."
  - question_ko: "[8번] 주행 로그 생성 로직의 근거가 약하다. 실제 고령 운전자 로그를 군집화한 경험적 분포인가, 사전 정의 유형별 파라미터 설정인가? 후자라면 각 파라미터의 데이터·문헌 근거는? (모델 퍼포먼스가 예측력이 아니라 시나리오 설계의 결과일 가능성 — 순환논증)"
    topic: 합성데이터-페르소나
    source: "sources/02_마스터답변안_전항목.md#§8(주행 로그 생성 로직과 페르소나 근거) · sources/07_근거지도.md#§8 · sources/데이터생성_상세정리.md · sources/08_출처부록_주제별.md#6장(주행 파라미터 실증 분포)"
    direct_answer_ko: 후자(사전 정의 파라미터 기반 합성)가 맞고 결과가 설계의 산물이라는 지적도 맞지만, 페르소나는 결과를 만드는 입력이 아니라 판정 로직의 전 경로를 시험하는 테스트 집합이므로 여기서 검증되는 것은 예측력이 아니라 로직 일관성이다. 구성은 문헌 3축(이동범위 축소 22.6%·만성 위험행동 클레임 ~3배·개인 내 변화 조기신호)의 조합인 6유형 × 10명 × 3환경 = 180 시나리오·14개월(80,032트립)이고, 채점 엔진은 유형 라벨을 받지 않으며(decision_feature_contract 허용 입력 8개 — 블라인드), 실패해야 할 케이스가 실제로 실패한다 — 이동만 급변한 이사형 오탐 대조군 30건 케어 0건, 케어형 30/30 발동. 순환논증은 이 라벨 차단과 오탐 대조군으로 절단되며, 절대값(월 방문 13~42회, 위험률 3%/72%)은 방향성만 문헌을 반영한 설계값임을 선제 고지하고 파일럿에서 실주행 경험 분포로 대체한다.
    spoken_answer_ko: "먼저 정정하겠습니다. 1차 자료의 '실제 드라이빙 로그 기반 30명'은 부정확한 표현이었고, 저희 데이터는 합성 데이터입니다. 질문 주신 분류로는 후자 — 사전 정의한 6개 유형에 파라미터를 설정해 생성했고, 규모는 60명 로스터를 3개 지역환경에 둔 180 시나리오입니다. 그리고 결과가 시나리오 설계의 산물이라는 지적도 맞습니다. 그게 이 단계의 목적입니다. 저희가 합성으로 검증하는 건 예측력이 아니라 로직 일관성입니다. 케어가 나야 할 설계에서 나는가보다, 나면 안 되는 설계에서 안 나는가가 더 중요합니다. 그래서 페르소나에 실패해야 할 케이스를 넣었습니다 — 이동만 커지고 안전은 그대로인 이사형 30건은 케어가 나오면 안 되는 대조군이고, 실측 오탐 0입니다. 채점 엔진은 유형 라벨을 모릅니다. 파라미터 중 위험행동 유형 가중치는 TAAS 원천 통계에서 엔진이 직접 계산하고 — 이 값은 유형 분해 표시용이라 판정에는 들어가지 않습니다 — 방문 빈도는 건강보험 통계와 노인실태조사로 방향을 앵커했습니다. 다만 발생확률의 절대값은 설계값이고 통계 앵커는 보강 중이라고 정직하게 말씀드립니다. 경험 분포로의 대체는 파일럿의 몫이며, 지금의 계약 테스트가 그대로 실데이터 검증 하네스가 됩니다."
    followups:
      - q: 확률 분포 기반으로 바꾸면 뭐가 달라지나?
        a: 구조는 이미 확률 축적이라 바뀌는 것은 모수의 출처뿐입니다. 파일럿 로그에서 방문 간격·거리·이벤트율의 경험 분포를 추정해 현재 설계값을 갈아끼우면 파이프라인과 테스트는 그대로 돕니다.
      - q: LLM이 만든 데이터면 LLM 편향이 들어가지 않나?
        a: LLM은 생활권 프로필(장소·방향·비중·변화 시점)만 쓰고 임계·가중치는 정하지 않습니다. 산출물은 1회 생성 후 저장소에 고정 커밋되고 이후 전 단계가 시드 고정이라 비트 단위로 재현됩니다.
      - q: 유형별 10명은 실제 인구 비율과 다르지 않나?
        a: 판정이 개인 단위라 옆에 누가 몇 명이든 한 사람의 결과는 동일합니다. 비율이 영향을 주는 것은 포트폴리오 합계 하나뿐이라 구성비별 재계산으로 따로 제시합니다.
    do_not_say:
      - 실제 드라이빙 로그 기반 30명
      - 예측력이 검증됐다
      - 발생확률 절대값에 통계 근거가 확보됐다
    evidence_ref:
      - LongROAD 이동범위 (n=2,990)
      - CMT 2023 UBI 백서
      - DRIVES (Neurology 2025)
      - Bayat et al. 2021
      - LongROAD 자기규제 (n=1,557)
      - TAAS 2010–2024
      - 국민건강보험공단 2022
      - 2023 노인실태조사
      - 한국소비자원 2024
      - Candrive/Ozcandrive (Langford et al. 2013)
    flags:
      - "근거지도 §8: 유형 ③⑤⑥의 문헌(Hirsch 2014·Ji 2023·KIRI)은 링크 미확보(△) — 발표 인용 전 확인 필요"
      - LLM 라벨 44/60 동일 명칭 수렴 운용 결함은 공개 대상(중복 57건만 결정론 치환 후 판정 불변 검증 — 마스터 §3 한계)
