    direct_answer_ko: "월 2회 방문하는 가장 뜸한 생활 거점이 '서로 다른 3일' 문턱을 넘길 포착 확률이 1개월 32% → 2개월 76%(정밀값 76.2%) → 3개월 94%. 1개월은 진짜 거점 셋 중 둘을 놓치고, 3개월은 약 +18%p를 얻는 대신 반영(개입·서비스 시작)이 한 달 늦는다 — 그래서 2개월이 합리적 균형값('최적값' 표현 금지). 빈도 가정(월 2회급)은 건보 월 3.75일 내원·경로당 주 2.9회·소비자원 주 3~5회 운전에 앵커했고, 선례는 Isaacman 2011(60일 관찰의 5% = 서로 다른 3일 — 관찰 창·임계·방문일 단위까지 동일). 포착 확률은 실측이 아니라 가정 위의 내부 추정이며 파일럿에서 실데이터 방문 빈도 분포로 다시 잰다."
    spoken_answer_ko: 월 2회 방문 거점 기준 두 달에 포착 확률 76%(1개월 32%, 3개월 94%는 반영 지연) — 합리적 균형값입니다.
