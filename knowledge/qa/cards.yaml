      - 시드 고정 재현성
      - decision_feature_contract 허용목록 8개
      - TAAS 가중치 diff 0
      - 파라미터 절대값(설계값)
    followups:
      - q: 파라미터 절대값(월 방문 13~42회, 위험률 3%/72%)의 근거는?
        a: 없다 — 방향성만 문헌이다. 먼저 인정하고, 파일럿에서 실주행 경험분포로 대체한다.
