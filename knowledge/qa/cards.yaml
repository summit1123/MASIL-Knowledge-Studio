# 소스: 최종 덱 Summary·Appendix + 마스터 Q&A(과거 결정 기록은 sources/11_V20_결정_기록_0810.md — 파일명만 유지, 내부 버전명은 답변 본문에 쓰지 않는다)
# layer: core = 무대에서 먼저 말하는 답변 예시 / deep = 추궁 시 쓰는 내부 계산·문헌 상세 / history = 과거 결정의 질문·표현 재료
# status=active 카드는 현재 답변 예시. status가 없거나 inactive인 카드는 질문 확장·충돌 탐지용 semantic support다.
# ⚠ 사용 규칙 (중요) — legacy 카드는 '답변 범위'가 아니라 '기출 아카이브'다
#  · 기존 53장은 실제로 받은 질문의 과거 답변이며, active 카드와 충돌하면 사용하지 않는다.
#  · 답변 생성의 1순위 소스는 official_positions.yaml(주제 단위라 조합 가능)이며,
#    카드는 문장 완성도가 필요할 때 참고하는 '이미 다듬어진 표현' 캐시다.
#  · 질문이 카드와 정확히 일치하지 않으면 카드를 억지로 끼워 맞추지 말고
#    active positions 여러 개를 조합해 답하라. 카드에 없다는 이유로 거부하지 마라.
#  · 거부는 '카드 없음'이 아니라 '근거(positions·evidence) 없음'일 때만.

meta:
  effective_date: 2026-08-10
  default_status_for_missing: legacy_reference
  mcp_filter: status == active
  supporting_filter: status != active
  default_role: answer_example
  default_canonical_for_facts: false
  p0_expected_count: 15
  p0_definition: 결선 8분 Q&A에서 반드시 대비할 질문 시나리오. 고정 사실은 deck_claims와 official_positions에서 가져온다.
  answer_style: 짧고 쉬운 문장. 첫 문장에 결론. 덱 용어와 동일한 영어 사용.

cards:
  - id: qa-monthly-three-grades
    status: active
    layer: core
    priority: P0
    scenario_id: P0-05
    role: answer_example
    canonical_for_facts: false
    question_ko: Favorable, Standard, Care는 세 등급인가요?
    question_en: Are Favorable, Standard, and Care three grades?
    topic: 상품-월별등급
    direct_answer_ko: "네. 발표와 고객 안내에서는 월별 결과를 Favorable, Standard, Care의 세 등급으로 쉽게 설명합니다. 실제 구현은 월 통합점수와 그달의 Care 신호를 함께 보존합니다. 그래서 Favorable 점수 조건과 Care가 같은 달에 함께 나와도 충돌이 아닙니다. Care는 그달의 안내와 직원 검토를 열고, 다음 달에는 다시 계산합니다. 데이터가 부족한 달은 불이익 없는 Hold입니다."
    spoken_answer_en: "Yes. We explain three monthly grades: Favorable, Standard, and Care. The system keeps the monthly score and the Care signal together. So a Favorable score and Care can appear in the same month. Care opens guidance and staff review for that month. The next month is calculated again. Hold means there is not enough data, with no penalty."
    source: deck://summary-1
    followups:
      - q: 내부 계산도 세 등급 하나로 처리하나요? (기술 추궁 시 — deep)
        a: 내부 계산은 월 통합점수와 Care 조건을 함께 보존합니다. 화면은 이를 월별 세 등급으로 쉽게 설명하고, 기술 질문에서는 Favorable 점수와 Care가 동시에 성립할 수 있다고 보완합니다.

  - id: qa-care-price
    status: active
    layer: core
    question_ko: Care review가 열리면 보험료가 오르나요?
    question_en: Does a Care review increase the premium?
    topic: 케어-가격
    direct_answer_ko: "아닙니다. Care 자체는 자동 할증이나 자동 차감을 만들지 않습니다. 사람 검토와 지원 리포트를 여는 신호입니다. 연간 할인율은 연간 주행 기록으로 별도 계산합니다."
    spoken_answer_en: "No. Care itself does not create an automatic surcharge or automatic deduction. It opens a human review and a support report. The annual discount is calculated separately from the annual driving record."
    followups:
      - q: 대시보드에는 13%p 차이가 보이는데요?
        a: 13%p 차이는 이 사례의 연간 시뮬레이션 결과입니다. 한 달 Care를 받았다고 자동으로 13%p가 깎이는 규칙이 아닙니다. Care는 검토와 지원을 열고, 연간 할인율은 연간 주행 기록으로 별도 계산합니다.
    source: sources/11_V20_결정_기록_0810.md#3-care-review-계약

  - id: qa-annual-discount
    status: active
    layer: core
    question_ko: 그러면 연간 할인율은 어떻게 정하나요?
    question_en: Then how is the annual discount determined?
    topic: 연간-할인
    direct_answer_ko: "현재 구현은 먼저 연간 주행거리와 차량 종류로 기존 마일리지 할인율을 정합니다. Favorable이 12개월 중 9개월 이상이면 3%p를 더하고, 후보 할인율은 45%를 넘지 않습니다. Care 때문에 할인율을 깎지는 않습니다. 3%p와 45%는 샌드박스 후보값이라 실제 상품화 전 계리 검증이 필요합니다."
    spoken_answer_en: "The current system first uses annual mileage and vehicle type to find the existing mileage discount. If nine or more months are Favorable, it adds three percentage points. The candidate discount is capped at 45 percent. Care does not reduce it. The 3-point bonus and the cap are sandbox values and still need actuarial validation."
    source: IMPLEMENTATION.md#4-현재-할인율-구현

  - id: qa-care-trigger
    status: active
    layer: deep
    question_ko: Care review는 정확히 언제 열리나요?
    question_en: What exactly triggers a Care review?
    topic: 케어-발동
    direct_answer_ko: "같은 달에 두 변화가 함께 커져야 합니다. 생활권 밖 비중은 직전 두 달 평균보다 25%p 이상, 위험행동 비중은 20%p 이상 늘어야 합니다. 한쪽만 변하면 열리지 않습니다."
    spoken_answer_en: "Two changes must rise together in the same month. Out-of-zone travel must rise by 25 percentage points. Risky behavior must rise by 20 points. We compare with the previous two months' average. One change alone does not open a review."
    source: sources/11_V20_결정_기록_0810.md#3-care-review-계약

  - id: qa-out-of-zone
    status: active
    layer: core
    priority: P0
    scenario_id: P0-04
    role: answer_example
    canonical_for_facts: false
    question_ko: 생활권 밖이 위험하다면서 왜 위치만으로 감점하지 않나요?
    question_en: If unfamiliar areas are riskier, why is there no location-only penalty?
    topic: 생활권밖-위험
    direct_answer_ko: "생활권 밖이라는 위치 자체에는 벌점이 없습니다. 대신 현재 설계 후보는 실제 위험 이벤트를 생활권 안에서는 계수 8, 밖에서는 12로 반영합니다. 즉 밖에 나간 것을 벌주는 것이 아니라, 낯선 환경에서 실제로 나타난 위험행동을 더 민감하게 보는 방식입니다. 8과 12는 파일럿에서 다시 보정할 후보값입니다."
    spoken_answer_en: "There is no penalty for simply driving outside the zone. Our current design uses a factor of 8 for risky events inside the zone and 12 outside. It responds more strongly to actual risky behavior in unfamiliar areas, not to the location itself. These factors will be recalibrated in the pilot."
    followups:
      - q: 12는 초행 도로 사고 위험 2.5배 문헌에서 계산한 값인가요?
        a: 아닙니다. 그 문헌은 낯선 도로가 위험 맥락일 수 있다는 방향만 지지합니다. 12는 팀이 정한 설계 후보값이며 파일럿에서 재보정합니다.
      - q: 덱의 Edward·Frank 점수도 8/12로 계산됐나요?
        a: 아닙니다. 현재 덱과 기존 180개 시나리오 수치는 안·밖 모두 계수 8을 쓴 기존 합성 실행 결과입니다. 8/12 반영 후에는 다시 계산해야 합니다.
    source: sources/11_V20_결정_기록_0810.md#3-care-review-계약

  - id: qa-zone-formation
    status: active
    layer: core
    question_ko: MASIL Zone은 어떻게 만드나요?
    question_en: How is a MASIL Zone formed?
    topic: 생활권-형성
    direct_answer_ko: "서로 다른 3일 이상 반복 방문한 지점을 거점으로 묶습니다. ε=260m는 거점 탐지의 시작값입니다. 실제 생활권 반경은 거점별 500m 최소 반경과 개인 P90, 2km 상한으로 정합니다. 지도는 직전 두 달 기록으로 매달 다시 만듭니다."
    spoken_answer_en: "We form anchors from places visited on at least three different days. The 260-meter value is a starting point for anchor detection. The zone radius uses a 500-meter core, each person's P90, and a 2-kilometer cap. We rebuild the map monthly from the previous two months."
    source: deck://appendix-b

  - id: qa-why-two-months
    status: active
    layer: deep
    question_ko: 왜 기준선이 두 달인가요?
    question_en: Why is the baseline two months?
    topic: 기준선-2개월
    direct_answer_ko: "월 두 번 방문한다는 가정으로 계산한 내부 추정입니다. 뜸한 거점은 한 달 관찰로 잡힐 확률이 32%지만, 두 달이면 76%입니다. 세 달은 94%지만 반영이 한 달 늦습니다. Isaacman 2011도 중요 장소 식별에 60일과 서로 다른 3일을 사용했습니다. 실측 포착률은 파일럿에서 다시 잽니다."
    spoken_answer_en: "This is an internal estimate based on two visits per month. One month captures such a place about 32 percent of the time. Two months reaches 76 percent. Three months reaches 94 percent but delays action by one month. Isaacman also used a 60-day window and distinct visit days. We will measure the real capture rate in the pilot."
    source: deck://appendix-b

  - id: qa-synthetic-validation
    status: active
    layer: core
    priority: P0
    scenario_id: P0-12
    role: answer_example
    canonical_for_facts: false
    question_ko: 합성 데이터로 무엇을 검증했다고 할 수 있나요?
    question_en: What can synthetic data actually validate?
    topic: 합성-검증범위
    direct_answer_ko: "예측력을 검증한 것이 아닙니다. 180개 시나리오에서 같은 입력이면 같은 결과가 나오는지, 규칙과 예외 처리가 의도대로 작동하는지 확인했습니다. 실제 요율과 사고 감소 효과는 파일럿에서 검증해야 합니다."
    spoken_answer_en: "It does not validate prediction accuracy. Across 180 scenarios, we tested reproducibility, rule execution, and exception handling. Real premiums and accident reduction still require a pilot."
    followups:
      - q: 환경이 바뀌어도 결과가 같았나요? (검증 추궁 시 — deep)
        a: 내부 두 축 계산 기준으로 60명 중 59명이 실질적으로 일치했고, 남은 1명은 75점·9개월 문턱 사례다.
    source: deck://appendix-d

  - id: qa-ai-role
    status: active
    layer: core
    priority: P0
    scenario_id: P0-09
    role: answer_example
    canonical_for_facts: false
    question_ko: AI가 보험료를 정하나요?
    question_en: Does AI set the premium?
    topic: AI-역할
    direct_answer_ko: "아닙니다. AI는 합성 이동 맥락과 설명문 작성을 돕습니다. 점수와 Care review는 고정 규칙으로 계산합니다. 보험료와 고객 조치는 사람이 검토합니다."
    spoken_answer_en: "No. AI helps create synthetic mobility contexts and draft explanations. Fixed rules calculate the score and Care signal. People review the premium and customer action."
    source: deck://summary-2

  - id: qa-business-targets
    status: active
    layer: core
    question_ko: Pilot, Scale up, Roll out의 숫자와 일정은 확정됐나요?
    question_en: Are the roadmap numbers and timing final?
    topic: 사업-목표
    direct_answer_ko: "아닙니다. 현재 확정한 것은 Pilot에서 시작해 결과를 확인한 뒤 Scale up과 Roll out으로 간다는 방향입니다. 규모, 기간, 가입률과 유지율은 아직 미정입니다. 덱의 숫자는 초기 기획 예시라 발표 대본과 기본 답변에서는 먼저 말하지 않습니다."
    spoken_answer_en: "No. What is fixed is the direction: start with a pilot, test it, then scale up and roll out. The size, timing, enrollment, and retention targets are not final. The numbers on the slide are early planning examples."
    source: deck://summary-2

  - id: qa-kca-braking-condition
    status: active
    layer: deep
    question_ko: 제동 반응 2.28초와 90% 차이는 모든 상황에 해당하나요?
    question_en: Is the 2.28-second braking result true in every situation?
    topic: 문헌-KCA-제동반응
    direct_answer_ko: "아닙니다. 시야가 제한된 돌발 상황에서 2.28초와 1.20초가 관찰된 조건부 결과입니다. 같은 시험의 교차로 우회전 조건에서는 차이가 0.02초였습니다. 따라서 일반 제동 능력 전체로 확대하지 않습니다."
    spoken_answer_en: "No. It was a specific limited-visibility emergency condition: 2.28 seconds versus 1.20. In another condition in the same test, the gap was only 0.02 seconds. We do not generalize it to all braking situations."
    source: presentation-kca-2024-elderly-drivers

  - id: qa-literature-evidence
    status: active
    layer: core
    question_ko: 문헌 근거를 바로 보여줄 수 있나요?
    question_en: Can you show the exact source behind that claim?
    topic: 문헌-인용
    direct_answer_ko: "가능합니다. 승인된 문헌 카드에 허용 주장, 원문 캡처, 덱 사용 위치, 단서를 연결합니다. 캡처가 없거나 문장 범위가 맞지 않으면 그 문헌으로 답하지 않습니다."
    spoken_answer_en: "Yes. Each approved literature card links the allowed claim and the original excerpt. It also shows where the deck uses it. If that link is missing, we do not use the source."
    source: sources/08_출처부록_주제별.md

  - id: qa-dashboard-comparison
    status: active
    layer: core
    question_ko: 두 사람의 거리가 비슷한데 왜 결과가 다른가요?
    question_en: Why are the results different when their annual distances are similar?
    topic: 대시보드-비교
    direct_answer_ko: "거리가 아니라 행동과 변화가 달랐기 때문입니다. Edward는 연간 2,473.6km, Frank는 2,510.1km로 비슷하지만 위험 이벤트는 209건과 10건입니다. 최신 비교표는 연간 Care·Favorable 등급 대신 연간 평균점수 81.6점과 98.4점을 보여줍니다. 화면의 할인율 차이는 이 사례의 연간 시뮬레이션 제안값이며, 한 달 Care에 따른 자동 차감이 아닙니다. 월별 Care는 검토와 지원을 열고 연간 할인율은 연간 주행 기록으로 별도 계산합니다."
    spoken_answer_en: "Their mileage is similar, but their behavior is different. Edward has 209 risky events and an annual average score of 81.6. Frank has 10 risky events and a score of 98.4. The latest table shows annual scores, not annual Care or Favorable grades. The rate difference is a simulated annual proposal for this case. It is not an automatic penalty for one Care month."
    do_not_say:
      - 최종 대시보드·최종 덱을 old/legacy/이전 데모로 지칭
      - 13%p를 확정 요율·고정 차감 정책으로 제시
      - "'한 달 케어 = 13%p 차감' 인과"
      - 최신 비교표에 연간 Care·Favorable 등급이 있다고 설명
    followups:
      - q: Edward는 연간 Care이고 Frank는 연간 Favorable인가요?
        a: "아닙니다. 최신 비교표는 연간 등급 행을 제거하고 Annual average score 81.6점과 98.4점을 보여줍니다. Care는 월별 검토 신호로 설명합니다."
    source: deck://dashboard-appendix

  - id: qa-why-senior-drivers
    status: active
    layer: core
    priority: P0
    scenario_id: P0-02
    role: answer_example
    canonical_for_facts: false
    question_ko: 왜 고령 운전자만 대상으로 시작하나요?
    question_en: Why start with older drivers?
    topic: 문제정의-고령운전자
    direct_answer_ko: "문제는 나이 자체가 아니라 변화 속도와 현재 제도의 간격입니다. 면허 갱신은 길고, 마일리지 보험은 거리만 봅니다. MASIL은 평소 운전에서 개인의 변화와 안전행동을 함께 보고, 이동권을 제한하기 전에 지원을 연결합니다."
    spoken_answer_en: "The issue is not age alone. It is the gap between personal change and current systems. License reviews are infrequent, and mileage insurance only sees distance. MASIL uses normal driving to recognize change and connect support before restricting mobility."
    source: deck://summary-1

  - id: qa-social-value
    status: active
    layer: core
    question_ko: 이 상품의 사회적 가치는 무엇인가요?
    question_en: What is the social value of this product?
    topic: 사회적가치
    direct_answer_ko: "규제나 면허 제한보다 먼저 자발적인 안전 지원을 제공합니다. 안전하게 운전하는 고령자는 인정하고, 변화가 큰 달에는 사람 검토와 예방 지원을 연결합니다. 실시간 위치를 가족과 공유하는 구조는 아닙니다."
    spoken_answer_en: "It offers voluntary safety support before restriction. It recognizes safe older drivers and connects human review when their pattern changes. It does not share real-time location with the family."
    source: deck://summary-2

  - id: qa-masil-30-seconds
    status: active
    layer: core
    priority: P0
    scenario_id: P0-01
    role: answer_example
    canonical_for_facts: false
    question_ko: MASIL을 30초로 설명하면?
    question_en: What is MASIL in 30 seconds?
    topic: 상품-소개
    direct_answer_ko: "MASIL은 고령 운전자를 위한 주행거리 특약 제안입니다. 거리만 보지 않고, 익숙한 생활권 안팎의 안전 운전과 평소 패턴의 변화를 함께 봅니다. 월별 결과는 Favorable, Standard, Care 세 등급으로 안내하고, Care는 직원 검토와 지원 제안으로 이어집니다. 안전한 운전은 할인으로 인정하고, 도움이 필요할 수 있는 변화는 지원으로 연결합니다."
    spoken_answer_en: "MASIL is a mileage-based rider proposal for senior drivers. We look beyond distance. We see safe driving in and out of each person's familiar zone. We also watch for changes from their normal pattern. Each month shows one of three grades: Favorable, Standard, or Care. Care opens staff review and support. Safe driving earns recognition; big changes bring support, not punishment."
    source: deck://summary-1

  - id: qa-zone-vs-geofence
    status: active
    layer: core
    priority: P0
    scenario_id: P0-03
    role: answer_example
    canonical_for_facts: false
    question_ko: MASIL Zone은 고정 지오펜스와 무엇이 다른가요?
    question_en: How is a MASIL Zone different from a fixed geofence?
    topic: 생활권-지오펜스
    direct_answer_ko: "고정 지오펜스는 모두에게 같은 경계를 긋지만, MASIL Zone은 각자의 실제 방문 기록으로 만들어지는 개인별 생활권입니다. 서로 다른 3일 이상 반복 방문한 거점을 중심으로 만들고, 반경도 개인 방문 분포로 정합니다. 지도는 직전 두 달 기록으로 매달 다시 만들어 이사 같은 생활 변화를 따라갑니다. 생활권 밖 주행은 벌점이 아니라 맥락으로만 봅니다."
    spoken_answer_en: "A fixed geofence draws the same line for everyone. A MASIL Zone is personal. It is built from each person's real visit records. Anchors need visits on three or more distinct days. The radius comes from the person's own visit pattern. The map is rebuilt monthly from the last two months. So it follows life changes such as moving. Driving outside the zone is context, never a penalty."
    source: deck://appendix-b

  - id: qa-grade-care-discount-relation
    status: active
    layer: core
    priority: P0
    scenario_id: P0-06
    role: answer_example
    canonical_for_facts: false
    question_ko: 월별 등급, Care 지원, 연간 할인은 어떤 관계인가요?
    question_en: How do the monthly grade, Care support, and annual discount relate?
    topic: 등급-지원-할인관계
    direct_answer_ko: "월별 등급은 그달의 상태를 보여줍니다. Care는 그달의 안내와 직원 검토를 열고 다음 달에는 다시 계산합니다. 자동 할증이나 할인 차감은 없습니다. 현재 연간 기본 할인율은 연간 주행거리와 차량 종류를 기존 마일리지 할인표에 넣어 정합니다. Favorable이 9개월 이상이면 샌드박스 후보 추가 할인 3%p가 붙습니다."
    spoken_answer_en: "The monthly grade shows how that month went. Care opens guidance and staff review for that month. The next month is calculated again. It does not create a surcharge or reduce the discount. The current base discount comes from annual mileage and vehicle type. Nine Favorable months add a three-point sandbox bonus."
    source: IMPLEMENTATION.md#4-현재-할인율-구현

  - id: qa-dashboard-13-point
    status: active
    layer: core
    priority: P0
    scenario_id: P0-07
    role: answer_example
    canonical_for_facts: false
    question_ko: 대시보드에는 왜 13%p 차이가 보이나요?
    question_en: Why does the dashboard show a 13-point difference?
    topic: 대시보드-13포인트
    direct_answer_ko: "13%p 차이는 이 사례의 연간 시뮬레이션 결과입니다. 한 달 Care를 받았다고 자동으로 13%p가 깎이는 규칙이 아닙니다. Care는 검토와 지원을 열고, 연간 할인율은 연간 주행 기록으로 별도 계산합니다."
    spoken_answer_en: "The 13-point difference is the simulated annual proposal for this case. It is not an automatic penalty for one month of Care. Care triggers review and support. The annual discount is calculated separately from the annual driving record."
    do_not_say:
      - 최종 대시보드·최종 덱을 old/legacy/이전 데모로 지칭
      - 13%p를 확정 요율·고정 차감 정책으로 제시
      - "'한 달 케어 = 13%p 차감' 인과"
    source: deck://dashboard-appendix

  - id: qa-vs-mileage-ubi
    status: active
    layer: core
    priority: P0
    scenario_id: P0-08
    role: answer_example
    canonical_for_facts: false
    question_ko: PAYD나 일반 UBI와 무엇이 다른가요?
    question_en: How is this different from Pay-As-You-Drive or ordinary UBI?
    topic: 차별점-UBI
    direct_answer_ko: "Pay-As-You-Drive는 얼마나 운전했는지를 봅니다. 일반 UBI는 어떻게 운전했는지를 봅니다. MASIL은 여기에 어디에서 익숙하게 운전하는지와 평소 패턴에서 무엇이 달라졌는지를 더합니다. 생활권 안팎의 안전 운전과 개인의 변화를 함께 보고, 변화가 큰 달에는 사람 검토와 지원을 연결합니다."
    spoken_answer_en: "Pay-As-You-Drive looks at how much you drive. UBI looks at how you drive. MASIL also looks at where driving is familiar and what changed from the person's normal pattern. A large change can lead to human review and support."
    source: deck://summary-1

  - id: qa-why-parameters
    status: active
    layer: core
    priority: P0
    scenario_id: P0-10
    role: answer_example
    canonical_for_facts: false
    question_ko: 왜 260m, 3일, 2개월인가요?
    question_en: Why 260 meters, three distinct days, and two months?
    topic: 파라미터-근거
    direct_answer_ko: "세 값 모두 확정 최적값이 아니라 근거 있는 시작값입니다. 260m는 장소 인식 문헌의 통용 대역(200~300m) 가운데에서 잡은 거점 탐지 시작값입니다. 서로 다른 3일 반복 방문은 하루 몰림이 아닌 진짜 생활 거점을 가려냅니다. 2개월(60일) 기준선은 뜸한 거점까지 안정적으로 잡는 관찰과 서비스 시작 속도의 균형점입니다. 세 값 모두 파일럿에서 실데이터로 재보정합니다."
    spoken_answer_en: "All three are starting values, not final constants. The 260 meters comes from the place-recognition literature range. Three distinct visit days separate real anchors from one busy day. A 60-day baseline balances stable capture with a fast start. We will recalibrate all three in the pilot."
    followups:
      - q: 2개월의 계산 근거가 있나요? (수치 추궁 시 — deep)
        a: "월 2회 방문 거점 기준 포착 확률의 내부 추정(1개월 32%·2개월 76%·3개월 94%)이 있습니다. 상세는 심층 카드 '왜 기준선이 두 달인가요?'에서 다룹니다."
    source: deck://appendix-b

  - id: qa-weights-969
    status: active
    layer: core
    priority: P0
    scenario_id: P0-11
    role: answer_example
    canonical_for_facts: false
    question_ko: 왜 이 가중치이고, 969개 테스트는 무엇을 증명했나요?
    question_en: Why these four weights, and what did the 969 tests prove?
    topic: 가중치-검증
    direct_answer_ko: "가중치는 문제 정의의 네 축(주행량, 생활권 안 안전, 생활권 밖 안전, 패턴 변화)에 대응하는 설계값입니다. 저희가 주장하는 것은 값 자체가 아니라 순서입니다. 969개 조합 전수 민감도 테스트는 가중치를 주변으로 움직여도 판정이 크게 흔들리지 않는다는 규칙 안정성을 확인했습니다. 예측력이나 실제 손해율을 증명한 것은 아니며, 최종 값은 파일럿 손해율 적합으로 재보정합니다."
    spoken_answer_en: "The four weights map to our four scoring axes. They are design values, not measured constants. We defend the order of the weights, not the exact numbers. The 969 tests moved the weights across many combinations. Decisions stayed stable in a wide region. This proves rule stability, not prediction power. Final values will be refit with pilot loss data."
    followups:
      - q: 민감도 상세 수치는? (수치 추궁 시 — deep)
        a: "±5 이웃 조합에서 판정 변화는 중앙 3건·최대 9건입니다. 상세는 심층 검증 자료에서 다룹니다."
    source: deck://appendix-c

  - id: qa-medical-screening-age
    status: active
    layer: core
    priority: P0
    scenario_id: P0-13
    role: answer_example
    canonical_for_facts: false
    question_ko: 이것은 의료 스크리닝이나 연령차별 아닌가요?
    question_en: Is this medical screening or age discrimination?
    topic: 윤리-연령차별
    direct_answer_ko: "아닙니다. 의료 진단을 하지 않고 건강 데이터를 수집하지 않습니다. 보는 것은 주행 기록뿐이고, 나이나 위치 자체에 벌점이 없습니다. 안전하게 운전하는 고령자는 할인으로 인정받습니다. 변화가 큰 달에는 자동 조치가 아니라 사람 검토와 지원 제안이 따르고, 최종 결정은 직원과 고객에게 있습니다. 이동권을 제한하기 전에 자발적 지원을 먼저 연결하는 구조입니다."
    spoken_answer_en: "No. We do not diagnose, and we collect no health data. We only look at driving records. Age and location carry no penalty in the score. Safe senior drivers earn recognition and discounts. A big change brings human review and a support offer. People, not the system, make the final decision. The goal is voluntary support before any restriction."
    source: deck://summary-2

  - id: qa-location-privacy
    status: active
    layer: core
    priority: P0
    scenario_id: P0-14
    role: answer_example
    canonical_for_facts: false
    question_ko: 위치 프라이버시와 동의는 어떻게 보호하나요?
    question_en: How do you protect location privacy and obtain consent?
    topic: 프라이버시-동의
    direct_answer_ko: "명시적 동의와 최소수집이 현재 원칙입니다. 제안 구조는 이동 경로 전체가 아니라 도착지 좌표와 날짜만 받고, POI를 조회하거나 실시간 위치를 가족과 공유하지 않습니다. 운영안은 직전 두 달의 위치 원본 뒤에는 파생값과 월별 집계를 남기는 방식입니다. 다만 구체적인 보관·파기·철회·공유 절차는 파일럿 국가의 법무 검토 뒤 확정합니다."
    spoken_answer_en: "Our current principles are explicit consent and minimum collection. The proposed design uses trip destinations and dates, not full routes. It does not look up POIs or share live location with family. The operating proposal keeps raw location for the rolling two-month window and then retains derived values and monthly counts. The exact retention, deletion, withdrawal, and sharing procedures still require legal review before the pilot."
    source: deck://summary-2

  - id: qa-insurer-adoption-pilot
    status: active
    layer: core
    priority: P0
    scenario_id: P0-15
    role: answer_example
    canonical_for_facts: false
    question_ko: 보험사가 왜 도입하고, 파일럿은 무엇을 검증하나요?
    question_en: Why would an insurer adopt this, and what will the real-world pilot test?
    topic: 도입-파일럿
    direct_answer_ko: "기존 마일리지 체계는 거리만 보므로 같은 거리 안의 안전행동과 변화를 구분하지 못합니다. MASIL은 기존 할인 위에 얹는 특약으로 시작해 통합 부담을 낮추려 합니다. 실데이터 파일럿에서는 규칙 재보정, 손해 영향, 고객 수용성과 운영 부담을 확인합니다. 구체적인 규모와 일정은 아직 확정하지 않았습니다."
    spoken_answer_en: "Mileage systems see distance, but not safe behavior and change within the same mileage. MASIL starts as a rider on the existing mileage discount. A real-data pilot will test rule calibration, loss impact, customer acceptance, and operating effort. The size and timeline are not final."
    followups:
      - q: 덱에는 500명·15–20%·+2%p가 있는데요?
        a: "초기 기획 예시입니다. 현재 팀이 확정한 파일럿 규모·가입률·유지율 약속은 아닙니다."
    source: deck://summary-2

  - question_ko: (3지형에서 우대 판정이 갈린 이유는? — 질문 문구는 문서에 없음, §3 표준답)
    topic: 3지형-우대갈림
    source: "sources/브리핑_0803_이슈정리.md#§3-3지형-우대-갈림(서사-변경) · sources/생활권반경_eps_정리.md#§4-실험B · sources/부록D_해설_팀원용.md#§0-시안수정-7번"
    direct_answer_ko: "서사가 바뀌었다(구답변 금지): 구 '갈린 4명 = 전원 케어 발동자' → 신 '갈린 6명 = 케어 발동 5명 + 광역안전형 1명'. rolling 확정 후 3지형(도심·교외·광역) 일치는 케어 60/60 유지 · 우대 54/60(구수치 56/60 금지). 5명은 우대를 잃은 달이 케어 구간과 겹친 경우이고, 광역안전형 1명은 케어와 무관 — 광역 저밀도에서 통합점수가 문턱(75점) 근처(72~82점)라 우대 월수 8/12로 9개월 기준 1개월 미달. 벌점이 아니라 문턱 효과다. 같은 60명 로스터를 세 지형에 놓은 '실험 B(고객 지형 변경)'의 결과로, 사는 지역이 판정을 바꾸지 않는다는 공정성 증거이며, eps를 단일값으로 바꾼 '실험 A(우리 설정 변경, 고정 기준 0/180)'와 섞어 말하지 말 것."
    spoken_answer_ko: 케어는 60명 전원 동일 유지, 우대는 54명 동일. 갈린 6명 중 5명은 우대를 잃은 달이 케어 구간과 겹친 경우고, 1명은 문턱 근처 점수의 1개월 미달 — 지역 페널티가 아닙니다.
    do_not_say:
      - 갈린 4명 = 전원 케어 발동자
      - 모든 판정이 지역 무관 동일
      - 우대 56/60(구수치)
    evidence_ref:
      - 3지형 실측 케어 60/60 · 우대 54/60 (rolling, 8/2)
      - "광역안전형 1명: 통합점수 72~82점(문턱 75점), 우대 월수 8/12"
      - 실험 A(설정 변경)/실험 B(지형 변경) 구분 — 생활권반경_eps_정리 §4
    followups:
      - q: 광역안전형 1명은 지역 벌점 아닌가?
        a: 벌점 항목 자체가 없다 — 문턱 효과다. 통합점수 72~82점(문턱 75점) 근처에서 우대 월수 8/12로 9개월 기준 미달. 보류·기본 케이스의 존재가 오히려 정직성 카드(부록D 시안 수정 7번).
  - question_ko: "[10번] 생활권 설정에 DBSCAN을 쓰는 것이 안전한가? 도시·농촌 점 밀도 차이가 커서 하나의 기준거리로는 생활권을 못 잡는다. ⓐ행렬 변환 균일 밀도 보정 ⓑ좌표계 변환 후 클러스터링 ⓒ비유클리드 공간 개념 ⓓrisk-neutral 할인율 활용을 검토하라."
    topic: DBSCAN-밀도
    source: "sources/02_마스터답변안_전항목.md#§10(생활권 클러스터링 DBSCAN 방법론의 안전성) · sources/07_근거지도.md#§10 · sources/생활권반경_eps_정리.md#§7(HDBSCAN과의 관계) · sources/브리핑_0803_이슈정리.md#§5(eps 정리)"
    direct_answer_ko: "지적하신 밀도 한계는 DBSCAN 원논문(Ester et al. 1996, p.229)이 스스로 자인한 문제이고, 그 문장을 출발점으로 ①기준거리 260m(문헌 대역 200~300m의 중간, 합성 3환경 260/520/1,100m는 지역 보정이 아니라 합성 지리 축척 정합) ②밀도 단독 거점 불인정('서로 다른 3일' AND, 같은 날 중복은 1일 계수 — 하루 몰림은 생활권이 못 됨) ③원의 크기를 군집 모양에서 분리(중심권 500m + 개인 P90, 상한 2km — 군집이 갈라져도 최종 생활권은 거의 동일)의 3층을 설계했으며, 실측 과병합 0/60·정기거점 누락 1~2/60이다. eps는 판정 경계가 아니라 거점 인식 눈금이라 전국 단일 260m 재판정에서도 판정 변화가 사실상 없다(고정 기준 0/180 · rolling 재검증 3/180 경계 사례 — '0건' 단독 인용 금지). 제안 ⓐ는 목적 동의(이방성은 하버사인으로 기처리, 지역별 행렬 = 지역별 eps의 행렬 표기), ⓑ는 3단 차등의 연속화 버전으로 로드맵 수용(다만 변환 후 반경은 미터 의미를 잃어 설명가능성 훼손), ⓒ는 흥미로우나 경로 미수집 거버넌스로 현 데이터 검증 불가(파일럿 등시선 기반 eps 검토), ⓓ는 공간 밀도 보정과의 적용 경로를 찾지 못해 의도를 여쭙는다. 운영값은 파일럿에서 k-거리 실측으로 재도출하며 지역을 나눌지 여부까지 측정이 정한다."
    spoken_answer_ko: "먼저 동의합니다. 밀도가 다르면 전역 기준거리 하나로는 안 됩니다 — 이건 DBSCAN 원논문이 229쪽에 스스로 적어둔 한계입니다. 저희는 그 문장을 출발점으로 세 겹을 만들었습니다. 첫째, 기준거리는 260미터입니다 — 장소인식 문헌의 임계 대역 200~300미터 한가운데입니다. 저희 합성 3환경은 지리 자체가 두 배씩 스케일돼 있어 엔진값도 260·520·1,100으로 축척을 맞췄지만, 이는 지역 보정이 아니라 합성 세계의 축척 정합이고, 전국 단일 260으로 재판정해도 판정 변화가 사실상 없습니다. 둘째, 밀도만으로는 거점을 인정하지 않습니다. '서로 다른 3일'을 AND로 요구하고 같은 날 중복은 하루로 셉니다 — 밀도가 높아도 하루 몰림은 생활권이 되지 못합니다. 셋째, 결정적으로 원의 크기는 군집 모양이 아니라 중심권 500미터와 그분 개인 방문거리의 90퍼센타일로 정합니다. 그래서 군집이 몇 조각으로 갈라져도 최종 생활권은 거의 같습니다. 실측으로 세 환경 180건 전부 과병합 0, 정기거점 누락은 환경당 한두 건입니다. 제안하신 좌표 변환은 저희 3단 차등의 연속화 버전으로 이해했고 로드맵으로 받겠습니다. 지금 단계에서 변환을 쓰면 고객께 '당신의 생활권 반경 485미터'를 설명할 수 없게 되어 설명가능성을 우선했습니다. 다만 risk-neutral 할인율은, 저희가 공간 밀도 보정과 연결하는 경로를 찾지 못했습니다. 어떤 의도이신지 여쭙고 반영하겠습니다."
    followups:
      - q: 그래도 260m는 결국 임의값 아닌가?
        a: 절대값을 주는 문헌이 없다는 점은 인정합니다. 다만 기준값 하나를 문헌 대역(200~300m) 안에서 잡고 나머지를 ×2 축척으로 파생한 구조라 임의 숫자 3개가 아니며, 파일럿에서 k-거리 실측으로 대체됩니다.
      - q: 도시·농촌을 무엇으로 나누고, 경계에 사는 사람은 어떻게 되나?
        a: 운영 분류는 DEGURBA(인구밀도 1,500/300)를 씁니다. 경계 사례의 관건은 판정이 뒤집히느냐인데, 같은 사람을 세 환경에 통째로 옮긴 통제 비교에서 케어 판정 60/60이 동일해 티어가 한 칸 달라져도 결론이 바뀌지 않는다는 실측이 있습니다.
      - q: HDBSCAN이 일부 지표에서 낫다면 왜 안 쓰나?
        a: 맞습니다, 적정 설정에서 정답 존 모양 적합도는 HDBSCAN이 더 높습니다(0.879~0.935 대 저희 0.715~0.880). 대신 거점 파편화는 저희가 낮습니다(3.1% 대 11.8%). 저희 채택 기준은 지표 우열이 아니라 반경의 근거를 약관과 고객에게 설명할 수 있는가이고, 지금 데이터는 사람당 점 수십 개라 HDBSCAN의 파라미터가 소표본 추정에 기대게 됩니다. 파일럿에서 승격 후보로 두고 전환 조건을 정의해 뒀습니다.
    do_not_say:
      - HDBSCAN은 커버리지 72%로 기각
      - MDPI 방법을 이식했다
      - 260m는 확정 절대값
      - "단일 260 재판정 '0건' 단독 인용(고정 기준 0/180 · rolling 3/180 단서 필수)"
    evidence_ref:
      - Ester et al. 1996 (DBSCAN KDD-96)
      - Zheng et al. 2009 · Montoliu et al. 2013
      - "MDPI Applied Sciences 15(22):12278"
      - Isaacman et al. 2011
      - "arXiv:1807.00546"
      - 활동공간 체계적 리뷰 47편 (PMC6737923)
      - Birant & Kut 2007 (ST-DBSCAN)
      - data/fixtures/gaip_algorithm_lab.json
      - DEGURBA (UN)
    flags:
      - eps 260 문헌(Zheng/Montoliu)은 원문 미확인 — 팩트체크 잔여(확정수치카드 표기 주의)
      - "축척 표기가 원문 간 상이: 마스터 §10 '×2 축척' vs 확정수치카드 '×2/×4.2' — 수치 정본은 확정수치카드"
      - "MDPI 인용은 대상이 인구 격자(집계 레벨)라 '지역별 임계값의 타당성' 근거로만, URL 미기재로 발표 인용 전 원문 재확인(마스터 부록 A)"
  - question_ko: DBSCAN이 도농 밀도차에서 안전한가
    topic: DBSCAN-밀도차
    source: "sources/02_마스터답변안_전항목.md#10-생활권-클러스터링dbscan-방법론의-안전성 · sources/07_근거지도.md#10-dbscan이-도농-밀도차에서-안전한가 · sources/생활권반경_eps_정리.md#7-hdbscan과의-관계-10번과-연결"
    direct_answer_ko: "그 한계는 DBSCAN 원논문이 스스로 자인했다(Ester 1996 KDD p.229 — 밀도가 다른 두 군집이 가까우면 병합될 수 있다는 원문 인용+PDF 확보). 반박 대상이 아니라 설계 전제였고, 안전장치 3중: ① 기준거리 260m(장소인식 문헌 대역 200~300m의 중간 — Zheng 2009 200m·Montoliu 2013 250m; 합성 3환경 260/520/1,100m는 지역 보정이 아니라 합성 지리 축척 ×2 정합이며, 단일 260 재판정 시 고정 기준 0/180·rolling 재검증 3/180으로 등가) ② 밀도 단독으로 거점 인정 안 함 — '서로 다른 3일' AND(dbscan_distinct_days, 같은 날 중복 방문은 1일 계수; 도심 eps를 900m까지 3배 키워도 과병합 0%로 안전 구간 실측됨) ③ 원 크기를 군집 모양에서 분리 — 판정 반경은 코어 500m + 개인 P90(상한 2km)이라 군집이 몇 조각으로 갈라져도 최종 생활권 원은 유사. 실측 채점표: 과병합 0%(3환경 전부), 반복거점 누락 1.6/2.4/3.1%(HDBSCAN 전 설정에서도 동일값 — 누락은 알고리즘이 아니라 관측량 문제), 커버리지 90.9/90.5/85.9%, 존 안정성 IoU 0.943/0.910/0.828. HDBSCAN과 9지표 비교 — 판정 성능 동급(존 모양 적합도는 HDBSCAN 우위 0.879~0.935 vs 0.715~0.880, 거점 파편화는 우리가 낮음 3.1% vs 11.8%). 현행 유지 이유는 성능이 아니라 반경 근거의 출처와 설명가능성이며, 실데이터 파일럿에서 HDBSCAN은 승격 후보(전환 조건 정의됨)이고 eps는 k-거리 실측으로 재도출한다."
    spoken_answer_ko: "먼저 동의합니다. 밀도가 다르면 전역 기준거리 하나로는 안 됩니다 — 이건 DBSCAN 원논문이 229쪽에 스스로 적어둔 한계입니다. 저희는 그 문장을 출발점으로 세 겹을 만들었습니다. 첫째, 기준거리는 260미터입니다 — 장소인식 문헌의 임계 대역 200~300미터 한가운데입니다. 저희 합성 3환경은 지리 자체가 두 배씩 스케일돼 있어 엔진값도 260·520·1,100으로 축척을 맞췄지만, 이는 지역 보정이 아니라 합성 세계의 축척 정합이고, 전국 단일 260으로 재판정해도 판정 변화가 사실상 없습니다. 둘째, 밀도만으로는 거점을 인정하지 않습니다. '서로 다른 3일'을 AND로 요구하고 같은 날 중복은 하루로 셉니다 — 밀도가 높아도 하루 몰림은 생활권이 되지 못합니다. 셋째, 결정적으로 원의 크기는 군집 모양이 아니라 중심권 500미터와 그분 개인 방문거리의 90퍼센타일로 정합니다. 그래서 군집이 몇 조각으로 갈라져도 최종 생활권은 거의 같습니다. 실측으로 세 환경 180건 전부 과병합 0, 정기거점 누락은 환경당 한두 건입니다. 제안하신 좌표 변환은 저희 3단 차등의 연속화 버전으로 이해했고 로드맵으로 받겠습니다. 지금 단계에서 변환을 쓰면 고객께 '당신의 생활권 반경 485미터'를 설명할 수 없게 되어 설명가능성을 우선했습니다. 다만 risk-neutral 할인율은, 저희가 공간 밀도 보정과 연결하는 경로를 찾지 못했습니다. 어떤 의도이신지 여쭙고 반영하겠습니다."
