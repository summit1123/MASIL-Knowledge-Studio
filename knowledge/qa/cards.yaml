  - question_ko: "[#4] Safe Zone이 반경(거리) 하나로만 정의돼 있다. 도심 1km와 농촌 1km는 의미가 다르니 GPS로 도시형/교외형/농촌형 지역유형을 나눠 기준을 차등화해야 현실성이 올라간다. (+CSC: 경로 단위인가 존 단위인가, 20km 경로 중 10km가 익숙하면 어떻게 반영하나)"
    topic: safe-zone-지역차등
    source: "sources/02_마스터답변안_전항목.md#4. Safe Zone 정의 방식 — 지역 유형별 차등 · sources/00_확정수치카드.md#생활권 · sources/브리핑_0803_이슈정리.md#5. eps 정리"
    duplicate_of: Safe Zone이 반경(거리) 기준으로만 설정돼 있는
    direct_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 판정 경계는 그 사람의 실제 방문 분포(P90)가 정하고, 지역 특성은 저희가 주입하는 것이 아니라 개인 실측이 자동으로 흡수합니다(같은 규칙에서 광역 813m vs 도심 500m — 데이터가 나눈 것). 반경은 두 층: eps 260m는 방문점을 거점으로 묶는 눈금일 뿐 판정 경계가 아니고, 판정은 생활권 원 max(500m, min(개인 P90, 2km))에서만 일어나며 원 공식에 eps가 들어가지 않는다. 판정이 보는 것은 도착지 하나(원장에 출발점·경로 컬럼 부재)라 지형이 개입할 통로가 없고, 경로 단위 문제(20km 중 10km)는 도착지 존 귀속 구조라 발생하지 않는다. 지역 설정이 판정을 좌우하지 않음을 두 실험으로 확인 — 실험 A(지역별 eps를 단일 260m로 통일해 재판정): 고정 기준 0/180 · rolling 재검증 3/180(경계 사례, '0건' 단독 인용 금지), 실험 B(같은 60명을 3지형에 배치): 케어 60/60·우대 54/60 동일. 운영값은 파일럿 k-거리 실측으로 재도출하며 지역을 나눌지 여부·방향까지 측정이 결정한다."
    spoken_answer_ko: "저희는 지역을 사람이 분류하지 않습니다. 세 가지로 말씀드리겠습니다. 첫째, 저희가 보는 것은 도착지 하나입니다. 원장에 출발점이나 경로 컬럼이 아예 없습니다. 어떤 지형을 지났는지가 아니라 '평소 가던 곳인가'만 보기 때문에, 지형 분류가 판정에 개입할 통로가 없습니다. 둘째, 지역 차이는 개인 실측이 흡수합니다. 생활권 원의 크기는 그 사람 방문 분포의 90퍼센타일이 정합니다. 같은 규칙인데 광역 거주자는 813m, 도심 거주자는 500m로 갈립니다 — 저희가 나눈 게 아니라 데이터가 나눈 겁니다. 셋째, 실측으로 두 번 확인했습니다. 저희 설정을 바꿔서, 지역별로 다르게 주던 기준거리를 전국 하나로 통일해 180건을 재판정했더니 판정 변화가 사실상 없었습니다(고정 기준 0/180 · rolling 재검증 3/180 경계). 그리고 고객 쪽을 바꿔서, 같은 60명을 도심·교외·광역 세 지형에 각각 놓았더니 케어는 60명 전원, 우대는 54명이 동일했습니다. 지역이 사람의 판정을 바꾸지 않는다는 뜻이고, 농촌 거주자나 정기 통원자가 구조적으로 불이익받지 않는다는 공정성 증거이기도 합니다. 기준거리 260m는 장소 인식 문헌의 통용 대역 200~300m의 중앙값으로 잡은 설계값입니다. 운영에서는 이 값을 정하지 않고 잽니다 — 재방문 산포를 실측하는 절차가 구현돼 있고, 지역을 나눌지 여부와 그 방향까지 측정이 결정합니다."
