    followups:
      - q: 도심이 오히려 주차가 어려워 산포가 클 텐데 왜 도심 eps가 작은가?
        a: 정확한 지적입니다. 방향은 저희 가정이고 반대일 수 있습니다. 그래서 방향을 주장하지 않습니다 — eps를 전국 단일값으로 바꿔 재판정해도 판정 변화가 사실상 없어서(고정 기준 0/180 · rolling 재검증 3/180 경계), 그 논쟁이 결과를 바꾸지 않습니다. 실제 방향은 파일럿 산포 측정이 정합니다.
      - q: 그럼 지역 차등을 한 게 아니지 않나?
        a: "사람이 지역을 분류해 다른 잣대를 주는 방식은 하지 않습니다. 대신 개인 실측이 지역 특성을 흡수해 결과적으로 원 크기가 갈립니다(광역 813m vs 도심 500m). 심사에서 지적하신 \"도심 1km와 농촌 1km의 의미 차이\"는 이 층에서 반영됩니다."
      - q: 260m는 어디서 나온 값인가?
        a: 장소 인식 연구의 공간 임계 대역입니다 — Zheng 2009가 200m, Montoliu 2013이 250m(권장 200~300m)를 씁니다. 260m는 그 대역의 중앙이고, 절대값을 주는 문헌은 없으므로 설계값임을 인정합니다. 운영값은 실데이터 k-거리로 재도출합니다.
      - q: HDBSCAN을 쓰면 eps가 필요 없지 않나?
        a: "HDBSCAN의 핵심 계산(k번째 이웃까지 거리)은 저희도 씁니다. 다만 개인마다 매번 추정하지 않고 전체에서 한 번 측정해 고정값으로 씁니다. 개인당 점이 100개 수준이라 개인 추정은 우연에 흔들리지만 수천 명을 모으면 안정적이기 때문이고, 그래야 \"반경 260m\"라는 말할 수 있는 숫자가 남습니다."
      - q: 경로 중 절반만 익숙한 길이면 어떻게 되나? (1차 CSC)
        a: "저희는 경로를 수집하지 않습니다. 도착지 기준이라 \"20km 중 10km\" 같은 구분이 발생하지 않습니다. 경로 반영은 맵매칭이 필요해 최소수집 원칙과 충돌하므로 로드맵 과제입니다."
