  - question_ko: 왜 3개월로 안 했나요?
    topic: 관찰창-3개월-트레이드오프
    source: "sources/부록B_해설_팀원용.md#2부-3~4단계·자주-나오는-질문"
    direct_answer_ko: "3개월이면 포착 확률 93.8%로 2개월(76.2%) 대비 +17.6%p를 얻지만, 고객의 서비스 시작(생활권 형성)이 한 달 늦어진다. 1개월은 32.3%로 뜸한 거점을 세 번 중 두 번 놓쳐 너무 짧다. 2개월 = 포착률과 시작 속도의 균형점이며, 그 교환(+17.6%p vs 한 달 지연)이 손해라고 판단했다. 이것도 파일럿 재보정 대상이다. '최적값' 표현 금지 — 2개월은 유일한 최적값이 아니라 합리적 범위 안의 값(발송 답변서 5번에 이 문장 그대로)."
    spoken_answer_ko: 포착률 +17.6%p를 얻는 대신 고객의 서비스 시작(생활권 형성)이 한 달 늦어집니다. 그 교환이 손해라고 판단했고, 이것도 파일럿 재보정 대상입니다.
    do_not_say:
