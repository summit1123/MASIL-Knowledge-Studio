  - question_ko: "기준선 2개월이랑 케어의 '직전 2개월'이랑 같은 건가요?"
    topic: 형성창-케어창-구분
    source: "sources/부록B_해설_팀원용.md#2부-자주-나오는-질문 · sources/00_확정수치카드.md#생활권-형성-주기"
    direct_answer_ko: "다른 장치다. 형성 2개월 = 생활권을 만드는 관찰 창(8/2 회의 결정에 따라 매달 직전 2개월로 갱신하는 rolling, 해당 월 제외). 케어의 직전 2개월 = 지표 숫자(이동 +25%p AND 위험행동 +20%p 동시)를 비교하는 창이고, 케어의 평소값·해제 기준은 지도와 분리되어 가입 초기 기준선에 고정 — 지도 갱신만으로 케어가 자동 해제되지 않는다. 발송 답변서 5번 '이후 12개월 내내 고정되는 비교 기준값'은 케어 평소값 서술이라 rolling과 모순 없음. 같은 '2개월'이라도 장치가 다르다."
    spoken_answer_ko: "다른 장치입니다. 형성 2개월 = 생활권을 만드는 관찰 창(매달 직전 2개월로 갱신). 케어의 직전 2개월 = 지표 숫자를 비교하는 창이고, 케어의 평소값·해제 기준은 지도와 분리되어 고정입니다. 같은 '2개월'이라도 장치가 다릅니다."
    do_not_say:
