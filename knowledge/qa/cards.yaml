  - question_ko: Safe Zone이 반경 기준뿐인데 지역 차등이 필요하지 않나
    direct_answer_ko: "지역을 사람이 분류하지 않는다. 판정이 보는 것은 도착지 하나뿐이고(출발점·경로 컬럼이 원장에 없음), 원 크기는 개인 방문 분포(P90, 하한 500m·상한 2km)가 정해 지역 차이를 자동 흡수한다. 실측 두 건: 단일 eps로 바꿔도 180 시나리오 판정 0건 변화, 3지형에서도 케어 60/60 유지·우대 54/60(갈림 6명 = 케어 5·문턱 1, 사유 실측 — 벌점 아님). 운영값은 실데이터 k-거리로 재고, 지역을 나눌지까지 측정이 정한다."
    do_not_say:
      - 지역별 3단 eps 차등을 검증된 성과로 내세우기
      - 도심 소·농촌 대 방향을 검증된 것처럼 방어
    evidence_ref:
      - 원장 구조(도착지만 봄)
      - eps 등가·단일 eps 재판정 0건 차이
      - 3지형 판정 실측
      - 개인별 원 갈림(813m vs 500m)
      - Zheng 2009 / Montoliu 2013
      - ENVIRONMENTS 순환 위험 고지
    followups:
      - q: 합성으로 검증한 것 아닌가(순환)?
        a: ENVIRONMENTS에 생성 파라미터(visit_jitter_m)와 분석 파라미터(dbscan_eps_m)가 공존해 합성 검증은 순환을 피할 수 없다 — 그래서 운영값은 실데이터 k-거리로 재도출한다고 먼저 말한다.
      - q: 지역 분류 기준은?
        a: 운영 시 DEGURBA(UN 표준) 채택 — 결정만 있고 미구현이다.
  - question_ko: 안전 운전자에게 매력 없는 상품 아닌가 (할증 우려)
    direct_answer_ko: "할증 경로가 코드에 존재하지 않는다(오버레이 구조, 180건 전건 candidate_surcharge_rate_pct = 0). 단발 운행은 월 집계에서 임계의 1/7 수준이고, 이동 25%p AND 위험 20%p 동시 급변이라야 발동하며, 그 위에 사람 검토가 있다. 실측으로 ③ 유형에서 이동 임계 초과 191 케이스-월인데 케어 0건. 다만 '케어 월 1개만 있어도 연간 감액(할인 축소 13.0%)'은 사실이므로 먼저 인정한다."
