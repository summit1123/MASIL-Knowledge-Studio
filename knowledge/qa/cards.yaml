  - question_ko: Candrive 고위험군은 얼마나 위험한가?
    topic: candrive-고위험군
    source: "sources/00_확정수치카드.md#표기 금지·주의"
    direct_answer_ko: "최대 5배. 원문(Marshall et al. 2023, J Gerontol A 78(12), 원문 PDF 확인)에 '3배'는 없음 — 실측은 같은 70세+ 코호트에서 저위험군 대비 at-fault 사고 위험(주행거리 보정)이 중위험 2.47배 · 고위험 5.26배(95% CI 2.81–9.84, 인년의 2.9%). '사고빈도'가 아니라 '사고 위험(거리 보정)'으로 표기한다. 종전 'CANDRIVE→CMT 교체' 지시는 폐기 — Candrive 유지 + 숫자 정정이 정답. 보너스 앵커: 70세+ 연평균 주행 11,017.6km(SD 6,959.9) 실측. 같은 Candrive 계열이라도 Langford et al. 2013(연 5,000km 미만 저주행군 사고위험 상승, '저주행 ≠ 저위험')은 마일리지 체계 비판용의 별도 인용이므로 역할을 섞지 않는다."
    do_not_say:
      - 동일 연령대 3배
      - "사고빈도(→'사고 위험(거리 보정)'으로)"
