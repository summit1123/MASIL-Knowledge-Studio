  - question_ko: "[#1] 생활권 안/밖 위험도 차이가 고령자에게만 발생할 것 같지 않다. 출퇴근·레저·학원 라이딩·장보기로 패턴이 다양한 30~50세대에서 운행 페르소나별 위험분류가 더 유의미할 것 같다. 왜 전 고객이 아닌 고령자에게만 한정했는가. (+CSC: 익숙한 도로 선호는 모두에게 해당 — 일반 대상 확대 그림도 필요)"
    topic: 고령자-한정
    source: "sources/02_마스터답변안_전항목.md#1. 타겟 한정 — 왜 고령자인가"
    direct_answer_ko: "고령자 한정은 시장을 좁힌 선택이 아니라 개인 기준선이 성립하는 조건을 고른 방법론적 선택이며, 확장에 필요한 것은 알고리즘 교체가 아니라 기준선 학습 창의 재조정입니다. 재는 것은 위험의 절대 수준이 아니라 평소 대비 변화(직전 2개월 평균 대비 이동 +25%p AND 위험행동 +20%p, location_penalty 0.0)라 '평소'가 정의될 때만 작동하는데, 30~50대의 패턴 다양성은 평소가 주 단위로 바뀐다는 뜻이라 우리 방식에서는 신호가 아니라 노이즈다. 고령층은 기준선이 가장 잘 서는 집단(LongROAD: 최초 자기규제 1순위 야간 회피 58.8%, 22.6%는 이웃 마을 밖으로 안 나가는 축소 이동범위)이고, 개입 가치도 비대칭(TAAS 2010~2024 직접 산출: 치명률 가중 고령운전자 사고 1.40배·노인 사고 2.52배, 고령 사고 비중 5.6%→21.6%)이며, 개인 내 변화가 조기 신호라는 문헌(DRIVES: 주행 변수만으로 MCI 판별 AUC 0.82 — 차이는 개인 내 궤적에서 드러남)도 확인한 범위에서는 고령 코호트에만 쌓여 있다. 확장 로드맵(CSC 제안 수용): 다음 대상은 연령이 아니라 '기준선이 서는가'로 고르며(요일 리듬이 일정한 정기 통근자 후보), 필요한 것은 학습 창의 요일 분리 재조정뿐 — 판정식·가중치·게이트 불변."
    spoken_answer_ko: "30~50대의 패턴 다양성이 위험 구분에 유의미하다는 데는 동의합니다. 다만 저희가 재는 것은 위험의 절대 수준이 아니라 그 사람의 평소 대비 변화라, 평소가 매주 바뀌는 집단에서는 기준선 자체가 서지 않습니다. 말씀하신 그 다양성이 저희 방식에서는 신호가 아니라 노이즈가 됩니다. 반대로 고령층은 야간 회피 58.8%, 22.6%가 생활 반경을 스스로 좁힌 상태라 기준선이 가장 잘 서는 집단입니다. 고령자 한정은 시장을 좁힌 게 아니라 방법론이 성립하는 조건을 고른 것입니다. 여기에 둘이 더해집니다 — 고령 사고는 치명률 가중 1.4배, 노인 사고는 2.5배라 조기 개입의 값이 구조적으로 크고, 개인 내 변화가 조기 신호라는 문헌도 저희가 확인한 범위에서는 고령 코호트에만 쌓여 있습니다. CSC에서 주신 일반 확대는 로드맵에 넣었습니다. 다음 대상은 연령이 아니라 '기준선이 서는가'로 고르며, 요일 리듬이 일정한 정기 통근자가 후보입니다. 필요한 건 알고리즘 교체가 아니라 학습 창을 요일별로 나누는 재조정입니다."
    do_not_say:
      - "30~50대 문헌 부재 단정('저희가 확인한 범위에서' 한정 필수)"
      - 합성 실측으로 오탐 방어 주장
    evidence_ref:
      - LongROAD PMC8968289
      - LongROAD PMC7317610
      - TAAS 2010~2024 원천
      - DRIVES PMC12662389
      - LongROAD ML PMC8167558
      - Candrive PubMed 23477415
    followups:
      - q: 다중 기준선이면 30~50대도 지금 되는 것 아닌가
        a: "엔진은 동일합니다. 다만 기준선이 둘 이상이면 '어느 기준선 대비 급변인가'의 귀속 규칙과 오탐 검증을 새로 해야 해서, 단일 기준선으로 규칙을 먼저 증명하는 것이 순서입니다."
      - q: 고령자만 골라 관리하는 낙인 아닌가
        a: 나이·위치에 벌점이 없고, 안전이 유지되면 우대로 갑니다. 급변해도 할증은 없고, 보너스 정지와 연간 할인 13%p 축소 범위에서 점검 권유로 이어집니다. 고령을 고른 이유도 위험군이어서가 아니라 기준선이 서기 때문입니다.
      - q: 시니어 시장이 작지 않나
        a: 고령운전자 사고 비중은 5.6%(2010)→21.6%(2024)로 14년 새 약 4배가 됐고, 저주행 고령 집단은 km당 위험이 오히려 높다는 보고가 있어(Candrive) 기존 마일리지 체계가 구조적으로 잘못 할인하는 미충족 구간입니다.
