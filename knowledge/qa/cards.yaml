  - question_ko: 생활권은 언제, 어떻게 형성·갱신됩니까? (형성 주기 표준답)
    direct_answer_ko: 매달 직전 2개월 방문으로 재형성(rolling), 해당 월 제외, 군집 실패 시 직전 지도 유지. 케어의 평소값·해제 기준은 기준선 고정으로 분리.
    spoken_answer_ko: 생활권은 매달 직전 2개월 방문으로 재형성됩니다(해당 월 제외, 군집 실패 시 직전 지도 유지). 이사 등 생활 변화는 두 달 안에 지도에 반영되고, 케어의 평소값·해제 기준은 가입 초기 기준선에 고정되어 위험 변화 감지는 유지됩니다 — 이사·가족돌봄 시나리오 30건 전원 우대 실측입니다.
