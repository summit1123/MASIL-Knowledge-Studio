    direct_answer_ko: 데이터는 3경로 단계 확보로 가고 — ①기존 UBI 채널(국내 UBI는 앱이 산정한 점수만 동의하에 보험사로 전송하는 구조라(KIRI리포트 2024.7) 원좌표 반출 없이 시작 가능) ②특약 동의 기반 신규 수집(필요한 것은 궤적이 아니라 도착지 좌표+방문 날짜뿐이라 동의 범위가 통상 UBI보다 좁음) ③공공·제휴(TAAS·복지부·건보공단 등) — 파일럿은 기준선 2개월+관찰 6개월, 개입군/대조군 병행, 지역 유형 2곳 이상 코호트로 건다(지금 데이터는 전부 합성, 실데이터 확보가 파일럿 1차 과제). 사고잦은곳은 판정 벌점이 아니라 케어 리포트의 안전 안내로 채택한다 — 감점으로 넣으면 사고다발지 인근 거주만으로 감점돼 위치 중립(location_penalty 0.0)과 3환경 케어 60/60 실측이 함께 무너지기 때문. 도로 위계는 맵매칭(궤적 재구성)이 최소수집 거버넌스와 충돌해 현재 미반영(능력이 아니라 우선순위·거버넌스 판단)이되, 평균속도·시간대 기반 경량 추정과 동일값 대 차등값 재무 비교를 파일럿 과제로 올린다 — 비교 도구인 요율 샌드박스는 이미 작동한다.
    spoken_answer_ko: "세 건 다 받겠습니다. 데이터는 3경로입니다 — 국내 UBI가 앱이 산정한 점수만 보험사로 넘기는 구조라(보험연구원 2024) 원좌표 반출 없이 기존 채널에서 시작할 수 있고, 신규 수집은 궤적이 아니라 '도착지 좌표와 날짜'뿐이라 동의 범위가 통상 UBI보다 좁습니다. 여기에 TAAS·공공 통계를 얹어 지역 유형 두 곳 이상 코호트에 기준선 2개월 + 관찰 6개월 파일럿을 겁니다. 지금 데이터는 전부 합성이고, 실데이터 확보가 파일럿의 1차 과제입니다.\n\n사고잦은곳은 채택하되 자리를 바꿔 채택합니다. 공개 데이터고 저희는 도착지 좌표가 있어 거점 주변 포함 여부는 궤적을 더 받지 않고도 뽑을 수 있습니다. 다만 이걸 감점으로 넣으면 그 동네에 사는 것만으로 감점이 됩니다 — 위치 중립 원칙과 '지역이 달라도 결론이 같다'는 60/60 실측이 함께 무너집니다. 그래서 감점이 아니라 케어 리포트의 안전 안내로 넣겠습니다.\n\n도로 위계는 현재 미반영입니다. 도로 등급을 알려면 맵매칭, 곧 궤적 재구성이 필요해 최소수집 원칙과 충돌하기 때문이고, 능력이 아니라 우선순위 판단입니다. 2단계로 평균속도·시간대로 도로 유형을 추정하는 경량 대안과, 말씀 주신 동일값 대 차등값 재무 비교를 파일럿 과제로 올리겠습니다 — 비교 도구인 요율 샌드박스는 이미 작동합니다."
    followups:
      - q: 정보 제공용이면 상품에 무슨 도움이 되나?
        a: "케어 리포트의 실행 가능성이 올라갑니다. 지금은 '점검하세요'까지인데 지점을 특정하면 담당자 상담과 지자체 안전 프로그램 연계가 구체화됩니다 — 감점보다 이쪽이 예방 효용이 큽니다."
