  - question_ko: "[#6] 위치데이터에는 보존 제약이 있어 6개월 안에 지워야 하는데, 기준선 2개월에 평가 12개월 구조가 성립하느냐. (회의록 표제 'UBI 유형·위치데이터 6개월 삭제'; 1차 CSC '데이터·연계·개인정보', 자동차보험상품파트 '운행 데이터 확보'의 연장)"
    topic: 위치데이터-법적제약
    source: "sources/02_마스터답변안_전항목.md#§6(위치데이터 수집·보존의 법적 제약) · sources/07_근거지도.md#§6"
    direct_answer_ko: "전제부터 교정드리면 '6개월 삭제 의무'라는 조항은 없고 원칙은 목적 달성 시 즉시 파기(위치정보법 제23조)이며, 저희 설계는 이미 그 원칙에 맞춰져 있습니다 — 판정에 위치가 필요한 원본은 어느 시점에도 직전 2개월분이고, 평가 12개월이 붙잡고 있는 것은 좌표가 아니라 거점 중심·반경이라는 파생값과 월별 카운트입니다. 회의의 '6개월'은 방통위 고시의 취급대장 최소 6개월 '보관' 의무(삭제 시한이 아니라 보관 하한)이고, 통신비밀보호법의 12개월은 기지국 자료의 통신사 보관 규정이라 무관합니다. 수집 자체가 최소라(궤적·경로 없이 트립당 도착지 좌표·날짜뿐, POI 미조회) 가장 보수적으로 6개월 한도를 잡아도 위치 원본은 상시 직전 2개월분뿐이라 여유가 남으며, 국내 UBI가 앱 산정 점수만 보험사로 전송하는 선례(보험연구원 KIRI리포트 2024.7) 위에 그대로 얹히는 구조입니다."
