  - question_ko: 주행로그, AI가 만든 것 아니냐?
    topic: 데이터생성-AI경계
    source: "sources/부록D_해설_팀원용.md#5절 AI의 경계 · sources/데이터생성_상세정리.md#3절 AI 프로필 · sources/브리핑_0803_이슈정리.md#Q&A 표준답"
    direct_answer_ko: "네, 생성 과정에 AI가 있습니다 — 다만 층이 갈립니다. AI(LLM)가 만드는 것은 인물의 생활 구조까지입니다(자주 가는 장소의 합성 라벨·방문 비중·패턴 변화 시점 — 실존 지명 금지, 스키마 검증 통과분만 사용, 1회 생성 후 캐시로 저장소에 커밋). 빈도·거리·위험률의 수치는 사람이 문헌 분포 위에 배치한 설계값이고, 개별 레코드는 시드 고정(sha256) 결정론 엔진이 전개하며, 판정 규칙·가중치·케어 임계도 AI가 정하지 않습니다(강제 장치: 거리대는 유형 역할로 강제 · 위험 크기는 아키타입 고정 · 캐시 커밋으로 검사 가능). 즉 AI가 판정에 유리하게 개입할 층이 구조적으로 없고, 그것을 대조군 오탐 0건으로 확인했습니다 — 이동 임계 초과 191 케이스-월에도 케어 발동 0. 첫마디는 반드시 '네'로 시작합니다(문서 명시 규칙)."
    spoken_answer_ko: 네, 생성 과정에 AI가 있습니다 — 다만 AI는 생활 구조까지만 만들고, 통계적 성질은 사람이 문헌에서, 개별 레코드는 고정 엔진이 만듭니다. AI가 판정에 유리하게 개입할 층이 구조적으로 없고, 그것을 대조군 오탐 0건으로 확인했습니다.
    do_not_say:
      - AI가 만들지 않았다 (부인으로 시작)
    evidence_ref:
