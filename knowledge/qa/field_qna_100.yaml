- id: G56
  tier: GENERAL
  group: VALUE
  order: 70.6
  question_ko: 보험사가 Care를 직접 운영해야 하나요? 운영 부담이 너무 크지 않나요?
  answer_ko_short: 모든 고객을 상시 관리하는 구조가 아니라 의미 있는 변화 신호가 나온 경우만 검토하는 signal-based review입니다.
    보험사는 검토 기준과 승인 책임을 유지하되, 상담·이동지원·건강검진 연결 같은 서비스는 검증된 외부 파트너와 연계할 수 있습니다.
  answer_en_short: Care is a signal-based review, not continuous management of every
    customer. The insurer keeps the review and approval rules, while selected support
    services may use qualified partners. Workload and cost must be measured first.
  logic_ko:
  - 운영모델은 보험사가 모든 지원을 직접 제공한다는 뜻이 아니라, 신호 확인·고객 안내·적절한 지원 연결을 책임지는 구조입니다.
  validation_and_limit_ko: Care 발생률, 건당 검토시간, 승인율, 지원 이용률, 외부 연계비용과 SLA를 파일럿에서 측정해
    인력과 범위를 정합니다.
  answer_boundaries_ko:
  - 보험사가 고객의 건강과 이동을 상시 책임진다고 말하지 않습니다.
