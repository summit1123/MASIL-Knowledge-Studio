- id: C19
  tier: CORE
  presentation_part: 3
  group: VALUE
  owner: 팀 공통
  question_ko: 보험사가 MASIL을 실제로 출시해야 하는 가장 직접적인 이유는 무엇인가요?
  question_en: What is the most direct reason for an insurer to launch MASIL?
  answer_ko_short: MASIL은 기존 마일리지 기준이 놓치는 고객 간 위험 차이를 더 정밀하게 구분합니다. 이를 통해 안전고객에게 더
    적절한 환급을 제안하고, 의미 있는 변화가 나타난 고객에게는 사고 전 지원 접점을 만들 수 있습니다. 장기적으로는 축적된 주행 맥락 데이터가
    위험모형과 상품 설계를 개선하는 자산이 될 수 있습니다. 즉 더 정교한 가격·고객관리·예방을 하나의 특약으로 연결한다는 것이 직접적인 가치입니다.
  answer_en_short: MASIL helps insurers distinguish risk differences that mileage
    alone can miss. It supports more tailored refunds and earlier support when meaningful
    changes appear. Over time, the data can also improve risk models and product design.
  logic_ko:
  - 보험사 가치는 분류에서 끝나지 않습니다. 더 정밀한 구분이 Reward와 사전지원으로 이어지고, 운영 중 축적되는 맥락 데이터가 다음 위험모형과
    상품설계를 개선할 때 하나의 Value Cycle이 됩니다.
  validation_and_limit_ko: 손해율과 수익성 개선을 이미 달성한 성과처럼 말하지 않습니다.
  answer_boundaries_ko:
  - 손해율과 수익성 개선을 이미 달성한 성과처럼 말하지 않습니다.
