- id: G50
  tier: GENERAL
  presentation_part: 3
  group: VALUE
  owner: 진영
  question_ko: MASIL이 더 안전한 이동환경을 만든다는 효과는 어떻게 검증할 수 있나요?
  question_en: How can MASIL prove that it creates safer mobility?
  answer_ko_short: 현재는 기대효과이지 검증된 성과가 아닙니다. 파일럿에서 사고·위험행동 변화와 함께 고객의 이동 유지, 가족의 걱정·연락
    부담, 지원 이용 경험을 사전 정의된 지표로 측정해야 합니다.
  answer_en_short: These are expected benefits, not proven outcomes. The pilot should
    measure driving safety, mobility, family burden, and support experience with pre-defined
    metrics.
  logic_ko:
  - 사회적 가치는 이동을 무조건 늘리는 것도, 사고만 줄이는 것도 아닙니다. 안전 신호를 유지하면서 필요한 이동을 지속하고, 운전자 동의하에 가족과
    지원 정보를 나누며, 불필요한 제한과 돌봄 부담을 줄이는지를 함께 봐야 합니다.
  validation_and_limit_ko: 지표는 월 주행일·필수목적지 방문, 100km당 위험 이벤트, 사고·청구, 지원 이용, 운전자 자기조절,
    가족 부담 설문, 프라이버시 불만과 철회율입니다. 기준선과 파일럿 후 변화를 비교하되 사회비용 감소나 가족 부담 감소를 현재 성과로 말하지
    않습니다.
  answer_boundaries_ko:
  - 사회비용 감소가 시뮬레이션으로 검증됐다고 말하지 않습니다.
