  question_ko: Care는 정확히 무엇인가요? 위험등급이나 보험료 페널티인가요?
  question_en: What exactly is Care? Is it a risk tier or a premium penalty?
  answer_ko_short: Care는 그 사람을 고정적으로 ‘위험한 운전자’라고 분류하는 낙인이 아닙니다. 자신의 평소와 비교했을 때 이동
    맥락의 변화와 위험행동 변화가 의미 있게 함께 나타난 달에 생성되는 월별 검토 신호입니다. 보험사가 변화 이유를 확인하고 예방지원을 검토하도록
    만드는 장치이며, Care 자체는 자동 보험료 페널티가 아닙니다.
  answer_en_short: Care does not label a person as a permanently risky driver. It
    is a monthly review signal when meaningful mobility and risky-behavior changes
    appear together. Care itself is not an automatic pricing penalty.
