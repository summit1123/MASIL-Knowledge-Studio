- id: G57
  tier: GENERAL
  group: VALUE
  order: 70.7
  question_ko: 고객은 왜 위치정보를 제공하면서까지 MASIL에 가입할까요?
  answer_ko_short: 고객에게 더 적절한 환급, 자신의 운전 변화에 대한 이해, 필요할 때 선택할 수 있는 지원이라는 분명한 교환가치가
    있어야 합니다. 가입과 Care 이용은 자발적이어야 하며, 원본 위치는 최소한으로 사용하고 목적지 이름보다 파생된 생활권·점수 중심으로 운영해야
