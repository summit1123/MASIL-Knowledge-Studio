- id: D22
  tier: DEEP
  presentation_part: 3
  group: VALIDATION
  owner: 공통
  question_ko: 원본을 지워도 파생점수와 월별 근거를 몇 년씩 보관하면 똑같은 것 아닌가요?
  question_en: If derived scores are kept for years, are they still personal data?
  answer_ko_short: 파생값이라고 자동으로 규제 대상에서 벗어나는 것은 아닙니다. 개인과 연결할 수 있다면 개인정보일 수 있으므로 목적·접근권한·보유기간·삭제
    절차가 필요합니다. 보험 분쟁 시효가 3년이라는 사실도 모든 데이터를 자동으로 3년 보관할 근거는 아닙니다.
  answer_en_short: Derived data is not automatically anonymous. If it can still be
    linked to a person, it needs a clear purpose, access control, retention period,
    and deletion process.
  logic_ko:
  - 파생값도 개인과 연결돼 있으면 개인정보가 될 수 있으므로 무기한 보관할 수 없습니다. 원본 GPS, 생활권 파생값, 월 점수·Reason Code,
    보험계약 기록을 서로 다른 데이터 등급으로 나누고 각각의 목적과 법적 근거에 맞는 보유·삭제표를 운영해야 합니다.
  validation_and_limit_ko: 원본은 목적 달성 즉시 파기가 원칙이고, 별도 동의가 있는 개인위치정보 보유도 법률상 최대 1년이라는
    상한을 기본 보관기간처럼 사용하지 않습니다. 계약·분쟁 근거값은 보험 관련 시효를 고려해 별도 기간을 정할 수 있지만 ‘모든 파생값 3년’으로
    일괄 적용하지 않고 법무 검토 후 필드별 기간을 확정합니다.
  answer_boundaries_ko:
  - 파생값은 개인위치정보가 아니므로 자유롭게 보관 가능하다고 말하지 않습니다.
