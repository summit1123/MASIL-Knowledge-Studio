  question_ko: 시뮬레이션 결과가 원하는 결론이 나오도록 설계된 것 아닌가요?
  question_en: Were the synthetic scenarios designed to produce the result you wanted?
  answer_ko_short: 시뮬레이션은 실제 효과를 증명하려는 것이 아니라 규칙이 의도와 다르게 작동하는 경우를 찾기 위한 테스트입니다. 우대가
    나와야 하는 사례만 만든 것이 아니라, 생활권 안 위험·생활권 밖 안전·이동만 변한 대조사례처럼 논리를 깨뜨릴 수 있는 유형도 포함했습니다.
