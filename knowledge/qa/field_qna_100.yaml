  owner: 진영
  question_ko: 고령 운전자는 왜 굳이 MASIL에 가입해야 하나요?
  question_en: Why would a senior driver choose to join MASIL?
  answer_ko_short: 안전하고 안정적으로 운전하는 고객은 추가 우대 할인을 받을 수 있고, 자신의 운전 변화를 이해할 수 있습니다. 중요한
    점은 감시나 제한이 아니라 자발적인 혜택과 지원으로 설계하는 것입니다. 실제 가입 유인은 파일럿에서 검증해야 합니다.
  answer_en_short: Safe and stable drivers can receive an extra benefit and understand
    changes in their driving. The product is voluntary and supportive, not restrictive.
  logic_ko:
  - 가입 유인은 안전하고 안정적인 운전에 대한 추가 우대, 자신의 월별 변화 이해, 원할 때 이용할 수 있는 Care 지원입니다. 감시나 강제
    제한이 아니라 자발적 가입·공유·철회가 가능해야 하며, 실제로 고객이 이 가치를 받아들이는지는 파일럿에서 검증합니다.
  validation_and_limit_ko: 현재 Favorable 추가 우대 후보는 +3%p입니다. 예를 들어 연간점수 기반 할인이 15%라면
    조건 충족 시 18%가 됩니다. 가입률뿐 아니라 유지율, 철회율, Care 안내 후 이탈률, 지원 이용률과 환급비용을 함께 비교해 실제 유인을
    판단합니다.
  answer_boundaries_ko:
  - 고령자의 높은 가입 의향이 이미 확인됐다고 말하지 않습니다.
