    조건을 충족하면 총 18%가 되는 구조입니다. 3%p가 충분한 가입 유인인지, 추가 환급비용보다 손해 개선·유지 가치가 큰지는 파일럿에서 가입률·유지율·손익으로
    검증합니다.
  answer_boundaries_ko:
