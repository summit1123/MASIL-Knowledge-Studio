  question_ko: MASIL이 저위험 고객 확보나 역선택 완화에 실제로 도움이 된다는 근거는 무엇인가요?
  question_en: What evidence shows that MASIL can attract lower-risk customers or
    reduce adverse selection?
  answer_ko_short: 역선택 가능성은 실제 상품에서 검증해야 합니다. 기존 마일리지 특약과 결합하고, Favorable 혜택과 Care
    지원을 함께 제공해 안전운전자와 변화가 있는 고객 모두에게 가입 이유를 만드는 방향입니다. 가입자와 비가입자의 위험 차이는 파일럿에서 비교해야
    합니다.
  answer_en_short: Adverse selection is a pilot question. We combine safe-driving
    benefits with optional support so the product has value for different customers.
    We must compare enrolled and non-enrolled groups.
  logic_ko:
  - 역선택을 설계만으로 없앴다고 말할 수는 없습니다. 기존 마일리지 특약 위에 안전운전 혜택과 선택형 Care 지원을 함께 두어 서로 다른 고객에게
    가입 이유를 만들고, 모집 채널과 초기 위험 분포를 관찰해 포트폴리오가 한쪽으로 치우치는지 확인해야 합니다.
  validation_and_limit_ko: 가입자와 비가입자의 기준 주행거리, 위험 이벤트, 기존 환급, 이후 사고·손해, 환급비용을 비교합니다.
    연령·지역·차량등급을 맞춘 뒤에도 가입군 위험이 얼마나 다른지, 우대 고객과 Care 고객의 유지율이 어떻게 다른지를 측정해 요율·모집 기준을
    조정합니다.
  answer_boundaries_ko:
  - MASIL이 역선택을 예방한다고 완료형으로 말하지 않습니다.
