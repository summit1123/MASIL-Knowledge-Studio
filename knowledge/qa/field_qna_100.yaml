- id: C08
  tier: CORE
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 팀 공통
  question_ko: 왜 각 운전자마다 자신의 Baseline이 필요한가요?
  question_en: Why does each driver need a personal baseline?
  answer_ko_short: 사람마다 자주 가는 곳, 운전거리, 운전시간과 생활패턴이 다르기 때문입니다. 같은 기준으로 모든 사람을 비교하면
    활동범위가 넓거나 생활권이 여러 개인 운전자를 잘못 해석할 수 있습니다. MASIL은 매월 이전 2개월을 그 사람의 최근 기준으로 사용해,
    현재 월이 자신의 평소와 어떻게 달라졌는지를 봅니다. 2개월은 실제 데이터로 다시 검증할 운영 시작값입니다.
  answer_en_short: Each driver has a different routine, travel range, and driving
    pattern. MASIL compares the current month with that driver’s own previous two
    months. Two months is an operational starting point that must be tested with real
    data.
  logic_ko:
  - 개인 Baseline은 사람 간 비교가 아니라 자기 평소와의 비교를 가능하게 합니다. 활동범위가 넓거나 생활권이 여러 개인 사람을 일률 기준으로
    오해하지 않게 하는 공정성 장치이기도 합니다.
  validation_and_limit_ko: 2개월이 통계적으로 확정된 최종 기준이라고 말하지 않습니다.
  answer_boundaries_ko:
  - 2개월이 통계적으로 확정된 최종 기준이라고 말하지 않습니다.
