- id: C09
  tier: CORE
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 팀 공통
  question_ko: MASIL Zone 밖으로 운전하면 불리하거나 위험하다고 판단하나요?
  question_en: Does driving outside the MASIL Zone create a disadvantage or mean higher
    risk?
  answer_ko_short: 아닙니다. Outer Zone은 위험구역이 아니라 생활권 밖이라는 중립적인 이동 맥락입니다. 생활권 밖에서도 안전하고
    안정적으로 운전하면 위치만으로 불이익을 받지 않습니다. 반대로 생활권 안에서도 위험행동이 많으면 낮은 안전점수를 받을 수 있습니다. MASIL은
    위치 자체가 아니라 그곳에서의 행동과 평소 대비 변화를 봅니다.
  answer_en_short: No. The Outer Zone is a neutral driving context, not an automatic
    risk area. Safe driving outside the zone is not penalized by location alone. MASIL
    evaluates behavior and change, not location by itself.
  logic_ko:
  - In/Out은 안전·위험 구역을 나눈 것이 아니라 행동을 보는 두 개의 관측창입니다. 위치는 중립이고, 각 맥락에서 실제 안전행동과 자기 평소
    대비 변화가 결과를 만듭니다.
  validation_and_limit_ko: "‘생활권 밖은 위험하지 않다’ 또는 ‘밖이면 감점한다’고 단정하지 않습니다."
  answer_boundaries_ko:
  - "‘생활권 밖은 위험하지 않다’ 또는 ‘밖이면 감점한다’고 단정하지 않습니다."
