- id: G16
  tier: GENERAL
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 다현
  question_ko: 농촌이나 장거리 운전자는 활동반경이 넓은데 불리하지 않나요?
  question_en: Are rural or long-distance drivers unfairly disadvantaged?
  answer_ko_short: 생활권 밖 비중 자체는 벌점이 아닙니다. 각자의 반복 방문으로 생활권을 만들고 실제 위험행동을 거리 기준으로 보정하기
    때문에 활동반경이 넓다는 이유만으로 불리하게 설계하지 않습니다. 다만 지역별 결과 격차는 실제 파일럿에서 검증해야 합니다.
  answer_en_short: A wider activity range is not a penalty. Each driver has a personal
    zone, and risky events are normalized by distance. Regional fairness still needs
