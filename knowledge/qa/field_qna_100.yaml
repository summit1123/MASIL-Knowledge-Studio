  question_en: What did you validate with synthetic scenarios, and what remains unvalidated?
  answer_ko_short: 180개 합성 시나리오는 실제 고객을 대표하거나 사고를 예측하는 표본이 아니라 상품 로직을 시험하는 테스트셋입니다.
    같은 입력의 재현성, 규칙 실행, 예외와 Hold 처리, 생활권 위치만으로 불이익이 생기지 않는지를 확인했습니다. 반면 실제 사고 감소, 손해율
