- id: D24
  tier: DEEP
  presentation_part: 3
  group: VALIDATION
  owner: 공통
  question_ko: GPS가 유출되면 피해가 큰데 보안대책은 무엇인가요?
  question_en: What security controls are needed if GPS data is leaked?
  answer_ko_short: 가장 중요한 대책은 덜 모으고 빨리 지우는 것입니다. 원본과 파생 데이터를 분리하고 암호화·권한분리·접근기록을 적용하며,
    고객·가족·직원 화면에는 필요한 최소 정보만 보여주는 구조가 필요합니다.
  answer_en_short: The first security control is data minimization. We separate raw
    and derived data, encrypt it, limit access, and keep audit logs.
  logic_ko:
  - 보안의 첫 단계는 유출될 데이터를 줄이는 것입니다. 원본과 파생 데이터를 분리하고 전송·저장 암호화, 키 분리, 최소권한, 접근로그, 짧은
    원본 보관, POI 마스킹을 적용합니다. 고객·가족·직원 화면도 각 역할에 필요한 최소 정보만 표시합니다.
  validation_and_limit_ko: 검증 항목은 암호화 적용률, 권한 밖 접근 차단률, 감사로그 누락률, 키 회전, 삭제 SLA, 모의침투
    취약점과 사고대응 훈련 시간입니다. 인증이나 침투시험을 아직 완료하지 않았으므로 ‘안전하다’고 단정하지 않고 출시 게이트로 관리합니다.
  answer_boundaries_ko:
  - 완벽한 익명화·유출 불가능을 주장하지 않습니다.
