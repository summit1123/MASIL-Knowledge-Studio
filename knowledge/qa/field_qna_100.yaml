- id: D03
  tier: DEEP
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 공통
  question_ko: HDBSCAN 같은 다른 군집화 방법은 왜 쓰지 않았나요?
  question_en: Why did you not use HDBSCAN or another clustering method?
  answer_ko_short: HDBSCAN은 밀도가 다른 지역에서 유용한 후보입니다. 현재는 거리·반복일수와 시작 파라미터를 고객과 직원에게
    설명하기 쉬운 DBSCAN을 기준으로 두었고, 실제 지역별 군집 안정성·누락·과분할을 비교해 교체 여부를 판단할 계획입니다.
  answer_en_short: HDBSCAN is a useful alternative for areas with different densities.
    We started with DBSCAN because its distance and repeat-day rules are easier to
    explain. A pilot should compare stability, missed anchors, and over-segmentation.
  logic_ko:
  - DBSCAN은 군집 수를 미리 정하지 않고 반복 방문점과 잡음을 분리할 수 있어 생활권 목적지에 적합합니다. P90은 한두 번의 먼 이동이
    반경을 과도하게 늘리는 것을 막으면서 개인 방문의 대부분을 포함합니다. 두 방법 모두 설명 가능하다는 점이 보험 상품에 중요합니다.
  validation_and_limit_ko: 현재 시작값은 DBSCAN ε=260m, 서로 다른 방문일 3일 이상입니다. 각 anchor의 반경은
    max(500m, min(P90, 2km))로 계산해 최소 500m·최대 2km로 제한합니다. 파일럿에서는 ε별 군집 안정성, anchor
    재발견률, 미분류 방문 비율과 월별 반경 변동을 비교해 보정합니다.
  answer_boundaries_ko:
  - DBSCAN/P90이 사고위험을 직접 예측한다고 말하지 않습니다.
