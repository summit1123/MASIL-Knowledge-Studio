    자동 반영하면 안 됩니다. The current synthetic test does not fully solve driver identity.
    A pilot needs vehicle-device-driver linking, shared-driver declarations, and exception
    review. Uncertain trips should not automatically count against the customer. 발표에서는
    Jackie-Tom 비교와 AI-Assisted Simulation Pipeline으로 상품의 작동 예시와 검증 범위를 보여줍니다. 기본 답변
    뒤 계산·운영·법무·기술 한계를 더 파고들 때 나올 수 있는 Deep Dive 질문입니다. shared-vehicle driver-identity
    운전자 식별은 별도의 운영·데이터 계약 문제입니다.
