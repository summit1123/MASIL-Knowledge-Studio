  question_ko: LLM 설명이 Reason Code와 일치하는지 어떻게 자동·수동으로 검증하나요?
  question_en: How do you verify that the LLM explanation matches the reason codes?
  answer_ko_short: 설명문에 허용된 Reason Code와 수치만 입력하고, 생성 후 코드·수치·등급이 원본과 일치하는지 구조 검사를
    수행합니다. 불일치하거나 근거가 없는 문장은 차단하고 직원이 최종 확인합니다.
  answer_en_short: The LLM receives only approved reason codes and values. After generation,
    the system checks that the codes, numbers, and tier match the source. Unsupported
    text is blocked, and staff perform the final review.
  logic_ko:
  - RAG보다 중요한 것은 constrained input, structured output, consistency check입니다.
  validation_and_limit_ko: 실제 hallucination rate와 직원 수정률을 파일럿에서 측정합니다.
