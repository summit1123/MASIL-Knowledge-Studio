  answer_ko_short: 매월 네 요소의 통합점수와 변화 조건을 함께 봅니다. 안전하고 안정적인 달은 Favorable, 일반적인 달은 Standard,
    이동 변화와 위험행동 변화가 함께 나타난 달은 Care로 안내합니다. 데이터가 부족하면 별도 Hold로 처리합니다.
