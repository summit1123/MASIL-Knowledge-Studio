  answer_ko_short: 두 사람은 차량 조건과 연간 주행거리가 비슷해 기존 Pay-As-You-Drive에서는 같은 환급을 받는 사례입니다.
    하지만 Jackie는 위험 이벤트가 많고 생활권 밖 안전점수가 낮았으며, Tom은 생활권 밖 이동이 있어도 운전은 안정적이었습니다. 이 사례는
    ‘같은 주행거리 = 같은 위험’이 아니며, MASIL이 위치만이 아니라 Context, Behavior, Change를 함께 본다는 점을 보여줍니다.
    두 사람은 실제 고객이 아닌 합성 사례입니다.
  answer_en_short: Jackie and Tom have similar annual mileage, so the existing mileage
    rider gives them the same refund. But Jackie shows more risky events and a lower
    out-of-zone safety score, while Tom remains stable. The example shows that similar
    mileage does not always mean similar risk.
  logic_ko:
  - 비교의 핵심은 같은 거리라도 행동과 맥락이 다르면 위험 설명이 달라진다는 점입니다. Jackie와 Tom은 그 구조를 보여주는 합성 대조사례이며
    실제 고객이나 검증된 요율 사례가 아닙니다.
  validation_and_limit_ko: Jackie·Tom 또는 3%·22.6%를 실제 고객·실제 판매요율로 말하지 않습니다.
  answer_boundaries_ko:
  - Jackie·Tom 또는 3%·22.6%를 실제 고객·실제 판매요율로 말하지 않습니다.
