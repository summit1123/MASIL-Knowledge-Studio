- id: G03
  tier: GENERAL
  presentation_part: 1
  group: DIFFERENCE
  owner: 다현
  question_ko: 고령자만 따로 평가하면 연령차별 아닌가요?
  question_en: Is it age discrimination to evaluate senior drivers separately?
  answer_ko_short: MASIL은 나이를 위험점수로 넣지 않습니다. 가입 대상은 고령 운전자이지만, 실제 평가는 주행량·안전행동·개인
    패턴 변화로 이루어집니다. 목적도 운전을 제한하는 것이 아니라 안전한 운전을 우대하고 이동을 계속 지원하는 것입니다.
  answer_en_short: Age is not a scoring input. We evaluate mileage, driving behavior,
    and changes from each person's own pattern. The goal is support, not restriction.
  logic_ko:
  - 가입 대상은 고령자이지만 점수 입력에는 나이·성별·건강정보가 들어가지 않습니다. 각 운전자를 다른 사람의 평균과 비교하기보다 자신의 반복 방문과
    직전 패턴에 비교합니다. 다만 개인화만으로 공정성이 보장되는 것은 아니므로 실제 파일럿에서 집단별 결과 차이를 따로 검사해야 합니다.
  validation_and_limit_ko: 파일럿에서는 연령대·지역·소득 대리변수별 평균점수, Favorable 비율, Care 비율, 할인
    차이, Hold 비율을 비교합니다. 직원 검토 결과와 신호가 불일치한 비율도 집단별로 확인합니다. 격차가 크면 표본 구성, GPS 밀도, 파라미터와
    지원 절차 중 어디에서 차이가 생겼는지 분해해 재보정합니다.
  answer_boundaries_ko:
  - 공정성이 이미 입증됐다고 말하지 않습니다.
