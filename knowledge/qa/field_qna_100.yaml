  question_ko: 안전하고 안정적으로 운전한 고객은 실제로 어떻게 우대받나요?
  question_en: How is a safe and stable customer actually rewarded?
  answer_ko_short: 매월 네 가지 지표를 합쳐 통합점수를 만들고, 안전하고 안정적인 달은 Favorable로 관리합니다. 12개월의
    유효 점수를 연간으로 종합해 기본 환급률을 제안하고, Favorable 기록이 충분한 고객에게는 추가 우대를 적용하는 구조입니다. 즉 단순히
    적게 운전했다는 이유가 아니라, 실제 안전행동과 안정성을 함께 반영해 환급 혜택을 제안합니다. 구체적인 환급률은 합성 시나리오의 후보값입니다.
  answer_en_short: MASIL combines four scores each month. Safe and stable months can
    receive a Favorable result. The valid monthly scores are combined for an annual
    refund proposal, with an additional reward for a strong Favorable record. The
    current refund rates are simulation candidates, not final tariffs.
  logic_ko:
  - Reward는 ‘생활권 안에 있었다’는 보상이 아니라 Safe & Stable의 결과입니다. 실제 행동으로 만든 월 점수와 반복된 Favorable
    기록이 연간 환급 제안으로 이어집니다.
  validation_and_limit_ko: Familiarity 자체나 Care 여부가 환급률을 직접 결정한다고 말하지 않습니다.
