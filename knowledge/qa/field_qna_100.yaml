  question_ko: AI·scoring rule·GPS 데이터가 잘못되면 고객을 잘못 평가할 수 있는데, 어떻게 대응하나요?
  question_en: How do you respond if AI, the scoring rule, or GPS data is wrong?
  answer_ko_short: 오류 유형을 분리해 관리해야 합니다. GPS가 부족하거나 비정상적이면 고객에게 불리하게 추정하지 않고 Hold로
    두며, scoring rule은 버전별 테스트와 실데이터 재보정을 거칩니다. AI가 만든 설명은 규칙에서 직접 나온 계산 사유와 수치에 대조하고
    직원이 확인합니다. 이 통제 절차의 세부 기준은 Pilot에서 실제 운영 데이터로 확정해야 합니다.
  answer_en_short: We manage data, rule, and AI errors separately. Insufficient or
    abnormal data is placed on Hold, rules are tested and recalibrated, and staff
    check AI explanations against the original calculation reasons. The detailed controls
    must be finalized in the pilot.
  logic_ko:
  - 오류는 GPS 입력, scoring rule, AI 설명의 세 층으로 나눠야 합니다. 데이터는 Hold, 규칙은 버전관리·재보정, 설명은 Reason
    Code 대조와 직원 검토로 각각 통제합니다.
  validation_and_limit_ko: 현재 완전한 오분류 방지 성능을 이미 검증했다고 말하지 않습니다.
  answer_boundaries_ko:
  - 현재 완전한 오분류 방지 성능을 이미 검증했다고 말하지 않습니다.
