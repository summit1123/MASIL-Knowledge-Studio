  question_ko: 가족에게 운전정보를 공유하면 사실상 위치감시 아닌가요?
  question_en: Is sharing driving information with family a form of location surveillance?
  answer_ko_short: 가족 공유는 운전자의 선택과 동의를 전제로 하며, 실시간 위치를 기본 제공하지 않습니다. 필요한 경우에도 ‘이번
    달 변화가 있었다’ 같은 안전 요약만 공유하고, 원본 경로나 목적지 이름은 제공하지 않는 방향입니다.
  answer_en_short: Family sharing is optional and requires the driver's consent. Real-time
    location is not shared by default. We share only a limited safety summary when
    needed.
