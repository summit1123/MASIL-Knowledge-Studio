- id: C05
  tier: CORE
  presentation_part: 1
  group: DIFFERENCE
  owner: 팀 공통
  question_ko: 결국 기존 UBI에 GPS나 생활권 기능을 추가한 것 아닌가요? MASIL만의 차별점은 무엇인가요?
  question_en: Is MASIL just UBI with GPS and a familiar-zone feature? What is different?
  answer_ko_short: 기술적으로는 기존 UBI 데이터 채널 위에 구현할 수 있습니다. 하지만 MASIL의 차이는 지도 기능 하나가 아니라
    개인 생활권, 안팎 안전행동, 평소 대비 변화, Reward와 Care, 사람 검토를 하나의 설명 가능한 보험상품 흐름으로 연결한 데 있습니다.
    GPS는 입력수단이고, 차별점은 그 데이터를 개인 맥락과 실제 보험 행동으로 전환하는 상품 구조입니다.
  answer_en_short: MASIL can be built on an existing UBI data channel. But it is not
    just a map feature. It connects personal context, safety behavior, change detection,
    rewards, Care, and human review in one explainable insurance flow.
  logic_ko:
  - 기술 채널과 상품 혁신을 구분해야 합니다. GPS는 입력수단이고, 차별점은 Zone 생성부터 점수·Reward·Care·직원 검토까지 이어지는
    설명 가능한 보험 흐름입니다.
  validation_and_limit_ko: GPS 기술 자체를 혁신이라고 과장하지 않습니다.
  answer_boundaries_ko:
  - GPS 기술 자체를 혁신이라고 과장하지 않습니다.
