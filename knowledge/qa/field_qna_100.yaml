- id: G31
  tier: GENERAL
  presentation_part: 2
  group: VALIDATION
  owner: 은서
  question_ko: 월별 점수와 등급은 연간 환급률로 어떻게 이어지나요?
  question_en: How do monthly scores and tiers become an annual refund?
  answer_ko_short: 매월 네 요소로 통합점수를 계산하고, 평가 가능한 월 점수를 평균해 연간 점수를 만듭니다. 연간 점수가 기본 환급
    폭에 반영되고, Favorable이 충분히 반복되면 현재 후보의 추가 우대를 적용할 수 있습니다. Hold 달은 유효 평균에서 제외합니다.
  answer_en_short: We calculate one integrated score each month and average the valid
    monthly scores for the annual result. The annual score affects the refund, and
    repeated Favorable results can add a candidate extra benefit. Hold months are
    excluded.
  logic_ko:
  - 월 tier는 월별 상태, annual score는 가격 연결이라는 역할을 분리합니다.
  validation_and_limit_ko: 실제 점수-환급 곡선은 계리 데이터로 확정해야 합니다.
