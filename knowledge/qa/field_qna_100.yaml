- id: G55
  tier: GENERAL
  group: VALUE
  order: 70.5
  question_ko: Care가 사고 예방으로 이어진다는 논리는 무엇인가요?
  answer_ko_short: MASIL은 사고를 정확히 예측한다고 주장하지 않습니다. 개인의 평소와 비교해 이동 맥락과 위험행동이 함께 달라진
