  question_ko: GPS 오류가 MASIL Zone이나 점수에 영향을 주지 않도록 어떻게 검사하나요?
  question_en: How do you detect GPS errors before they affect the zone or score?
  answer_ko_short: 비현실적인 좌표 점프, 시간·거리·속도의 불일치, 결측 주행, 장치별 이상률을 먼저 검사합니다. 반복 방문일과 군집
    안정성으로 일회성 오류를 줄이고, 품질 기준을 통과하지 못한 달은 Hold 또는 직원 검토로 보냅니다.
  answer_en_short: We check impossible jumps, inconsistent time-distance-speed patterns,
    missing trips, and device-level anomalies. Repeated visit days reduce one-off
    errors, and low-quality months are placed on Hold or reviewed.
