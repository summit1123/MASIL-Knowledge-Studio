  question_ko: 왜 Familiarity를 보험 평가에 포함하나요?
  question_en: Why does MASIL include familiarity in insurance assessment?
  answer_ko_short: Familiarity가 안전을 자동으로 보장한다는 뜻은 아닙니다. 다만 익숙하지 않은 경로의 부담과 익숙한 경로를
    선택하는 경향은 고령 운전자의 실제 운전을 이해하는 중요한 맥락입니다. MASIL은 익숙함 자체에 점수를 주지 않고, 그 맥락 안팎에서 실제로
    어떻게 운전했으며 평소와 무엇이 달라졌는지를 함께 봅니다.
  answer_en_short: Familiarity does not automatically mean safety. It is useful context
    for understanding senior driving. MASIL does not reward familiarity alone; it
    also checks actual behavior and changes from the driver’s usual pattern.
  logic_ko:
  - Familiarity는 안전 판정이 아니라 행동을 해석하는 배경입니다. 익숙한 곳에서도 위험하게 운전할 수 있고, 낯선 곳에서도 안전할 수
    있으므로 실제 행동과 변화가 반드시 함께 들어갑니다.
  validation_and_limit_ko: 2.5배와 76%는 서로 다른 연구이며, Familiarity와 안전의 인과를 단정하지 않습니다.
