  question_ko: 왜 P90을 사용했나요?
  question_en: Why did you use P90?
  answer_ko_short: P90은 한두 번의 먼 좌표가 Zone을 과도하게 키우는 것을 막으면서, 각 anchor 주변의 평소 방문위치 대부분을
    포함하기 위한 개인화된 Buffer입니다. 모든 운전자에게 같은 반경을 강요하지 않는 장점이 있습니다.
  answer_en_short: P90 includes most normal visits around an anchor without letting
    a few distant points make the zone too large. It creates a personal buffer instead
    of one fixed radius for everyone.
