  question_ko: 안전한 고객에게 더 많은 혜택을 주고 Care 운영비까지 쓰면 보험사 비용만 늘어나는 것 아닌가요? 그래도 MASIL이
    보험사에 이익이 될 수 있다고 보는 이유는 무엇인가요?
  question_en: Why can MASIL still benefit an insurer after extra rewards and Care
    operating costs?
  answer_ko_short: 보험사의 경제성은 추가 환급과 Care 비용보다 사고 전 개입으로 줄일 수 있는 손해, 더 정밀한 가격, 안전고객의
    확보·유지 가치가 클 때 성립합니다. MASIL은 위험 변화를 더 일찍 발견해 사고 전 지원으로 연결하고, 장기적으로 더 풍부한 위험데이터를
    축적하는 구조를 제안합니다. 다만 현재 단계에서는 검증된 수익이 아니라 사업 가설입니다. Pilot에서 기존 상품군과 비교해 사고·청구·손해율,
    환급비용, Care 운영비, 가입률과 유지율을 함께 측정해야 합니다.
  answer_en_short: MASIL creates value only if avoided losses, better pricing, and
    customer value exceed the extra refund and Care costs. This is a business hypothesis,
    not a proven result. The pilot must compare claims, loss ratio, operating costs,
    enrollment, and retention with the existing product.
  logic_ko:
  - 경제성은 회피손해와 가격·고객가치가 추가 환급·Care·데이터 비용보다 큰지의 문제입니다. 합성 결과로 결론내리지 않고 Pilot에서 청구·손해율·비용·가입·유지를
    같은 기준으로 비교해야 합니다.
  validation_and_limit_ko: 손해율 개선이나 수익성을 합성 시나리오로 입증했다고 말하지 않습니다.
  answer_boundaries_ko:
  - 손해율 개선이나 수익성을 합성 시나리오로 입증했다고 말하지 않습니다.
