  answer_ko_short: 시스템은 먼저 데이터와 Reason Code를 제시하고, 직원이 변화가 실제인지 확인합니다. 검토 후 고객에게 어떤
    운전 변화가 관찰됐는지 쉬운 언어로 설명하고, 필요한 경우 선택 가능한 예방지원을 안내합니다. 고객은 자신의 변화를 확인하고 지원을 신청할
    수 있습니다. 최종 안내와 지원 연결은 자동이 아니라 사람의 검토를 거칩니다.
