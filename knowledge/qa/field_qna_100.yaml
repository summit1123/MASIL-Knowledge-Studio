- id: G52
  tier: GENERAL
  group: VALUE
  order: 70.2
  question_ko: 더 정밀한 Risk Segmentation이 실제 Pricing에 어떻게 도움이 되나요?
  answer_ko_short: 같은 주행거리라도 안전행동과 변화가 다르면 위험도 같다고 보기 어렵습니다. 이 차이를 구분하면 환급을 실제 관측된
    행동에 더 가깝게 설계할 수 있고, 기존 거리 기준에서 생기는 과도하거나 부족한 우대를 줄일 수 있습니다.
  answer_en_short: Drivers with similar mileage may show different behavior and change
    patterns. Better segmentation can align refund design more closely with observed
    risk. The final pricing relationship still requires real claims and loss data.
  logic_ko:
  - 분류가 곧 요율은 아닙니다. 분류 결과와 실제 사고·손해의 관계를 확인한 뒤 계리 보정을 거쳐야 Pricing에 반영할 수 있습니다.
  validation_and_limit_ko: 현재 3%, 22.6%와 가중치는 합성 시나리오의 후보값입니다. 실제 환급곡선은 손해빈도·손해액·운영비·공정성
    결과로 재보정합니다.
  answer_boundaries_ko:
  - 합성 점수를 곧바로 확정 판매요율이라고 말하지 않습니다.
