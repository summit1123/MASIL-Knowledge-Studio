- id: D10
  tier: DEEP
  presentation_part: 2
  group: VALIDATION
  owner: 공통
  question_ko: 실제 주행에서 과속·급가속·급감속 기준과 센서 품질은 어떻게 검증하나요?
  question_en: How will you validate speeding, harsh-acceleration, and harsh-braking
    thresholds and sensor quality?
  answer_ko_short: 현재 합성 데이터에서는 운전자 유형별 위험률에 따라 이벤트를 만들고 과속·급가속·급감속으로 표시합니다. 실제 파일럿에서는
    eTAS 기준과 차량·텔레매틱스 센서 기준을 맞추고, 결측·오탐·장치별 차이를 먼저 검증해야 합니다.
  answer_en_short: In the synthetic data, event counts come from each driver profile
    and are shown as speeding, harsh acceleration, and harsh braking. A real pilot
    must align sensor thresholds with eTAS and test missing data, false events, and
    device differences.
  logic_ko:
  - 핵심 논리 현재 검증의 목적은 이벤트 탐지기 정확도를 입증하는 것이 아니라 위험 이벤트가 주어졌을 때 MASIL 상품 규칙이 의도대로 작동하는지
    확인하는 것입니다. 실제 상용화에는 센서 단계의 별도 검증이 선행돼야 합니다. 현재 설계 합성 로그는 유형별 risk rate로 이벤트 수를
    만들고 과속·급가속·급감속 유형을 표시합니다. 실제 데이터에서는 eTAS 임계값, 차량 제조사·텔레매틱스 정의, GPS·가속도 센서 품질을
    동일한 이벤트 계약으로 맞춥니다.
  validation_and_limit_ko: 파일럿에서는 센서별 이벤트 발생률, 결측 주행 비율, 동일 주행의 장치 간 일치율, 수동 검토 대비
    오탐·미탐, 100km당 이벤트 분포를 확인합니다. 센서 계약이 안정된 뒤에만 안전점수 변환식과 월 점수를 재보정합니다.
  answer_boundaries_ko:
  - 합성 이벤트를 실제 차량 센서에서 검출한 데이터나 eTAS 정확도 검증 결과로 설명하지 않습니다.
