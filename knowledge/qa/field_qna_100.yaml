  question_ko: 월별 평가 결과가 연간 보험료 환급으로 어떻게 이어지나요?
  question_en: How do monthly results lead to the annual premium refund?
  answer_ko_short: 먼저 매월 Mileage, In-Zone Safety, Out-Zone Safety, Pattern Change를
    합쳐 월 통합점수를 계산합니다. 유효한 12개월 점수를 평균해 연간 점수를 만들고, 그 연간 점수와 우대 기록을 바탕으로 연간 환급을 제안합니다.
    월별 Favorable·Standard·Care는 관리 결과이고, 연간 환급은 12개월 점수를 종합한 별도 결과입니다. 따라서 Care가 나온
    달이 있다는 이유만으로 환급률을 자동 차감하지 않습니다.
  answer_en_short: Each month, MASIL combines the four scores into one monthly score.
    The valid monthly scores are averaged into an annual score, which supports the
    annual refund proposal. Care is a monthly review signal; it does not automatically
    reduce the refund.
  logic_ko:
  - 월별 관리는 운전 상태를 이해하기 위한 층이고, 연간 환급은 12개월 점수를 종합한 가격 층입니다. Care는 월별 검토 신호이므로 그 이름
    자체를 환급식의 차감항으로 넣지 않습니다.
  validation_and_limit_ko: Care → 13%p 차감으로 설명하지 않습니다. 3%와 22.6%는 합성 예시입니다.
  answer_boundaries_ko:
  - Care → 13%p 차감으로 설명하지 않습니다. 3%와 22.6%는 합성 예시입니다.
