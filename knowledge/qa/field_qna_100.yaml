- id: G12
  tier: GENERAL
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 다현
  question_ko: 반복 방문한 목적지가 있다고 해서 그 경로까지 익숙하다고 볼 수 있나요?
  question_en: Does a repeated destination prove that the route itself is familiar?
  answer_ko_short: 완전히 같지는 않습니다. MASIL Zone은 반복 방문 목적지로 개인의 익숙한 활동영역을 추정하는 지표입니다.
    그 안의 모든 도로가 익숙하다고 단정하지 않고, 최종 평가는 실제 안전행동과 최근 변화로 합니다.
  answer_en_short: Not exactly. Repeated destinations estimate a familiar activity
    area, but they do not prove that every road inside it is familiar. The final score
    still uses actual driving behavior and recent change.
  logic_ko:
  - 핵심 논리 MASIL Zone은 ‘이 도로를 알고 있다’는 내비게이션 지도가 아니라 반복되는 생활 목적지를 중심으로 만든 개인 활동영역입니다.
    따라서 Zone 안이라는 이유로 안전하다고 판정하지 않고 In-Zone Safety를 별도로 계산합니다. 현재 설계 서로 다른 3일 이상 방문한
    목적지를 anchor로 만들고, DBSCAN과 P90으로 주변 활동범위를 구성합니다. 경로 단위 익숙함은 더 촘촘한 궤적 보관이 필요하므로
    최소수집 원칙과 함께 파일럿에서 비교할 확장 항목입니다.
  validation_and_limit_ko: 파일럿에서는 목적지 기반 Zone과 반복 경로 기반 지표를 각각 만들고 월 점수·Care 결과·GPS
    보관량이 얼마나 달라지는지 비교합니다. 경로 지표가 검토 유용성을 충분히 높이면서 개인정보 부담을 정당화할 때만 추가합니다.
  answer_boundaries_ko:
