  group: VALIDATION
  owner: 공통
  question_ko: 생활권을 만들기 위해 꼭 원본 GPS가 필요한가요?
  question_en: Do you really need raw GPS data to build the MASIL Zone?
  answer_ko_short: 개인별 반복 목적지와 안팎 주행을 구분하려면 위치 정보가 필요합니다. 다만 전체 이동경로를 무기한 보관할 필요는
    없습니다. MASIL은 생활권 생성에 필요한 최소 데이터와 기간만 사용하고 이후에는 점수와 월별 근거를 중심으로 남기는 구조입니다.
  answer_en_short: Location data is needed to find repeated destinations and separate
    in-zone and out-zone driving. We use it only for the minimum purpose and period,
    then keep minimized monthly evidence.
  logic_ko:
  - 생활권을 처음 만들 때는 출발·도착 위치와 반복 방문일을 구분할 수 있는 위치 데이터가 필요합니다. 그러나 보험사 모든 부서가 전체 이동경로를
    볼 필요는 없습니다. 수집 단계에서 생활권·안팎 여부·월 집계로 변환하고 원본 접근과 파생값 이용을 분리하는 것이 핵심입니다.
  validation_and_limit_ko: 최소 입력은 익명화된 운전자·주행 ID, 시간, 출발·도착 좌표, 주행거리, 위험 이벤트와 필요한
    경우 경로의 안팎 구간입니다. 파일럿에서는 전체 초단위 경로 없이도 점수가 유지되는지 비교해 좌표 샘플링 주기와 필수 필드를 줄입니다. 원본을
    덜 썼을 때 점수 차이와 생활권 생성 실패율을 측정합니다.
  answer_boundaries_ko:
  - GPS를 전혀 저장하지 않는다고 말하지 않습니다.
