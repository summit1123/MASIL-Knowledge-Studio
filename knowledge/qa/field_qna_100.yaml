- id: C16
  tier: CORE
  presentation_part: 2
  group: VALIDATION
  owner: 팀 공통
  question_ko: AI는 정확히 무엇을 하고, 무엇을 하지 않나요?
  question_en: What exactly does AI do, and what does it not do?
  answer_ko_short: AI는 실데이터가 없는 단계에서 운전자 프로필을 바탕으로 합성 이동 시나리오를 만드는 작업을 지원했습니다. DBSCAN과
    P90은 정해진 기준으로 MASIL Zone을 만드는 재현 가능한 군집화·통계 알고리즘이고, 고정 규칙이 월별 점수·등급·환급 제안을 계산합니다.
    LLM은 그 계산 근거, 예를 들면 생활권 밖 안전점수 저하나 이동·위험행동의 동시 변화를 사람이 이해하기 쉬운 문장으로 바꿉니다. 즉 AI가
    보험료를 결정하지 않습니다.
  answer_en_short: AI supports simulated driver profiles and movement scenarios. DBSCAN
    and P90 form the MASIL Zone, and fixed rules calculate the scores, tiers, and
    refund proposal. The LLM only turns the calculation reasons into a simple report.
    AI does not determine the premium.
  logic_ko:
  - AI의 역할은 생성·설명 지원이고 결정권은 고정 규칙과 사람에게 있습니다. 이 구분이 있어야 AI 활용을 숨기지 않으면서도 보험료 결정의 책임성과
    재현성을 설명할 수 있습니다.
  validation_and_limit_ko: LLM이 점수·등급·환급을 결정하거나 실제 고객을 진단한다고 말하지 않습니다.
  answer_boundaries_ko:
  - LLM이 점수·등급·환급을 결정하거나 실제 고객을 진단한다고 말하지 않습니다.
