- id: D14
  tier: DEEP
  presentation_part: 2
  group: VALIDATION
  owner: 공통
  question_ko: 고정 규칙이 특정 유형의 운전자를 반복적으로 잘못 평가하면 어떻게 하나요?
  question_en: What if the fixed rules systematically misjudge a certain type of driver?
  answer_ko_short: 처음부터 모든 위험을 예측하려는 모델이 아닙니다. 네 가지 투명한 요소로 환급과 변화 신호를 설명하고, 애매한 경우는
    사람 검토로 넘기는 구조입니다. 파일럿에서 놓치는 사례가 확인되면 규칙과 파라미터를 버전 관리하며 보정합니다.
  answer_en_short: We do not try to predict every risk. We use four transparent factors
    and human review for uncertain cases. Pilot data will show where the rules need
    recalibration.
  logic_ko:
  - 규칙 기반은 모든 현실을 완벽하게 표현하기보다 보험료와 Care 결과를 고객과 직원이 설명할 수 있게 만드는 선택입니다. 현재는 입력 특성과
    계산 계약을 고정하고 Reason Code를 남깁니다. 더 복잡한 모델은 실제 데이터에서 의미 있는 개선이 확인될 때 보조 모델로 비교할 수
    있습니다.
  validation_and_limit_ko: 비교 실험에서는 같은 검증셋에서 규칙 모델과 후보 ML 모델의 위험신호 식별률, 오탐률, 집단별 격차,
    설명 가능한 사례 비율, 운영 검토시간을 함께 봅니다. 정확도가 조금 높아도 이유를 설명할 수 없거나 공정성·운영비가 악화되면 가격 결정 모델로
    채택하지 않습니다.
  answer_boundaries_ko:
  - 규칙 기반이라 편향이 없다고 말하지 않습니다.
