- id: C02
  tier: CORE
  presentation_part: 1
  group: PROBLEM
  owner: 팀 공통
  question_ko: 왜 고령 운전자를 우선 대상으로 했나요?
  question_en: Why did you start with senior drivers?
  answer_ko_short: 고령 운전자 리스크 관리의 필요성은 커지고 있지만, 운전은 많은 고령자에게 독립적인 생활을 위한 중요한 이동수단입니다.
    또한 모든 고령 운전자가 같은 위험을 갖는 것도 아닙니다. 안전과 이동권의 균형, 그리고 개인별 평가의 필요성이 가장 분명하게 만나는 집단이기
    때문에 고령 운전자부터 시작했습니다. 나이 자체는 MASIL 점수의 입력값이 아닙니다.
  answer_en_short: Senior-driver risk management is becoming more important, but driving
    is still essential for many seniors. Not every senior driver has the same risk.
    We start with seniors because the need to balance safety and mobility is especially
    clear, and age itself is not a scoring input.
  logic_ko:
  - 고령자를 타깃으로 삼는 이유와 나이를 점수에 넣는 것은 다른 문제입니다. MASIL은 안전과 이동권의 긴장이 큰 집단에서 시작하지만, 판정은
    나이가 아니라 실제 운전으로 합니다.
  validation_and_limit_ko: 나이를 위험점수나 건강진단의 대리변수처럼 설명하지 않습니다.
  answer_boundaries_ko:
  - 나이를 위험점수나 건강진단의 대리변수처럼 설명하지 않습니다.
