  question_ko: 기존 마일리지 특약과 비교해 MASIL이 보험사에 추가로 만들어주는 가치는 무엇인가요?
  answer_ko_short: 기존 마일리지 특약은 주행량을 중심으로 환급합니다. MASIL은 같은 거리 안에서도 안전행동, 생활권 맥락, 개인의
    평소 대비 변화를 구분해 안전하고 안정적인 고객은 더 정교하게 우대하고, 의미 있는 변화는 Care 검토로 연결합니다.
  answer_en_short: Mileage riders mainly reward how little a customer drives. MASIL
    also distinguishes safe behavior, driving context, and change from a personal
    baseline. This supports more precise rewards and earlier Care review.
  logic_ko:
  - 추가가치는 GPS 자체가 아니라 같은 주행거리 안에서 기존 상품이 놓치던 위험 차이를 설명하고 행동하는 구조입니다.
