  question_ko: 실제 GPS 주행데이터를 어떻게 확보하고, 고객 동의와 법적 문제는 어떻게 해결할 건가요?
  question_en: How will you obtain real GPS data and handle customer consent and legal
    requirements?
  answer_ko_short: 현재 검증 데이터는 전부 합성입니다. 실제 데이터는 보험사·텔레매틱스 파트너의 기존 동의 채널을 활용하거나, 자발적으로
    참여한 파일럿 고객에게 목적과 항목을 명확히 알리고 별도 동의를 받아 확보해야 합니다. 아직 데이터 제휴가 확정된 것은 아니며, 적법한 데이터
    확보가 파일럿의 첫 번째 조건입니다.
  answer_en_short: Our current data is fully synthetic. Real GPS data would require
    an insurer or telematics partnership, or an opt-in pilot with clear customer consent.
    Data access is not secured yet. It is the first requirement for the pilot.
  logic_ko:
  - 현재 실제 고객 GPS를 확보한 상태는 아닙니다. 보험사 텔레매틱스 채널이나 동의 기반 파일럿 앱을 통해 목적·항목·보유기간·제공대상을 분리
    고지하고 자발적으로 수집해야 합니다. 원본은 생활권 계산을 위한 짧은 rolling 구간에만 두고 이후에는 필요한 파생·월 집계만 남기는 방향입니다.
  validation_and_limit_ko: 현재 설계 후보는 직전 2개월 원본을 rolling 처리하는 것입니다. 파일럿 계약 전에는 가입 동의율,
