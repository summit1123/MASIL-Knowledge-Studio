  answer_ko_short: 같은 날 여러 번 기록된 좌표가 중요한 생활장소로 과대평가되는 것을 막고, 여러 날짜에 반복된 일상 목적지만 anchor로
    인정하기 위해서입니다. 3일은 현재 설명 가능한 시작값이며 실제 데이터로 재검증해야 합니다.
  answer_en_short: The rule prevents many records from one day from being treated
    as an important place. Only destinations repeated across different days become
    anchors. Three days is a starting value, not a final rule.
  logic_ko:
  - 방문 건수보다 distinct-day repetition을 봅니다.
