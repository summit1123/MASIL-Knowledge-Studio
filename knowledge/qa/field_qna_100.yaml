  question_ko: MASIL이 정확히 해결하려는 문제는 무엇인가요?
  question_en: What exact problem does MASIL solve?
  answer_ko_short: MASIL이 해결하려는 문제는 ‘고령 운전자는 모두 위험하다’는 것이 아닙니다. 현재의 규제와 보험은 주행거리나
    일부 운전행동은 보지만, 각 운전자의 익숙한 생활권과 자신의 평소 대비 변화를 충분히 구분하지 못합니다. MASIL은 이 개인별 맥락을 더해
    같은 주행거리 안에서도 서로 다른 위험을 더 정밀하게 설명하려는 특약입니다.
  answer_en_short: MASIL does not assume that all senior drivers are risky. The problem
    is that current systems cannot fully distinguish each driver’s familiar context
    and changes from their usual pattern. MASIL adds that personal context to existing
    mileage and driving-behavior assessment.
  logic_ko:
  - 핵심은 새로운 위험을 만들어내는 것이 아니라 기존 보험의 분류 해상도를 높이는 것입니다. 주행거리·행동만 보던 평가에 개인 생활권과 자기 평소
    대비 변화라는 맥락을 더합니다.
  validation_and_limit_ko: "‘고령 운전자가 위험하다’가 핵심 문제라고 말하지 않습니다."
  answer_boundaries_ko:
  - "‘고령 운전자가 위험하다’가 핵심 문제라고 말하지 않습니다."
