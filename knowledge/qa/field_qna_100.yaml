- id: D12
  tier: DEEP
  presentation_part: 2
  group: VALIDATION
  owner: 공통
  question_ko: 고객이 GPS나 운전데이터를 조작해 점수를 높이면 어떻게 하나요?
  question_en: How do you prevent GPS spoofing or gaming to improve the score?
  answer_ko_short: 가능성을 전제로 설계해야 합니다. 한 번의 짧은 주행이나 특정 위치 방문만으로 유리해지지 않도록 서로 다른 날의
    반복 방문, 100km 기준 위험률, 월별 누적을 사용합니다. 파일럿에서는 GPS 위변조와 선택적 운행 같은 게이밍을 별도 탐지해야 합니다.
  answer_en_short: We assume gaming is possible. Repeated visit days, distance-normalized
    risk rates, and monthly aggregation make simple manipulation harder. GPS spoofing
    still needs pilot controls.
  logic_ko:
  - 조작은 한 가지 탐지기로 해결하지 않고 입력·행동·운영의 세 층으로 막습니다. anchor는 같은 날 여러 번 찍어도 인정하지 않고 서로 다른
    3일 이상 반복돼야 합니다. POI 이름은 점수 입력이 아니며, 주행의 시간·거리·속도 일관성, 비현실적 GPS 점프, 센서 연속성을 검사합니다.
    기기·차량·운전자 연결 규칙은 파일럿 운영계약으로 확정해야 합니다.
  validation_and_limit_ko: 파일럿에서는 정상 주행과 의도적으로 주입한 조작 사례를 섞어 탐지율=탐지한 조작 건수÷전체 주입 조작
    건수, 오탐률=정상인데 경고한 건수÷전체 정상 건수로 측정합니다. 직원 판정과 시스템 경고의 일치율, 검토시간도 함께 봅니다. 현재 게이밍
    탐지 정확도를 보유한 것처럼 말하지 않고, 무엇을 어떻게 검증할지까지 답합니다.
  answer_boundaries_ko:
  - 현재 시스템이 모든 GPS 위변조를 차단한다고 말하지 않습니다.
