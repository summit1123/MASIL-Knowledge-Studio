- id: G53
  tier: GENERAL
  group: VALUE
  order: 70.3
  question_ko: 안전한 고객을 더 많이 유치하면 왜 보험사에 좋은가요?
  answer_ko_short: 보험사는 가입자 수뿐 아니라 포트폴리오의 위험구성도 중요합니다. MASIL의 우대가 안전하고 안정적인 운전자에게
    매력적으로 작동한다면, 상대적으로 양호한 고객의 유입과 유지에 도움을 주고 전체 위험구성을 개선할 가능성이 있습니다.
  answer_en_short: Insurers care about portfolio quality, not only customer count.
    A meaningful reward may attract and retain safer, more stable drivers. This may
    improve the risk mix, but the effect must be tested in a pilot.
  logic_ko:
  - 고객 유치와 손해율 개선을 단정하지 않고, 우대가 가입·유지와 위험구성에 미치는 경로를 설명합니다.
  validation_and_limit_ko: 파일럿에서 가입자 위험분포, 가입률, 유지율, 환급비용, 청구빈도와 손해액을 기존 상품·비교군과 함께
    봐야 합니다.
  answer_boundaries_ko:
  - 안전 고객만 선택적으로 가입해 손해율이 자동 개선된다고 말하지 않습니다.
