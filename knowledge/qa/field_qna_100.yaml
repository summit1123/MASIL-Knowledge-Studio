- id: G33
  tier: GENERAL
  presentation_part: 2
  group: VALIDATION
  owner: 은서
  question_ko: Hold는 무엇이고 Favorable·Standard·Care와 어떻게 다른가요?
  question_en: What is Hold, and how is it different from Favorable, Standard, and
    Care?
  answer_ko_short: Hold는 위험등급이 아니라 데이터가 부족하거나 품질이 불안정해 그달을 신뢰성 있게 평가할 수 없는 상태입니다.
    불리한 점수를 추정하지 않고 연간 유효평균에서 제외하거나 기존 상품 기준으로 처리합니다.
  answer_en_short: Hold is not a risk tier. It means the data is insufficient or unreliable
    for a fair monthly assessment. We do not guess a negative score; the month is
    excluded or handled under the existing product rule.
  logic_ko:
  - 데이터 오류를 고객 위험으로 오인하지 않기 위한 보호장치입니다.
