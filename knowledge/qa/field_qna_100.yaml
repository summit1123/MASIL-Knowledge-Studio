  question_ko: 기존 시스템에 붙이려면 비용과 기간이 얼마나 드나요?
  question_en: How much time and cost would integration with an existing insurer system
    require?
  answer_ko_short: 현재는 정확한 비용을 확정할 단계가 아닙니다. 핵심 모듈은 기존 UBI·마일리지 채널 위에 붙일 수 있지만, 데이터
    동의·보안·직원 검토·고객 앱 연동 비용을 함께 산정해야 합니다. 파일럿에서 최소 기능과 운영비를 먼저 측정하겠습니다.
  answer_en_short: We cannot give a reliable cost yet. The scoring module can use
    existing mileage or UBI channels, but privacy, security, staff review, and app
    integration all need costing.
  logic_ko:
  - 가장 작은 파일럿은 데이터 수집·동의, 생활권·월 점수 계산, Reason Code, 직원 검토 화면, 고객 월 요약, 삭제·감사로그까지입니다.
    멋진 전체 앱보다 점수의 재현성, 직원 검토 가능성, 고객 이해와 데이터 통제가 먼저 검증돼야 합니다.
  validation_and_limit_ko: 비용은 초기 연동·개발비 + 월 데이터 저장·처리비 + 월 Care 건수×건당 검토비 + 보안·법무·고객지원비로
    나눕니다. 기간과 예산은 기존 텔레매틱스 API, 사용자 수, GPS 주기, 내부 시스템 연동 범위를 확인한 뒤 산정하며 현재 숫자를 임의로
    제시하지 않습니다.
  answer_boundaries_ko:
  - 현재 대시보드가 상용 시스템이라고 말하지 않습니다.
