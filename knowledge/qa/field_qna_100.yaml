  owner: 다현
  question_ko: 위험운전은 정확히 어떤 이벤트를 의미하나요?
  question_en: What events count as risky driving?
  answer_ko_short: 현재는 과속·급가속·급감속처럼 주행에서 관찰 가능한 이벤트를 사용합니다. 안과 밖에서 각각 주행거리로 보정한 발생률을
    계산하며, 실제 센서 임계값과 이벤트 품질은 실데이터 파일럿에서 검증해야 합니다.
  answer_en_short: We use observable events such as speeding, harsh acceleration,
    and harsh braking. Event rates are normalized by distance inside and outside the
    zone. Real sensor thresholds must be validated in a pilot.
  logic_ko:
  - 핵심 논리 위치는 행동을 해석하는 맥락이고, 점수를 움직이는 것은 과속·급가속·급감속 같은 실제 위험 이벤트입니다. 야간주행·신규 목적지·운전반경
    확대는 최근 패턴 변화를 설명하는 신호로 사용합니다. 현재 설계 안과 밖의 위험 이벤트를 각각 해당 구간 주행거리로 나눠 100km당 발생률로
    만듭니다. 밖으로 나간 횟수나 비중만으로는 안전점수를 깎지 않습니다.
  validation_and_limit_ko: In-Zone Safety = max(0, 100 - r_in×8), Out-Zone Safety
    = max(0, 100 - r_out×12)이며 r은 100km당 위험 이벤트 수입니다. r=2라면 안은 84점, 밖은 76점입니다. 8과
    12는 현재 상품 후보 계수이며 실제 사고·주행 데이터로 재보정해야 합니다.
  answer_boundaries_ko:
  - 초행 도로 사고 위험 2.5배를 계수 12의 직접 산식 근거라고 말하지 않습니다.
