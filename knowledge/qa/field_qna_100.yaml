- id: D15
  tier: DEEP
  presentation_part: 2
  group: VALIDATION
  owner: 공통
  question_ko: 합성 주행 데이터의 값과 행동패턴은 어떻게 만들었나요?
  question_en: How were the synthetic driving values and behavior patterns generated?
  answer_ko_short: 먼저 문헌과 공개 통계에서 고령 운전자의 이동 빈도·자기조절·야간·낯선 경로 같은 방향성을 정리했습니다. 그다음
    각 오류 모드를 시험할 수 있도록 여섯 가지 운전자 유형과 세 가지 환경을 설계하고, 재현 가능한 규칙으로 GPS·주행 이벤트를 생성했습니다.
    절대값은 설계값이며 실제 고객 분포를 대표한다고 주장하지 않습니다.
  answer_en_short: We used literature and public statistics to set realistic directions.
    We then designed six driver types and three environments to test different failure
    modes. The exact values are synthetic design parameters, not a real population
    sample.
  logic_ko:
  - 합성 데이터는 결론에 맞춰 임의의 점을 찍은 것이 아니라, 먼저 운전자 유형별 가설을 정하고 문헌에서 확인한 고령 운전자의 이동·자기조절 특성을
    방향성으로 사용해 월별 목적지, 주행거리, 야간·신규 경로, 위험 이벤트를 생성했습니다. 문헌은 방향을 뒷받침하고 개별 합성 숫자를 사실로
    보증하지는 않습니다.
  validation_and_limit_ko: 60명의 합성 운전자마다 2개월 기준선과 12개월 평가 구간을 만들고, 세 환경에서 총 180개 시나리오와
    80,032개 주행 로그를 생성했습니다. 파일럿에서는 실제 주행횟수·거리·야간비중·위험 이벤트 분포와 합성 분포를 비교하고 차이가 크면 생성
    파라미터를 다시 맞춥니다.
  answer_boundaries_ko:
  - 문헌이 합성 데이터의 모든 확률값을 검증했다고 말하지 않습니다.
