    and retain safer, more stable drivers. This may improve the risk mix, but the
    effect must be tested in a pilot. 고객 유치와 손해율 개선을 단정하지 않고, 우대가 가입·유지와 위험구성에 미치는
    경로를 설명합니다.
- id: G54
  tier: GENERAL
  group: VALUE
  order: 70.4
  question_ko: MASIL이 고객 유지율을 높일 수 있다고 보는 이유는 무엇인가요?
  answer_ko_short: MASIL은 연말 환급만 제공하는 것이 아니라 월별 피드백, 안전운전 우대, 선택 가능한 Care라는 지속적인 접점을
    만듭니다. 고객이 자신의 운전 변화를 이해하고 혜택을 체감하면 상품을 계속 사용할 이유가 생길 수 있습니다.
  answer_en_short: MASIL creates regular contact through monthly feedback, rewards,
    and optional Care. Customers may stay when they understand their driving and see
    continuing value. Retention improvement is still a pilot hypothesis.
  logic_ko:
  - 유지율의 논리는 접점과 교환가치이며, 현재 성과가 아니라 검증할 사업가설입니다.
  validation_and_limit_ko: 가입 후 이용률, 월 리포트 확인률, Care 이용률, 갱신률, 중도이탈과 철회사유를 비교해야 합니다.
  answer_boundaries_ko:
  - 유지율 상승 수치를 확정 성과처럼 제시하지 않습니다.
