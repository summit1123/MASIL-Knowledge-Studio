  question_ko: 왜 Favorable이 9개월 이상이면 +3%p 추가우대를 주나요?
  question_en: Why does nine or more Favorable months add a candidate 3-percentage-point
    benefit?
  answer_ko_short: 3%p는 현재 시뮬레이션에 구현된 후보 보너스입니다. 안전운전에 체감 가능한 인센티브를 주는 경제성 예시이지, 실제
    시장 데이터로 확정된 요율은 아닙니다. 파일럿에서 손해율과 가입 반응을 보고 재보정합니다.
  answer_en_short: Three percentage points is the current simulation candidate. It
    is not a final tariff. We will recalibrate it using loss results and customer
    response in the pilot.
  logic_ko:
  - 기본 환급은 연간 통합점수에 따라 정하고, Favorable은 월 통합점수 75점 이상이면서 Care 동시변화 조건이 없는 달입니다. 이러한
