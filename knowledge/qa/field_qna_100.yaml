- id: C10
  tier: CORE
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 팀 공통
  question_ko: 왜 Mileage / In-Zone Safety / Out-Zone Safety / Pattern Change 네 가지를
    함께 보나요?
  question_en: Why do you combine Mileage, In-Zone Safety, Out-of-Zone Safety, and
    Pattern Change?
  answer_ko_short: 네 지표는 운전 노출량, 익숙한 곳의 안전행동, 생활권 밖의 안전행동, 자신의 평소 대비 변화를 각각 보여줍니다.
    주행거리 하나만 보면 놓칠 수 있는 행동과 맥락을 함께 보기 위해 네 축을 결합합니다. 현재 30/30/20/20은 969개 가중치 조합의
    민감도 분석에서 안정성을 확인한 초기 후보이며, 최종 판매요율은 아닙니다. 실제 데이터가 들어오면 가중치와 환급구조를 다시 보정합니다.
  answer_en_short: The four scores cover exposure, safety inside the zone, safety
    outside the zone, and change from the driver’s usual pattern. Together, they show
    more than mileage alone. The current 30/30/20/20 weights are stable starting candidates,
    not final tariff weights.
  logic_ko:
  - 네 축은 노출량·안쪽 행동·바깥 행동·시간에 따른 변화를 서로 보완합니다. 한 조합만 믿지 않기 위해 가중치 969개 조합을 다시 계산하고,
    기준 조합 대비 월 판정 변화율·운전자별 점수 순위·경계 사례의 이동을 확인했습니다. 30/30/20/20은 결과가 급격히 뒤집히지 않는 안정
