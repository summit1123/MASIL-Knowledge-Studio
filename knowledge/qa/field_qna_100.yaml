- id: D01
  tier: DEEP
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 공통
  question_ko: 30/30/20/20이나 임계값이 바뀌면 결과가 얼마나 흔들리나요?
  question_en: How sensitive are the results to the 30/30/20/20 weights and thresholds?
  answer_ko_short: 그래서 여러 가중치 조합을 다시 계산해 결과가 급변하지 않는 안정 구간을 확인했습니다. 다만 이것은 현재 합성 시나리오
    안에서의 민감도입니다. 실제 손해율에 대한 최적값을 증명한 것은 아닙니다.
  answer_en_short: We tested many weight combinations to find a stable region where
    classifications do not change sharply. This is sensitivity testing on synthetic
    scenarios, not proof of an optimal real-world tariff.
  logic_ko:
  - 30/30/20/20과 안전점수 계수는 자연법칙이 아니라 현재의 시작값입니다. 그래서 한 조합만 보여주지 않고 가중치와 임계값을 흔들었을 때
    결과가 얼마나 바뀌는지 민감도 분석을 했습니다. 목표는 절대 불변이 아니라 작은 변화에 분류가 급격히 뒤집히지 않는 안정 구간을 찾는 것입니다.
  validation_and_limit_ko: 가중치 969개 조합을 다시 계산해 기준 조합 대비 월 결과 변화율, 운전자별 점수 순위 변화, 경계
    사례의 이동을 확인합니다. 30/30/20/20은 안정 구간의 후보 중심값이며 실제 사고·손해 데이터로 다시 보정해야 합니다.
  answer_boundaries_ko:
  - 969가 실제 고객 검증 건수라고 말하지 않습니다.
