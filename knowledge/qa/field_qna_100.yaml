- id: C04
  tier: CORE
  presentation_part: 1
  group: DIFFERENCE
  owner: 팀 공통
  question_ko: 기존 Pay-As-You-Drive와 UBI로는 왜 충분하지 않은가요?
  question_en: Why are Pay-As-You-Drive and UBI not enough?
  answer_ko_short: Pay-As-You-Drive는 주로 얼마나 운전했는지를 보고, UBI는 급가속·급감속처럼 어떻게 운전했는지를 봅니다.
    MASIL은 여기에 어디가 그 사람의 익숙한 생활권인지, 그리고 최근 운전이 자신의 평소와 어떻게 달라졌는지를 더합니다. 따라서 주행거리가
    비슷한 고객도 개인 맥락과 행동 변화에 따라 다르게 설명할 수 있습니다.
  answer_en_short: Pay-As-You-Drive looks mainly at how much a person drives. UBI
    looks at how the person drives. MASIL also adds familiar context and changes from
    the driver’s own usual pattern. This helps distinguish different risks even when
    mileage is similar.
  logic_ko:
  - PAYD의 HOW MUCH와 UBI의 HOW에 WHERE와 CHANGE FROM OWN USUAL을 더하는 구조입니다. 기존 상품을 폐기하는
    것이 아니라 기존 마일리지 특약 위에 개인 맥락을 얹습니다.
  validation_and_limit_ko: MASIL이 기존 PAYD·UBI를 완전히 대체한다고 말하지 않습니다.
  answer_boundaries_ko:
  - MASIL이 기존 PAYD·UBI를 완전히 대체한다고 말하지 않습니다.
