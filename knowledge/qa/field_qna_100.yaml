- id: D23
  tier: DEEP
  presentation_part: 3
  group: VALIDATION
  owner: 공통
  question_ko: 고객이 동의를 철회하거나 데이터를 삭제해 달라고 하면요?
  question_en: What happens if a customer withdraws consent or asks for deletion?
  answer_ko_short: 새로운 수집을 중단하고, 더 이상 필요한 목적이나 법정 보존 근거가 없는 원본과 파생 데이터를 삭제하는 절차가 필요합니다.
    법정 확인자료가 남아야 한다면 그 범위와 기간을 별도로 설명해야 합니다.
  answer_en_short: We stop new collection and delete data that no longer has a valid
    purpose or legal retention basis. Any required legal record must be separated
    and explained.
  logic_ko:
  - 고객이 동의를 철회하면 신규 위치 수집을 중단하고, 보유 목적이 끝난 원본과 파생값을 삭제 절차로 보냅니다. 법적으로 보존해야 하는 계약기록은
    서비스 데이터와 분리해 접근을 제한합니다. 이후 MASIL 판정이 불가능한 달은 불리하게 추정하지 않고 Hold 또는 기존 상품 처리로 전환합니다.
  validation_and_limit_ko: 운영 검증에서는 철회 요청 접수부터 수집 중단·삭제 완료까지 걸린 시간, 삭제 실패 건수, 백업 반영
    시간, 철회 이후 신규 수집 0건을 측정합니다. 정확한 SLA와 계약상 환급 처리 규칙은 파일럿 약관에서 확정합니다.
  answer_boundaries_ko:
  - 철회 시 불이익을 주는 구조로 설명하지 않습니다.
