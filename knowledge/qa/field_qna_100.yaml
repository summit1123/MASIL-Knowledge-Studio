- id: C03
  tier: CORE
  presentation_part: 1
  group: PROBLEM
  owner: 팀 공통
  question_ko: 왜 이 문제에 보험사가 개입해야 하나요? 규제나 면허제도로 해결하면 안 되나요?
  question_en: Why should an insurer address this issue instead of regulation or licensing?
  answer_ko_short: 면허제도와 규제는 운전 가능 여부를 판단하지만, 정기 점검 사이의 일상적인 변화를 계속 반영하기는 어렵습니다. 보험은
    이미 활용하는 주행 데이터를 바탕으로 안전운전은 우대하고, 의미 있는 변화가 보이면 사고 전에 예방지원을 연결할 수 있습니다. MASIL은
    규제를 대신하는 것이 아니라, 규제와 일상 운전 사이의 빈틈을 자발적인 보험 서비스로 보완합니다.
  answer_en_short: Regulation decides whether a person may drive, but it cannot continuously
    reflect everyday changes between checks. Insurance can reward safer driving and
    connect meaningful changes to support before an accident. MASIL complements regulation;
    it does not replace it.
  logic_ko:
  - 규제는 운전 허용 여부를 다루고, 보험은 점검 사이의 안전행동을 우대하고 변화가 보일 때 지원을 연결합니다. 둘은 대체관계가 아니라 역할이
    다른 보완관계입니다.
  validation_and_limit_ko: MASIL이 면허 판단·의료 판단을 대신한다고 말하지 않습니다.
  answer_boundaries_ko:
  - MASIL이 면허 판단·의료 판단을 대신한다고 말하지 않습니다.
