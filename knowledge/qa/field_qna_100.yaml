- id: C07
  tier: CORE
  presentation_part: 1
  group: MASIL_LOGIC
  owner: 팀 공통
  question_ko: MASIL Zone은 정확히 무엇이고 어떻게 만드나요?
  question_en: What exactly is a MASIL Zone, and how is it created?
  answer_ko_short: MASIL Zone은 각 운전자의 반복 방문으로 만들어지는 개인별 익숙한 활동영역입니다. 현재 설계에서는 이전 2개월
    동안 서로 다른 3일 이상 방문한 가까운 목적지를 DBSCAN으로 묶어 반복 거점을 찾습니다. 그다음 실제 방문거리의 P90을 반영해 거점마다
    개인화된 범위를 만들고, 이를 한 사람의 MASIL Zone으로 구성합니다.
  answer_en_short: A MASIL Zone is a personal familiar activity area built from repeated
    visits. DBSCAN finds nearby destinations visited on at least three different days.
    P90 then creates a personal range around each repeated destination.
  logic_ko:
  - 현장에서는 ‘반복 방문으로 만든 개인별 익숙한 활동영역’이라고 먼저 답합니다. 더 물으면 서로 다른 3일, DBSCAN, 여러 거점, P90
    개인 반경 순으로 Appendix B를 설명합니다.
  validation_and_limit_ko: 집 하나를 중심으로 한 고정 원이나 행정구역이라고 설명하지 않습니다.
  answer_boundaries_ko:
  - 집 하나를 중심으로 한 고정 원이나 행정구역이라고 설명하지 않습니다.
