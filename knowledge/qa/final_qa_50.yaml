  status: active
  theme: T2
  rank: A
  question_ko: 위험운전은 무엇으로 정의하고, 생활권 안팎 점수는 어떻게 계산하나요?
  short_answer_ko: 위험운전은 과속·급가속·급감속처럼 실제 주행에서 관찰되는 이벤트로 봅니다. 단순 건수가 아니라 생활권 안과 밖에서 각각 100km당 발생률을 계산하고, 밖에서 발생한 위험행동에는 더 민감한
    후보 계수를 적용합니다.
  short_answer_en: Risky driving means observable events such as speeding, harsh acceleration, and harsh braking. We calculate
    events per 100 kilometers inside and outside the zone. Risky behavior outside the zone uses a more sensitive candidate
    factor.
  why_this_answer: ‘생활권 밖이라서 감점한다’는 오해를 막고, 실제 행동을 거리로 보정해 비교한다는 계산 논리를 보여줍니다.
  product_logic: '핵심 논리

    위치는 행동을 해석하는 맥락이고, 점수를 움직이는 것은 과속·급가속·급감속 같은 실제 위험 이벤트입니다. 야간주행·신규 목적지·운전반경 확대는 최근 패턴 변화를 설명하는 신호로 사용합니다.


    현재 설계

    안과 밖의 위험 이벤트를 각각 해당 구간 주행거리로 나눠 100km당 발생률로 만듭니다. 밖으로 나간 횟수나 비중만으로는 안전점수를 깎지 않습니다.'
  calculation_or_validation: In-Zone Safety = max(0, 100 - r_in×8), Out-Zone Safety = max(0, 100 - r_out×12)이며 r은 100km당 위험
    이벤트 수입니다. r=2라면 안은 84점, 밖은 76점입니다. 8과 12는 현재 상품 후보 계수이며 실제 사고·주행 데이터로 재보정해야 합니다.
  follow_up: ‘같은 급감속인데 왜 생활권 밖에서 더 크게 보나요?’ → 낯선 환경에서는 판단 부담이 커질 수 있어 밖에서 발생한 실제 위험행동을 더 민감하게 봅니다. 다만 위치 자체에는 벌점을 주지 않고, 8과
    12는 파일럿에서 다시 보정합니다.
  answer_boundary: 초행 도로 사고 위험 2.5배를 계수 12의 직접 산식 근거라고 말하지 않습니다.
  presentation_source: Summary 1 · Appendix C · 안전점수 후보식
  priority: A
