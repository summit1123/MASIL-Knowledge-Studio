- id: T3-09
  status: active
  theme: T3
  rank: B
  question_ko: 고객이 점수를 높이려고 시스템을 조작할 수 있지 않나요?
  short_answer_ko: 가능성을 전제로 설계해야 합니다. 한 번의 짧은 주행이나 특정 위치 방문만으로 유리해지지 않도록 서로 다른 날의 반복 방문, 100km 기준 위험률, 월별 누적을 사용합니다. 파일럿에서는
    GPS 위변조와 선택적 운행 같은 게이밍을 별도 탐지해야 합니다.
  short_answer_en: We assume gaming is possible. Repeated visit days, distance-normalized risk rates, and monthly aggregation
    make simple manipulation harder. GPS spoofing still needs pilot controls.
  why_this_answer: ‘조작 불가능’이라고 방어하지 않고 현재 방어와 남은 통제를 구분합니다.
  product_logic: 조작은 한 가지 탐지기로 해결하지 않고 입력·행동·운영의 세 층으로 막습니다. anchor는 같은 날 여러 번 찍어도 인정하지 않고 서로 다른 3일 이상 반복돼야 합니다. POI 이름은 점수
    입력이 아니며, 주행의 시간·거리·속도 일관성, 비현실적 GPS 점프, 센서 연속성을 검사합니다. 기기·차량·운전자 연결 규칙은 파일럿 운영계약으로 확정해야 합니다.
  calculation_or_validation: 파일럿에서는 정상 주행과 의도적으로 주입한 조작 사례를 섞어 탐지율=탐지한 조작 건수÷전체 주입 조작 건수, 오탐률=정상인데 경고한 건수÷전체 정상 건수로 측정합니다.
    직원 판정과 시스템 경고의 일치율, 검토시간도 함께 봅니다. 현재 게이밍 탐지 정확도를 보유한 것처럼 말하지 않고, 무엇을 어떻게 검증할지까지 답합니다.
  follow_up: ‘가족이 대신 운전하면 어떻게 구분하나요?’ → 현재 합성 검증만으로는 해결되지 않습니다. 실제 파일럿에서 기기·차량·운전자 연결, 차량 공유 신고와 예외 검토 규칙을 데이터 계약에 포함해야 합니다.
  answer_boundary: 현재 시스템이 모든 GPS 위변조를 차단한다고 말하지 않습니다.
  presentation_source: Appendix B · 파일럿 검증 항목
  priority: B
- id: T3-10
  status: active
  theme: T3
  rank: A
  question_ko: 실제 주행에서는 과속·급가속·급감속을 어떻게 판정하고 데이터 품질을 믿나요?
  short_answer_ko: 현재 합성 데이터에서는 운전자 유형별 위험률에 따라 이벤트를 만들고 과속·급가속·급감속으로 표시합니다. 실제 파일럿에서는 eTAS 기준과 차량·텔레매틱스 센서 기준을 맞추고, 결측·오탐·장치별
    차이를 먼저 검증해야 합니다.
  short_answer_en: In the synthetic data, event counts come from each driver profile and are shown as speeding, harsh acceleration,
    and harsh braking. A real pilot must align sensor thresholds with eTAS and test missing data, false events, and device
    differences.
  why_this_answer: 합성 이벤트 표시와 실제 센서 판정이 이미 같은 수준으로 검증됐다는 오해를 막고, 실데이터 전환 절차를 설명합니다.
  product_logic: '핵심 논리

    현재 검증의 목적은 이벤트 탐지기 정확도를 입증하는 것이 아니라 위험 이벤트가 주어졌을 때 MASIL 상품 규칙이 의도대로 작동하는지 확인하는 것입니다. 실제 상용화에는 센서 단계의 별도 검증이 선행돼야 합니다.


    현재 설계

    합성 로그는 유형별 risk rate로 이벤트 수를 만들고 과속·급가속·급감속 유형을 표시합니다. 실제 데이터에서는 eTAS 임계값, 차량 제조사·텔레매틱스 정의, GPS·가속도 센서 품질을 동일한 이벤트 계약으로
    맞춥니다.'
  calculation_or_validation: 파일럿 지표는 센서별 이벤트 발생률, 결측 주행 비율, 동일 주행의 장치 간 일치율, 수동 검토 대비 오탐·미탐, 100km당 이벤트 분포입니다. 센서 계약이 안정된
    뒤에만 안 8·밖 12 후보식과 월 점수를 재보정합니다.
  follow_up: ‘그럼 지금 80,032개 로그의 위험 이벤트는 실제 eTAS 탐지 결과가 아닌가요?’ → 맞습니다. 합성 프로필에서 결정론적으로 생성한 상품검증 입력입니다. eTAS는 이벤트 의미와 실데이터 임계값을
    맞추기 위한 기준이며 실제 탐지 성능은 파일럿에서 검증합니다.
  answer_boundary: 합성 이벤트를 실제 차량 센서에서 검출한 데이터나 eTAS 정확도 검증 결과로 설명하지 않습니다.
  presentation_source: Appendix D · eTAS · 합성 이벤트 생성 경계
  priority: A
- id: T4-01
  status: active
  theme: T4
  rank: A
  question_ko: 생활권을 만들기 위해 꼭 원본 GPS가 필요한가요?
  short_answer_ko: 개인별 반복 목적지와 안팎 주행을 구분하려면 위치 정보가 필요합니다. 다만 전체 이동경로를 무기한 보관할 필요는 없습니다. MASIL은 생활권 생성에 필요한 최소 데이터와 기간만 사용하고
    이후에는 점수와 월별 근거를 중심으로 남기는 구조입니다.
  short_answer_en: Location data is needed to find repeated destinations and separate in-zone and out-zone driving. We use
    it only for the minimum purpose and period, then keep minimized monthly evidence.
  why_this_answer: 필요성을 인정하면서 최소수집 원칙을 바로 붙입니다.
  product_logic: 생활권을 처음 만들 때는 출발·도착 위치와 반복 방문일을 구분할 수 있는 위치 데이터가 필요합니다. 그러나 보험사 모든 부서가 전체 이동경로를 볼 필요는 없습니다. 수집 단계에서 생활권·안팎
    여부·월 집계로 변환하고 원본 접근과 파생값 이용을 분리하는 것이 핵심입니다.
  calculation_or_validation: 최소 입력은 익명화된 운전자·주행 ID, 시간, 출발·도착 좌표, 주행거리, 위험 이벤트와 필요한 경우 경로의 안팎 구간입니다. 파일럿에서는 전체 초단위 경로 없이도
    점수가 유지되는지 비교해 좌표 샘플링 주기와 필수 필드를 줄입니다. 원본을 덜 썼을 때 점수 차이와 생활권 생성 실패율을 측정합니다.
  follow_up: ‘출발지와 전체 이동 궤적까지 꼭 필요한가요?’ → 초기 생활권과 안팎 구간 계산에는 위치정보가 필요하지만 전체 궤적을 장기 보관할 필요는 없습니다. 파일럿에서 도착지·구간 요약만으로 같은 결과가
    유지되는지 비교해 필드를 줄입니다.
  answer_boundary: GPS를 전혀 저장하지 않는다고 말하지 않습니다.
  presentation_source: Summary 2 Core Principle · Appendix B
  priority: A
- id: T4-02
  status: active
  theme: T4
  rank: S
  question_ko: 실제 GPS 주행데이터를 어떻게 확보하고, 고객 동의와 법적 문제는 어떻게 해결할 건가요?
  short_answer_ko: 현재 검증 데이터는 전부 합성입니다. 실제 데이터는 보험사·텔레매틱스 파트너의 기존 동의 채널을 활용하거나, 자발적으로 참여한 파일럿 고객에게 목적과 항목을 명확히 알리고 별도 동의를
    받아 확보해야 합니다. 아직 데이터 제휴가 확정된 것은 아니며, 적법한 데이터 확보가 파일럿의 첫 번째 조건입니다.
  short_answer_en: Our current data is fully synthetic. Real GPS data would require an insurer or telematics partnership,
    or an opt-in pilot with clear customer consent. Data access is not secured yet. It is the first requirement for the pilot.
  why_this_answer: 확보 경로가 이미 정해진 것처럼 말하지 않고, 가능한 경로·동의 원칙·현재 미확정 상태를 한 번에 설명합니다. 실무자가 실제로 확인하려는 것은 보관개월보다 먼저 ‘데이터를 적법하게 얻을
    수 있는가’입니다.
  product_logic: 현재 실제 고객 GPS를 확보한 상태는 아닙니다. 보험사 텔레매틱스 채널이나 동의 기반 파일럿 앱을 통해 목적·항목·보유기간·제공대상을 분리 고지하고 자발적으로 수집해야 합니다. 원본은 생활권
    계산을 위한 짧은 rolling 구간에만 두고 이후에는 필요한 파생·월 집계만 남기는 방향입니다.
  calculation_or_validation: 현재 설계 후보는 직전 2개월 원본을 rolling 처리하는 것입니다. 파일럿 계약 전에는 가입 동의율, 수집 성공률, GPS 결측률, 동의 철회율을 측정하고 법무 검토로
    정확한 보관·파기 기간을 확정합니다. 실제 데이터 확보 전 단계이므로 이미 제휴나 동의를 확보했다고 말하지 않습니다.
  follow_up: ‘보험사가 원본 GPS를 실제로 받을 수 있나요?’ · ‘고객이 동의하지 않으면요?’ · ‘원본은 정확히 언제 지우나요?’ · ‘파생점수는 얼마나 보관하나요?’ → T4-03·T4-05·T4-06으로
    연결
  answer_boundary: 실제 GPS 제휴가 이미 확보됐거나 법무 검토가 끝났다고 말하지 않습니다. 기존 UBI 채널이 반드시 원본 좌표를 보험사에 제공한다고도 단정하지 않습니다.
  presentation_source: Summary 2 Data & Standards · 위치정보법 제23조·시행령 · 파일럿 데이터 계획
  priority: top10
- id: T4-03
  status: active
  theme: T4
  rank: A
  question_ko: 원본을 지워도 파생점수와 월별 근거를 몇 년씩 보관하면 똑같은 것 아닌가요?
  short_answer_ko: 파생값이라고 자동으로 규제 대상에서 벗어나는 것은 아닙니다. 개인과 연결할 수 있다면 개인정보일 수 있으므로 목적·접근권한·보유기간·삭제 절차가 필요합니다. 보험 분쟁 시효가 3년이라는
    사실도 모든 데이터를 자동으로 3년 보관할 근거는 아닙니다.
  short_answer_en: Derived data is not automatically anonymous. If it can still be linked to a person, it needs a clear purpose,
    access control, retention period, and deletion process.
  why_this_answer: 파생 데이터의 위험을 축소하지 않아 실무자의 법무·보안 질문에 신뢰를 줍니다.
  product_logic: 파생값도 개인과 연결돼 있으면 개인정보가 될 수 있으므로 무기한 보관할 수 없습니다. 원본 GPS, 생활권 파생값, 월 점수·Reason Code, 보험계약 기록을 서로 다른 데이터 등급으로
    나누고 각각의 목적과 법적 근거에 맞는 보유·삭제표를 운영해야 합니다.
  calculation_or_validation: 원본은 목적 달성 즉시 파기가 원칙이고, 별도 동의가 있는 개인위치정보 보유도 법률상 최대 1년이라는 상한을 기본 보관기간처럼 사용하지 않습니다. 계약·분쟁 근거값은
    보험 관련 시효를 고려해 별도 기간을 정할 수 있지만 ‘모든 파생값 3년’으로 일괄 적용하지 않고 법무 검토 후 필드별 기간을 확정합니다.
  follow_up: ‘그럼 정확히 어떤 데이터를 몇 년 남기나요?’ → 원본 GPS와 파생값을 구분해야 합니다. 원본은 짧게 처리하고, 계약·분쟁에 필요한 월 점수·Reason Code도 필요한 최소 필드와 법적 근거별
    기간을 법무 검토 후 정합니다.
  answer_boundary: 파생값은 개인위치정보가 아니므로 자유롭게 보관 가능하다고 말하지 않습니다.
  presentation_source: 위치정보법 · 개인정보보호 원칙 · 상법 제662조
  priority: A
- id: T4-04
  status: active
  theme: T4
  rank: S
  question_ko: 가족에게 운전정보를 공유하면 사실상 위치감시 아닌가요?
  short_answer_ko: 가족 공유는 운전자의 선택과 동의를 전제로 하며, 실시간 위치를 기본 제공하지 않습니다. 필요한 경우에도 ‘이번 달 변화가 있었다’ 같은 안전 요약만 공유하고, 원본 경로나 목적지 이름은
    제공하지 않는 방향입니다.
  short_answer_en: Family sharing is optional and requires the driver's consent. Real-time location is not shared by default.
    We share only a limited safety summary when needed.
  why_this_answer: 가족 가치와 고령 운전자의 자율성·사생활을 함께 지킵니다.
  product_logic: 가족 공유는 기본 기능이 아니라 운전자가 선택하는 지원 기능입니다. 기본 공유 범위는 월 점수, 변화 여부, 지원 신청 상태처럼 안전에 필요한 요약정보이고 실시간 위치, 상세 경로, POI
    이름은 포함하지 않습니다. 누구에게 무엇을 언제까지 공유할지 운전자가 직접 정하고 철회할 수 있어야 합니다.
  calculation_or_validation: 파일럿에서는 공유 동의율, 공유 범위별 선택률, 철회율, 가족·운전자 만족도와 불편 신고를 봅니다. 제품 화면은 실시간 좌표 0개, POI 이름 0개를 기본 원칙으로
    검증하고, 예외 공유는 별도의 명시적 동의가 없으면 열지 않습니다.
  follow_up: ‘가족이 운전자에게 공유를 강요하면 어떻게 하나요?’ → 운전자 본인의 별도 동의와 철회가 전제입니다. 가족이 대신 동의하지 못하게 하고 공유 범위·대상·기간을 운전자가 직접 확인하는 절차가 필요합니다.
  answer_boundary: 가족에게 자동 알림 또는 실시간 위치를 기본 공유한다고 말하지 않습니다.
  presentation_source: Summary 2 Family value · Customer app
  priority: S
- id: T4-05
  status: active
  theme: T4
  rank: A
  question_ko: 보험사 인수나 손해사정 부서가 원본 위치를 요구하면 어떻게 하나요?
  short_answer_ko: MASIL의 발표 기준은 예방지원과 할인 설명에 필요한 점수·안팎 비중·Reason Codes만 역할별로 제공하는 것입니다. 원본 위치를 인수나 손해사정에 확대 사용하는 것은 별도의 목적과
    법적 근거·동의·거버넌스 없이는 허용하지 않는 방향입니다.
  short_answer_en: Staff receive only the scores and evidence needed for their role. Using raw location for underwriting or
    claims would require a separate legal basis, consent, and governance.
  why_this_answer: 보험사 내부 편의를 이유로 목적 제한이 무너지는 상황을 명확히 차단합니다.
  product_logic: 원본 위치는 점수 계산 운영자와 제한된 데이터 처리 영역에만 두고, 인수·손해사정에는 필요한 월 점수와 Reason Code만 제공합니다. 다른 목적으로 원본을 쓰려면 기존 동의의 범위를
    넓혀 해석하지 않고 별도 법적 근거, 동의, 권한승인과 감사기록이 필요합니다.
  calculation_or_validation: 권한표에서 역할별 조회 필드를 정의하고 원본 GPS 접근자는 최소 인원으로 제한합니다. 파일럿에서는 역할 외 접근 시도 차단률, 승인 없는 원본 조회 0건, 모든 조회의
    감사로그 생성률 100%를 운영 목표로 두며 실제 수치는 보안테스트 후 보고합니다.
  follow_up: ‘사고 조사에 원본 위치가 꼭 필요하면 어떻게 하나요?’ → MASIL의 기본 동의를 다른 목적으로 확대하지 않습니다. 별도의 법적 근거와 적법한 절차가 확인된 경우에만 최소 범위를 제공하고 모든
    접근을 기록해야 합니다.
  answer_boundary: 보험사라면 어떤 목적으로도 내부 활용 가능하다고 말하지 않습니다.
  presentation_source: Summary 2 Right separation · privacy design
  priority: A
- id: T4-06
  status: active
  theme: T4
  rank: A
  question_ko: 고객이 동의를 철회하거나 데이터를 삭제해 달라고 하면요?
  short_answer_ko: 새로운 수집을 중단하고, 더 이상 필요한 목적이나 법정 보존 근거가 없는 원본과 파생 데이터를 삭제하는 절차가 필요합니다. 법정 확인자료가 남아야 한다면 그 범위와 기간을 별도로 설명해야
    합니다.
  short_answer_en: We stop new collection and delete data that no longer has a valid purpose or legal retention basis. Any
    required legal record must be separated and explained.
  why_this_answer: 삭제권을 무조건 즉시 전부 삭제와 혼동하지 않고 법정 보존자료와 분리합니다.
  product_logic: 고객이 동의를 철회하면 신규 위치 수집을 중단하고, 보유 목적이 끝난 원본과 파생값을 삭제 절차로 보냅니다. 법적으로 보존해야 하는 계약기록은 서비스 데이터와 분리해 접근을 제한합니다. 이후
    MASIL 판정이 불가능한 달은 불리하게 추정하지 않고 Hold 또는 기존 상품 처리로 전환합니다.
  calculation_or_validation: 운영 검증에서는 철회 요청 접수부터 수집 중단·삭제 완료까지 걸린 시간, 삭제 실패 건수, 백업 반영 시간, 철회 이후 신규 수집 0건을 측정합니다. 정확한 SLA와
    계약상 할인 처리 규칙은 파일럿 약관에서 확정합니다.
  follow_up: ‘삭제하면 기존 할인은 어떻게 되나요?’ → 이후 MASIL 계산에 필요한 데이터가 부족하면 Hold 또는 기존 상품 기준으로 전환합니다. 이미 적용된 계약 기록은 법적 보존 근거가 있는 최소 항목만
    서비스 데이터와 분리합니다.
  answer_boundary: 철회 시 불이익을 주는 구조로 설명하지 않습니다.
  presentation_source: 위치정보주체 권리 · pilot governance
  priority: A
- id: T4-07
  status: active
  theme: T4
  rank: A
  question_ko: GPS가 유출되면 피해가 큰데 보안대책은 무엇인가요?
  short_answer_ko: 가장 중요한 대책은 덜 모으고 빨리 지우는 것입니다. 원본과 파생 데이터를 분리하고 암호화·권한분리·접근기록을 적용하며, 고객·가족·직원 화면에는 필요한 최소 정보만 보여주는 구조가 필요합니다.
  short_answer_en: The first security control is data minimization. We separate raw and derived data, encrypt it, limit access,
    and keep audit logs.
  why_this_answer: 막연한 ‘보안 강화’보다 피해면적을 줄이는 설계 원칙을 제시합니다.
  product_logic: 보안의 첫 단계는 유출될 데이터를 줄이는 것입니다. 원본과 파생 데이터를 분리하고 전송·저장 암호화, 키 분리, 최소권한, 접근로그, 짧은 원본 보관, POI 마스킹을 적용합니다. 고객·가족·직원
    화면도 각 역할에 필요한 최소 정보만 표시합니다.
  calculation_or_validation: 검증 항목은 암호화 적용률, 권한 밖 접근 차단률, 감사로그 누락률, 키 회전, 삭제 SLA, 모의침투 취약점과 사고대응 훈련 시간입니다. 인증이나 침투시험을 아직 완료하지
    않았으므로 ‘안전하다’고 단정하지 않고 출시 게이트로 관리합니다.
  follow_up: ‘누가 관리자 권한을 갖나요?’ → 원본 위치 처리 담당자와 점수·검토 담당자를 분리하고 최소 인원만 권한을 갖게 합니다. 역할별 승인자·접근필드·감사주기는 파일럿 운영계약에서 확정합니다.
  answer_boundary: 완벽한 익명화·유출 불가능을 주장하지 않습니다.
  presentation_source: Summary 2 Minimum collection · security design
  priority: A
- id: T4-08
  status: active
  theme: T4
  rank: A
  question_ko: 운전 패턴 변화로 치매나 건강문제를 추정하는 것 아닌가요?
  short_answer_ko: 아닙니다. MASIL은 질병을 진단하거나 건강상태를 추정하지 않습니다. 최근 운전 패턴과 위험행동이 평소와 달라졌다는 사실만 보여주고, 필요한 경우 사람이 지원 안내를 검토합니다.
  short_answer_en: No. MASIL does not diagnose disease or infer a medical condition. It only shows that driving behavior changed
    from the person's usual pattern.
  why_this_answer: Chen 문헌의 ‘운전패턴 변화가 먼저 나타날 수 있음’을 진단 주장으로 확대하지 않습니다.
  product_logic: MASIL은 질병·인지상태를 진단하지 않습니다. 건강정보는 점수 입력에 넣지 않고, 최근 운전과 위험행동이 개인의 평소와 달라졌다는 사실만 보여줍니다. Care는 의료판정이 아니라 선택 가능한
    지원을 안내하기 전에 직원이 운전 맥락을 확인하는 월별 신호입니다.
  calculation_or_validation: 질병 라벨을 학습하거나 예측하지 않으므로 민감도·특이도 같은 의료 정확도 수치는 없습니다. 파일럿에서는 Care 신호 중 실제 이동 변화나 차량·GPS 오류로 설명된
    비율, 고객이 지원을 원한 비율을 측정합니다. 이를 치매 조기진단 정확도로 바꾸어 말하지 않습니다.
  follow_up: ‘고객 앱에 건강검진 추천이 있으면 진단 기능 아닌가요?’ → 아닙니다. 운전 변화가 확인된 고객이 선택할 수 있는 일반 지원 메뉴이며 MASIL이 질병 가능성을 계산하거나 의료판정을 내리는 것은
    아닙니다.
  answer_boundary: early dementia detection이라고 말하지 않습니다.
  presentation_source: Appendix A Chen 2025 · Care 적용 범위
  priority: A
- id: T4-09
  status: active
  theme: T4
  rank: A
  question_ko: 농촌이나 장거리 운전자는 생활권 밖 비중이 높아 불리하지 않나요?
  short_answer_ko: 생활권 밖 비중 자체는 벌점이 아닙니다. 각자의 반복 방문으로 생활권을 만들고 실제 위험행동을 거리 기준으로 보정하기 때문에 활동반경이 넓다는 이유만으로 불리하게 설계하지 않습니다. 다만
    지역별 결과 격차는 실제 파일럿에서 검증해야 합니다.
  short_answer_en: A wider activity range is not a penalty. Each driver has a personal zone, and risky events are normalized
    by distance. Regional fairness still needs real pilot testing.
  why_this_answer: 개인화 원리와 공정성 검증의 미완료 경계를 함께 답합니다.
  product_logic: 농촌·장거리 운전자는 활동반경이 넓을 수 있으므로 밖 비중 자체를 감점하지 않습니다. 생활권은 개인 방문으로 만들고 안팎 위험행동은 각각 주행거리로 보정합니다. 그래도 GPS 밀도와 도로환경
    차이가 결과에 영향을 줄 수 있으므로 지역별 공정성은 실데이터로 별도 확인해야 합니다.
  calculation_or_validation: 지역별로 생활권 생성률, Hold 비율, 평균 안팎 점수, Favorable·Care 비율, 평균 할인과 직원 검토 불일치를 비교합니다. 주행거리·운전시간을 맞춘 뒤에도
    격차가 남는지 보고, 남으면 ε·반경·센서 품질 또는 위험 이벤트 정의를 재보정합니다.
  follow_up: ‘도시와 농촌에 같은 260m를 써도 되나요?’ → 260m는 설명 가능한 시작값입니다. 실제 지역별 군집 안정성과 Hold 비율에 체계적인 차이가 생기면 지역별 파라미터 또는 HDBSCAN 같은
    대안을 비교해야 합니다.
  answer_boundary: 지역 무관 공정성이 이미 검증됐다고 말하지 않습니다.
  presentation_source: Appendix B/D · 지역별 공정성 검증
  priority: A
- id: T4-10
  status: active
  theme: T4
  rank: B
  question_ko: 한국에서 가능한 개인정보 설계를 해외에도 그대로 적용할 수 있나요?
  short_answer_ko: 아닙니다. 최소수집·목적제한·권한분리라는 원칙은 유지할 수 있지만, 위치정보의 법적 지위와 동의·보유기간은 국가마다 다릅니다. 출시 국가별 법무 검토와 데이터 처리계약이 필요합니다.
  short_answer_en: The privacy principles can travel, but the legal rules cannot be copied country by country. Each market
    needs its own legal review and data-processing contract.
  why_this_answer: 국제 대회에서 확장성을 말하되 규제 차이를 무시하지 않습니다.
  product_logic: 최소수집·목적제한·권한분리라는 설계 원칙은 유지할 수 있지만 위치정보의 법적 지위와 동의·보유·국외이전 규칙은 국가마다 다릅니다. 따라서 한국 설계를 그대로 복제하지 않고 출시 국가마다 데이터
    흐름과 보험업 규제를 다시 승인받아야 합니다.
  calculation_or_validation: 국가별 출시 게이트는 수집 법적 근거, 동의 문구, 보유·삭제표, 데이터 소재지·국외이전, 보험료 사용 가능성, 고객 권리, 처리업체 계약의 7개 영역으로 점검합니다.
    모두 승인되기 전에는 해당 국가 규제 준수 완료나 출시 일정을 확정해 말하지 않습니다.
  follow_up: ‘GDPR을 준수하나요?’ → 최소수집·목적제한·삭제·권한분리는 부합을 지향하는 원칙이지만 정식 적합성 평가를 마친 것은 아닙니다. 출시 국가별 법무 검토와 데이터 처리계약이 필요합니다.
  answer_boundary: 글로벌 규제 준수 완료라고 말하지 않습니다.
  presentation_source: Roadmap · 국가별 법무 검토
  priority: B
- id: T5-01
  status: active
  theme: T5
  rank: S
  question_ko: 보험사가 이 상품을 도입해야 하는 가장 직접적인 이유는 무엇인가요?
  short_answer_ko: 기존 마일리지 기준이 놓치는 운전행동 차이를 설명하고, 사고가 나기 전 위험 변화에 대응할 수 있기 때문입니다. 보험사는 안전운전자에게 더 정교한 혜택을 주고, 위험 변화 고객에게는 예방지원이라는
    새로운 접점을 만들 수 있습니다.
  short_answer_en: MASIL helps insurers see risk differences that mileage alone can miss. It supports more precise discounts
    for safe drivers and earlier preventive support when driving changes.
  why_this_answer: 사회적 가치보다 먼저 보험사의 상품·리스크관리 효용에 직접 답합니다.
  product_logic: 보험사 가치는 네 가지로 나눠 봐야 합니다. 마일리지만으로 구분되지 않는 행동 위험을 설명하고, 안전 고객에게 정교한 혜택을 주며, 변화 고객에게 사고 전 지원 접점을 만들고, Reason
    Code로 직원과 고객의 설명 비용을 줄이는 것입니다. 모두 실제 포트폴리오에서 검증해야 할 가치 가설입니다.
  calculation_or_validation: 파일럿에서는 기존 마일리지군 대비 위험 구분력, 사고·위험 이벤트 변화, 고객 유지율, Care 건당 비용과 지원 전환율을 각각 측정합니다. 손익은 회피 손해와 유지가치에서
    추가 할인·데이터·시스템·Care 운영비를 뺀 값으로 평가하며 현재 개선 폭을 확정하지 않습니다.
  follow_up: ‘그래서 실제로 얼마를 절감하나요?’ → T5-02
  answer_boundary: 합성 시뮬레이션이 손해율 개선을 증명했다고 말하지 않습니다.
  presentation_source: Summary 2 Insurer value
  priority: top10
- id: T5-02
  status: active
  theme: T5
  rank: S
  question_ko: 손해율이나 경제성이 실제로 개선된다는 근거가 있나요?
  short_answer_ko: 현재는 경제성 가설과 합성 샌드박스가 있을 뿐 실제 손해율 개선을 입증하지 못했습니다. 파일럿에서 기존 마일리지군과 비교해 사고 빈도·손해율·지원비용·할인비용을 함께 측정해야 합니다.
  short_answer_en: We have an economic hypothesis, not proven loss-ratio improvement. The pilot must compare claims, loss
    ratio, support cost, and discount cost against the existing mileage product.
  why_this_answer: 실무자가 가장 민감하게 보는 성과 근거를 과장 없이 정면으로 답합니다.
  product_logic: 현재 합성 시뮬레이션은 계산과 사례 비교를 보여주지만 실제 손해율 개선을 증명하지 않습니다. 경제성은 기존 마일리지 특약군과 유사한 고객 비교군을 두고 사고 빈도·심도, 할인비용, Care
    운영비, 데이터·시스템비용과 유지가치를 함께 봐야 합니다.
  calculation_or_validation: 순가치 = 회피된 사고손해액 + 유지·선택 개선가치 - 추가 할인비용 - Care 운영비 - 데이터·시스템비용으로 계산합니다. 이 값이 0보다 커지는 조건이 손익분기점입니다.
    현재 +3%p 우대와 대시보드 사례 할인은 구조를 보여주는 후보값이지 실제 손익 근거가 아닙니다.
  follow_up: ‘손익분기점은 어떻게 계산하나요?’ → 회피된 사고손해와 유지가치에서 추가 할인·Care 운영·데이터·시스템 비용을 뺀 순가치가 0보다 커지는 조건입니다. 실제 값은 보험사 포트폴리오 데이터로 산출합니다.
  answer_boundary: 사회비용·사고감소·손해율 개선을 완료 성과로 표현하지 않습니다.
  presentation_source: Summary 2 Result · 경제성 검증 범위
  priority: top10
- id: T5-03
  status: active
  theme: T5
  rank: A
  question_ko: Care가 나오면 보험사와 고객은 실제로 무엇을 하나요? 운영 부담은 없나요?
  short_answer_ko: Care는 자동 제재가 아니라 직원 검토 큐를 엽니다. 직원은 변화 이유와 데이터 오류 가능성을 확인하고, 고객에게 월 리포트와 선택 가능한 예방 지원을 안내합니다. 발생량과 건당 검토시간은
    파일럿에서 운영 가능성을 확인해야 합니다.
  short_answer_en: Care opens a staff review, not an automatic penalty. Staff check the reason and possible data errors, then
    offer a monthly report and optional support. The pilot must test case volume and review time.
  why_this_answer: Care의 고객 여정과 보험사 운영을 한 번에 보여주고, 자동판정·자동발송이라는 오해를 막습니다.
  product_logic: '핵심 논리

    Care의 목적은 사고 전에 변화 신호를 설명하고 고객이 선택할 수 있는 지원을 연결하는 것입니다. 직원 검토 전에는 고객에게 확정 리포트를 자동 발송하지 않고, 지원 거절도 가격 불이익으로 연결하지 않습니다.


    현재 설계

    월 신호 생성 → Reason Code와 데이터 품질 확인 → 직원 승인 → 고객 월 리포트 → 예방 상담·차량 점검·대체이동 같은 선택형 지원 → 종결 순서입니다. 다음 달에는 다시 계산하며 고객을 장기 관리대상으로
    고정하지 않습니다.'
  calculation_or_validation: 필요 인력 = 월 Care 건수×평균 검토분÷직원 1인당 가용 검토분입니다. 파일럿에서 Care 발생률, 건당 검토시간, 데이터 오류 종결률, 연락 성공률, 지원 선택률,
    반복 Care율과 SLA를 측정해 운영 규모를 정합니다.
  follow_up: ‘Care 연락을 고객이 거절하면 어떻게 되나요?’ → 지원은 선택사항이므로 추가 불이익 없이 종결합니다. 다만 실제 위험행동이 월 점수를 낮췄다면 그 점수는 다른 달과 동일한 방식으로 연간 평균에
    반영됩니다.
  answer_boundary: AI가 고객에게 Care 리포트를 자동 발송하거나 보험사가 건강관리 책임을 계속 진다고 말하지 않습니다.
  presentation_source: Dashboard staff review · 고객 앱 지원 흐름
  priority: A
- id: T5-04
  status: active
  theme: T5
  rank: A
  question_ko: 실제 파일럿에서 무엇을 성공 기준으로 볼 건가요?
  short_answer_ko: 첫째는 실제 데이터에서도 생활권과 점수가 안정적으로 계산되는지, 둘째는 위험 변화 신호가 직원이 검토할 만큼 유용한지, 셋째는 안전운전자 혜택과 Care 비용을 포함해 경제성이 있는지입니다.
    여기에 고객 수용성·프라이버시·지역별 공정성도 함께 봐야 합니다.
  short_answer_en: The pilot should test technical stability, useful risk-change signals, economic value, customer acceptance,
    privacy, and fairness.
  why_this_answer: 기술 성공만이 아니라 상품·운영·윤리의 성공조건을 균형 있게 제시합니다.
  product_logic: 파일럿 성공은 기술만으로 결정하지 않습니다. 생활권·점수 재현성, 직원이 쓸 수 있는 변화 신호, 고객 동의와 지원 경험, 비용 대비 보험 가치, 개인정보보호와 지역별 공정성을 각각 통과해야
    합니다. 한 영역이라도 중대한 문제가 있으면 상용화로 바로 넘어가지 않습니다.
  calculation_or_validation: 게이트는 기술(생성률·재현성), 신호(검토 일치·오탐), 운영(건수·시간·SLA), 경제(순가치), 고객(가입·철회·만족), 프라이버시(삭제·접근), 공정성(집단 격차)으로
    사전 정의합니다. 표본수·기간·통과 임계값은 보험사 기초율을 본 뒤 미리 등록합니다.
  follow_up: ‘파일럿에서 하나만 가장 먼저 확인한다면 무엇인가요?’ → 실제 주행데이터에서도 변화 신호가 안정적으로 재현되고 직원이 검토할 가치가 있는지입니다. 이 단계가 실패하면 요율과 확장 논의를 진행할
    근거가 없습니다.
  answer_boundary: 500명·15~20%·+2%p를 확정 목표로 말하지 않습니다.
  presentation_source: Summary 2 Roadmap · 파일럿 성공 기준
  priority: A
- id: T5-05
  status: active
  theme: T5
  rank: A
  question_ko: 고령 운전자가 굳이 가입할 유인이 있나요?
  short_answer_ko: 안전하고 안정적으로 운전하는 고객은 추가 우대 할인을 받을 수 있고, 자신의 운전 변화를 이해할 수 있습니다. 중요한 점은 감시나 제한이 아니라 자발적인 혜택과 지원으로 설계하는 것입니다.
    실제 가입 유인은 파일럿에서 검증해야 합니다.
  short_answer_en: Safe and stable drivers can receive an extra benefit and understand changes in their driving. The product
    is voluntary and supportive, not restrictive.
  why_this_answer: 고객가치를 할인 하나로만 좁히지 않되 수용성이 검증 전임을 인정합니다.
  product_logic: 가입 유인은 안전하고 안정적인 운전에 대한 추가 우대, 자신의 월별 변화 이해, 원할 때 이용할 수 있는 Care 지원입니다. 감시나 강제 제한이 아니라 자발적 가입·공유·철회가 가능해야
    하며, 실제로 고객이 이 가치를 받아들이는지는 파일럿에서 검증합니다.
  calculation_or_validation: 현재 Favorable 추가 우대 후보는 +3%p입니다. 예를 들어 연간점수 기반 할인이 15%라면 조건 충족 시 18%가 됩니다. 가입률뿐 아니라 유지율, 철회율,
    Care 안내 후 이탈률, 지원 이용률과 할인비용을 함께 비교해 실제 유인을 판단합니다.
  follow_up: ‘Care 안내가 부담스러워 가입을 피하지 않을까요?’ → 실제 위험입니다. Care를 가격 벌점과 분리하고 선택형 지원으로 표현하되, 고객 인터뷰와 메시지별 가입·철회·이탈률을 비교해 수용 가능한
    방식을 찾아야 합니다.
  answer_boundary: 고령자의 높은 가입 의향이 이미 확인됐다고 말하지 않습니다.
  presentation_source: Summary 2 Senior value
  priority: A
- id: T5-06
  status: active
  theme: T5
  rank: A
  question_ko: 안전한 사람만 가입하는 게 아니라 위험한 사람만 들어오는 역선택은 어떻게 막나요?
  short_answer_ko: 역선택 가능성은 실제 상품에서 검증해야 합니다. 기존 마일리지 특약과 결합하고, Favorable 혜택과 Care 지원을 함께 제공해 안전운전자와 변화가 있는 고객 모두에게 가입 이유를
    만드는 방향입니다. 가입자와 비가입자의 위험 차이는 파일럿에서 비교해야 합니다.
  short_answer_en: Adverse selection is a pilot question. We combine safe-driving benefits with optional support so the product
    has value for different customers. We must compare enrolled and non-enrolled groups.
  why_this_answer: 역선택을 예방했다고 주장하지 않고 설계 대응과 검증방법을 제시합니다.
  product_logic: 역선택을 설계만으로 없앴다고 말할 수는 없습니다. 기존 마일리지 특약 위에 안전운전 혜택과 선택형 Care 지원을 함께 두어 서로 다른 고객에게 가입 이유를 만들고, 모집 채널과 초기 위험
    분포를 관찰해 포트폴리오가 한쪽으로 치우치는지 확인해야 합니다.
  calculation_or_validation: 가입자와 비가입자의 기준 주행거리, 위험 이벤트, 기존 할인, 이후 사고·손해, 할인비용을 비교합니다. 연령·지역·차량등급을 맞춘 뒤에도 가입군 위험이 얼마나 다른지,
    우대 고객과 Care 고객의 유지율이 어떻게 다른지를 측정해 요율·모집 기준을 조정합니다.
  follow_up: ‘안전운전자에게 할인만 더 주면 손익이 나빠지지 않나요?’ → 가능성이 있습니다. 우대 고객의 실제 손해 차이와 유지가치가 추가 할인비용을 넘는지 비교해야 하며, 부족하면 할인곡선이나 가입조건을
    다시 조정합니다.
  answer_boundary: MASIL이 역선택을 예방한다고 완료형으로 말하지 않습니다.
  presentation_source: Summary 2 Insurer value · 역선택 검증 항목
  priority: A
- id: T5-07
  status: active
  theme: T5
  rank: B
  question_ko: 고령자용으로 시작한 모델을 30~50대까지 확장할 근거가 있나요?
  short_answer_ko: 개인 생활권과 평소 대비 변화라는 구조는 다른 연령에도 적용할 수 있습니다. 하지만 고령자 문제정의와 같은 효과가 그대로 재현된다는 뜻은 아닙니다. 일반 운전자 확대는 고령자 파일럿 이후
    별도의 타당성 검증이 필요합니다.
  short_answer_en: The personal-zone and change-detection framework may apply to other ages. But the same value is not yet
    proven. Expansion needs a separate validation after the senior pilot.
  why_this_answer: 플랫폼 확장성을 보여주되 고령자 특화 문제정의와 섞지 않습니다.
  product_logic: 개인 생활권과 평소 대비 변화라는 방법은 다른 연령에도 적용할 수 있지만 위험 맥락과 고객가치는 달라질 수 있습니다. 고령자용 파라미터·문헌·지원방식을 그대로 복제하지 않고, 고령자 파일럿을
    통과한 뒤 새로운 모집단에서 문제정의부터 다시 검증해야 합니다.
  calculation_or_validation: 확장 단계에서는 방문빈도, 생활권 반경, 위험 이벤트 분포, 계수·가중치, 할인 반응, 공정성 결과를 새 집단에서 재추정합니다. 기존 모델과 새 보정 모델의 점수·결과
    차이를 비교하고 별도 성공 게이트를 통과하기 전에는 30~50대 확대 효과를 확정하지 않습니다.
  follow_up: ‘그럼 처음부터 전 연령을 대상으로 하지 않은 이유는 무엇인가요?’ → 고령 운전자의 이동권과 상황판단이라는 명확한 문제부터 좁게 검증하기 위해서입니다. 다른 연령 확장은 새로운 문제정의와 별도
    보정이 필요합니다.
  answer_boundary: 같은 파라미터를 모든 연령에 그대로 적용한다고 말하지 않습니다.
  presentation_source: Summary 2 Roadmap
  priority: B
- id: T5-08
  status: active
  theme: T5
  rank: A
  question_ko: 사고 감소나 가족 돌봄 부담 감소 같은 사회적 가치는 어떻게 검증하나요?
  short_answer_ko: 현재는 기대효과이지 검증된 성과가 아닙니다. 파일럿에서 사고·위험행동 변화와 함께 고객의 이동 유지, 가족의 걱정·연락 부담, 지원 이용 경험을 사전 정의된 지표로 측정해야 합니다.
  short_answer_en: These are expected benefits, not proven outcomes. The pilot should measure driving safety, mobility, family
    burden, and support experience with pre-defined metrics.
  why_this_answer: 사회적 가치 슬라이드의 메시지를 유지하면서 성과 과장을 피합니다.
  product_logic: 사회적 가치는 이동을 무조건 늘리는 것도, 사고만 줄이는 것도 아닙니다. 안전 신호를 유지하면서 필요한 이동을 지속하고, 운전자 동의하에 가족과 지원 정보를 나누며, 불필요한 제한과 돌봄
    부담을 줄이는지를 함께 봐야 합니다.
  calculation_or_validation: 지표는 월 주행일·필수목적지 방문, 100km당 위험 이벤트, 사고·청구, 지원 이용, 운전자 자기조절, 가족 부담 설문, 프라이버시 불만과 철회율입니다. 기준선과 파일럿
    후 변화를 비교하되 사회비용 감소나 가족 부담 감소를 현재 성과로 말하지 않습니다.
  follow_up: ‘가족 부담 감소도 보험사의 성과지표인가요?’ → 직접 손해지표라기보다 고객경험·유지·지원효과를 보여주는 보조지표입니다. 사고·손해·운영비와 함께 보되 단독으로 경제성을 주장하지 않습니다.
  answer_boundary: 사회비용 감소가 시뮬레이션으로 검증됐다고 말하지 않습니다.
  presentation_source: Summary 2 Result · social-value boundary
  priority: A
- id: T5-09
  status: active
  theme: T5
  rank: B
  question_ko: 기존 시스템에 붙이려면 비용과 기간이 얼마나 드나요?
  short_answer_ko: 현재는 정확한 비용을 확정할 단계가 아닙니다. 핵심 모듈은 기존 UBI·마일리지 채널 위에 붙일 수 있지만, 데이터 동의·보안·직원 검토·고객 앱 연동 비용을 함께 산정해야 합니다. 파일럿에서
    최소 기능과 운영비를 먼저 측정하겠습니다.
  short_answer_en: We cannot give a reliable cost yet. The scoring module can use existing mileage or UBI channels, but privacy,
    security, staff review, and app integration all need costing.
  why_this_answer: ‘코드가 있으니 바로 출시 가능’이라는 위험한 인상을 피합니다.
  product_logic: 가장 작은 파일럿은 데이터 수집·동의, 생활권·월 점수 계산, Reason Code, 직원 검토 화면, 고객 월 요약, 삭제·감사로그까지입니다. 멋진 전체 앱보다 점수의 재현성, 직원 검토
    가능성, 고객 이해와 데이터 통제가 먼저 검증돼야 합니다.
  calculation_or_validation: 비용은 초기 연동·개발비 + 월 데이터 저장·처리비 + 월 Care 건수×건당 검토비 + 보안·법무·고객지원비로 나눕니다. 기간과 예산은 기존 텔레매틱스 API, 사용자
    수, GPS 주기, 내부 시스템 연동 범위를 확인한 뒤 산정하며 현재 숫자를 임의로 제시하지 않습니다.
  follow_up: ‘가장 작은 MVP에는 무엇이 들어가나요?’ → 동의 기반 데이터 수집, 생활권과 월 점수, Reason Code, 직원 검토 화면, 고객 월 요약, 삭제·감사로그까지입니다. 전체 상용 앱보다 이
    흐름의 재현성과 운영성을 먼저 검증합니다.
  answer_boundary: 현재 대시보드가 상용 시스템이라고 말하지 않습니다.
  presentation_source: Implementation roadmap · 구축·운영 범위
  priority: B
- id: T5-10
  status: active
  theme: T5
  rank: S
  question_ko: 이 점수와 할인 구조를 실제 보험료에 반영하려면 무엇을 더 검증해야 하나요?
  short_answer_ko: 현재 점수와 할인은 상품 구조를 보여주는 후보입니다. 실제 보험료에 쓰려면 보험사의 주행·사고·손해 데이터로 점수와 손해의 관계를 보정하고, 할인비용·공정성·규제와 내부 계리 승인을 함께
    통과해야 합니다.
  short_answer_en: The current score and discount are product candidates. Real pricing needs insurer driving and claims data,
    actuarial calibration, fairness checks, cost analysis, and regulatory approval.
  why_this_answer: ‘시뮬레이션이 있으니 바로 요율로 쓸 수 있다’는 오해를 막고 상용화에 필요한 보험 절차를 구체적으로 답합니다.
  product_logic: '핵심 논리

    MASIL은 먼저 설명 가능한 위험 구분 구조를 제안한 것이고 확정 요율표를 제시한 것이 아닙니다. 실제 가격은 점수가 미래 손해와 안정적으로 연결되는지, 추가 할인과 Care 비용을 감당할 수 있는지, 특정 집단에
    부당한 차이가 없는지를 확인한 뒤 정해야 합니다.


    현재 설계

    실데이터 파일럿 → 손해 빈도·심도 및 기존 마일리지군 비교 → 점수-손해 곡선 보정 → 할인·비용 시나리오 → 공정성·민감도 검토 → 보험사 계리·상품·법무 승인 → 필요한 규제 절차 순서로 진행합니다.'
  calculation_or_validation: 검증값은 점수구간별 사고빈도·손해율, 기존 마일리지 대비 증분 구분력, +3%p 우대비용, Care 운영비, 고객 유지가치, 집단별 할인격차입니다. 순가치가 양수이고
    결과가 안정적인 구간에서만 실제 할인곡선을 확정합니다.
  follow_up: ‘그럼 대시보드의 3%와 22.6%는 무엇인가요?’ → 동일한 합성 조건에서 기존 마일리지 방식과 MASIL 후보식을 비교한 경제성 샌드박스 출력입니다. 실제 판매요율이나 입증된 보험료가 아닙니다.
  answer_boundary: 대시보드 사례값을 확정 요율, 실제 보험료 또는 손해율 개선 증거로 설명하지 않습니다.
