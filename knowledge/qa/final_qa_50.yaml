  rank: B
  question_ko: 왜 이름이 MASIL인가요? 해외 심사위원이 이해할 수 있나요?
  short_answer_ko: ‘마실’은 집 근처를 가볍게 다녀오는 짧고 익숙한 외출을 뜻하는 한국어 표현입니다. 개인의 실제 생활 반경을 존중한다는 상품 철학을 담고 있고, 발표에서는 바로 이어서 personalized
    familiar activity zone이라고 설명합니다.
  short_answer_en: Masil is a Korean word for a short, familiar trip around one's neighborhood. It reflects the idea of supporting
    everyday mobility in a personal activity zone.
  why_this_answer: 브랜드의 한국적 의미와 국제 청중을 위한 기능적 설명을 동시에 제공합니다.
  product_logic: ‘마실’은 집 근처를 가볍게 다녀오는 익숙한 외출을 뜻하지만, MASIL Zone은 집 하나를 중심으로 한 고정 원이 아닙니다. 서로 다른 날 반복 방문한 병원·시장·가족 집 같은 여러 목적지가
    anchor가 되고, 발표에서는 바로 personalized familiar activity zone이라고 풀어 설명합니다.
  calculation_or_validation: 브랜드 설명 자체에는 계산이 필요하지 않습니다. 기술적으로 연결해 묻는다면 서로 다른 3일 이상 방문한 목적지를 anchor로 만들고, 각 anchor의 방문거리 P90으로
    개인별 범위를 만든다고 답하면 됩니다.
  follow_up: ‘집만 중심으로 생활권을 만드나요?’ → 아닙니다. 집 외에도 병원·시장·가족 집처럼 서로 다른 날 반복 방문한 여러 목적지가 각각 anchor가 될 수 있습니다.
  answer_boundary: 모든 고령자가 집 근처에서만 운전한다고 일반화하지 않습니다.
  presentation_source: 발표 대본 MASIL name explanation
  priority: B
- id: T2-01
  status: active
  theme: T2
  rank: S
  question_ko: 생활권 밖 주행은 MASIL 점수에 어떻게 반영되나요?
  short_answer_ko: 생활권 밖에서는 낯선 환경 때문에 위험이 커질 수 있습니다. 하지만 병원이나 가족 방문처럼 정상적인 이동도 있으므로, 위치 자체는 벌점으로 쓰지 않습니다. 대신 밖에서 발생한 실제 위험운전을
    더 민감하게 반영합니다.
  short_answer_en: Unfamiliar roads can be riskier, but leaving the zone is not a penalty. We look at actual driving behavior
    and give more weight to risky events outside the familiar zone.
  why_this_answer: 문제정의의 ‘밖은 위험 맥락’과 상품 원칙의 ‘위치 자동벌점 없음’을 충돌 없이 연결합니다.
  product_logic: 생활권 안팎은 위치 벌점을 주기 위한 구분이 아니라 위험행동이 발생한 맥락을 나누기 위한 구분입니다. 밖으로 나간 횟수나 비중만으로는 점수를 깎지 않습니다. 안과 밖의 실제 위험 이벤트를
    각각 주행거리로 보정해 안전점수를 만들고, 밖에서 발생한 위험행동에만 더 민감한 후보 계수를 적용합니다.
  calculation_or_validation: 먼저 안과 밖에서 발생한 위험 이벤트를 각각 100km당 건수로 바꿉니다. 후보식은 In-Zone Safety = max(0, 100 - 100km당 위험 이벤트×8),
    Out-Zone Safety = max(0, 100 - 100km당 위험 이벤트×12)입니다. 둘 다 100km당 2건이면 안 점수는 84점, 밖 점수는 76점입니다. 밖으로 나간 사실은 0점도 깎지 않고 실제
    위험행동이 있을 때만 차이가 생깁니다.
  follow_up: ‘그럼 생활권 밖 안전점수는 왜 따로 계산하나요?’ → 낯선 환경에서의 실제 행동을 생활권 안 행동과 분리해 보기 위해서입니다. 밖으로 나간 사실은 감점하지 않고 그 구간에서 발생한 위험 이벤트만
    거리로 보정합니다.
  answer_boundary: Outer Zone is automatically unsafe / location penalty라고 말하지 않습니다.
  presentation_source: Summary 1 · Appendix Dashboard · 현재 팀 후보식
  priority: top10
- id: T2-02
  status: active
  theme: T2
  rank: A
  question_ko: MASIL Zone은 실제로 어떻게 만드나요?
  short_answer_ko: 매달 해당 월을 제외한 직전 2개월의 도착지를 봅니다. 서로 다른 3일 이상 반복된 가까운 목적지를 DBSCAN으로 묶어 anchor를 찾고, 각 anchor 주변의 실제 방문거리 P90으로
    개인별 Buffer를 만듭니다.
  short_answer_en: Each month, we use the previous two months of destinations. DBSCAN finds places visited on at least three
    different days. P90 then creates a personal buffer around each anchor.
  why_this_answer: 알고리즘 이름보다 입력·반복성·개인화를 순서대로 설명해 처음 듣는 사람도 따라올 수 있습니다.
  product_logic: 평가할 달을 제외한 직전 2개월의 도착지를 모읍니다. 가까운 도착지를 DBSCAN으로 묶고 서로 다른 3일 이상 반복된 군집만 anchor로 인정합니다. 각 anchor 주변 방문거리의 P90을
    구해 개인별 Buffer를 만들고, 매달 같은 절차를 다시 실행해 이사나 새 병원 같은 변화를 반영합니다.
  calculation_or_validation: DBSCAN의 시작거리 ε는 260m입니다. Core는 최소 500m, Buffer 반경은 max(500m, min(P90, 2km))로 제한합니다. 예를 들어 P90이
    244m면 500m를 사용하고, 485m면 역시 최소 500m, 1.2km면 1.2km, 3km면 최대 2km를 사용합니다. 모두 실제 GPS로 재보정할 후보값입니다.
  follow_up: ‘이사하면 과거 생활권 때문에 계속 불리하지 않나요?’ → 생활권은 고정하지 않고 매달 직전 2개월로 다시 만듭니다. 새 목적지가 반복되면 새로운 anchor로 들어오며 전환기 데이터가 부족하면
    Hold로 보호합니다.
  answer_boundary: 가입 후 한 번 만든 지도를 1년 고정한다고 말하지 않습니다.
  presentation_source: Summary 1 · Appendix B
  priority: A
- id: T2-03
  status: active
  theme: T2
  rank: S
  question_ko: 월별 Favorable·Standard·Care가 연간 할인으로 어떻게 이어지나요?
  short_answer_ko: 매달 네 가지 요소로 통합점수를 계산하고 그달의 결과를 보여줍니다. 연말에는 판정 가능한 월 점수들을 평균해 연간 점수를 만들고, 그 점수가 할인 폭에 반영됩니다. Favorable 조건을
    충족하면 별도의 추가 우대 할인이 붙습니다.
  short_answer_en: We calculate one integrated score each month. Valid monthly scores are averaged for the annual result.
    That annual score affects the discount, and Favorable can add an extra benefit.
  why_this_answer: 월별 결과와 연간 점수·할인의 역할을 분리해 대시보드 변경사항과 일치시킵니다.
  product_logic: 매달 네 축으로 통합점수와 Favorable·Standard·Care 결과를 계산합니다. 현재 설명 기준에서 통합점수 75점 이상이고 Care 동시변화 조건이 없으면 Favorable, 그
    외 일반 월은 Standard이며 데이터가 부족하면 Hold입니다. Care는 그달의 변화 안내입니다. 연말에는 유효 월 점수를 평균한 연간점수로 기본 할인 폭을 정하고, Favorable이 12개월 중 9개월
    이상이면 추가 우대를 적용합니다.
  calculation_or_validation: 월 통합점수는 네 축의 30/30/20/20 가중합입니다. 연간점수 = 유효한 월 통합점수 합 ÷ 유효 개월 수이며 Hold 달은 평균에서 제외합니다. 예를 들어 유효
    월 점수 합이 900점이고 10개월이면 연간점수는 90점입니다. 기본 할인은 연간점수에 연결하고, Favorable 월이 9/12 이상이면 현재 후보 +3%p를 추가합니다. Care 라벨의 직접 가격효과는 0입니다.
  follow_up: ‘그럼 Care 한 번이면 연간 할인이 줄어드나요?’ → T2-04
  answer_boundary: 연간 Care 등급을 최신 비교표에 다시 붙이지 않습니다.
  presentation_source: 최신 대본 · 최신 Dashboard 비교표 · 팀 합의
  priority: top10
- id: T2-04
  status: active
  theme: T2
  rank: S
  question_ko: Care가 나오면 할인율이 줄어드나요?
  short_answer_ko: Care 자체가 할인 차감 원인은 아닙니다. 위험운전이 많으면 안전점수와 연간 통합점수가 낮아져 할인 폭이 줄 수 있습니다. Care는 그달의 변화 신호를 직원이 확인하고 지원을 안내하기
    위한 결과입니다.
  short_answer_en: Care itself does not reduce the discount. Risky driving can lower the safety scores and the annual score.
    Care opens staff review and support for that month.
  why_this_answer: 가격과 지원의 인과관계를 분리해 ‘Care penalty’ 오해를 바로 차단합니다.
  product_logic: Care는 가격 등급에 붙는 벌점이 아니라 평소 대비 이동과 위험행동이 함께 변한 달의 안내 결과입니다. 다음 달에는 같은 규칙으로 다시 계산합니다. 할인에 영향을 주는 것은 Care라는
    이름이 아니라 위험행동 때문에 낮아진 안전점수와 그 월 점수가 연간 평균에 포함되는 효과입니다.
  calculation_or_validation: Care의 직접 가격효과는 0입니다. 예를 들어 Out-Zone Safety가 10점 낮아지면 이 축의 가중치가 20%이므로 월 통합점수는 2점 낮아집니다. 이 월 점수가
    연간 평균에 들어가 할인 폭에 영향을 줄 수 있지만, Care 라벨 자체를 가격 산식에 넣지는 않습니다.
  follow_up: ‘Care 지원을 거절하면 불이익이 있나요?’ → 없습니다. Care 라벨과 지원 수락 여부는 가격 산식에 직접 넣지 않습니다. 가격에는 실제 네 축 점수와 연간 평균만 반영합니다.
  answer_boundary: Care면 보너스 자동 정지 / 한 번 Care면 연말까지 유지라고 말하지 않습니다.
  presentation_source: 팀 결정 · 최신 Dashboard 변경
  priority: top10
- id: T2-05
  status: active
  theme: T2
  rank: A
  question_ko: Edward와 Frank의 할인 차이는 정확히 무엇 때문에 생기나요?
  short_answer_ko: 두 사람의 주행거리는 비슷하지만 실제 위험행동은 크게 다릅니다. Edward는 위험 이벤트가 많아 안팎 안전점수와 연간 평균점수가 낮았고, Frank는 생활권 밖에서도 안정적으로 운전했습니다.
    할인 차이는 Care 명칭이 아니라 이 행동·점수 차이에서 나옵니다.
  short_answer_en: Their mileage is similar, but their behavior is different. Edward had many more risky events and lower
    safety scores. Frank drove safely even outside his zone. The discount difference comes from those scores, not from the
    Care label.
  why_this_answer: 최신 표에서 제거한 연간 등급 대신 실제 비교 가능한 행동·점수를 근거로 답합니다.
  product_logic: 두 사람의 할인 차이는 Care 여부가 아니라 실제 행동점수에서 시작합니다. Edward는 위험 이벤트가 많아 안팎 안전점수와 연간 평균이 낮고, Frank는 생활권 밖에서도 안정적으로 운전했습니다.
    최신 비교표는 연간 등급 대신 이 행동·점수 차이를 직접 보여줍니다.
  calculation_or_validation: Edward와 Frank는 거리 2,473.6km와 2,510.1km, 위험 이벤트 209건과 10건, 안 점수 77.3과 97.7, 밖 점수 47.9와 95.8, 연간점수
    81.6과 98.4입니다. 제안 할인 3%와 22.6%는 합성 경제성 샌드박스의 사례 출력입니다. 실제 점수-할인 곡선은 계리 데이터로 재보정해야 하므로 이 두 값을 보편 요율로 설명하지 않습니다.
  follow_up: ‘Edward의 연간점수도 81.6인데 왜 제안 할인은 3%인가요?’ → 현재 비교표는 후보 할인곡선을 사용한 합성 경제성 사례입니다. 점수와 위험행동이 가격 차이를 만들 수 있음을 보여주지만 실제
    점수-할인 곡선은 보험사 손해 데이터로 다시 보정해야 합니다.
  answer_boundary: 할인 차이를 Care 라벨 하나의 효과로 설명하지 않습니다.
  presentation_source: Appendix Dashboard
