  question_ko: 왜 DBSCAN과 P90을 사용했나요?
  short_answer_ko: DBSCAN은 반복 방문이 모인 곳을 찾고 일회성 방문을 노이즈로 분리하기 좋습니다. P90은 모든 사람에게 같은 반경을 강요하지 않고 각 anchor의 실제 방문 분포에 맞춰 Buffer를
    만들 수 있습니다. 두 방법 모두 결과를 지도와 숫자로 설명하기 쉽습니다.
  short_answer_en: DBSCAN finds repeated destination clusters and separates occasional visits. P90 creates a personal buffer
    from each driver's own visit distribution. Both are explainable.
  why_this_answer: 알고리즘 성능 우월성보다 상품에 필요한 반복성·개인화·설명가능성을 중심으로 답합니다.
  product_logic: DBSCAN은 군집 수를 미리 정하지 않고 반복 방문점과 잡음을 분리할 수 있어 생활권 목적지에 적합합니다. P90은 한두 번의 먼 이동이 반경을 과도하게 늘리는 것을 막으면서 개인 방문의
    대부분을 포함합니다. 두 방법 모두 설명 가능하다는 점이 보험 상품에 중요합니다.
  calculation_or_validation: 현재 시작값은 DBSCAN ε=260m, 서로 다른 방문일 3일 이상입니다. 각 anchor의 반경은 max(500m, min(P90, 2km))로 계산해 최소 500m·최대
    2km로 제한합니다. 파일럿에서는 ε별 군집 안정성, anchor 재발견률, 미분류 방문 비율과 월별 반경 변동을 비교해 보정합니다.
  follow_up: ‘HDBSCAN이 더 적합하지 않나요?’ → 밀도가 다른 지역에서는 후보가 될 수 있습니다. 현재는 고객에게 설명하기 쉽고 시작 파라미터가 명확한 DBSCAN을 사용하며, 파일럿에서 군집 안정성과
    실패율을 비교해 교체 여부를 결정합니다.
  answer_boundary: DBSCAN/P90이 사고위험을 직접 예측한다고 말하지 않습니다.
  presentation_source: Appendix B
  priority: A
