  status: active
  theme: T3
  rank: A
  question_ko: 30/30/20/20이나 임계값이 바뀌면 결과가 크게 흔들리지 않나요?
  short_answer_ko: 그래서 여러 가중치 조합을 다시 계산해 결과가 급변하지 않는 안정 구간을 확인했습니다. 다만 이것은 현재 합성 시나리오 안에서의 민감도입니다. 실제 손해율에 대한 최적값을 증명한 것은
    아닙니다.
  short_answer_en: We tested many weight combinations to find a stable region where classifications do not change sharply.
    This is sensitivity testing on synthetic scenarios, not proof of an optimal real-world tariff.
  why_this_answer: 민감도 분석의 실제 의미를 정확히 제한합니다.
  product_logic: 30/30/20/20과 안전점수 계수는 자연법칙이 아니라 현재의 시작값입니다. 그래서 한 조합만 보여주지 않고 가중치와 임계값을 흔들었을 때 결과가 얼마나 바뀌는지 민감도 분석을 했습니다.
    목표는 절대 불변이 아니라 작은 변화에 분류가 급격히 뒤집히지 않는 안정 구간을 찾는 것입니다.
  calculation_or_validation: 가중치 969개 조합을 재실행해 기준 조합 대비 월 결과가 바뀐 비율, 운전자별 점수 순위 변화, 경계 사례의 이동을 확인합니다. 30/30/20/20은 안정 구간의
    후보 중심값이며, 안 8·밖 12 계수도 실데이터에서 사고·위험행동과의 관계를 확인해 별도로 재보정합니다.
  follow_up: ‘그럼 왜 지금 30·30·20·20을 선택했나요?’ → 주행노출과 안쪽 안전을 각각 30으로, 밖 안전과 패턴 안정성을 각각 20으로 둔 설명 가능한 시작값이며 969개 조합에서 급격한 분류 변화가
    적은 후보 구간에 있었기 때문입니다.
  answer_boundary: 969가 실제 고객 검증 건수라고 말하지 않습니다.
  presentation_source: Appendix C Sensitivity Analysis
  priority: A
- id: T3-08
  status: active
  theme: T3
  rank: S
  question_ko: 실제 데이터가 없는데 상품성이 있다고 말할 수 있나요?
  short_answer_ko: 현재 단계에서 말할 수 있는 것은 구현 가능한 상품 논리와 검증 가능한 파일럿 구조입니다. 손해율 개선, 사고 감소, 가입 의향은 아직 가설입니다. 다음 단계는 실제 운전·계약·손해 데이터를
    연결해 그 가설을 검증하는 것입니다.
  short_answer_en: Today we can show an implementable product logic and a testable pilot design. Crash reduction, loss-ratio
    improvement, and customer adoption are still hypotheses.
  why_this_answer: 대회의 제안 단계와 상용 성과를 구분하면서도 지금 만든 가치가 무엇인지 설명합니다.
  product_logic: 현재 말할 수 있는 것은 상품 로직을 실행 가능한 시스템으로 만들고 합성 시나리오에서 규칙·예외·설명코드가 의도대로 작동했다는 점입니다. 고객 수용성, 사고 감소, 손해율, 실제 GPS 품질과
    공정성은 아직 검증하지 않았으므로 상품성이 입증됐다고 말하지 않습니다.
  calculation_or_validation: 실데이터 파일럿은 기술 지표(생활권 생성률·재현성), 신호 지표(직원 검토 일치·오탐), 고객 지표(동의·철회·지원 이용), 경제 지표(할인·Care·시스템 비용 대비
    손해), 공정성 지표(지역·집단별 결과)를 함께 측정해야 합니다. 성공 기준은 보험사 데이터 확인 후 사전 확정합니다.
  follow_up: ‘파일럿 성공 기준은 무엇인가요?’ → T5-04
  answer_boundary: synthetic-to-real 성능이 이미 보장된다고 말하지 않습니다.
