  question_ko: 합성 주행 데이터는 어떻게 만들었나요? 임의로 만든 것 아닌가요?
  short_answer_ko: 먼저 문헌과 공개 통계에서 고령 운전자의 이동 빈도·자기조절·야간·낯선 경로 같은 방향성을 정리했습니다. 그다음 각 오류 모드를 시험할 수 있도록 여섯 가지 운전자 유형과 세 가지 환경을
    설계하고, 재현 가능한 규칙으로 GPS·주행 이벤트를 생성했습니다. 절대값은 설계값이며 실제 고객 분포를 대표한다고 주장하지 않습니다.
  short_answer_en: We used literature and public statistics to set realistic directions. We then designed six driver types
    and three environments to test different failure modes. The exact values are synthetic design parameters, not a real population
    sample.
  why_this_answer: 문헌 기반과 설계 기반을 구분해 ‘그럴듯한 숫자를 AI가 임의 생성했다’는 오해를 막습니다.
  product_logic: 합성 데이터는 결론에 맞춰 임의의 점을 찍은 것이 아니라, 먼저 운전자 유형별 가설을 정하고 문헌에서 확인한 고령 운전자의 이동·자기조절 특성을 방향성으로 사용해 월별 목적지, 주행거리,
    야간·신규 경로, 위험 이벤트를 생성했습니다. 문헌은 방향을 뒷받침하고 개별 합성 숫자를 사실로 보증하지는 않습니다.
  calculation_or_validation: 60명의 합성 운전자마다 2개월 기준선과 12개월 평가 구간을 만들고, 세 환경에서 총 180개 시나리오와 80,032개 주행 로그를 생성했습니다. 파일럿에서는 실제
    주행횟수·거리·야간비중·위험 이벤트 분포와 합성 분포를 비교하고 차이가 크면 생성 파라미터를 다시 맞춥니다.
  follow_up: ‘문헌이 합성 데이터의 각 숫자를 직접 지지하나요?’ → 아닙니다. 문헌은 자기조절·활동공간·패턴 변화 같은 유형의 방향을 뒷받침합니다. 주행횟수와 위험률 같은 절대값은 검증용 가정이며 실제 데이터로
    재보정합니다.
  answer_boundary: 문헌이 합성 데이터의 모든 확률값을 검증했다고 말하지 않습니다.
  presentation_source: Summary 2 · Appendix D · 데이터생성 상세정리
  priority: A
- id: T3-04
  status: active
  theme: T3
  rank: A
  question_ko: 시뮬레이션 결과가 원하는 결론이 나오도록 설계된 것 아닌가요?
  short_answer_ko: 시뮬레이션은 실제 효과를 증명하려는 것이 아니라 규칙이 의도와 다르게 작동하는 경우를 찾기 위한 테스트입니다. 우대가 나와야 하는 사례만 만든 것이 아니라, 생활권 안 위험·생활권 밖
    안전·이동만 변한 대조사례처럼 논리를 깨뜨릴 수 있는 유형도 포함했습니다.
  short_answer_en: The simulation is a logic test, not proof of market impact. We included contrast cases that could break
    the design, such as safe out-zone driving and risky in-zone driving.
  why_this_answer: 합성 검증의 정당성을 ‘성공률’이 아니라 반례와 오류모드 탐색으로 설명합니다.
  product_logic: 원하는 결론을 넣고 결과를 확인한 것이 아니라 서로 반대되는 행동 조합을 의도적으로 포함했습니다. 예를 들어 생활권 밖 비중은 늘지만 안전행동은 유지되는 경우, 이동과 위험행동이 함께 늘어나는
    경우, 저점수가 계속되지만 급변은 없는 경우를 따로 만들어 규칙이 서로 다르게 반응하는지 봅니다.
  calculation_or_validation: 각 시나리오에는 기대 분기표를 둡니다. 입력 조건, 기대 월 결과, 기대 Reason Code를 먼저 고정한 뒤 실제 출력과 비교하고 불일치 건수를 셉니다. 이때 지표는
    ‘모델 정확도’가 아니라 규칙 일치율, 예외 처리율, 재현 실패 건수입니다. 실제 위험예측 성능은 실데이터 라벨이 있어야 측정할 수 있습니다.
  follow_up: ‘실패한 시나리오도 공개할 수 있나요?’ → 가능합니다. 기대 결과와 실제 결과가 달랐던 사례, 수정한 규칙과 버전을 구분해 남기면 검증 과정과 남은 한계를 투명하게 설명할 수 있습니다.
  answer_boundary: 시뮬레이션 분류 결과를 정답 라벨 정확도로 표현하지 않습니다.
  presentation_source: Appendix D Validation logic
