questions:
- id: T1-01
  status: active
  theme: T1
  rank: S
  question_ko: MASIL은 기존 Pay-As-You-Drive나 UBI와 정확히 무엇이 다른가요?
  short_answer_ko: Pay-As-You-Drive는 주행량을 보고, 일반적인 UBI는 운전행동을 봅니다. MASIL은 여기에 개인별 생활권 안팎의 맥락과 평소 대비 패턴 변화까지 더합니다. 그래서 같은 거리를
    운전해도 서로 다른 위험을 설명할 수 있습니다.
  short_answer_en: Pay-As-You-Drive looks at how much a person drives. UBI looks at how they drive. MASIL also looks at familiar
    driving context and changes from the driver's usual pattern.
  why_this_answer: 대본의 핵심 문장인 ‘same mileage does not always mean the same risk’를 그대로 풀어 기존 상품 대비 차이를 한 번에 보여줍니다.
  product_logic: MASIL은 기존 마일리지 특약을 없애는 상품이 아니라 그 위에 운전 맥락을 더하는 구조입니다. 주행량, 생활권 안 안전, 생활권 밖 안전, 평소 패턴의 안정성을 각각 계산하고, Care가
    필요한 달은 가격 페널티가 아니라 직원이 변화 이유를 확인하는 흐름으로 연결합니다.
  calculation_or_validation: 월 통합점수는 Mileage×0.30 + In-Zone Safety×0.30 + Out-Zone Safety×0.20 + Pattern Stability×0.20으로
    계산합니다. 이 네 축이 ‘얼마나, 어떻게, 어떤 맥락에서, 평소와 무엇이 달라졌는지’를 한 점수에 묶습니다. 연말에는 유효한 월 점수의 평균을 사용하고, Favorable 조건에는 현재 +3%p 추가 할인 후보가
    붙습니다.
  follow_up: ‘그럼 일반 UBI에 GPS 기능만 넣으면 되지 않나요?’ → T1-09로 연결
  answer_boundary: UBI가 위치나 맥락을 전혀 다루지 않는다고 보편적으로 단정하지 않습니다. MASIL의 제안 차이는 ‘개인 생활권과 변화 감지를 상품 논리의 중심에 둔다’는 점입니다.
  presentation_source: Summary 1 · 발표 대본 Problem & Solution
  priority: top10
- id: T1-02
  status: active
  theme: T1
  rank: A
  question_ko: 왜 고령 운전자만을 위한 별도 상품이 필요한가요?
  short_answer_ko: 고령 운전자는 단순히 덜 운전하는지가 아니라 복잡한 상황을 판단하는 부담과 익숙하지 않은 환경의 영향이 더 중요할 수 있습니다. MASIL은 나이만으로 제한하지 않고, 각 운전자의 실제
    행동과 변화를 개인 기준으로 봅니다.
  short_answer_en: Senior driving risk is not only about mileage. Complex situations and unfamiliar roads can create more
    burden. MASIL uses each driver's own behavior and changes, not age alone.
  why_this_answer: 고령자를 고위험으로 낙인찍지 않으면서도 이 상품이 해결하려는 구체적 문제를 설명합니다.
  product_logic: 고령자를 나이 자체로 낮게 평가하는 것이 아닙니다. 고령 운전에서 특히 중요한 상황판단과 익숙하지 않은 도로의 부담을 문제로 보고, 실제 판정에는 나이·건강진단이 아니라 개인의 주행량, 안전행동,
    평소 대비 변화만 사용합니다.
  calculation_or_validation: 덱의 2.28초는 시야가 제한된 돌발상황에서 측정된 제동 반응시간이며 젊은 운전자보다 약 90% 느렸다는 조건을 함께 말해야 합니다. 초행 경로의 사고 연루 가능성 2.5배도
    ‘모든 생활권 밖 주행이 2.5배 위험하다’는 뜻이 아니라 익숙하지 않은 맥락의 판단 부담을 보여주는 근거입니다.
  follow_up: ‘결국 연령차별 아닌가요?’ → T1-04, ‘신체 취약성이 더 큰 원인 아닌가요?’ → T1-08
  answer_boundary: 모든 고령 운전자가 위험하다고 말하지 않습니다. 사고 심도나 인지장애를 예측한다고도 말하지 않습니다.
  presentation_source: Summary 1 · Appendix A
  priority: A
- id: T1-03
  status: active
  theme: T1
  rank: S
  question_ko: 이 문제는 면허 제도나 규제가 해결해야지, 왜 보험이 개입하나요?
  short_answer_ko: 규제는 운전 가능 여부를 판단하지만 매일의 변화를 계속 반영하기 어렵습니다. 보험은 기존 주행 데이터를 활용해 안전운전을 보상하고, 위험 변화가 보일 때 자발적인 지원을 연결할 수 있습니다.
    규제를 대체하는 것이 아니라 규제와 제한 사이의 빈틈을 보완하는 역할입니다.
  short_answer_en: Regulation decides whether a person may drive. Insurance can support safer driving between those checks.
    MASIL does not replace regulation. It adds voluntary support and incentives.
  why_this_answer: 보험사의 역할을 과장하지 않고 규제와 상품의 기능 차이를 분명히 합니다.
  product_logic: 면허 제도는 운전 허용·제한을 판단하는 공적 장치입니다. MASIL은 그 판단을 대신하지 않고, 보험사가 월별 안전행동을 보상하고 최근 변화가 클 때 선택 가능한 지원을 안내하는 고객 접점을
    만듭니다. 의료 판단과 면허 결정은 계속 MASIL 밖에 둡니다.
  calculation_or_validation: MASIL은 처음 2개월로 개인 기준선을 만들고 이후 매달 최근 운전 변화를 확인합니다. 몇 년 간격의 면허 갱신을 대체하는 것이 아니라 그 사이의 월별 변화에 반응하는
    시간 구조입니다. Care가 표시돼도 다음 달에는 같은 규칙으로 다시 계산합니다.
  follow_up: ‘그럼 보험사가 사실상 건강관리자가 되는 것 아닌가요?’ → 아닙니다. 보험사는 해당 월의 운전 변화와 지원 선택지를 안내할 뿐 질병을 판단하거나 지속적인 건강관리 책임을 맡지 않습니다. Care도
    다음 달에는 같은 규칙으로 다시 계산합니다.
  answer_boundary: 규제가 실패했다고 단정하거나 MASIL이 면허 정책을 대체한다고 말하지 않습니다.
  presentation_source: Summary 1 Current Limitations · Appendix A
  priority: top10
- id: T1-04
  status: active
  theme: T1
  rank: A
  question_ko: 고령자만 따로 평가하면 연령차별 아닌가요?
  short_answer_ko: MASIL은 나이를 위험점수로 넣지 않습니다. 가입 대상은 고령 운전자이지만, 실제 평가는 주행량·안전행동·개인 패턴 변화로 이루어집니다. 목적도 운전을 제한하는 것이 아니라 안전한 운전을
    우대하고 이동을 계속 지원하는 것입니다.
  short_answer_en: Age is not a scoring input. We evaluate mileage, driving behavior, and changes from each person's own pattern.
    The goal is support, not restriction.
  why_this_answer: 대상 집단과 판정 변수를 분리해 차별 우려에 직접 답합니다.
  product_logic: 가입 대상은 고령자이지만 점수 입력에는 나이·성별·건강정보가 들어가지 않습니다. 각 운전자를 다른 사람의 평균과 비교하기보다 자신의 반복 방문과 직전 패턴에 비교합니다. 다만 개인화만으로
    공정성이 보장되는 것은 아니므로 실제 파일럿에서 집단별 결과 차이를 따로 검사해야 합니다.
  calculation_or_validation: 파일럿에서는 연령대·지역·소득 대리변수별 평균점수, Favorable 비율, Care 비율, 할인 차이, Hold 비율을 비교합니다. 직원 검토 결과와 신호가 불일치한
    비율도 집단별로 확인합니다. 격차가 크면 표본 구성, GPS 밀도, 파라미터와 지원 절차 중 어디에서 차이가 생겼는지 분해해 재보정합니다.
  follow_up: ‘그럼 30~50대로 확대할 수 있다는 말과 모순 아닌가요?’ → T5-07
  answer_boundary: 공정성이 이미 입증됐다고 말하지 않습니다.
  presentation_source: Summary 2 Result · Appendix A
  priority: A
- id: T1-05
  status: active
  theme: T1
  rank: A
  question_ko: 같은 주행거리라고 해서 위험이 다르다는 걸 어떻게 보여주나요?
  short_answer_ko: 대시보드의 Edward와 Frank가 그 예입니다. 연간 거리는 비슷하지만 위험 이벤트와 생활권 안팎 안전점수는 크게 다릅니다. 기존 방식은 같은 마일리지 결과를 주지만, MASIL은
    실제 운전행동 차이를 연간 점수와 할인에 반영합니다.
  short_answer_en: Edward and Frank drove similar distances, but their driving behavior was very different. MASIL reflects
    that difference in their annual scores and discounts.
  why_this_answer: 심사위원이 이미 본 비교표를 사용하므로 숫자를 외우지 않아도 설계 차이를 이해할 수 있습니다.
  product_logic: 대시보드는 주행거리가 거의 같은 Edward와 Frank를 나란히 놓습니다. 두 사람의 차이는 이동량이 아니라 위험 이벤트와 생활권 안팎 안전점수입니다. MASIL은 이 행동 차이를 월 점수와
    연간 평균에 반영하므로 기존 마일리지 방식이 놓치는 차이를 설명할 수 있습니다.
  calculation_or_validation: Edward와 Frank의 연간 거리는 2,473.6km와 2,510.1km로 비슷하지만 위험 이벤트는 209건과 10건, 안 점수는 77.3과 97.7, 밖 점수는
    47.9와 95.8, 연간 평균점수는 81.6과 98.4입니다. 표시 할인 3%와 22.6%는 이 합성 사례의 후보 요율 결과이며 실제 보험료 효과를 입증한 값은 아닙니다.
  follow_up: ‘왜 점수 차이보다 할인 차이가 더 커 보이나요?’ → T2-05와 T2-09
  answer_boundary: 이 한 사례가 실제 손해율 차이를 입증한다고 말하지 않습니다.
  presentation_source: Appendix Dashboard · 최신 비교표
  priority: A
- id: T1-06
  status: active
  theme: T1
  rank: A
  question_ko: 왜 ‘익숙함’이 보험 평가에 들어가야 하나요?
  short_answer_ko: 익숙하지 않은 길에서는 더 많은 판단이 필요할 수 있습니다. 하지만 익숙함 자체를 안전으로 단정하지 않고, 생활권은 운전 맥락을 구분하는 기준으로만 씁니다. 최종 평가는 그 안팎에서 실제로
    어떻게 운전했는지를 봅니다.
  short_answer_en: Unfamiliar roads can require more judgment. But familiarity does not automatically mean safety. The zone
    gives context, while actual behavior drives the result.
  why_this_answer: 문제정의의 문헌 근거와 ‘위치 벌점 없음’이라는 상품 경계를 동시에 보존합니다.
  product_logic: 생활권은 안전지대가 아니라 운전 맥락을 나누는 기준입니다. 익숙한 곳에서도 위험행동이 많으면 In-Zone Safety가 낮아지고, 낯선 곳에서도 안전하게 운전하면 위치만으로 불이익을 받지
    않습니다. 즉 익숙함은 행동을 해석하기 위한 배경이고 최종 점수는 실제 행동으로 결정됩니다.
  calculation_or_validation: Ehsani & Tefft의 2.5배는 초행 경로의 사고 연루 가능성이 높을 수 있다는 문제정의 근거입니다. MASIL은 그 수치를 점수식에 그대로 곱하지 않습니다.
    실제 계산은 안팎 위험 이벤트를 각각 100km당 건수로 바꾼 뒤 후보 계수 8과 12를 적용하며, 계수는 실제 데이터로 재보정합니다.
  follow_up: ‘생활권 안에서 사고가 나면 모델이 놓치는 것 아닌가요?’ → 놓치지 않습니다. 생활권 안에서도 과속·급가속·급감속을 In-Zone Safety로 계산하므로 익숙한 위치가 위험행동을 상쇄하지 않습니다.
  answer_boundary: MASIL Zone을 Safe Zone이라고 부르지 않습니다.
  presentation_source: Summary 1 · Ehsani & Tefft 2021 · Appendix A
  priority: A
- id: T1-07
  status: active
  theme: T1
  rank: A
  question_ko: 이동권을 보장한다면서 위험을 평가하는 건 모순 아닌가요?
  short_answer_ko: 이동권을 지킨다는 것은 위험을 보지 않는다는 뜻이 아닙니다. 위치를 이유로 운전을 막지 않고, 실제 안전행동을 보상하며 변화 신호가 있을 때 선택 가능한 지원을 제공한다는 뜻입니다.
  short_answer_en: Protecting mobility does not mean ignoring risk. We do not restrict travel by location. We reward safe
    driving and offer support when risk changes appear.
  why_this_answer: ‘자유로운 이동’과 ‘예방적 위험관리’를 대립시키지 않고 상품의 균형으로 설명합니다.
  product_logic: 이동권을 지킨다는 것은 위험을 무시한다는 뜻이 아닙니다. 이동 장소를 이유로 제한하거나 벌점을 주지 않고, 안전운전에는 혜택을 주며 변화 신호가 있을 때 고객이 선택할 수 있는 지원을 제공한다는
    뜻입니다. 가족 공유와 Care 신청도 운전자 동의가 전제입니다.
  calculation_or_validation: 이동권 효과는 할인율 하나로 측정하지 않습니다. 파일럿에서 월 주행일수·이동거리·자기조절 행동이 유지되는지, 지원 이후 운전 중단이 불필요하게 늘지 않는지, 고객의 거부·철회율과
    만족도를 함께 봅니다. 현재는 측정 방법을 제안한 단계이지 효과를 입증한 단계가 아닙니다.
  follow_up: ‘지원 신청을 거절하면 할인에 불이익이 있나요?’ → 없습니다. Care 지원은 고객 선택이고 가격과 분리합니다. 다만 그달 실제 위험행동이 월 점수를 낮췄다면 그 점수는 다른 달과 같은 방식으로
    연간 평균에 반영됩니다.
  answer_boundary: MASIL이 이동권을 법적으로 보장한다고 말하지 않습니다.
  presentation_source: Summary 2 Result
  priority: A
- id: T1-08
  status: active
  theme: T1
  rank: B
  question_ko: 고령자 사고가 큰 건 운전행동보다 신체 취약성 때문 아닌가요?
  short_answer_ko: 신체 취약성은 사고 결과를 더 심각하게 만들 수 있습니다. 하지만 MASIL은 사고 심도나 건강상태를 예측하지 않습니다. 저희가 다루는 범위는 사고 전 관찰 가능한 운전행동과 패턴 변화입니다.
  short_answer_en: Physical fragility can make crash outcomes more severe. MASIL does not predict medical condition or crash
    severity. We focus on observable driving behavior before a crash.
  why_this_answer: 상대의 반론을 인정한 뒤 제품이 해결하는 범위를 좁혀 과장과 차별 논란을 피합니다.
  product_logic: 신체 취약성은 같은 사고가 더 큰 피해로 이어지는 이유가 될 수 있습니다. MASIL은 그 사실을 부정하지 않지만 사고 심도나 질병을 예측하지도 않습니다. 상품이 개입하는 지점은 사고 전에
    관찰 가능한 위험행동과 개인 패턴 변화이며, 건강정보는 점수 입력에서 제외합니다.
  calculation_or_validation: 노출 보정 후 약 5배 같은 문헌 수치는 고령 운전 위험의 배경을 설명할 때만 사용합니다. 파일럿에서는 사고 빈도와 심도를 분리해 관찰하고, MASIL 신호가 주로 빈도
    변화와 연결되는지 확인합니다. 질병 예측 민감도나 사고심도 예측 정확도는 산출하지 않습니다.
  follow_up: ‘그럼 Care는 건강 이상을 추정하는 것 아닌가요?’ → 아닙니다. Care는 운전의 이동 변화와 위험행동 변화가 함께 나타났다는 월별 신호일 뿐이며 질병명이나 건강상태를 추정하지 않습니다.
  answer_boundary: 인지장애 조기진단 상품이라고 말하지 않습니다.
  presentation_source: Appendix A · Q&A fragility boundary
