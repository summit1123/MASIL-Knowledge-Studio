  rank: S
  question_ko: 기존 UBI에 생활권 기능만 추가하면 되는 것 아닌가요?
  short_answer_ko: 기술적으로는 기존 UBI 채널 위에 구현할 수 있습니다. MASIL의 차이는 지도 기능 하나가 아니라, 개인 생활권·안팎 안전점수·패턴 변화·Care 지원을 하나의 설명 가능한 상품 흐름으로
    묶었다는 점입니다.
  short_answer_en: MASIL can be built on an existing UBI channel. Its value is not just a map feature. It connects personal
    context, safety scores, change detection, and human support.
  why_this_answer: ‘대체재’가 아니라 기존 인프라 위에 얹을 수 있는 상품 설계라는 현실적인 입장을 취합니다.
  product_logic: 기술적으로는 기존 UBI나 마일리지 데이터 채널 위에 구현할 수 있습니다. 차이는 지도 기능 하나가 아니라 생활권 생성, 안팎 안전점수, 패턴 변화, Reason Code, 직원 승인과 고객
    지원을 하나의 상품 흐름으로 묶는 데 있습니다. 경쟁력은 실제 데이터 검증과 운영 계약이 쌓일수록 생깁니다.
  calculation_or_validation: 연동 범위는 데이터 수집 API, 생활권·점수 서비스, 직원 검토 화면, 고객 요약 화면, 동의·삭제·감사로그로 나뉩니다. 비용은 초기 구축비와 월 데이터 처리비, Care
    건당 운영비로 분리해 산정합니다. 현재 정확한 기간과 비용은 없지만 어떤 구성요소를 견적해야 하는지는 이 구조로 정의할 수 있습니다.
  follow_up: ‘그렇다면 기술적 해자는 무엇인가요?’ → 초기 해자는 알고리즘 하나보다 생활권·점수·Reason Code·직원 검토를 연결한 상품 운영체계입니다. 장기적인 해자는 실제 주행·손해 데이터로 보정한
    규칙과 보험사 운영 경험이 쌓일 때 생깁니다.
  answer_boundary: 경쟁사가 절대 복제할 수 없다고 말하지 않습니다.
  presentation_source: Summary 1 · Summary 2 Pipeline
