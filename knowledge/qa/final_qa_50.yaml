  question_ko: 반복 방문한 목적지가 있다고 해서 그 경로까지 익숙하다고 볼 수 있나요?
  short_answer_ko: 완전히 같지는 않습니다. MASIL Zone은 반복 방문 목적지로 개인의 익숙한 활동영역을 추정하는 지표입니다. 그 안의 모든 도로가 익숙하다고 단정하지 않고, 최종 평가는 실제 안전행동과
    최근 변화로 합니다.
  short_answer_en: Not exactly. Repeated destinations estimate a familiar activity area, but they do not prove that every
    road inside it is familiar. The final score still uses actual driving behavior and recent change.
  why_this_answer: 목적지 기반 생활권의 한계를 숨기지 않으면서도, 생활권을 안전 판정이 아닌 맥락 지표로 쓰는 이유를 설명합니다.
  product_logic: '핵심 논리

    MASIL Zone은 ‘이 도로를 알고 있다’는 내비게이션 지도가 아니라 반복되는 생활 목적지를 중심으로 만든 개인 활동영역입니다. 따라서 Zone 안이라는 이유로 안전하다고 판정하지 않고 In-Zone Safety를
    별도로 계산합니다.


    현재 설계

    서로 다른 3일 이상 방문한 목적지를 anchor로 만들고, DBSCAN과 P90으로 주변 활동범위를 구성합니다. 경로 단위 익숙함은 더 촘촘한 궤적 보관이 필요하므로 최소수집 원칙과 함께 파일럿에서 비교할 확장
    항목입니다.'
  calculation_or_validation: 파일럿에서는 목적지 기반 Zone과 반복 경로 기반 지표를 각각 만들고 월 점수·Care 결과·GPS 보관량이 얼마나 달라지는지 비교합니다. 경로 지표가 검토 유용성을
    충분히 높이면서 개인정보 부담을 정당화할 때만 추가합니다.
  follow_up: ‘그럼 MASIL Zone이라는 이름이 과장 아닌가요?’ → Zone은 안전지대가 아니라 개인 활동영역을 나타내는 맥락 지표입니다. 모든 도로의 익숙함을 보증하지 않고 실제 행동점수와 함께 사용한다고
    설명합니다.
  answer_boundary: Zone 안의 모든 도로가 익숙하거나 안전하다고 말하지 않습니다.
  presentation_source: Summary 1 · Appendix B · 생활권 적용 범위
  priority: A
- id: T2-09
  status: active
  theme: T2
  rank: B
  question_ko: Favorable 추가 할인은 왜 3%p인가요?
  short_answer_ko: 3%p는 현재 시뮬레이션에 구현된 후보 보너스입니다. 안전운전에 체감 가능한 인센티브를 주는 경제성 예시이지, 실제 시장 데이터로 확정된 요율은 아닙니다. 파일럿에서 손해율과 가입 반응을
    보고 재보정합니다.
  short_answer_en: Three percentage points is the current simulation candidate. It is not a final tariff. We will recalibrate
    it using loss results and customer response in the pilot.
  why_this_answer: 현재 구현값을 숨기지 않으면서도 확정 요율로 과장하지 않습니다.
  product_logic: 기본 할인은 연간 통합점수에 따라 정하고, Favorable은 월 통합점수 75점 이상이면서 Care 동시변화 조건이 없는 달입니다. 이러한 Favorable 월이 12개월 중 9개월 이상이면
    안전하고 안정적인 운전이 충분히 반복됐다고 보고 추가 혜택을 적용합니다. Standard와 Care에는 이 추가분이 없지만 Care라는 이유로 기존 할인분을 자동 차감하지도 않습니다.
  calculation_or_validation: 현재 추가 우대 후보값은 +3%p입니다. 예를 들어 연간점수 기반 할인이 15%이고 Favorable 조건을 충족하면 총 18%가 되는 구조입니다. 3%p가 충분한 가입
    유인인지, 추가 할인비용보다 손해 개선·유지 가치가 큰지는 파일럿에서 가입률·유지율·손익으로 검증합니다.
  follow_up: ‘3%p가 가입을 유도하기에 충분한가요?’ → 아직 확인되지 않았습니다. 파일럿에서 할인 수준별 가입률·유지율·위험구성·추가 할인비용을 비교해 고객 유인과 보험사 손익이 함께 성립하는 수준을 찾습니다.
  answer_boundary: 시장 최적 보너스 또는 검증된 전환율이라고 말하지 않습니다.
  presentation_source: 현재 GaipStudio 구현 후보 · 팀 합의
  priority: B
- id: T2-10
  status: active
  theme: T2
  rank: S
  question_ko: Pattern Change와 Care는 어떤 경우에 결정되나요?
  short_answer_ko: 이번 달을 직전 2개월의 개인 기준선과 비교합니다. 생활권 밖 이동이나 야간·신규 목적지가 늘고, 위험행동도 같은 달에 함께 증가하면 Care로 안내합니다. 점수가 낮다는 이유만으로 Care가
    되는 것은 아닙니다.
  short_answer_en: We compare this month with the driver's previous two months. Care appears when mobility changes and risky
    behavior increase together in the same month. A low score alone does not create Care.
  why_this_answer: Care를 저점수자 낙인이나 건강판정이 아니라 개인의 동시 변화 신호로 정확히 설명합니다.
  product_logic: '핵심 논리

    Care는 ‘위험한 사람’이라는 고정 등급이 아니라 평소와 다른 이동 변화와 위험행동 변화가 같은 달에 겹친 신호입니다. 다음 달에는 새로운 이번 달과 직전 기준을 사용해 다시 계산합니다.


    현재 설계

    이동 변화에는 생활권 밖 비중, 야간 외부주행, 신규 목적지, 운전반경 확대가 포함되고 행동 변화에는 과속·급가속·급감속의 100km당 증가가 포함됩니다. 데이터가 부족하면 불리하게 추정하지 않고 Hold로 둡니다.'
  calculation_or_validation: 현재 시뮬레이션의 설명 후보는 생활권 밖 비중이 직전 2개월 평균보다 25%p 이상 증가하고 위험행동 비중도 20%p 이상 증가하는 조건이 같은 달에 함께 나타나는 경우입니다.
    두 조건은 AND이며, 이 임계값은 실제 데이터로 재보정합니다.
  follow_up: ‘평소부터 위험하게 운전하지만 변화가 없으면 Care가 아닌가요?’ → 그렇습니다. Care는 급격한 변화 안내이고, 낮은 안전점수는 Favorable을 받지 못하고 연간점수와 할인 폭에 반영됩니다.
    기존 법규·안전관리까지 Care가 대신하지는 않습니다.
  answer_boundary: 낮은 점수만으로 Care가 된다고 말하거나 Care를 장기 건강관리 등급처럼 설명하지 않습니다.
  presentation_source: Dashboard · Pattern Change · Care 월별 결과
  priority: S
- id: T3-01
  status: active
  theme: T3
  rank: S
  question_ko: AI가 보험료를 결정하지 않는다면 왜 AI 기반 상품인가요?
  short_answer_ko: AI는 다양한 고령 운전자 프로필과 이동 시나리오를 만들고, 결과를 이해하기 쉬운 설명으로 바꾸는 데 사용합니다. 하지만 점수와 할인은 고정된 규칙이 계산하고, 최종 적용은 직원이 검토합니다.
    AI는 설계·검증·설명을 돕고 보험료 결정권은 갖지 않습니다.
  short_answer_en: AI helps create synthetic driver scenarios and explain results. Fixed rules calculate the score and discount.
    Staff review the final result. AI does not set the premium.
  why_this_answer: AI 활용을 축소하지 않으면서 보험에서 가장 민감한 가격결정 책임을 명확히 분리합니다.
  product_logic: AI와 규칙 엔진의 역할을 분리합니다. AI는 여러 운전자 유형과 이동패턴을 가진 합성 시나리오를 만들고 결과 설명 초안을 돕습니다. 생활권 생성, 네 축 점수, 월 결과와 할인 계산은 버전이
    고정된 규칙으로 수행하며, Care 안내와 고객 전달은 직원이 확인합니다.
  calculation_or_validation: 검증할 때는 AI가 낸 문장을 평가하는 것이 아니라 동일 입력·동일 규칙 버전에서 점수와 Reason Code가 재현되는지 확인합니다. 운영 기록에는 입력 데이터 버전,
    파라미터 버전, 계산 결과, 직원 승인 상태를 남겨 어느 단계에서 결과가 만들어졌는지 추적합니다.
  follow_up: ‘그럼 AI 없이도 가능한 것 아닌가요?’ → 실제 판정은 AI 없이도 고정 규칙으로 실행할 수 있습니다. AI의 역할은 다양한 합성 운전자와 이동 시나리오 생성, 설명 초안 지원이며 보험료 결정권은
    규칙과 사람에게 남깁니다.
  answer_boundary: AI가 위험을 예측하거나 보험료를 자동 확정한다고 말하지 않습니다.
  presentation_source: Summary 2 Core Principle · 발표 대본
  priority: S
- id: T3-02
  status: active
  theme: T3
  rank: S
  question_ko: 180개 시나리오로 무엇을 검증했다고 말할 수 있나요?
  short_answer_ko: 180개 합성 시나리오를 통해 서로 다른 운전 유형과 환경에서도 정해진 규칙이 일관되게 작동하는지 확인했습니다. 실제 사고율, 손해율, 고객 행동을 검증한 것은 아닙니다. 그것은 실제
    데이터 파일럿의 역할입니다.
  short_answer_en: We used 180 synthetic scenarios to test whether the rules work consistently across different driver types
    and environments. We did not prove real crash reduction or loss-ratio improvement.
  why_this_answer: 검증한 것과 아직 검증하지 않은 것을 한 답변에 함께 말해 신뢰를 높입니다.
  product_logic: 180개 시나리오는 실제 고령 운전자 180명을 대표하는 표본이 아닙니다. 서로 다른 위험 가설을 맡은 60명의 합성 운전자에게 도시·교외·저밀도 3개 환경을 적용해, 규칙이 예상한 분기와
    예외를 일관되게 처리하는지 확인한 오류모드 테스트입니다.
  calculation_or_validation: 검증 단위는 60명×3환경=180개 시나리오, 합성 주행 로그는 80,032건입니다. 각 시나리오마다 기대 월 결과·Reason Code와 실제 출력을 비교합니다. 이
    검증으로 코드 재현성과 규칙 분기는 말할 수 있지만 실제 사고예측 정확도, 손해율 개선, 모집단 대표성은 말할 수 없습니다.
  follow_up: ‘그러면 결과가 현실에서 의미 없지 않나요?’ → T3-08
  answer_boundary: 대표 표본, 실제 운전자, 사고예측 성능이라고 말하지 않습니다.
