- id: T2-06
  status: active
  theme: T2
  rank: A
  question_ko: 왜 네 요소의 가중치가 30·30·20·20인가요?
  short_answer_ko: 주행 노출과 익숙한 환경의 안전행동을 각각 30으로 두고, 생활권 밖 안전과 최근 변화에는 각각 20을 둔 사전 설계값입니다. 네 요소가 모두 중요하되 관측량이 많은 축에 조금 더 무게를
    둔 구조이며, 실제 손해율 데이터로 다시 보정할 예정입니다.
  short_answer_en: The weights are a pre-defined design choice. Mileage and in-zone safety receive 30 each. Out-zone safety
    and pattern stability receive 20 each. We will recalibrate them with real loss data.
  why_this_answer: 자의적이지 않다고 과장하지 않고 ‘설계 이유 + 재보정 계획’을 함께 답합니다.
  product_logic: 30/30/20/20은 네 축의 상대적 중요도를 정하는 층입니다. 주행 노출과 익숙한 환경의 안전행동을 각각 30으로, 밖 안전과 최근 패턴 안정성을 각각 20으로 둔 시작값입니다. 밖 위험
    이벤트에 쓰는 12 같은 계수는 Out-Zone 축 내부에서 이벤트를 점수로 바꾸는 별도 층이므로 두 숫자는 충돌하지 않습니다.
  calculation_or_validation: 한 축이 10점 변하면 가중치 30% 축은 통합점수에 3점, 20% 축은 2점을 움직입니다. 민감도 분석에서는 969개 가중치 조합을 다시 계산해 분류가 급격히 뒤집히지
    않는 안정 구간을 확인했습니다. 현재 값은 그 구간의 후보 중심점이며 유일한 최적값은 아닙니다.
  follow_up: ‘밖 축의 가중치는 20인데 왜 위험행동 계수는 더 큰가요?’ → 두 값은 다른 층입니다. 12는 밖 위험 이벤트를 Out-Zone Safety로 바꾸는 축 내부 계수이고, 20%는 완성된 밖 점수가
    통합점수에 기여하는 비중입니다.
  answer_boundary: AI가 가중치를 정했다고 말하지 않습니다.
  presentation_source: Summary 1 · Appendix C
