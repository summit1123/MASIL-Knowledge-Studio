# 소스: 최종 제출 덱 충돌 방지 규칙
# status=active만 MCP 기본 적용. status가 없으면 legacy_reference.

meta:
  effective_date: 2026-08-10
  default_status_for_missing: legacy_reference
  mcp_filter: status == active

forbidden:
  - id: no-care-price-effect
    status: active
    expression: "'Care 자체가 자동 할증·자동 차감을 만든다'는 표현"
    reason: Care는 도움이 필요할 수 있는 달의 표시 — 직원 검토와 지원 제안으로 이어지며 자동 가격 효과 없음
    replacement: "Care 자체는 자동 할증·자동 차감을 발생시키지 않음. 연간 할인율은 연간 통합 기록으로 별도 계산 (사례의 연간 시뮬레이션 결과 언급은 허용)"

  - id: no-current-13-point-policy
    status: active
    expression: "13%p를 확정 요율·고정 차감 정책으로 제시하거나 '한 달 케어 = 13%p 차감' 인과로 설명"
    reason: 13%p는 덱 p.3 Edward 사례의 연간 시뮬레이션 결과 — 한 달 Care에 대한 자동 차감 규칙이 아님
    replacement: "KO: \"13%p 차이는 이 사례의 연간 시뮬레이션 결과입니다. 한 달 Care를 받았다고 자동으로 13%p가 깎이는 규칙이 아닙니다. Care는 검토와 지원을 열고, 연간 할인율은 연간 주행 기록으로 별도 계산합니다.\" / EN: \"The 13-point difference is the simulated annual proposal for this case. It is not an automatic penalty for one month of Care. Care triggers review and support. The annual discount is calculated separately from the annual driving record.\""

  - id: no-location-only-penalty
    status: active
    expression: 생활권 밖이라는 위치만으로 감점 또는 Care review 발동
    reason: 밖은 위험 맥락이며 실제 안전행동과 동시 변화를 함께 봄
    replacement: no location-only penalty

  - id: no-54-of-60-current
    status: active
    expression: 54/60을 최신 환경 간 실질 일치로 제시
    reason: 내부 계산(deep 레이어) 기준으로 재집계한 최신값은 59/60
    replacement: 59/60, 남은 1명은 문턱 사례

  - id: no-target-as-measurement
    status: active
    expression: 500명·15–20%·+2%p를 실측·예측·성과로 설명
    reason: 파일럿에서 검증할 목표값
    replacement: target, not a measurement or forecast

  - id: no-final-rate-validation
    status: active
    expression: 합성 시뮬레이션으로 최종 요율·사고 감소·예측력이 검증됐다고 주장
    reason: 검증 범위는 재현성·규칙 실행·예외 처리
    replacement: product-logic validation using synthetic scenarios

  - id: no-deck-unsupported-literature
    status: active
    expression: Sumagaysay 또는 LexisNexis를 Appendix A의 해당 주장 근거로 방어
    reason: 최종 문헌 검토에서 해당 문장을 뒷받침하지 못함
    replacement: 근거 한계를 인정하고 확인된 문헌이 지지하는 범위만 답변

  - id: no-unconditional-kca-braking-generalization
    status: active
    expression: 고령 운전자의 일반 제동 반응이 2.28초이며 모든 상황에서 비고령자보다 90% 느리다고 설명
    reason: 2.28초 대 1.20초는 시야 제한 돌발 상황의 비교값이며 같은 시험의 다른 조건에는 일반화할 수 없음
    replacement: 시야가 제한된 돌발 상황에서 2.28초 대 1.20초가 관찰됐다고 조건을 함께 말함

  - id: no-legacy-label-for-final-artifacts
    status: active
    expression: 최종 제출 덱 또는 최종 대시보드를 old·legacy·과거 데모로 지칭
    reason: 결선 제출 산출물 — legacy 지칭은 산출물 신뢰를 스스로 훼손 (레거시는 30명 구데모 등 실제 과거 산출물에만 해당)
    replacement: 최종 덱·최종 대시보드로 지칭

  - id: no-internal-version-names-public
    status: active
    expression: "내부 버전명(V20, V20 계약, pending next version 등)을 공개 답변·position·카드·용어 본문에 사용"
    reason: 내부 관리 명칭 — active 레이어에서 제거 (history 레이어와 파일명은 유지)
    replacement: 버전명 없이 최종 덱 기준으로 서술

  - id: no-hold-as-risk-tier
    status: active
    expression: Hold(보류)를 네 번째 등급 또는 위험 등급으로 설명
    reason: Hold는 데이터 부족 시 판정을 보류하는 데이터 상태 — 불이익 없음
    replacement: 월별 등급은 Favorable·Standard·Care 세 가지, Hold는 no-penalty 데이터 상태

  - expression: 80,002건
    reason: 오타 (취소선 표기)
    replacement: 80,032건
  - expression: 2M/12M
    reason: 백만으로 읽힘 — 표기 금지
    replacement: 2개월 기준선 + 12개월 평가 (총 14개월)
  - expression: 고정 기준 120/54/6 (연간 판정)
    reason: 구버전 고정 기준값 (취소선 표기)
    replacement: 우대 118 / 기본 56 / 보류 6 · 케어 30 (rolling 확정, 8/2 재시뮬)
  - expression: min_pts
    reason: 기술 표기보다 문장 표현 우선
    replacement: 서로 다른 3일 이상 방문
  - expression: eps 150m
    reason: 7/13 합성 비교실험의 당시 후보값 — 쓰지 말 것
    replacement: 260m 단일 (채택 기준값)
  - expression: "케어 '전원 5~7개월'"
    reason: 인용 금지 (취소선 표기) — 지도가 새 목적지를 흡수해 조기 해제됨
    replacement: 케어 월수 전원 1개월
  - expression: 민감도 고정 기준 4/12
    reason: 구버전 (취소선 표기)
    replacement: ±5 이웃 19개 중앙 3건·최대 9건 (rolling 재실행 8/2)
  - expression: "\"±5에서 0~6건\""
    reason: 구버전 (취소선 표기)
    replacement: ±5 이웃 19개 중앙 3건·최대 9건
  - expression: 더 낮음 고정 114건
    reason: 구버전 고정 기준값 (취소선 표기)
    replacement: 더 낮음 113건 (rolling)
  - expression: "\"5~7%p\" 단독 표기"
    reason: 단독 표기 금지
    replacement: 1~7%p 점수 비례 (75점=1, 100점=7)
  - expression: "\"eTAS는 없는 명칭\""
    reason: 이전 카드의 표기가 오류였음 — 정정. eTAS는 실재 명칭(한국교통안전공단 운행기록분석시스템)
    replacement: eTAS = 위험운전행동 정의의 표준 (써머리 표기 유지)
  - expression: "\"합성을 eTAS 임계로 생성했다\""
    reason: 합성 엔진에 eTAS 임계 구현 없음
    replacement: "\"유형 정의는 eTAS 표준, 합성 빈도는 LongROAD 0.35g 앵커, 실서비스에서 eTAS 임계 적용\""
  - expression: "\"TEFFT\" 단독 표기"
    reason: 표기 금지
    replacement: Ehsani & Tefft 2021 (CHANCE 34(1))
  - expression: "Candrive \"동일 연령대 3배\""
    reason: 원문(Marshall et al. 2023)에 3배 없음 — 금지
    replacement: "\"최대 5배\" (고위험 5.26배, 95% CI 2.81–9.84)"
  - expression: "\"사고빈도\" (Candrive 맥락)"
    reason: 원문은 주행거리 보정 위험
    replacement: "\"사고 위험(거리 보정)\""
  - expression: "\"CANDRIVE→CMT 교체\" 지시"
    reason: 종전 지시 폐기
    replacement: Candrive 유지 + 숫자 정정
  - expression: "DRIVES \"사고 이전\""
    reason: 표기 정정
    replacement: "\"진단 이전\""
  - expression: Nemotron 데이터셋을 썼다는 서술
    reason: 데이터셋 사용 아님
    replacement: 방법론을 따라 자체 정의
  - expression: MCI 60%/치매 81% · 제동 2.28초/90% · 55.7% vs 27.5%
    reason: 인용 금지 — 출처부록 ✕ 등급
  - expression: "\"AI가 가중치를 골랐다\"로 읽히는 서술"
    reason: AI는 초기 규칙 후보 생성까지, 값은 사람이 결정
    replacement: AI는 초기 규칙 후보 생성, 값은 사람이 결정
  - expression: "엔진값 260/520/1,100을 '지역 보정'으로 설명"
    reason: 지역 보정이 아님
    replacement: 합성 지리 축척(×2/×4.2) 정합용 — 실세계 260 단일과 등가
  - expression: "'data' (단독 표기)"
    reason: 실주행 데이터로 오인 소지 — 심사 지적 사항
    replacement: 합성 시나리오(synthetic scenarios)
  - expression: "\"실제 드라이빙 로그를 바탕으로 6개 운전자 범주 및 30명\""
    reason: 1차 자료의 부정확한 서술 — 실제 로그의 경험적 분포를 직접 사용한 적 없음
    replacement: 합성 데이터, 6유형 60명 로스터 × 3환경 = 180 시나리오 × 14개월
  - expression: "\"위치데이터 6개월 삭제 의무\""
    reason: 그런 조항은 없음 — 제23조는 목적 달성 시 즉시 파기 원칙, 6개월은 취급대장 보관 하한
    replacement: "\"기준은 기간이 아니라 목적\" + \"어느 해석의 보존 한도에도 저희 구조가 부합\""
  - expression: "\"도심 eps가 작고 농촌이 크다\" (방향 방어)"
    reason: 검증된 바 없는 가정 — 합성 데이터는 그 값을 넣어 만들었으므로 순환이라 확인 불가; 반대(도심 주차난 산포)가 더 그럴듯할 수 있음
    replacement: 방향은 주장하지 않음 — 실험 A(단일 eps 재판정 고정 기준 0/180 · rolling 재검증 3/180(경계))로 논쟁이 결과를 바꾸지 않음을 제시
  - expression: "\"밖이 위험하다\" / 위치 벌점 시사"
    reason: 우리 결론이 아님 — 문헌도 상반(Ehsani vs Burdett)·리뷰도 불확실
    replacement: "\"평소 대비 이동과 행동이 동시에 급변했는가\"; 위치 벌점 0"
  - expression: 사고 심도 예측 시사
    reason: 산식에 심도 항이 없음 — 심도는 예측하지 않음
    replacement: "\"케어의 목적은 심도 예측이 아니라 '사람이 점검할 시점'의 감지\""
  - expression: 합성 실측 수치로 오탐(우연 방문지 오인) 방어 주장
    reason: 합성 데이터는 설계상 우연 방문지가 드묾 — 미탐 방어 실측 한정
    replacement: 오탐 방어는 푸아송 확률 논리(임계 3일 시 8.0%)로만 주장
  - expression: "\"위치정보법 때문에 (업계가) 위치를 안 쓴다\""
    reason: 인과를 밝힌 문헌 미확인
    replacement: KIRI리포트의 구조 선례(점수만 전송)로만 언급, 인과 미주장
  - expression: Lally 2010(66일)을 기준선 2개월의 근거로 인용
    reason: 새 습관의 형성 기간 연구(n=96, 12주)이지 기존 패턴 관측 기간 근거가 아니며 범위 18~254일로 넓음
    replacement: 시간 스케일 방향성 참고로만; 2개월의 근거는 거점 검출에 필요한 관측량
  - expression: "\"3일 고정\""
    reason: Isaacman 도출 방식과의 일치가 논거 — 고정 상수처럼 말하면 근거가 끊김
    replacement: "\"관찰 창의 5% = 서로 다른 3일\""
  - expression: 실험 A(단일 eps 재판정)와 실험 B(3지형 배치) 혼용 서술
    reason: 서로 다른 실험 — 발표에서 섞어 말하지 않기로 명시
    replacement: 실험 A = 우리 파라미터 변경(고정 기준 0/180 · rolling 재검증 3/180 경계), 실험 B = 고객 지형 변경(케어 60/60 · 우대 54/60)으로 분리 서술
  - expression: 운전 연구 선례(UMTRI·DRIVES·Candrive)와 Isaacman 통신 데이터 계열 혼용
    reason: "담당 질문이 다름 — 전자는 '왜 2개월', 후자는 '왜 3일'"
    replacement: 두 계열을 분리해 각각의 질문에 대응
  - expression: 감액 13%p를 확정 요율로 제시
    reason: 요율 샌드박스의 손익 예시값 (source_status = illustrative_economics_sandbox_not_final_tariff)
    replacement: "\"손익 예시값이며 운영상 개입은 벌점·할증이 아니라 사람 검토와 예방 지원\""
  - expression: "LongROAD ML '집 15마일 이내 통행 비율'을 확정 근거로 인용"
    reason: 저자가 preliminary로 규정
    replacement: 개념 근거로만 인용
  - expression: "\"월 점수는 위치정보가 아니므로 규제와 무관\""
    reason: 고객별 월 점수는 위치정보가 아니어도 개인정보로 계속 규율됨
    replacement: "\"위치정보가 아니라 개인정보 일반 체계로 관리\"까지만 주장"
  - expression: "30~50대 조기 신호 문헌이 '없다'는 단정"
    reason: 부재 증명 불가
    replacement: "\"저희가 확인한 범위에서 30~50대 코호트에 대응하는 문헌은 찾지 못했다\""
  - expression: 경로당 주 2.9회·복지관 주 1.5회를 전체 노인 통계로 제시
    reason: 해당 시설을 생활 거점으로 삼는 이용자 기준; 복지관 수치는 단일 언론 인용으로 재확인 중
    replacement: "\"경로당 이용자 기준 주 2.9회\" 등 이용자 기준 명시"
  - expression: 실제 드라이빙 로그 기반 30명
    reason: 1차 자료의 부정확한 표현으로 공식 정정됨 — 실물은 합성 데이터
    replacement: 합성 데이터(synthetic scenarios) · 6유형 60명 로스터 × 3환경 = 180 시나리오 · 14개월
  - expression: 루프 / multi-agent loop / Agent–Validator Loop
    reason: 반복 탐색이 존재하지 않아 부정확 — 용어 철회 확정(9번)
    replacement: multi-agent pipeline(생성→검토→승인 체인) 또는 agent-assisted design process
  - expression: "'300만원' 통계"
    reason: 원출처 미확인 — 덱에서 제거 확정(12번)
    replacement: 인용하지 않음 (심도 배경은 ERSO 5배·TAAS 치명률 가중으로)
  - expression: "MDPI 15(22):12278 방법 이식 주장"
    reason: 대상이 인구 격자(집계 레벨)라 개인 생활권과 스케일 상이 · 발표 인용 전 원문 재확인 필요
    replacement: "'지역별 임계값의 타당성' 근거로만 한정 인용"
  - expression: 국내 도로 위계별 건수·심도 수치 인용
    reason: 출처 미확인(13번 C)
    replacement: "도시/농촌 대비(NHTSA 2021: 주행 32% vs 사망 40%, 1.74 대 1.19)까지만"
  - expression: 뷜만 신뢰도를 적용했다
    reason: Z = n/(n+k)를 수치로 추정한 적 없음 — 수위 과장(11번 ③)
    replacement: 신뢰도 원리를 따른 보수적 근사(0/1 두 단), 파일럿 분산 실측으로 정식 추정 대체
  - expression: 완전 지역 중립
