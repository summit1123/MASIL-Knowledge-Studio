      - id: p3-dashboard-label
        text_en: "Actual Dashboard Interface - Edward Clark (b. 1953)"
        kind: label
        status: as_printed
        note_ko: 이 화면이 최종 대시보드다. old/legacy/과거 데모로 지칭하지 않는다.

      - id: p3-same-conditions
        text_en: "Same conditions, Different behavior — Same vehicle class (base premium $604) · same existing tariff. Under the existing mileage scheme both would pay the same premium"
