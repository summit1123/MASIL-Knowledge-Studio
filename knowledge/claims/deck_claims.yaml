        status: as_printed
        note_ko: Care review는 직원 검토·지원 신호이지 자동 할증이 아니다. 위치·거리가 아닌 행동 변화가 판정을 갈랐다.

      - id: p3-distance-outzone
        text_en: "Annual distance 2,473.6 km vs 2,510.1 km · Out-of-zone share 7.3% vs 11.1%"
        kind: statistic
        status: as_printed
        note_ko: 존 밖 비중이 더 큰 Frank가 Favorable — 위치만으로 감점하지 않는다는 근거로 사용.

      - id: p3-risky-events
        text_en: "Risky events · 12M evaluation: 209 vs 10"
        kind: statistic
        status: as_printed
        note_ko: 판정을 가른 핵심 변수(위험행동). 그대로 인용 가능.

      - id: p3-safety-scores
        text_en: "In-zone safety score 77.3 vs 97.7 · Out-of-zone safety score 47.9 vs 95.8 · Annual average score 81.6 pts vs 98.4 pts"
        kind: statistic
        status: as_printed
        note_ko: 대조표 점수 3종. 인쇄값 그대로 말한다.

      - id: p3-tariff-13-point
        text_en: "Existing mileage: 16% · $508 (both). MASIL proposal: 3% · $586 (Edward) vs 22.6% · $468 (Frank)"
        kind: statistic
        status: as_printed_needs_context
        note_ko: "13%p 공식 문안 — '13%p 차이는 이 사례의 연간 시뮬레이션 결과입니다. 한 달 Care를 받았다고 자동으로 13%p가 깎이는 규칙이 아닙니다. Care는 검토와 지원을 열고, 연간 할인율은 연간 주행 기록으로 별도 계산합니다.' 확정 요율·고정 차감 정책으로 제시하지 않는다."

      - id: p3-measured-contrast
        text_en: "Measured contrast: among the 180 scenarios, the opposite-decision case in the same vehicle class (and the same existing tariff when available) with the closest annual distance. What split the tariff was behavior (co-occurring risky-behavior change), not distance or location."
        kind: design
        status: as_printed
        note_ko: 대조 사례 선정 기준과 결론 문장. 거리·위치가 아닌 행동이 갈랐다는 공개 문안.

