  - page: 5
    title: "Appendix - A — Why Senior Drivers? / What's the Current Situation?"
    claims:
      - id: p5-oecd-2030
        text_en: "1 in 4 OECD drivers will be 65+ by 2030 (OECD, 2001)"
        kind: citation
        status: as_printed_needs_context
        note_ko: 원문 통계는 drivers가 아니라 persons(인구) 기준. 구두로 말할 때는 persons로 보정한다.

      - id: p5-eu-road-deaths
        text_en: "Aged 65+ make up 21% of population but 31% of road deaths (EU Commission, 2025)"
        kind: statistic
        status: as_printed
        note_ko: 인구 비중 대비 사망 비중. 인쇄값 그대로.

      - id: p5-erso-5x-fatality
        text_en: "Drivers 75+: 5x higher fatality risk at equal exposure (ERSO, n.d.)"
        kind: statistic
        status: as_printed
        note_ko: fatality(심도) 기준이다. 사고 빈도와 신체 취약성에 따른 심도를 구분해 말한다.
        evidence_ref: presentation-erso-older-driver-risk

      - id: p5-chen-cognitive-first
        text_en: "Cognitive decline shows up first in driving/mobility patterns — before any accident (Chen et al., 2025, Neurology)"
        kind: citation
        status: as_printed
        note_ko: 패턴 변화 감지의 의학적 근거. MASIL이 인지장애를 진단한다고 말하지 않는다.
        evidence_ref: presentation-chen-2025-neurology

      - id: p5-cicchino-71
        text_en: "71% of older drivers' inadequate surveillance errors came from looking but not seeing, rather than failing to look (vs. 40% for middle-aged drivers) (Cicchino & McCartt, 2015)"
        kind: statistic
        status: as_printed
        note_ko: inadequate surveillance 오류 중의 비율이다. 전체 사고 원인의 71%로 말하지 않는다.
        evidence_ref: presentation-cicchino-mccartt-2015

      - id: p5-ehsani-25x
        text_en: "Under same road conditions, first-time travelers have 2.5x likelihood of accident involvement (Ehsani & Tefft, 2021)"
        kind: statistic
        status: as_printed
        note_ko: p.1과 동일 근거의 재등장. crash involvement 표현 유지.
        evidence_ref: presentation-ehsani-tefft-2021

      - id: p5-iihs-intersection-43
        text_en: "Multi-vehicle fatal intersection crashes: 43% for drivers 80+ vs. 24% for ages 16-59 (IIHS, 2024)"
        kind: statistic
        status: as_printed
        note_ko: 교차로 다중차량 치명 사고 비중. 인쇄값 그대로.

      - id: p5-vivoda-self-regulation
        text_en: "Seniors self-regulate as ability declines — avoiding night driving (58.8%) & unfamiliar areas (11%) (Vivoda et al., 2021)"
        kind: statistic
        status: as_printed
        note_ko: 초기 자기조절 행동 관찰치. 전체 고령자가 모두 회피한다고 일반화하지 않는다.
        evidence_ref: presentation-vivoda-2021

      - id: p5-license-renewal
        text_en: "Protracted Driver's License Renewal Cycles — renewal cycles fail to keep pace with elderly drivers' frequent cognitive changes (Budget Direct Insurance, 2026; KOTRA, 2018)"
        kind: citation
        status: as_printed
        note_ko: 규제 공백 프레임의 근거.

      - id: p5-conditional-licensing
        text_en: "The Conditional Licensing Dilemma — backlash over age discrimination stalls policy, while blanket restrictions risk isolation and depression (Chihuri et al., 2016)"
        kind: citation
        status: as_printed
        note_ko: 연령차별 질문(P0-13) 대응의 출발점 — 일괄 제한의 부작용 근거.

      - id: p5-sumagaysay-ubi-gap
        text_en: "Mileage metrics misclassify low-frequency, high-severity seniors as low-risk, while behavior (UBI) metrics fail to capture physical and cognitive decline (Sumagaysay, 2026)"
        kind: citation
        status: printed_correction_planned
        note_ko: 출처 캡처가 이 주장을 뒷받침하지 않아 8/18 수정본에서 제거 예정. 무대에서 이 출처로 방어하지 않는다. 기존 상품 한계는 다른 근거로 설명.
        evidence_ref: presentation-sumagaysay-2026

      - id: p5-enrollment-045
        text_en: "Elderly safety-education discount rider: 0.5% enrollment rate, 45% of non-UBI subscribers say discounts aren't attractive enough (LexisNexis Risk Solutions, 2015; iNews24, 2024)"
        kind: statistic
        status: printed_correction_planned
        note_ko: "45%(LexisNexis)는 fleet telematics 맥락이라 8/18 제거 예정 — 방어 금지. 0.5%(iNews24)는 유지하며 반전 문안으로 사용: '0.5%는 교육 이수를 먼저 요구한 특약의 가입률 — 우리는 선행 비용을 제거했다.'"
        evidence_ref: presentation-lexisnexis-2015

      - id: p5-masil-solution-row
        text_en: "MASIL Rider — how we solve this: 2-month baseline pattern-change detection · mobility protection with safe-driving encouragement · senior-specific benefits + risk segmentation · preventive care delivery (calls, texts, family alerts)"
        kind: design
        status: as_printed
        note_ko: 해결책 4열 요약. Care 대상에게는 예방적 아웃리치가 간다는 문안 포함.

  - page: 6
    title: "Appendix - B — How is MASIL Zone formed?"
    claims:
      - id: p6-zone-formation-steps
        text_en: "Visit Events (1 visit record = 1 point with a date) - Repeated Anchors (3+ distinct visit days within epsilon=260m, x=noise) - Core Zone 500m (uniform minimum radius) - Per-Anchor P90 Buffer (final radii combined into the personal MASIL Zone, x=Outer)"
        kind: design
        status: as_printed
        note_ko: 존 형성 4단계. 반복 방문 앵커 + 개인별 반경이라는 구조를 그대로 설명.

      - id: p6-distinct-day-variant
        text_en: "MASIL distinct-day Variant: Core_MASIL(p) holds iff the number of distinct dates among neighbors within epsilon is >= 3 (DBSCAN + min_distinct_days = 3). Repeated events on the same day count as 1 day toward core support"
        kind: design
        status: as_printed
        note_ko: 같은 날 여러 기록은 1일로 계산. 앵커 판정의 핵심 규칙.

      - id: p6-radius-formula
        text_en: "Zone radius after clustering: r_h = max(500m, min(r90_h, 2km)) — epsilon is for anchor detection · 500m / P90 / 2km define the zone radius"
        kind: design
        status: as_printed
        note_ko: 앵커 탐지(260m)와 존 반경(500m/P90/2km)의 역할 분리를 명확히 말한다.

      - id: p6-epsilon-footnote
        text_en: "epsilon=260m is MASIL's proposed starting value, referencing Zheng's 200m (stay-point) and Montoliu's 250m / 200-300m (DBSCAN Dmax) — not a value taken directly from any paper. The operational value is recalibrated using the distance distribution of distinct-day neighbors and cluster stability"
        kind: citation
        status: as_printed
        note_ko: 260m는 논문 직접값이 아니라 제안 시작값. 파일럿에서 재보정한다는 문안이 덱에 인쇄돼 있다.
        evidence_ref: [presentation-zheng-2009, presentation-montoliu-gatica-perez-2010]

      - id: p6-isaacman-2month
        text_en: "Isaacman et al. (2011): repetition across multiple days explains a place's importance better than records concentrated in a single day. 60-day observation criterion — multiple records on the same day = 1 day · 3+ distinct days required"
        kind: citation
        status: as_printed
        note_ko: 2개월 기준선과 distinct-day 규칙의 문헌 근거.
        evidence_ref: presentation-isaacman-2011

      - id: p6-outer-neutral
        text_en: "Outer Zone represents neutral mobility context · 260m and the 2-month baseline are operational starting values (separate from care detection's preceding 2 months)"
        kind: design
        status: as_printed
        note_ko: 생활권 밖은 중립적 이동 맥락 — 위치만으로 감점하지 않는다는 공개 계약과 직결.

      - id: p6-hdbscan-gate
        text_en: "DBSCAN distinct-day = operational baseline (explainable by distance and repeat days). HDBSCAN = density-adaptive challenger. Swap gate: triggered when a fixed epsilon repeatedly fails in specific environments; must improve stability on the same visit events without noise or over-segmentation"
        kind: design
        status: as_printed
        note_ko: 왜 DBSCAN이 기본인지(설명가능성 우선)와 교체 조건. 추궁 시 사용.

  - page: 7
    title: "Appendix - C — How were the weights in the MASIL scoring formula determined?"
    claims:
      - id: p7-weights-candidate
        text_en: "Current weights are not the final values, but a validated stable candidate. Initial weights were set based on the risk exposure structure and validated through sensitivity analysis. (Example: Mileage 30%, In-zone safe driving 30%, Outside-zone safe driving 20%, Driving pattern change 20%)"
        kind: design
        status: as_printed
        note_ko: 30/30/20/20은 확정값이 아닌 검증된 안정 후보. 이 문장이 덱의 공식 지위다.

      - id: p7-explainable-by-design
        text_en: "Weights are human-defined for explainability, while risk scoring is performed by fixed rules. Loss ratio data is not yet available; therefore, the current weights are initial values designed for future recalibration"
        kind: design
        status: as_printed
        note_ko: 손해율 데이터 부재를 덱이 스스로 명시 — 합성 데이터 한계 질문의 1차 방어선.

      - id: p7-weight-principle
        text_en: "Weights reflect data reliability. In-zone (30%): more observations, higher confidence. Out-zone (20%): fewer observations, supporting factor. 30:30:20:20 is a practical starting point, not a fixed rule"
        kind: design
        status: as_printed
        note_ko: 관측량-신뢰도 원칙. 왜 이 가중치냐(P0-11)의 핵심 답변.

      - id: p7-sensitivity-969
        text_en: "Validation: sensitivity analysis — 969 weight combinations x 180 simulated drivers. Classification was driven mainly by Mileage and In-zone safe driving. The selected 30% weights lie in the most stable region before rapid classification changes"
        kind: statistic
        status: as_printed
        note_ko: 969 조합 민감도 분석의 결론. 상세 수치는 deep 레이어 — 추궁 시에만 꺼낸다.

  - page: 8
    title: "Appendix - D — How is the synthetic simulation structured, and what does it validate?"
    claims:
      - id: p8-simulation-map
        text_en: "Four stages with separated owners: (1) define validation cases (People), (2) build personas/movement (Nemotron + AI), (3) 14-month deployment (Simulation), (4) validate product logic (Product Rules). Separating hypothesis, persona, driving, and judgment roles keeps expected results from contaminating the judgment"
        kind: design
        status: as_printed
        note_ko: 기대 결과가 판정을 오염시키지 않게 역할을 분리했다는 통제 원칙.

      - id: p8-14month-structure
        text_en: "14-month scenario deployment: pattern observation 2 months + change·evaluation 12 months. 2 months is the simulation's baseline observation period"
        kind: design
        status: as_printed
        note_ko: p.2의 2M/12M 표기가 여기서 개월로 풀려 있다.

      - id: p8-scale-repeat
        text_en: "60 people (6 types x 10 people) · 180 scenarios · 3 regions (urban, suburban, regional) · 80,032 events synthetic visit·trips"
        kind: statistic
        status: as_printed
        note_ko: p.2 검증 규모의 재등장. 숫자 동일.

      - id: p8-persona-table
        text_en: "Six persona types with hypothesis, Expected and Result columns: Self-Regulating (Favorable/Favorable), Risky-Within-Life-Zone (Standard/Standard), Route-Changing Safety-Maintaining (Standard/Standard), Movement/Risk Co-Changing (Care/Care), Multiple MASIL Zone (Standard/Standard), Wide-Area/Stable (Favorable/Favorable)"
        kind: statistic
        status: as_printed
        note_ko: 6개 페르소나 가설-결과 표. 가설 검증 구조(역가설 포함)를 보여주는 핵심 표.

      - id: p8-persona-row2-result
        text_en: "Row 2 — Risky-Within-Life-Zone Type: Expected Standard · Result Standard (close-to-home effect counter-hypothesis)"
        kind: statistic
        status: as_printed_needs_context
        note_ko: 인쇄된 Result가 실측 시뮬레이션 결과와 불일치. 이 행의 결과를 방어하기 전에 실측 기준으로 확인하고, 질문이 오면 실제 결과 기준으로 설명한다.

      - id: p8-sciencedirect-refs
        text_en: "Reference literature column cites 'close-to-home effect, ScienceDirect 2017' and 'ScienceDirect, 2021'"
        kind: citation
        status: printed_correction_planned
        note_ko: ScienceDirect는 플랫폼명이지 저자가 아니다. 8/18 수정본에서 실제 저자·논문 표기로 정정 예정. 무대에서 ScienceDirect를 출처명으로 말하지 않는다.

      - id: p8-557-national
        text_en: "National data: ~55.7% of elderly driver traffic accidents correspond to 'failure to maintain safe driving'"
        kind: statistic
        status: as_printed
        note_ko: Movement/Risk Co-Changing 페르소나의 참고 문헌 칸에 인쇄된 국내 통계.

      - id: p8-validated-scope
        text_en: "What Was Validated: computation reproducibility, product rule execution, exception/hold processing, prevention of location-only disadvantage. What Was NOT Validated: finalized optimal formula, actual premium/discount rate, accident/loss-ratio improvement, actual customer acceptance"
        kind: design
        status: as_printed
        note_ko: 합성 데이터가 검증한 것/못 한 것(P0-12)의 공식 문안. 규칙 일관성은 검증, 실제 손해율은 미검증.

