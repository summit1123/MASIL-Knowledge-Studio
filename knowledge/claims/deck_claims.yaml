pages:
  - page: 1
    title: "SUMMARY 1 — AI-Based Senior Auto Insurance Innovation · Senior MASIL Zone Mileage Rider"
    claims:
      - id: p1-rider-tagline
        text_en: "Senior MASIL Zone Mileage Rider — Not just how little they drive, but how safely they drive in familiar zones."
        kind: label
        status: as_printed
        note_ko: 상품 한 줄 정의. 마일리지 특약에 MASIL Zone 안정성·존 밖 안전·패턴 변화를 반영한다는 프레임.

      - id: p1-senior-accidents-up
        text_en: "Overall traffic accidents 1.3% down, senior driver accidents 8.3% up (Korea Road Traffic Authority, n.d.)"
        kind: statistic
        status: as_printed
        note_ko: 전체 사고 감소 대비 고령 운전자 사고 증가. 출처는 도로교통공단 TAAS.

      - id: p1-braking-228
        text_en: "Braking reaction time: 2.28s (+90% vs. non-elderly) (KCA, 2024)"
        kind: statistic
        status: as_printed_needs_context
        note_ko: 시야가 제한된 돌발 상황 조건의 수치(고령 2.28초 vs 비고령 1.20초). 모든 상황에서 무조건 90% 느리다고 일반화하지 않는다. 같은 시험의 교차로 우회전 조건 차이는 0.02초.
        evidence_ref: presentation-kca-2024-elderly-drivers

      - id: p1-intersection-judgment
        text_en: "Accidents cluster at intersections/yielding — judgment risk, not attention (McGwin et al., 1999)"
        kind: citation
        status: as_printed
        note_ko: 부주의가 아니라 상황 판단 위험이라는 프레임의 근거.
        evidence_ref: presentation-mcgwin-brown-1999

      - id: p1-firsttime-25x
        text_en: "First-time routes have 2.5x higher crash risk (Ehsani & Tefft, 2021) — burden of unfamiliarity affects elderly drivers more severely"
        kind: statistic
        status: as_printed
        note_ko: crash involvement 표현 유지. 고령자만의 효과로 일반화하지 않는다.
        evidence_ref: presentation-ehsani-tefft-2021

      - id: p1-three-tiers
        text_en: "Favorable · Standard · Care Tier"
        kind: label
        status: as_printed
        note_ko: 공개 상품 계약 — 월별 결과는 세 등급으로 설명한다. Hold는 네 번째 위험 등급이 아니라 데이터 부족 시 판정을 보류하는 데이터 상태(불이익 없음). Care는 검토·지원으로 이어지며 자동 할증·차감을 만들지 않는다.

      - id: p1-four-factors
        text_en: "4 Weighted Factors: Mileage Score ex. 30% · IN-Zone Safety ex. 30% · Out-Zone Safety ex. 20% · Pattern Change ex. 20% (see Appendix C)"
        kind: design
        status: as_printed
        note_ko: "'ex.' 표기 그대로 예시 시작값이다. 확정 가중치가 아니라 검증된 안정 후보(Appendix C)."

      - id: p1-masil-zone-def
        text_en: "What is a MASIL-Zone? A personalized activity zone, built from repeatedly visited locations. Auto-calibrated using more than 3 visitings filtering & each individual's P90 visit distribution (2-month baseline). Core Zone · Buffer Zone · Outer Zone"
        kind: design
        status: printed_correction_planned
        note_ko: "'more than 3 visitings'는 오타 — 정확한 규칙은 '3+ distinct visit days'(서로 다른 방문일 3일 이상). 8/18 수정 예정. 구두에서는 distinct visit days로 말한다."

      - id: p1-current-limitations
        text_en: "Regulation cannot keep up, and current products cannot distinguish the risk"
        kind: label
        status: as_printed
        note_ko: 규제·기존 상품 한계 요약. 문제 정의의 마무리 문장.

  - page: 2
    title: "SUMMARY 2 — Senior Driver MASIL Zone Rider: pipeline · principles · validation scale · roadmap"
    claims:
      - id: p2-pipeline
        text_en: "GPS Synthetic Data (generate driving logs using synthetic driver profiles) - DBSCAN + P90 (auto-generate Masil zones: Core·Buffer·Outer) - Simulation Execution: rule-based grading (Favorable / Standard / Care) without AI - AI Report: provide Reason Codes, explainable results"
        kind: design
        status: as_printed
        note_ko: 판정은 규칙 기반이고 AI는 설명 리포트(Reason Codes)만 담당한다. 덱에 인쇄된 핵심 아키텍처 문장.

      - id: p2-ai-principle
        text_en: "Core Principle — AI does not determine the premium. Minimum collection · POI masking · Right separation"
        kind: design
        status: as_printed
        note_ko: AI가 하는 것/안 하는 것 질문의 1차 답변. 프라이버시 3원칙 포함.

      - id: p2-mobility-86
        text_en: "86% — Senior drivers' hope to preserve their mobility rights"
        kind: statistic
        status: printed_correction_planned
        note_ko: 덱에 출처 미표기. 8/18 수정본에서 출처 표기 또는 문구 조정 예정. 그 전까지 무대에서 무출처 단정으로 사용하지 않는다.

      - id: p2-validation-scale
        text_en: "Validation Scale — 60 Drivers (6 driver types x 10 drivers x 3 regions: urban, suburban, regional) · 180 Scenarios · 80,032 Logs"
        kind: statistic
        status: as_printed
        note_ko: 합성 시뮬레이션 검증 규모. 숫자 그대로 인용 가능.

      - id: p2-2m-12m
        text_en: "2M Baseline & 12M Evaluation"
        kind: label
        status: as_printed_needs_context
        note_ko: 2M=2개월 기준선, 12M=12개월 평가라는 뜻. 구두에서 months임을 명시해 2 million 등으로 오독되지 않게 한다.

      - id: p2-roadmap-targets
        text_en: "Pilot 0-6M: validate with a real-world driving cohort (Synthetic to Real Data), Target: 500 drivers / Scale up 6-18M: limited commercial launch, expected voluntary enrollment 15-20% / Roll out 18+M: expand to general drivers (ages 30-50), expected retention increase +2%p"
        kind: statistic
        status: as_printed_needs_context
        note_ko: 500명·15-20%·+2%p는 전부 목표(target)이며 실측이 아니다. 0.5% 반전 문안과 함께 목표로만 말한다.

      - id: p2-mobility-rights
        text_en: "Guaranteeing Mobility Rights: No regulation but support — guaranteeing mobility that goes beyond discounts, built on trust and care, so drivers voluntarily choose and sustain it"
        kind: label
        status: as_printed
        note_ko: 규제가 아닌 지원이라는 사회적 포지셔닝 문장.

  - page: 3
    title: "Appendix - Dashboard — Edward Clark vs Frank Wilson contrast table"
