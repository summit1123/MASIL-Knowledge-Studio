# 소스: 최종 제출 덱·최종 용어 단어장
# status=active 용어는 현재 표현 계약. 나머지는 옛 표현·동의어·충돌 탐지용 semantic support다.

meta:
  effective_date: 2026-08-10
  default_status_for_missing: legacy_reference
  mcp_filter: status == active
  supporting_filter: status != active

terms:
  - id: masil-zone
    status: active
    korean: 생활권
    official_english: MASIL Zone
    plain_english: a personal activity zone built from repeated visits
    notes: 행정구역이나 고정 반경이 아님. 한국어 '마실 나가다'의 일상적 외출 의미를 담은 이름
    banned_variants: [Safe Zone, Living Zone, Home Zone, routine zone]

  - id: monthly-tiers
    status: active
    layer: core
    korean: 월별 세 등급
    official_english: Favorable · Standard · Care Tier
    plain_english: the three monthly result tiers shown to customers
    notes: "발표·고객 안내에서는 세 등급으로 쉽게 설명. 구현은 월 통합점수와 해당 월 Care 신호를 함께 보존하므로 Favorable 점수 조건과 Care가 동시에 성립할 수 있음. Care는 다음 달 다시 계산. Hold는 네 번째 위험 등급이 아니라 데이터 부족 시 불이익 없이 보류하는 상태"

  - id: favorable
    status: active
    layer: core
    korean: 우대
    official_english: Favorable
    plain_english: a month with an integrated score of 75 or higher
    banned_variants: [Preferred, reward]

  - id: standard
    status: active
    korean: 기본
    official_english: Standard
    plain_english: the regular monthly score result

  - id: hold
    status: active
    korean: 보류
    official_english: Hold
    plain_english: a no-penalty hold when there is not enough data
    notes: 네 번째 위험 등급이 아니라 데이터 상태 — 데이터 부족 시 판정을 보류하며 불이익 없음

  - id: care-review
    status: active
    layer: core
    korean: 케어 검토
    official_english: Care review
    plain_english: staff review and a support offer for a Care month
    notes: "월별 세 등급 설명에서 Care는 도움이 필요할 수 있는 그달을 표시. 다음 달에는 다시 계산하며 지속 건강관리 등급이 아님. 직원 검토와 지원 안내로 이어지고 자동 할증·자동 차감은 없음"
    banned_variants: [pricing tier]

  - id: two-independent-axes
    status: active
    layer: deep
    korean: 두 축
    official_english: two independent axes
    plain_english: internal calculation view — the score result and the Care signal are computed separately
    notes: "기술 레이어(추궁 시만): 내부 계산에서는 점수 판정과 Care 신호가 별도로 계산되며, Favorable과 Care가 같은 달에 함께 나타날 수 있음. 공개 설명은 월별 세 등급"

  - id: monthly-integrated-score
    status: active
    korean: 월 통합점수
    official_english: monthly integrated score
    plain_english: the weighted monthly score from four factors

  - id: annual-score
    status: active
    korean: 연간 점수
    official_english: annual score
    plain_english: the average of eligible monthly integrated scores shown for the year
    notes: 현재 화면의 설명용 숫자. 기본 할인율은 기존 마일리지 할인표로 계산하고 Favorable 자격은 9개월 기준으로 판단

  - id: annual-verdict
    status: active
    korean: 연간 판정
    official_english: annual verdict
    plain_english: the annual result shown after 12 evaluation months
    notes: Care review와 혼동하지 않음

  - id: additional-discount
    status: active
    korean: 추가 할인
    official_english: additional discount
    plain_english: an extra discount qualification after 9 Favorable months
    notes: 현재 샌드박스 후보값은 +3%p, 전체 할인율 상한 45%. 최종 요율은 파일럿·계리 검증 대상

  - id: core-buffer-outer
    status: active
    korean: 중심권 · 완충권 · 바깥
    official_english: Core Zone · Buffer Zone · Outer Zone
    plain_english: the inner area, personal buffer, and outside context
    notes: Outer Zone은 자동 감점이 아님

  - id: anchor
    status: active
    korean: 거점
    official_english: anchor
    plain_english: a place visited on at least three different days

  - id: distinct-visit-days
    status: active
    korean: 서로 다른 3일 이상
    official_english: 3+ distinct visit days
    banned_variants: [more than 3 visitings]

  - id: p90-buffer
    status: active
    korean: 개인 P90 반경
    official_english: per-anchor P90 buffer
    plain_english: a personal radius containing 90 percent of visits around an anchor

  - id: out-of-zone
    status: active
    korean: 생활권 밖
    official_english: out-of-zone
    plain_english: mobility outside the personal MASIL Zone
    notes: risk context, not a location-only penalty

  - id: co-change
    status: active
    korean: 동시 급변
    official_english: co-occurring change
    plain_english: mobility and risky behavior rise together in the same month
    banned_variants: [co-change tier]

  - id: synthetic-scenarios
    status: active
    korean: 합성 시나리오
    official_english: synthetic scenarios
    plain_english: designed cases used to test product logic
    notes: 실제 고객·실요율·예측 정확도 검증 아님
    banned_variants: [real driving data, 180 drivers]

  - id: reason-codes
    status: active
    korean: 사유 코드
    official_english: reason codes
    plain_english: fixed codes explaining why a rule fired

  - id: human-review
    status: active
    korean: 사람 검토
    official_english: human review
    plain_english: a person checks the evidence before customer action

  - id: target
    status: active
    korean: 목표값
    official_english: target
    plain_english: a value to test in the pilot, not a measured result

  - id: behavior-spelling
    status: active
    korean: 운전 행동
    official_english: driving behavior
    plain_english: how the person drives
    notes: 출력은 미국식 철자 behavior로 통일. behaviour는 금지어가 아니라 검색 별칭으로 인식
    search_aliases: [behaviour]

  - id: mileage-rider
    status: active
    korean: 주행거리 할인 특약
    official_english: mileage rider
    plain_english: the existing discount based on how much a person drives

  - id: rule-based-grading
    status: active
    korean: 규칙 기반 판정
    official_english: rule-based grading
    plain_english: fixed rules calculate the result; AI does not set the premium

  - korean: eTAS (운행기록분석시스템)
    plain_english: KOTSA digital tachograph analysis system
    notes: "한국교통안전공단. 위험운전행동 '정의'의 표준. 실재 명칭 — 이전 카드의 '없는 명칭' 표기는 오류로 정정됨. 써머리 표기 유지"
    banned_variants:
      - eTAS는 없는 명칭
  - korean: TAAS (교통사고분석시스템)
    plain_english: KoROAD Traffic Accident Analysis System
    notes: "도로교통공단. 위험운전 유형 '구성비' 유도 — 표시 전용, 판정 미진입"
  - korean: DBSCAN
    notes: 생활권 클러스터링 채택 알고리즘. 성능 대등 시 설명 가능한 쪽 우선
  - korean: HDBSCAN
    notes: challenger — 실데이터 재비교 대상
  - korean: 갱신형(rolling)
    official_english: rolling
    notes: 8/2 채택. 실물 근거 필드명 rolling_60_day_dbscan_p90
    banned_variants:
      - 가입 시 1회
      - 첫 2개월 고정
    plain_english: 매달 직전 2개월(60일) 기록으로 생활권을 재형성, 해당 월 제외, 군집 실패 시 직전 지도 폴백
  - korean: 거점 조건
    notes: "'서로 다른 3일 이상 방문'으로 표현 — min_pts 표기 지양"
    banned_variants:
      - min_pts
  - korean: 케어
    notes: 요율 영향은 보너스 정지 + 그해 할인 13%p 축소, 하한 0%라 할증 불가. 연간은 ANY(한 달이라도)
    official_english: care_review
    plain_english: "이동(≥0.25)과 위험행동(≥0.20)이 동시에 급변할 때 열리는 점검 상태 — 2단계 규칙(감지: 직전 2개월 대비 / 유지·해제: 학습 기준선 대비, 미달 달 자동 해제)"
    banned_variants:
      - 케어 5~7개월 지속
      - 케어는 5개월 이상 지속
  - korean: 우대 / 기본 / 보류
    notes: 화면 4상태는 113 / 31 / 30 / 6 (우대∩케어 5명).
    banned_variants:
      - 120 / 54 / 6 (구수치)
    plain_english: "연간 판정 3분류 (확정: 118 / 56 / 6)"
  - korean: LongROAD 0.35g 앵커
    notes: 합성 위험운전 빈도의 앵커
  - korean: Candrive
    notes: "Marshall et al. 2023, J Gerontol A 78(12). '최대 5배' 표기, CMT 교체 지시 폐기"
    banned_variants:
      - 동일 연령대 3배
      - CANDRIVE→CMT 교체
  - korean: DRIVES
    notes: "'진단 이전'으로 표기 ('사고 이전' 아님)"
    banned_variants:
      - 사고 이전
  - korean: Nemotron
    notes: 데이터셋 사용 아님 — 방법론을 따라 자체 정의
  - korean: 60 Drivers / 180 Scenarios
    official_english: 60 Drivers, 180 Scenarios
    notes: 병기 가능 표기 (60명 × 3환경 = 180 시나리오)
  - korean: 합성 시나리오
    official_english: synthetic scenarios
    plain_english: 사전 정의 파라미터 기반으로 생성한 가상 주행 시나리오(6유형 60명 × 3환경 = 180 × 14개월)
    banned_variants:
      - data(단독)
      - 실주행 데이터
      - 실제 드라이빙 로그 기반
      - data
    notes: 검증 대상은 예측력이 아니라 판정 로직 일관성
  - korean: 케어 (care_review)
    plain_english: "직전 2개월 평균 대비 이동 +25%p AND 위험행동 +20%p 동시 급변 시 열리는 '사람 검토' 상태 — 자동 요율이 아니라 점검 권유"
    banned_variants:
      - 할증
      - 벌점
    notes: 해제는 신청 없이 지표 정상 복귀 그 달에(care_open = fires or (care_open and sustained))
  - korean: 우대
    plain_english: integrated_score ≥ 75인 달이 reward, 연간은 reward 월 ≥ 9개월
    notes: 보너스 = 1.0 + clip((score−75)/25,0,1)×6.0 (1.0~7.0%p), 우대 & 케어 아님 조건
    official_english: reward
  - korean: 생활권  # 표제 정리: Safe Zone은 심사 지적 인용 표기
    plain_english: 반복 방문이 만들어낸 군집들의 집합 — 판정의 기준선이지 벌점의 경계선이 아님
    banned_variants:
      - 안전지대(밖=위험 함의)
    notes: "매달 직전 2개월 창으로 재군집(zone_refresh_policy: rolling_2m)"
  - korean: eps
    plain_english: 생활권 군집의 축척 파라미터 — 채택 기준값 260m 단일
    notes: 설계값임을 인정(Zheng 200m·Montoliu 200~300m 대역의 중간값). 판정 경계가 아님 — 최종 반경은 max(500m, min(개인 P90, 2km)). 운영값은 파일럿 k-거리 실측으로 재도출.
    banned_variants:
      - eps 150m
      - 지역별 차등 eps
      - 지역별 차등 반경(성과 표현)
      - Safe Zone 판정 반경
    official_english: eps
  - korean: 생활권 원
    plain_english: 도착지 안/밖을 판정하는 경계 = max(코어 500m, min(개인 P90, 2km))
    notes: "실측: 도심·교외 500m, 광역 813m — P90이 지역 차이를 흡수"
  - korean: P90
    plain_english: Radius containing 90% of visits to that anchor
    notes: 개인 실측(사람×거점마다 다름). 장날 한 번의 원거리 주차에 원이 4배 커지지 않게 하는 장치.
    banned_variants:
      - 최댓값 반경
      - 평균 반경
    official_english: 90th percentile visit distance
  - korean: AND 게이트
    plain_english: 이동 축(밖 비중 −직전 2개월 평균 ≥ 25%p)과 위험행동 축(≥ 20%p)이 동시에 넘어야 케어 신호 발동
    notes: 명절·병원·여행은 이동 축만 건드려 열리지 않음. rolling 전환 후 이동 다리의 이벤트 기반 재정의가 파일럿 숙제
  - korean: 오버레이 (할인 자격 점수)
    plain_english: 기존 마일리지 할인 위에 얹히는 할인 자격 점수 — 요율표가 아니며 할증 경로가 구조상 없음(하한 0% = 기준 요율)
    banned_variants:
      - 요율표
      - 할증 상품
    notes: masil = korea_mileage + bonus − reduction, max(0, min(45, ·))
  - korean: 기준선 (베이스라인) 2개월
    plain_english: "생활권 학습 관찰 기간(engine.py:38 BASELINE_MONTHS). 기준선 월의 판정 결과는 BASELINE_OBSERVATION으로 불이익 없음"
    notes: 1/2/3개월 민감도 실측은 미실행 백로그
  - korean: 서로 다른 3일
    official_english: distinct days (>= 3)
    plain_english: 거점(제2거점) 인정 문턱 — 관찰 창(2개월)의 5%. 하루 중복 방문은 1일로 계수
    banned_variants:
      - 3일 고정
    notes: "clustering.py:237 distinct_day_count >= 3; Isaacman 2011과 창·단위·임계 일치"
  - korean: 재정규화 (observed_weight)
    plain_english: "미관측 축(예: 밖에 안 나간 달의 밖 축)을 채점에서 제외하고 남은 가중치로 재분배 — 네 축(거리 30/안 30/밖 20/변화 20) 모두 같은 규칙"
    notes: "outer_zone_policy: context_only_no_location_penalty"
  - korean: 보류 (sparse)
    plain_english: "커버리지 80% 미만인 달은 우대·케어 모두 판정 보류(min_data_coverage_pct: 80.0) — 결측이 불이익이 되지 않음"
    notes: sparse 6건 전건 변동 0(41.0%→41.0%)
  - korean: 존 단위 (도착지 귀속)
    plain_english: "한 트립은 도착지가 속한 존 하나에 통째로 귀속, 부분 점수 없음 — '20km 중 10km 익숙' 문제가 구조적으로 발생하지 않음"
    notes: 경로 미수집은 최소수집 거버넌스 설계
  - korean: 합성 데이터
    official_english: synthetic scenarios
    plain_english: 사전 정의 6유형 파라미터로 생성한 시뮬레이션 데이터(60명 로스터 × 3환경 = 180 시나리오 · 14개월)
    banned_variants:
      - 실제 드라이빙 로그 기반 30명
    notes: 답변 시 반드시 선제 정정과 함께 사용
  - korean: 멀티 에이전트 파이프라인
    official_english: multi-agent pipeline (생성→검토→승인 체인)
    plain_english: 후보 규칙 생성 → 크리틱 검토 → 승인 게이트의 단방향 3단 체인 (레거시 설계 단계)
    banned_variants:
      - multi-agent loop
      - 루프
      - Agent–Validator Loop
    notes: "대안 표기: agent-assisted design process. 덱 교체 확정, 반영 진행 중"
  - korean: 생활권
    official_english: MASIL Zone
    banned_variants:
      - Living Zone
      - Home Zone
      - routine zone
      - Safe Zone
      - 가입 시 1회 형성되는 생활권
    plain_english: Union of anchor-point circles derived from driving arrival points
    notes: "공식 영어 = MASIL Zone (2026-08-04 팀 확정) · Safe Zone은 심사 지적 인용 시 원문 표기로만"
  - korean: 판정 보류
    plain_english: zone_available=False 또는 data_coverage_pct<80이면 판정하지 않음; 연간은 유효 달 9개월 미만이면 hold
    notes: 부족한 데이터로 고객에게 불리한 추정을 하지 않는 소비자 보호 방향
  - korean: 오버레이
    plain_english: 기존 마일리지 할인율(korea_rate)을 base로 그 위에서만 움직이는 할인 자격 점수 — 요율을 만들지 않음
    notes: 할증 항목 없음(candidate_surcharge_rate_pct 0.0), 하한 0·상한 45%, tariff_status = illustrative_economics_sandbox_not_final_tariff
  - korean: 표시 전용 유형 분해
    official_english: type_breakdown_display_only_decisions_unaffected
    plain_english: "TAAS 유도 가중치로 위험 이벤트 '수'를 급제동·과속·야간 유형으로 나눠 리포트에 보여주는 것 — 판정 불변"
    notes: 코드에 역할 문자열로 선언·테스트 고정, 가중치 교체 후 180건 판정 diff 0
  - korean: 이사형 (이동변화·안전유지형)
