  - korean: 문헌 회랑
    plain_english: The range literature gives; our design values are placed inside it
    notes: "원칙: 문헌이 숫자를 주는 게 아니라 분포를 주고, 우리 값의 위치를 표로 제시. 자릿수 하나까지의 근거는 주장하지 않음."
  - korean: 4단계 체인
