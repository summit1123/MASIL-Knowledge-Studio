  - korean: 시드 고정
    official_english: fixed seed (sha256)
    plain_english: Same input always yields the same synthetic data
    notes: 사람×월 단위 시드. 재현성이 검증의 전제.
  - korean: 파티션 108/36/36
    official_english: dev 108 / validation 36 / holdout 36
    plain_english: Scenario split proving rules were not fitted to the data
    notes: "180 시나리오(60명 × 3환경: 도심·교외·광역)의 분할."
  - korean: TAAS
