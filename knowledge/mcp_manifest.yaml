# 팀 발표 준비용 MCP 계약. 공개 런타임은 현재 정본과 실제 사용 문헌만 검색한다.

version: 2026-08-10-mcp-ready-v4
default_mode: qa_support
mcp_implementation_allowed: true

runtime_sources:
  deck:
    uri: deck://gaip-2026-final-9p
    sha256: 56dba11941b1f2491f469c3c37d2555326a36c95aa7c0d977da2d70fb83cd35b
    pages: 9
    reviewed: 2026-08-10
provenance_only:
  master_qa_origin:
    uri: https://claude.ai/code/artifact/9dea93fd-3645-48c6-8166-3e4cdcad5abc
    runtime_retrieval: false
    note: 원본 위치 기록만 보존. MCP는 이 URL을 조회하지 않으며 질문·답변·문헌·캡처를 로컬 데이터셋으로 내보낸 뒤 사용
    reviewed: 2026-08-10
  master_qa_local_export:
    text_file: sources/master_qa_artifact_2026-08-10.txt
    capture_manifest: assets/evidence/captures/manifest.json
    capture_index: knowledge/evidence/capture_index.yaml
    capture_count: 44
    canonical_for_current_facts: false

canonical_sources:
  current_implementation:
    file: IMPLEMENTATION.md
    role: 2026-08-10 현재 GaipStudio 작업 checkout의 실제 점수·Care·할인 계산 감사
    portability_note: MKS 밖의 미커밋 작업 파일을 확인한 기록이므로 재현 가능한 릴리스 커밋 고정 전에는 구현 진실의 임시 스냅샷
  product_model:
    file: knowledge/product_model.yaml
    role: 질문 유형별 현재 상품 설계와 미확정 경계
  deck_claims:
    file: knowledge/claims/deck_claims.yaml
    role: 장표에 인쇄된 내용과 수정·보완 상태
  team_positions:
    file: knowledge/official_positions.yaml
    filter: status == active
    role: product_model 세부 현재 설명

authority_routing:
  file: knowledge/product_model.yaml
  section: authority_by_question_type
  rule: 하나의 전역 우선순위가 아니라 질문 유형에 맞는 primary 자료가 결론을 정함

include:
  - file: IMPLEMENTATION.md
    role: current_working_tree_implementation_audit
  - file: knowledge/product_model.yaml
    layer: core
  - file: knowledge/presentation_story.yaml
    role: presentation_narrative_map
  - file: knowledge/conflict_map.yaml
    role: conflict_resolution
  - file: knowledge/coverage_matrix.yaml
    role: readiness_and_gaps
  - file: knowledge/claims/deck_claims.yaml
    role: slide_content
  - file: knowledge/official_positions.yaml
    filter: status == active
  - file: knowledge/snapshot.yaml
  - file: knowledge/qa/cards.yaml
    filter: status == active
    role: answer_example
    canonical_for_facts: false
  - file: knowledge/key_numbers.yaml
    filter: status == active
  - file: knowledge/glossary.yaml
    filter: status == active
  - file: knowledge/forbidden_claims.yaml
    filter: status == active
  - file: knowledge/evidence/registry.yaml
    collection: presentation_entries
    filter: citation_tier == stage_citable
  - file: knowledge/evidence/capture_index.yaml
    role: local_literature_and_deck_capture_links

runtime_excluded:
  - past Master Q&A exports
  - decision history and meeting records
  - inactive or superseded official positions
  - archived Q&A cards
  - listed_only, qa_only, internal, and banned literature
  - inactive evidence captures
  - deprecated glossary and guardrail records
  - note: 위 자료는 Git에만 보존하며 검색 인덱스·답변 패킷·공개 도구에서 반환하지 않음

exclude_from_answer_support:
  - evidence with citation_tier == banned
  - statements marked prohibited_use
  - 팀 최신 확정 설명과 아직 정합하지 않은 발표 대본 초안
  - deprecated bulk paths listed in knowledge/snapshot.yaml

asset_policy:
  remote_artifact_runtime_lookup: false
  text_corpus: local_files_only
  evidence_images: local_assets_only
  completed:
    - Master Q&A 본문을 로컬 텍스트로 내보냄
    - 문헌·덱 캡처 44개를 로컬 이미지와 SHA-256 manifest로 저장
    - Summary·Appendix 문헌 22개를 주장·주의사항·장표 위치·원문/덱 캡처에 정확히 연결
    - References/Q&A 전용 문헌과 인용 중지 자료는 Git에만 보존하고 공개 런타임에서 제외

retrieval_pipeline:
  - stage: current_facts
    search: authority_routing에 따라 canonical_sources + include
    purpose: 질문 유형에 맞는 현재 결론·수치·고정 용어·허용 문헌 확보
  - stage: exact_evidence_traversal
    search: 현재 사실의 evidence_links만 탐색
    purpose: provenance용 source_refs·material_refs·evidence_ref를 증거 연결로 오인하지 않고 명시적 주장-문헌 연결만 사용
  - stage: conflict_resolution
    rule: supporting material never overrides current canon
    on_conflict: 최종 덱과 현재 상품 계약을 기준으로 현재 교정·주의사항만 반환
  - stage: response_packet
    fields:
      - current_conclusion
      - answer_facts
      - evidence_and_citations
      - conflicts_and_avoid_phrases
      - plain_wording_material
      - exact_evidence_captures
    presentation_contract: 기본 답은 2~4개의 짧고 쉬운 문장. 정확한 캡처가 있으면 별도 요청 없이 관련 주장 뒤에 최대 2개 표시

client_rendering:
  mcp_app_resource: ui://masil/evidence-view.html
  mime_type: text/html;profile=mcp-app
  preferred: Claude 대화 안의 inline evidence card
  fallback: 검증된 공개 이미지 URL과 Markdown
  trigger: prepare_answer_context가 evidence_captures를 반환한 경우에만 show_answer_evidence를 이어 호출

retrieval_rules:
  - 덱은 장표 내용의 정본이지만 모든 질문의 답을 단독 결정하지 않는다.
  - 상품 논리·산식·문헌·시뮬레이션·변경 이유·표현은 product_model의 authority_by_question_type에 따라 각각 권한 있는 자료를 사용한다.
  - 과거 Q&A·폐기 규칙·변경 이력은 공개 런타임에서 검색하거나 반환하지 않는다.
  - 팀원은 도구 이름을 알 필요가 없다. 실제 MASIL 질문과 붙여 넣은 초안은 prepare_answer_context를 기본 진입점으로 사용한다.
  - prepare_answer_context는 별도 모델 호출 없이 질문을 발표 개요·상품 논리·덱 맥락·문헌 근거·현재 주장 검토·미확정 검증·사회적 가치·초안 검토로 라우팅한다. 라우트는 답을 결정하지 않고 검색 재료의 우선순위만 정한다.
  - 정확한 evidence_captures가 있으면 사용자가 캡처를 따로 요청하지 않아도 show_answer_evidence로 대화 안에 표시한다. 정확한 연결이 없으면 이미지를 추측하지 않는다.
  - 기본 답변에서는 도구명·내부 ID·YAML 필드·authority/status·corpus 통계를 노출하지 않는다.
  - forbidden_claims와 must_not_say는 주장 경계이지 예상 질문 목록이 아니다. 사용자가 요청하지 않으면 질문으로 변환하지 않는다.
  - 예상 질문은 사용자가 명시적으로 요청한 경우에만 생성하며 지식베이스 사실이 아니라 Claude가 만든 준비용 질문으로 표시한다.
  - cards의 active 항목은 질문 시나리오와 표현 예시이며 사실 정본으로 사용하지 않는다.
  - 덱과 현재 상품 모델이 다르면 claim 상태와 conflict_map을 함께 반환하고, 확인된 교정은 과거 인쇄 문구보다 현재 설명에 사용한다.
  - layer가 deep인 항목(내부 계산·두 축·민감도 상세)은 기술적 설명이 필요한 질문에서 보조 재료로 사용한다.
  - 덱에 남아 있으나 팀이 철회한 문헌 수치는 deck_conflict로 알리고 그 주장을 방어하지 않는다.
  - 현재 근거가 부족하면 보조 자료로 결론을 만들어내지 말고 근거 부족과 추가 확인 항목을 답한다.
  - unresolved 질문에는 current_evidence_status, recommended_position_ko, validation_needed를 함께 반환하며 권고 표현을 검증된 사실로 바꾸지 않는다.

telemetry_contract:
  storage: local SQLite
  collected:
    - tool name and order
    - selected answer-material route
    - success or error
    - duration
    - result and capture counts
    - anonymous session hash
    - corpus fingerprint and server version
  never_collected:
    - user prompt or tool arguments
    - Claude answer text
    - evidence body or capture content
    - OAuth credentials or raw user identity
  feedback: explicit fixed tags only; never infer a rating

connection_continuity:
  oauth_access_refresh_tokens: persistent SQLite with mode 0600
  authorization_codes: short-lived in memory
  content_or_code_restart: existing connector registration remains valid
  tool_schema_change: an existing conversation may need a new chat for tool rediscovery, not connector re-registration

implementation_gate:
  status: approved_for_server_implementation
  approved_date: 2026-08-10
  open_items_policy: 미확정 항목은 숨기지 않고 상태·권고 표현·필요 검증을 반환
  remaining_non_blocking:
    - MKS 밖 현재 구현 checkout을 재현 가능한 릴리스 커밋으로 고정
    - 실제 데이터 파일럿·공정성·법무·운영·계리 검증
