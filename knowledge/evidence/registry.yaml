presentation_entries:
  - key: presentation-ehsani-tefft-2021
    canonical_key: ehsani-tefft-2021
    source: Ehsani & Tefft 2021, CHANCE 34(1)
    citation_tier: stage_citable
    usage_scope: summary_1_appendix_a
    allowed_claim: 익숙하지 않은 도로에서 사고 연루 가능성이 2.5배 높았다
    caveat: 고령자만의 효과로 일반화하지 않고 crash involvement로 표현
    deck_location: Summary 1 · Appendix A
    capture_available: true
    url: https://doi.org/10.1080/09332480.2021.1885934

  - key: presentation-mcgwin-brown-1999
    source: McGwin & Brown 1999
    citation_tier: stage_citable
    usage_scope: summary_1
    allowed_claim: 고령 운전자 사고가 교차로와 양보 상황에 집중되는 경향
    caveat: 부주의 전체로 일반화하지 않고 situational judgment 맥락으로 사용
    deck_location: Summary 1
    capture_available: true
    url: https://doi.org/10.1016/S0001-4575(98)00061-X

  - key: presentation-cicchino-mccartt-2015
    source: Cicchino & McCartt 2015
    citation_tier: stage_citable
    usage_scope: appendix_a
    allowed_claim: 고령 운전자의 inadequate surveillance 오류 중 looking but not seeing이 71%, 중년은 40%
    caveat: 전체 사고 원인의 71%라고 말하지 않음
    deck_location: Appendix A
    capture_available: true
    url: https://doi.org/10.1016/j.aap.2015.04.015

  - key: presentation-chen-2025-neurology
