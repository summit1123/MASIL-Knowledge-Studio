      - id: model-monthly-safety-function
        status: candidate_parameter
        answer_authority: current
        layer: deep
        implementation_state: planned_not_implemented
        statement_ko: 현재 팀 설계 후보는 생활권 안 100km당 위험 이벤트에 계수 8, 생활권 밖 위험 이벤트에 계수 12를 적용한다. 생활권 밖이라는 위치 자체에는 벌점이 없고, 밖에서 실제로 발생한 위험행동만 더 민감하게 반영한다.
        formula:
          in_zone_safety: max(0, 100 - in_zone_risky_events_per_100_km * 8)
          out_of_zone_safety: max(0, 100 - out_of_zone_risky_events_per_100_km * 12)
        caveats:
          - 8과 12는 팀이 채택한 후보값이며 문헌에서 직접 도출된 수치가 아님
          - 최종 계수는 파일럿 데이터로 재보정
          - 30/30/20/20 축 가중치와 위험 이벤트 계수 8/12는 서로 다른 파라미터
        source_refs:
          - knowledge/official_positions.yaml#out-of-zone-risk-and-no-location-penalty
          - IMPLEMENTATION.md#1-월별-점수
        implementation_status: approved_team_candidate_not_yet_in_external_demo
      - id: model-monthly-safety-function-observed-demo
        status: documented_reference
        answer_authority: supporting
        layer: deep
        implementation_state: current_sandbox_parameter
        statement_ko: 2026-08-10에 감사한 외부 합성 엔진은 안·밖 모두 계수 8을 사용한다. 기존 Edward·Frank 점수와 180개 시나리오 결과는 이 8/8 실행 결과이며 8/12로 재계산된 결과가 아니다.
        formula: observed_demo_score = max(0, 100 - risky_events_per_100_km * 8)
        source_refs:
          - IMPLEMENTATION.md#현재-외부-데모와의-차이
        implementation_status: verified_in_current_external_working_tree_requires_rerun_for_8_12
      - id: model-monthly-pattern-function
        status: documented_reference
        answer_authority: supporting
        layer: deep
        statement_ko: 참조 패턴 안정성 점수는 위험행동 변화지수가 커질수록 낮아지는 max(0, 100-change×100) 함수다.
        source_refs:
          - sources/02_마스터답변안_전항목.md#부록-C
        implementation_status: current runtime code verification unavailable
      - id: model-monthly-integrated-formula
        status: current
        answer_authority: current
        layer: deep
        statement_ko: 통합점수는 관측된 축의 가중합을 관측된 가중치 합으로 나누며 미관측 축은 분모에서 제외한다.
        formula: integrated_score = sum(observed_axis_score * weight) / sum(observed_weight)
        source_refs:
          - knowledge/official_positions.yaml#monthly-and-annual-score-contract
          - sources/02_마스터답변안_전항목.md#부록-C
          - IMPLEMENTATION.md#1-월별-점수
      - id: model-monthly-coverage-hold
