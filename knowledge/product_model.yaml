# MASIL 전체 상품 모델. 질문의 종류에 따라 권한 있는 자료를 고르고, 과거 자료는 설명과 충돌 탐지에만 사용한다.

meta:
  effective_date: 2026-08-10
  status: approved_for_mcp_with_open_items
  domain_count: 15
  claim_count: 95
  purpose: 문제정의부터 사회적 가치·생활권·판정·운영·공정성·규제·시장·실행·근거·한계까지 현재 설계와 미확정 경계를 한곳에 기록
  source_code_available_in_repository: false
  external_source_code_audited: true
  implementation_audit_file: IMPLEMENTATION.md
  source_code_note: 실행 코드는 MKS 저장소 밖의 seniorcareservice 작업 checkout에서 확인했다. IMPLEMENTATION.md는 2026-08-10 작업 파일의 동작을 기록하며, 재현 가능한 릴리스 커밋은 아직 고정되지 않았다.

status_definitions:
  current: 현재 발표·Q&A에서 사실 또는 팀 결정으로 사용 가능
  candidate_parameter: 현재 후보값이지만 파일럿 재보정 대상
  documented_reference: 과거 구현 또는 정리문서에 계산식이 있으나 현재 코드·정책과 재대조가 필요
  pilot_target: 실측이나 예측이 아닌 파일럿 목표
  pilot_hypothesis: 파일럿에서 검증할 가치·효과 가설
  unresolved: 팀 결정 또는 구현 확인이 필요한 빈칸
  historical: 과거 데모·설계·검토 이력으로만 사용
  prohibited: 현재 답변의 근거 또는 정책으로 사용 금지

implementation_state_definitions:
  product_rule: 발표와 Q&A에서 현재 상품 원칙으로 설명할 수 있는 팀 계약
  current_sandbox_parameter: 현재 데모 코드에 실제로 들어 있으나 파일럿·계리 재보정 대상인 후보값
  planned_not_implemented: 팀이 채택했지만 현재 외부 데모 코드에는 아직 반영되지 않은 설계
  validated_result: 합성 시뮬레이션 또는 테스트에서 범위를 명시해 확인한 결과

unresolved_response_contract:
  rule: 미확정 항목은 확정 사실로 승격하지 않고 현재 검증 수준, 논리에 맞는 권고 표현, 필요한 검증을 함께 반환
  fields:
    - current_evidence_status
    - recommended_position_ko
    - validation_needed

authority_by_question_type:
  slide_content:
    primary: knowledge/claims/deck_claims.yaml
    rule: 인쇄 내용, 구두 보완과 수정 예정 상태를 함께 반환
  current_product_rule:
    primary: knowledge/product_model.yaml
    supporting:
      - knowledge/official_positions.yaml#status=active
      - knowledge/key_numbers.yaml#status=active
  calculation_and_parameter:
    primary: knowledge/product_model.yaml
    supporting:
      - IMPLEMENTATION.md
      - knowledge/key_numbers.yaml#status=active
      - sources/02_마스터답변안_전항목.md#부록-C
    rule: IMPLEMENTATION.md에서 확인된 현재 실행 경로와 과거 reference specification을 구분해 반환
  literature_and_statistics:
    primary: knowledge/evidence/registry.yaml#presentation_entries
    rule: allowed_claim과 caveat 범위를 넘지 않음
  simulation_result:
    primary: knowledge/key_numbers.yaml#claim_type=simulation_result,status=active
    supporting:
      - knowledge/claims/deck_claims.yaml
      - sources/00_확정수치카드.md
  change_reason_and_conflict:
    primary: knowledge/conflict_map.yaml
    supporting:
      - knowledge/history/decision_log.yaml
      - sources/11_V20_결정_기록_0810.md
      - knowledge/qa/cards.yaml#status!=active
  easy_wording:
    primary:
      - knowledge/glossary.yaml#status=active
      - knowledge/qa/cards.yaml#status=active
    rule: 표현만 빌리고 사실은 해당 질문 유형의 primary 자료에서 가져옴

domains:
  - domain_id: problem_definition
    title_ko: 문제정의와 현재 제도의 간격
    coverage: partial
    claims:
      - id: model-problem-risk-growth
        status: current
        answer_authority: current
        layer: core
        statement_ko: 고령 운전자 문제는 단순한 사고 건수보다 인구 변화, 상황 판단의 어려움, 신체 취약성과 현재 제도의 긴 갱신 주기가 함께 만드는 간격으로 설명한다.
        source_refs:
          - deck://summary-1
          - deck://appendix-a
        caveats:
          - 나이 자체를 개인 위험 판정 입력으로 쓰지 않음
          - 사고 심도를 예측한다고 말하지 않음
      - id: model-problem-situational-judgment
        status: current
        answer_authority: current
        layer: core
        statement_ko: 핵심 문제는 단순 부주의가 아니라 교차로·양보·돌발 상황에서의 situational judgment와 looking but not seeing이다.
        source_refs:
          - deck://summary-1
          - presentation-mcgwin-brown-1999
          - presentation-cicchino-mccartt-2015
        evidence_links:
          - ref: presentation-mcgwin-brown-1999
            relation: direct
            supports: 고령 운전자 사고가 교차로·양보·교통흐름 판단 조건에 집중되는 경향
            auto_show_source: true
          - ref: presentation-cicchino-mccartt-2015
            relation: direct
            supports: inadequate surveillance 사례 안에서 looking but not seeing 오류가 높은 비중을 보였다는 근거
            auto_show_source: true
      - id: model-problem-unfamiliar-context
        status: current
        answer_authority: current
        layer: core
        statement_ko: 익숙하지 않은 도로는 위험 맥락이 될 수 있지만, MASIL은 생활권 밖이라는 위치 자체를 위험 판정으로 사용하지 않는다.
        source_refs:
          - deck://summary-1
          - presentation-ehsani-tefft-2021
          - knowledge/official_positions.yaml#out-of-zone-risk-and-no-location-penalty
        evidence_links:
          - ref: presentation-ehsani-tefft-2021
            relation: direct
            supports: 익숙하지 않은 도로가 사고 연루 위험이 커질 수 있는 맥락이라는 문제정의
            auto_show_source: true
        evidence_boundary_ko: 위치 자체를 감점하지 않는다는 후반부는 문헌 결론이 아니라 MASIL의 상품 설계 결정
      - id: model-problem-current-system-gap
        status: current
        answer_authority: current
        layer: core
        statement_ko: 면허·규제는 개인의 월별 변화를 빠르게 반영하기 어렵고, 기존 마일리지 특약은 주행거리만으로 같은 거리 안의 행동 차이를 구분하지 못한다.
        source_refs:
          - deck://summary-1
          - deck://dashboard-appendix
        caveats:
          - 일반 UBI 전체가 고령자 위험을 오분류한다고 확대하지 않음
      - id: model-problem-severity-boundary
        status: current
        answer_authority: current
        layer: deep
        statement_ko: 신체 취약성과 사고 심도는 예방 필요성의 배경일 뿐 개인 점수·Care·할인 계산의 입력이 아니다.
        source_refs:
          - sources/02_마스터답변안_전항목.md#12-사고-심도
        implementation_status: 판정 입력 계약에 심도·손해액·사고 라벨 없음이라는 문서 기록, 현재 저장소에 코드 없음

  - domain_id: target_and_fairness
    title_ko: 고령자 타깃과 공정성 경계
    coverage: partial
    claims:
      - id: model-target-senior-first
        status: current
        answer_authority: current
        layer: core
        statement_ko: MASIL은 고령 운전자를 시작 집단으로 삼지만 나이나 건강 상태가 아니라 개인의 평소 패턴과 실제 안전행동을 본다.
        source_refs:
          - deck://appendix-a
          - knowledge/qa/cards.yaml#qa-why-senior-drivers
      - id: model-target-self-regulation
        status: current
        answer_authority: current
        layer: core
        statement_ko: 고령 운전자의 자기조절과 반복 생활 패턴은 개인 기준선을 만들 수 있다는 타깃 적합성의 근거다.
        source_refs:
          - presentation-vivoda-2021
          - presentation-longroad-self-regulation
        evidence_links:
          - ref: presentation-vivoda-2021
            relation: supporting_context
            supports: 자기조절을 시작한 고령 운전자의 첫 회피 행동 분포
            auto_show_source: true
          - ref: presentation-longroad-self-regulation
            relation: supporting_context
            supports: 지각된 운전 편안감과 야간·낯선 지역 회피 등 자기조절의 연관
            auto_show_source: true
        evidence_boundary_ko: 개인 기준선의 적합성은 두 연구를 바탕으로 한 MASIL의 설계 해석이며 문헌이 보험 기준선을 직접 검증한 것은 아님
      - id: model-target-no-medical-screening
        status: current
        answer_authority: current
        layer: core
        statement_ko: MASIL은 질환을 진단하거나 운전 적격성을 판정하는 의료 스크리닝이 아니다.
        source_refs:
          - knowledge/qa/cards.yaml#qa-medical-screening-age
          - presentation-chen-2025-neurology
        evidence_links:
          - ref: presentation-chen-2025-neurology
            relation: supporting_context
            supports: 실제 주행행동 변화가 MCI 집단과 정상인지 집단을 시간에 따라 구분한 배경
            auto_show_source: true
        evidence_boundary_ko: 의료 스크리닝을 하지 않는다는 결론은 MASIL의 입력·거버넌스 경계이며 Chen 논문이 정한 상품 규칙이 아님
      - id: model-target-age-expansion
        status: pilot_hypothesis
        answer_authority: supporting
        layer: roadmap
        statement_ko: 고령 운전자 파일럿 뒤 다른 연령대로 확대할 수 있다는 내용은 로드맵 가설이며 현재 검증된 확장 결과가 아니다.
        source_refs:
          - deck://summary-2
      - id: model-target-disparate-impact
        status: unresolved
        answer_authority: none
        layer: fairness
        statement_ko: 실제 데이터에서 연령·지역·소득·디지털 접근성 등에 따른 불리한 영향과 가입 선택편의를 어떤 지표로 검증할지는 아직 정해지지 않았다.
        current_evidence_status: design_consistent_not_validated
        recommended_position_ko: "나이로 위험을 정하지 않고 개인 기준선과 행동을 보므로 대리차별 위험을 줄이려는 설계다. 다만 실제 집단별 공정성은 파일럿 데이터로 별도 확인해야 한다."
        validation_needed: 연령·지역·소득·디지털 접근성별 판정률, Hold율, 이탈률과 오탐 차이 측정
        decision_needed: 파일럿 공정성 속성·지표·임계값·표본 이탈 점검 계획 확정
        gap_evidence_ref: knowledge/history/coverage_probe_2026-08-04.md
        gap_cluster_ko: 공정성·대리차별과 선택편의

  - domain_id: value_proposition
    title_ko: 상품 정의와 사회적 가치
    coverage: partial
    claims:
      - id: model-value-rider-overlay
        status: current
        answer_authority: current
        layer: core
        statement_ko: MASIL은 기존 마일리지 특약을 대체하는 독립 보험이 아니라 거리 외의 안전행동과 변화 맥락을 더하는 rider 제안이다.
        source_refs:
          - deck://summary-1
          - knowledge/qa/cards.yaml#qa-vs-mileage-ubi
      - id: model-value-mobility-rights
        status: current
        answer_authority: current
        layer: core
        statement_ko: 핵심 사회적 포지셔닝은 규제와 이동 제한보다 먼저 신뢰·Care·자발적 안전 지원을 제공해 이동권을 유지하도록 돕는 것이다.
        source_refs:
          - deck://summary-2
          - knowledge/qa/cards.yaml#qa-social-value
      - id: model-value-insurer
        status: pilot_hypothesis
        answer_authority: supporting
        layer: business
        statement_ko: 보험사에 예방적 위험관리, 역선택 완화와 기존 특약 고도화 가치를 줄 수 있다는 것은 파일럿에서 검증할 사업 가설이다.
        source_refs:
          - deck://summary-2
          - knowledge/qa/cards.yaml#qa-insurer-adoption-pilot
        caveats:
          - 손해율 개선이나 역선택 감소가 검증됐다고 말하지 않음
      - id: model-value-senior
        status: pilot_hypothesis
        answer_authority: supporting
        layer: business
        statement_ko: 안전한 고령 운전자를 인정하고 변화가 큰 시점에 지원을 연결해 자발적 자기조절을 돕는다는 고객 가치 가설이다.
        source_refs:
          - deck://summary-2
      - id: model-value-family
        status: pilot_hypothesis
        answer_authority: supporting
        layer: business
        statement_ko: 고객 동의 아래 필요한 지원 정보를 공유해 가족 돌봄 부담을 줄일 수 있다는 것은 검증 전 가치 가설이다.
        source_refs:
          - deck://summary-2
        caveats:
          - 실시간 위치 공유 구조로 설명하지 않음
      - id: model-value-society
        status: pilot_hypothesis
        answer_authority: supporting
        layer: business
        statement_ko: 이동권과 예방 안전을 함께 지원해 사회적 비용을 줄일 수 있다는 것은 장기 가치 가설이며 현재 합성 시뮬레이션이 증명하지 않았다.
        source_refs:
          - deck://summary-2

  - domain_id: data_and_privacy
    title_ko: 입력 데이터·최소수집·동의
    coverage: partial
    claims:
      - id: model-data-event-inputs
        status: documented_reference
        answer_authority: supporting
        layer: deep
        statement_ko: 현재 문서상 계산에 필요한 이벤트 입력은 목적지 좌표·방문일·트립 거리·위험 이벤트·커버리지이며 전체 경로 궤적은 사용하지 않는다.
        source_refs:
          - sources/02_마스터답변안_전항목.md#6-위치데이터
          - sources/02_마스터답변안_전항목.md#부록-C
        implementation_status: reference schema documented, runtime schema not present in this repository
      - id: model-data-no-route
        status: current
        answer_authority: current
        layer: core
        statement_ko: 판정은 경로·궤적이 아니라 도착지 이벤트와 월 집계값을 사용한다.
        source_refs:
          - knowledge/official_positions.yaml#privacy-minimum-collection
          - sources/00_확정수치카드.md#생활권
      - id: model-data-poi-masking
        status: current
        answer_authority: current
        layer: core
        statement_ko: 목적지 이름은 마스킹하고 판정·설명 권한을 분리한다.
        source_refs:
          - deck://summary-2
      - id: model-data-on-device-option
        status: pilot_hypothesis
        answer_authority: supporting
        layer: privacy
        statement_ko: 존 안팎 판정을 단말에서 수행하고 보험사에는 파생 월 집계만 보내는 구조는 파일럿 설계 옵션이다.
        source_refs:
          - sources/02_마스터답변안_전항목.md#6-위치데이터
      - id: model-data-legal-review
        status: unresolved
        answer_authority: none
        layer: privacy
        statement_ko: 위치정보·개인정보 동의, 보관, 철회와 가족 공유의 최종 법무 설계는 파일럿 전에 별도 확정해야 한다.
        current_evidence_status: design_principles_only
        recommended_position_ko: "현재 원칙은 최소수집, POI 마스킹, 권한 분리, 고객 선택이다. 구체적인 보관기간과 철회·공유 절차는 파일럿 국가의 법무 검토 뒤 확정한다."
        validation_needed: 파일럿 데이터 흐름도, 동의서, 보관·파기표, 철회와 가족 공유 절차의 법무 검토
        source_refs:
          - knowledge/official_positions.yaml#privacy-minimum-collection
      - id: model-data-jurisdiction-portability
        status: unresolved
        answer_authority: none
        layer: privacy
        statement_ko: 싱가포르 PDPA·MAS, GDPR, EU AI Act와 국가별 요율 인가 절차에 MASIL을 어떻게 이식할지는 아직 법무·규제 검토가 끝나지 않았다.
        current_evidence_status: external_legal_review_required
        recommended_position_ko: "MASIL의 데이터 최소화와 사람 검토 원칙은 국가별 적용의 출발점이다. 다만 규제 준수나 요율 인가 가능성은 국가별 검토 전에는 주장하지 않는다."
        validation_needed: 국가별 개인정보·AI·보험 요율 인가 체크리스트와 현지 법무 의견
        decision_needed: 발표 국가와 파일럿 국가별 적용 체크리스트 및 법무 검토 범위 확정
        gap_evidence_ref: knowledge/history/coverage_probe_2026-08-04.md
        gap_cluster_ko: 해외 관할 이식성과 요율 인가

  - domain_id: zone_formation
    title_ko: MASIL Zone 형성
    coverage: partial
    claims:
      - id: model-zone-definition
        status: current
        answer_authority: current
        layer: core
        statement_ko: MASIL Zone은 행정구역이나 하나의 고정 원이 아니라 반복 방문으로 생긴 개인 거점들의 집합이다.
        source_refs:
          - deck://appendix-b
      - id: model-zone-window
        status: current
