      - 분리하면 양쪽 실패를 모두 막는다는 논리
    must_not_say:
      - 고정이 현행 설계라는 서술
    evidence_ref:
      - sources/생활권_형성주기_이슈정리.md 2~3절
  - topic: 상품 지위 — 할증 경로가 구조상 없다
    status: deprecated
    deprecated_by: monthly-and-annual-score-contract
    deprecated_reason: 과거 데모의 bonus-reduction 요율 산식을 현행 상품 구조로 설명함.
    approved_position_ko: 요율표가 아니라 기존 마일리지 할인 위에 얹히는 할인 자격 점수다. masil_rate = clip(korea_mileage + bonus − reduction, 0, 45). 할증은 값이 0인 게 아니라 항 자체가 없고, 하한 0% = 기준 요율. 보너스는 점수 비례 최대 7%p(하한 1%p), 총 할인 캡 45%. 180 시나리오 전건 candidate_surcharge_rate_pct = 0. 최악의 경우가 할증이 아니라 할인 축소다.
    claim_type: team_decision
    must_include:
      - 할증 항 부재(코드 근거)
      - 최악 = 할인 축소, 하한 = 기준 요율
    must_not_say:
      - 벌점
      - 할증 가능성을 시사하는 표현
    evidence_ref:
      - "src/gaip_simulation/engine.py:1069-1070"
      - 180 시나리오 번들 candidate_surcharge_rate_pct 전건 0
  - topic: 단발 예외 운행은 판정에 진입하지 못한다
    approved_position_ko: "판정 단위는 트립이 아니라 월 집계 비율. fires = (이번 달 밖 비중 − 직전 2개월 평균 ≥ 0.25) AND (이번 달 위험행동 비율 − 직전 2개월 평균 ≥ 0.20). 실측 월 트립 중앙값 32건이므로 예외 운행 1건이 밖 비중을 움직이는 폭은 약 3.1%p — 임계의 1/8. 25%p를 넘기려면 같은 달 예외 운행 8건, 위험행동 축까지 넘기려면 위험 트립 6~7건 더 필요. \"한 번의 예외\"가 아니라 \"한 달 내내 바뀐 생활\"만 감지된다. 월 신호 → 연간 판정 → care_review로 사람 검토를 거치는 3중 구조."
    claim_type: simulation_result
    must_include:
      - 월 집계 비율 단위
      - AND 게이트(25%p·20%p 동시)
      - 중앙값 32건 → 1건 = 약 3.1%p = 임계의 1/8
    must_not_say:
      - 트립 단건 판정처럼 들리는 표현
    evidence_ref:
      - sources/안전운전자_매력도_정리.md 2절
      - 실측 월 트립 중앙값 32건
  - topic: AND 게이트 오탐 대조군 실측
    approved_position_ko: "명절 귀성·병원 통원·여행은 이동 축만 건드린다. 오탐 대조군(이동변화·안전유지형) 10명 × 3환경 = 30 시나리오 실측: 이동변화지수가 임계를 넘은 달(장기 기준선 대비) 360 케이스-월 중 191(최대 73.9%p), 감지식과 같은 직전 2개월 대비로 좁혀도 46 케이스-월(최대 65.4%p), 위험행동 변화지수 전건 0, 케어 발동 0건."
    claim_type: simulation_result
    must_include:
      - 10명 × 3환경 = 30 시나리오
      - 이동 지표 임계 초과 191 케이스-월에도 케어 발동 0건
    must_not_say:
      - "대조군을 \"30명\"으로 지칭"
    evidence_ref:
      - sources/안전운전자_매력도_정리.md 3절
  - topic: 감액 13%p의 지위 — 샌드박스 예시값
    status: historical_demo
    superseded_by: dashboard-13-point-difference
    deprecated_reason: 13%p는 현재 정책이 아니라 기존 데모 설명용 이력임.
    approved_position_ko: 감액 13%p는 요율 샌드박스의 손익 예시값이다(source_status = illustrative_economics_sandbox_not_final_tariff). 자동 요율 반영이 아니라 사람 검토(care_review)이며, 운영상 개입은 벌점이 아니라 점검 권유와 예방 지원. 해제는 신청이 필요 없다 — 지표가 정상으로 돌아온 그 달에 닫힌다(care_open = fires or (care_open and sustained)).
    claim_type: team_decision
    must_include:
      - 13%p는 예시값(최종 요율 아님)
      - 해제 자동(신청 불요)
    must_not_say:
      - 13%p를 확정 요율처럼 서술
      - 벌점
    evidence_ref:
      - "src/gaip_simulation/engine.py:1187"
      - source_status = illustrative_economics_sandbox_not_final_tariff
  - topic: 실측 — 안전할수록 이득이 커진다 (유형별 할인율)
    approved_position_ko: "평균 할인율(180 시나리오, 유형당 30): 안정 저주행형 33.8%→38.9%, 이동변화·안전유지형(이사) 21.2%→26.7%, 복수 생활권형 19.5%→24.3%, 광역 이동·안전형 20.9%→24.8%, 생활권 내 위험행동형 33.4%→33.4%(동일), 이동·위험행동 동시변화형 19.6%→7.9%. 180 중 150건이 기존 마일리지와 같거나 낮은 보험료, 그중 113건이 더 낮다. 데이터 부족 시 '보류'라 불이익 없음(sparse 6건 전건 변동 0)."
    claim_type: simulation_result
    must_include:
      - 150/180 같거나 낮음, 113건 더 낮음
      - sparse 6건 변동 0(보류=불이익 없음)
    evidence_ref:
      - sources/안전운전자_매력도_정리.md 5절 (180 시나리오 번들)
  - topic: 연간 케어 any 규칙 — 실측 결과 (정직 고지)
    status: historical_demo
    superseded_by: care-review-no-direct-price-effect
    deprecated_reason: 과거 엔진의 가격 결합 동작을 재현하기 위한 이력임.
    approved_position_ko: "현행 규칙: _annual_state는 평가 12개월 중 하나라도 care_review면 연간 care_review(한 달 발동으로 그 해 감액). rolling 실측에서 케어 발동 월수 분포는 0개월 150건 / 1개월 30건 / 2개월 이상 0건 — 케어 30건 전원이 1개월 발동(지도가 새 목적지를 흡수해 유지 조건 조기 해제). k≥2로 보수화하면 연간 케어 대상 0건, 동시변화형 평균 할인율 7.93%→19.57%로 감액 전건 소멸. 구 고정 기준에서는 전원 5~7개월이라 k≥1~5 동일이었다. any 유지 여부는 이제 실측이 직접 답하는 질문이 됐다. 산식 예시(기존 할인 25% 가정): 11개월 우수+1개월 급변 고객 12.0% vs 12개월 애매 고객 25.0% = 13.0%p 역전(우대 보너스 포함 17.6%p)."
    claim_type: simulation_result
    must_include:
      - 케어 30건 전원 1개월 발동(rolling 실측)
      - 13.0%p 역전은 산식 계산(가정 명시)
      - 발동 정확성(30/30·오탐 0/30)은 유지
    must_not_say:
      - "\"우리 시뮬레이션에 그런 사례가 없다\"를 안전의 근거로 사용"
    evidence_ref:
      - sources/안전운전자_매력도_정리.md 6절
      - sources/안전운전자_매력도_정리.md 6절 (산식 구조 이슈 ①)
  - topic: 권고 — 감액을 발생 월수에 비례 (팀 결정 필요, 미결)
    status: deprecated
    deprecated_by: care-review-no-direct-price-effect
    deprecated_reason: 최신 팀 결정에서 Care review와 가격을 분리해 미결 안건이 종료됨.
    approved_position_ko: "권고: 감액을 발생 월수에 비례시킨다(13.0 × 발생월수 ÷ 12; 1개월 발동 시 감액 1.08%p). 감지가 이진인 것은 정당하나 요율 반영까지 이진·연간 고정일 이유는 없다. 선언 파라미터라 손익까지 즉시 재계산된다. 도입 여부는 팀 결정 필요(이슈 ①과 동일 안건) — 아직 미결정."
    claim_type: future_plan
    must_include:
      - 권고 상태이며 팀 결정 미결임을 명시
      - 1개월 시 1.08%p
    must_not_say:
      - 월수 비례가 이미 도입된 것처럼 서술
    evidence_ref:
      - sources/안전운전자_매력도_정리.md 6절 (산식 구조 이슈 ①)
      - sources/안전운전자_매력도_정리.md 6·9절
  - topic: 판정이 보는 것은 도착지 하나 — 지형이 개입할 통로가 없다
    approved_position_ko: "원장 gaip_visit_events.csv의 좌표 컬럼은 latitude/longitude 한 쌍뿐이고 one_visit_event_per_trip: true. 출발점·경유 경로 컬럼이 존재하지 않는다. 트립 1건 → 방문 지점 1개(도착지) → 그 좌표가 생활권 원 안인가만 본다. 어떤 지형을 통과했는지, 고속도로를 탔는지는 데이터에 없어 지형이 판정에 개입할 통로 자체가 없다."
    claim_type: team_decision
    must_include:
      - 출발점·경로 컬럼 부재(원장 스키마)
      - "트립:방문 = 1:1"
    must_not_say:
      - 경로·통과 지형이 판정에 반영된다는 표현
    evidence_ref:
      - data/fixtures/gaip_visit_events.csv 스키마
      - trip_visit_summary.one_visit_event_per_trip
  - topic: eps와 생활권 원의 층 분리 — eps는 판정 기준이 아니다
    approved_position_ko: "반경이 두 종류인데 한 이름으로 불려온 것이 혼동의 원인. 위층 eps(260/520/1,100m, 합성 3환경 설정)는 흩어진 방문점을 한 거점으로 묶는 눈금이고, 아래층 생활권 원 = max(코어 500m, min(개인 P90, 2km))이 도착지 안/밖을 판정하는 경계다. 판정은 아래 층에서만 일어나며 eps는 그 아래로 내려오지 않는다. 실측: eps를 전국 단일 260m로 바꿔도 원 반경은 도심 500m·교외 500m·광역 813m로 완전히 동일."
    claim_type: team_decision
    must_include:
      - 생활권 원 공식 max(코어 500m, min(개인 P90, 2km))
      - eps를 바꿔도 원 크기 불변 실측
    must_not_say:
      - eps가 판정 경계라는 서술
      - "\"지역별로 eps를 차등했다\"를 성과로"
    evidence_ref:
      - sources/생활권반경_eps_정리.md 2절 실측 표
  - topic: 지역 차이는 개인 실측(P90)이 흡수한다
    approved_position_ko: "지역을 사람이 분류하지 않는다. 같은 규칙을 적용했는데 그 사람의 방문 분포(P90)가 달라서 광역 813m vs 도심·교외 500m로 갈린다. 심사위원이 요구한 \"지역별 차등\"은 이미 일어나고 있으며 사람이 아니라 데이터가 만든다 — 분류 오류도 경계 분쟁도 없다."
    claim_type: team_decision
    must_include:
      - "\"저희가 나눈 게 아니라 데이터가 나눈 것\""
      - 광역 813m vs 도심 500m
    must_not_say:
      - 사람이 지역을 분류해 차등을 뒀다는 표현
    evidence_ref:
      - sources/생활권반경_eps_정리.md 3절
  - topic: 실험 A·B — 지역 설정이 판정을 좌우하지 않는다
    approved_position_ko: "실험 A(우리 파라미터 변경): 지역별 eps를 전국 단일 260m로 통일해 180 시나리오 재판정 — 판정이 달라진 시나리오 0건/180건(고정 기준; 갱신형 재검증에서는 경계 3건). 실험 B(고객 지형 변경): 같은 60명 로스터를 도심·교외·광역 세 지형에 각각 놓고 판정 — 케어 60/60 동일, 우대 54/60 동일(갈린 6명 = 케어 발동 5명 + 광역 문턱 근접 1명(우대 월 8/12), 벌점 아님). 농촌 거주자·정기 통원자가 구조적으로 불이익받지 않는다는 공정성 증거."
    claim_type: simulation_result
    must_include:
      - A는 우리 설정, B는 고객 지형 — 별개 실험
      - "갱신형 재검증 경계 3건도 함께 말할 것(\"사실상 없었습니다\" 어법)"
    must_not_say:
      - 실험 A와 B를 섞어 서술
    evidence_ref:
      - sources/생활권반경_eps_정리.md 4절
  - topic: eps 260의 근거 — 설계값 인정 + 문헌 대역
    approved_position_ko: "근거 4겹: ① 인정 — 절대값을 주는 문헌은 없다, 설계값이다. ② 기준값은 문헌 대역 — Zheng 2009 200m, Montoliu 2013 250m(권장 200~300m), 260m는 그 한가운데. ③ 520·1,100은 ×2 축척 규칙 — 환경 설계 전체(트립 5.4/11/24km, 도달반경 900/1,500/3,000m)와 같은 비율. ④ 실측 + 파일럿 — 현 값에서 과병합 0%, 반복거점 누락 1.6~3.1%, 운영값은 실데이터 k-거리로 재도출."
    claim_type: team_decision
    must_include:
      - 설계값임을 먼저 인정
      - 문헌 대역 200~300m의 중앙
    must_not_say:
      - 문헌이 260m를 직접 준다는 서술
    evidence_ref:
      - sources/생활권반경_eps_정리.md (근거 4겹)
      - Zheng 2009
      - Montoliu 2013
  - topic: 3단 eps의 방향(도심 작음·농촌 큼)은 방어하지 않는다
    approved_position_ko: "\"도심이 작고 농촌이 크다\"는 방향은 검증된 바 없는 가정이다. 반대 논리가 더 그럴듯할 수 있다 — 도심은 주차난 때문에 매번 다른 곳에 대므로 산포가 오히려 클 수 있다. 우리 합성 데이터는 도심 산포를 가장 작게(40/70/130m) 설정해 만들었으므로 그 데이터로는 방향을 확인할 수 없다(우리가 넣은 값을 다시 읽는 것). 실험 A가 \"방향이 어느 쪽이든 판정이 같다\"를 보여주므로 논쟁 자체가 불필요하다. 실제 방향은 파일럿 산포 측정이 정한다."
    claim_type: hypothesis
    must_include:
      - 방향은 가정이며 방어하지 않음
      - 실험 A로 논쟁 무력화
    must_not_say:
      - 도심 eps가 작아야 한다는 방향 주장
      - 합성 산포 수치를 방향의 근거로
    evidence_ref:
      - sources/생활권반경_eps_정리.md 5절
  - topic: 운영 eps 결정 절차 — k-거리 산포 측정 (파일럿)
    approved_position_ko: "운영값은 정하지 않고 잰다. 같은 장소를 다른 날 다시 갔을 때 좌표 산포(주차 산포)를, 점마다 \"다른 날 방문 중 2번째로 가까운 것까지의 거리\"로 재서 수천 명 분포의 P95를 컷으로 쓴다(거점 인정 규칙이 \"서로 다른 3일\"이므로 다른 날 이웃 2개 필요 → 2번째 이웃 거리). 개인별로 재지 않는다(개인당 방문 100개 남짓, HDBSCAN 소표본 문제와 동일). 절차가 결정하는 것: eps 260 유지/상향 여부, 지역을 나눌지 여부, 나눈다면 방향까지(도심이 클 수도 있다). 합성 데이터 리허설(도심 9/18/21m, 교외 16/31/37m, 광역 30/59/71m — 중앙값/P90/P95)은 절차가 지역별 산포 차이를 잡아낸다는 확인일 뿐 260의 근거가 아니다."
    claim_type: future_plan
    must_include:
      - 지역 분류 여부·방향까지 측정이 결정
      - 합성 리허설 수치는 260의 근거가 아님(⚠)
    must_not_say:
      - 리허설 수치를 260 정당화에 사용
    evidence_ref:
      - sources/생활권반경_eps_정리.md 6절
  - topic: HDBSCAN과의 관계 — 계산은 빌리되 고정값으로 적용
    approved_position_ko: "k-거리 측정은 HDBSCAN의 핵심거리와 같은 계산이며 차이는 적용 지점뿐. HDBSCAN은 판정마다 그 사람 100여 점으로 실시간 추정(말할 숫자 없음), 우리는 파일럿에서 수천 명 수만 점으로 한 번 재서 eps 고정값으로 쓴다(\"반경 260m\" — 약관·민원에 쓸 수 있는 숫자). 값의 출처는 데이터(측정)이면서 적용은 고정 잣대(설명 가능). 파일럿 측정에서 산포가 사람마다 크게 널뛰어 고정값이 위험하다고 나오면 그때 HDBSCAN으로 간다 — 같은 측정이 eps 값과 \"고정값으로 될 일인가\"를 동시에 알려준다."
    claim_type: future_plan
    must_include:
      - 설명 가능성(말할 수 있는 숫자)이 고정값 선택의 이유
      - HDBSCAN 전환 조건 명시
    must_not_say:
      - HDBSCAN을 쓰지 않는 이유를 회피성으로 설명
    evidence_ref:
      - sources/생활권반경_eps_정리.md 7절
  - topic: 저주행 고령 운전자의 km당 사고 위험 (마일리지 한계 근거)
    approved_position_ko: Candrive/Ozcandrive(Langford et al. 2013, AAP)는 연 5,000km 미만 저주행 고령 집단의 km당 사고 위험이 오히려 높다고 보고했다. 거리만 보는 마일리지 체계에서는 실제로 안전한 분이 그렇지 않은 분과 같은 할인을 받는다 — 이 특약의 존재 이유. 실측에서 안정 저주행형은 33.8%→38.9%.
    claim_type: external_fact
    must_include:
      - 연 5,000km 미만·km당 위험이라는 조건부 표현 유지
    must_not_say:
      - 저주행 고령자가 위험하다는 단정적 일반화
    evidence_ref:
      - "https://pubmed.ncbi.nlm.nih.gov/23477415/"
