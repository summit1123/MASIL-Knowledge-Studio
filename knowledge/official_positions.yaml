  - topic: 12번 — 손익분기 감도
    approved_position_ko: "손익분기는 심도를 요율에 넣지 않고도 성립한다: 케어 세그먼트(30건·16.7%) 클레임을 12.4% 줄이면 균형(심도 가산 없는 1.0× 기준), 고령 심도 1.2× 감도 시나리오에서는 10.3%로 내려간다. 심도는 요율 변수가 아니라 경제성 여유를 보는 방향 확인용이며, 파일럿에서는 케어 효과 측정(개입 전후 건당 손해액 변화) 지표로 쓴다."
    claim_type: simulation_result
    evidence_ref:
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    must_include:
      - SEVERITY_RELATIVITY = [1.0, 1.2]는 감도 파라미터
    must_not_say:
      - 심도가 요율식에 들어간다
  - topic: 13번 — 데이터 확보 3경로와 파일럿
    approved_position_ko: "① 기존 채널 — 국내 UBI는 외부 앱 산정 점수만 동의하에 전송하는 구조(보험연구원 KIRI리포트 2024.7)라 원좌표 반출 없이 같은 채널에 파생 지수를 얹어 시작. ② 특약 동의 신규 수집 — 필요한 것은 궤적이 아니라 도착지 좌표+방문 날짜(+트립 거리·위험 이벤트 수)뿐, 동의 범위가 통상 UBI보다 좁음. ③ 공공·제휴 — TAAS, 복지부·건보공단, 지자체 데이터(가용성 확인 필요). 파일럿: 기준선 2개월+관찰 6개월, 개입군/대조군 병행, 지역 유형 2개 이상, N은 UBI 가입 고령 고객 모수 확인 후 확정(현재 미확정이라 숫자를 말하지 않는다). 정직 고지: 80,032트립·180 시나리오는 전부 합성이며 실데이터 확보가 파일럿 1차 과제."
    claim_type: future_plan
    evidence_ref:
      - 보험연구원 KIRI리포트 2024.7
      - TAAS 2010–2024
    must_include:
      - 파이프라인·검증 하네스가 실데이터 검증 도구로 그대로 전환된다는 점
    must_not_say:
      - 파일럿 N 숫자(모수 확인 전)
  - topic: "13번 — 사고잦은곳: 자리를 바꿔 채택"
    approved_position_ko: 도로교통공단 사고다발지역은 공개 데이터이고 도착지 좌표만으로 거점 주변 포함 여부를 산출 가능(맵매칭 불필요 — 현재 구현에는 없고 파일럿 항목). 그러나 판정 (−)요소로 넣으면 사고다발지 인근 거주자가 행동과 무관하게 감점되어 위치 중립 선언과 지역 공정성 실측(60/60)이 무너진다. 따라서 케어 리포트의 안전 안내 정보로 채택 — 정보 제공은 위치 중립을 깨지 않고 예방 효용은 그대로 얻는다. 보험사 사고데이터의 GPS 좌표 표기·정밀도는 확인 불가라 협업 어젠다로 남긴다.
    claim_type: team_decision
    evidence_ref:
      - data/fixtures/gaip_algorithm_lab.json
    must_include:
      - "C-3에서 유보했던 '정보 제공용 vs 감액 요인' 규칙을 이렇게 확정했다는 계보"
    must_not_say:
      - 사고잦은곳을 판정 감점 요소로 반영
  - topic: "13번 — 도로 위계: 미반영 사유와 2단계 안"
    approved_position_ko: "도로 등급 파악은 맵매칭 = 궤적 재구성이라 최소수집 거버넌스와 정면 충돌해 뺐다 — 능력이 아니라 우선순위·거버넌스 판단. 인접 근거는 도시/농촌 대비(NHTSA 2021)까지이고 국내 위계별 건수·심도 수치는 출처 미확인이라 인용하지 않는다. 2단계 안: (i) 경량 추정 — 평균속도·출발 시간대로 고속/간선 여부를 트립 단위 확률 추정(소요시간은 파일럿 수집 항목 추가, 집계값만 사용) (ii) 재무 비교분석 — 요율 샌드박스로 동일값 대 차등값을 같은 화면에서 대조(현 기준선: 180건 할증 0, 150건 동등 이하 보험료, 113건 더 낮음). 라벨 없는 지금은 차등값 손익 수치를 제시하지 않는다."
    claim_type: team_decision
    evidence_ref:
      - NHTSA 2021 (DOT HS 813 488)
    must_include:
      - "'능력이 아니라 우선순위 판단'이라는 프레임"
    must_not_say:
