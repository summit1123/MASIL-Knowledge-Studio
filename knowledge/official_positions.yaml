# 소스: seniorcareservice/final 승인 세트 + 팀 최종 결정 기록(2026-08-10)
# 규칙: status=active가 우선. deprecated/historical_demo는 현재 답변에 사용하지 않음.

meta:
  effective_date: 2026-08-10
  canon: sources/11_V20_결정_기록_0810.md
  default_status_for_missing: legacy_reference
  mcp_filter: status == active
  conflict_rule: 같은 주제나 논리의 항목이 충돌하면 active가 이기며, 충돌이 해소되지 않으면 사람 검토로 보낸다.

positions:
  - id: product-monthly-tiers-contract
    topic: 상품 판정 — 월별 세 등급 공개 계약
    status: active
    layer: core
    effective_date: 2026-08-10
    approved_position_ko: "월별 결과는 Favorable, Standard, Care의 세 등급으로 쉽게 설명한다. 실제 구현은 월 통합점수와 해당 월 Care 신호를 함께 보존하므로 Favorable 점수 조건과 Care가 같은 달에 함께 성립할 수 있다. Care는 그달의 안내와 직원 검토를 열고 다음 달에는 다시 계산한다. 데이터가 부족한 달의 Hold는 네 번째 위험 등급이 아니라 불이익 없는 데이터 상태다. 연간 할인율 계산은 월별 표시와 구분한다."
    claim_type: team_decision
    must_include:
      - Favorable · Standard · Care 세 등급 (three monthly tiers)
      - Hold는 위험 등급이 아니라 데이터 상태(불이익 없음)
      - Care는 직원 검토와 지원 제안으로 연결
      - Care는 해당 월 신호이며 다음 달 다시 계산
      - 연간 할인율 계산은 월별 등급 표시와 구분
    must_not_say:
      - Hold를 네 번째 위험 등급으로 설명
      - Care 자체가 자동 할증·자동 차감을 만든다는 표현
      - 내부 버전명(V20 등)을 공개 답변에 사용
      - 최종 대시보드·최종 덱을 old/legacy 데모로 지칭
    evidence_ref:
      - deck://summary-1
      - sources/11_V20_결정_기록_0810.md#1-상품-판정-계약
      - IMPLEMENTATION.md#3-care

  - id: internal-calculation-structure
    topic: 내부 계산 구조 — 점수 판정과 Care 신호의 분리 (기술 레이어)
    status: active
    layer: deep
    effective_date: 2026-08-10
    approved_position_ko: "내부 계산은 월 통합점수와 해당 월 Care 조건을 함께 보존한다. Favorable 점수 조건과 Care가 같은 달에 함께 나타날 수 있으며 현재 화면은 Reward + Care Review로 둘 다 유지할 수 있다. 공개 설명은 월별 세 등급(Favorable, Standard, Care)이고, 동시 성립은 기술 질문에서만 보완한다."
    claim_type: team_decision
    must_include:
      - 점수 판정과 Care 신호는 내부적으로 별도 계산
      - Favorable과 Care가 같은 달에 함께 나타날 수 있음
      - 공개 설명은 월별 세 등급
    must_not_say:
      - 세 등급 공개 설명을 부정하는 표현
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#1-상품-판정-계약
      - IMPLEMENTATION.md#3-care

  - id: monthly-and-annual-score-contract
    topic: 월 통합점수와 연간 점수
    status: active
    effective_date: 2026-08-09
    approved_position_ko: "월 통합점수는 30/30/20/20 네 축의 가중평균이다. 화면의 연간 통합점수는 판정 가능한 월 통합점수의 단순 평균으로 설명에 사용한다. 현재 구현에서 기본 할인율은 이 평균점수가 아니라 연간 주행거리와 차량 종류를 기존 마일리지 할인표에 넣어 정한다. Favorable 9개월 이상이면 샌드박스 후보 추가 할인 3%p가 붙고 전체 할인은 45%를 넘지 않는다."
    claim_type: implementation_audit
    implementation_status: verified_in_current_gaip_studio_working_tree
    must_include:
      - 12개월 월 통합점수의 단순 평균
      - 기본 할인율은 기존 마일리지 할인표로 계산
      - 3%p와 45%는 최종 요율이 아닌 후보값
    must_not_say:
      - 연간 평균점수가 현재 기본 할인율을 정한다는 표현
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#2-월간연간-계산
      - IMPLEMENTATION.md#2-연간-점수와-favorable
      - IMPLEMENTATION.md#4-현재-할인율-구현

  - id: favorable-additional-discount-qualification
    topic: Favorable 추가 할인 자격
    status: active
    effective_date: 2026-08-09
    approved_position_ko: "월 통합점수 75점 이상이면 그 달은 Favorable이다. 12개월 중 Favorable이 9개월 이상이면 연간 추가 할인 자격이 생긴다. 현재 샌드박스는 3%p를 더하고 전체 할인율을 45%로 제한하지만, 이는 구현된 후보값이며 최종 요율은 아니다."
    claim_type: team_decision
    must_include:
      - 월 75점 이상
      - 12개월 중 9개월 이상
      - 추가 할인 자격
      - 현재 샌드박스 후보는 +3%p, 전체 45% 상한
    must_not_say:
      - Care review 때문에 Favorable 자격 또는 추가 할인이 중지됨
      - 1~7%p가 최종 확정 요율임
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#2-월간연간-계산
      - IMPLEMENTATION.md#4-현재-할인율-구현

  - id: care-review-no-direct-price-effect
    topic: Care review의 가격 영향
    status: active
    layer: core
    effective_date: 2026-08-10
    approved_position_ko: "Care review는 조건을 충족한 그달의 안내와 사람 검토를 여는 신호다. 다음 달에는 다음 달 데이터로 다시 계산하며 MASIL이 지속적인 건강관리 책임을 맡는다는 뜻이 아니다. Care 자체가 자동 할증이나 자동 차감을 발생시키지 않으며, Favorable 추가 할인을 중지하지도 않는다."
    claim_type: team_decision
    must_include:
      - Care 자체는 자동 할증·자동 차감 없음
      - 사람 검토와 지원 리포트
      - 해당 월만 표시하고 다음 달 다시 계산
      - 연간 할인율은 별도 계산
    must_not_say:
      - Care 자체가 자동 할증·자동 차감을 만든다는 표현
      - Care 시 보너스 자동 정지 또는 유예
      - 한 달 Care = 13%p 차감이라는 인과
      - Care가 연말까지 유지되거나 건강관리 책임이 계속된다는 표현
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#3-care-review-계약
      - IMPLEMENTATION.md#3-care

  - id: care-review-trigger-contract
    topic: Care review 발동 조건과 의미
    status: active
    effective_date: 2026-08-09
    approved_position_ko: "이번 달 생활권 밖 비중이 직전 2개월 평균보다 25%p 이상 늘고, 위험행동 비중도 같은 비교에서 20%p 이상 늘어야 Care review가 열린다. 같은 달 AND 조건이며, 절대적으로 위험한 수준이 아니라 개인의 변화 신호를 찾는다."
    claim_type: team_decision
    must_include:
      - 이동 +25%p AND 위험행동 +20%p
      - 같은 달
      - 변화 신호
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#3-care-review-계약

  - id: stable-low-score-classification
    topic: 낮은 점수가 지속되는 운전자의 월별 등급
    status: active
    layer: core
    effective_date: 2026-08-10
    approved_position_ko: "점수가 계속 낮더라도 직전 2개월과 비교해 이동과 위험행동이 함께 급변하지 않았다면 Standard입니다. Care는 절대적으로 위험한 사람을 분류하는 등급이 아니라 평소보다 큰 변화가 나타난 그달을 알리는 등급입니다."
    claim_type: team_decision
    must_include:
      - 지속 저점수는 Standard
      - Care는 절대 수준이 아니라 개인의 변화 신호
      - 다음 달에는 같은 규칙으로 다시 계산
    must_not_say:
      - 통합점수 55점 미만이면 자동 Care
      - Pattern Change Risk 70점이면 자동 Care
    evidence_ref:
      - IMPLEMENTATION.md#3-care

  - id: out-of-zone-risk-and-no-location-penalty
    topic: 생활권 밖 위험과 위치 무감점 원칙
    status: active
    effective_date: 2026-08-09
    approved_position_ko: "문제 정의에서는 익숙하지 않은 생활권 밖 환경에서 위험이 커질 수 있다고 말한다. 상품 판정에서는 생활권 밖이라는 위치만으로 감점하지 않고, 밖에서의 실제 안전행동과 같은 달의 변화 맥락을 함께 본다."
    claim_type: team_decision
    must_include:
      - 생활권 밖은 위험 맥락
      - 위치만으로 감점하지 않음
      - 실제 안전행동을 함께 봄
    must_not_say:
      - 생활권 밖은 위험하지 않음
      - out-of-zone 자체가 자동 벌점
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#3-care-review-계약
      - knowledge/evidence/registry.yaml#presentation-ehsani-tefft-2021
      - knowledge/evidence/registry.yaml#presentation-hirsch-activity-space-2014
    evidence_links:
      - ref: knowledge/evidence/registry.yaml#presentation-ehsani-tefft-2021
        supports: 생활권 밖의 익숙하지 않은 도로에서 위험이 커질 수 있다는 문제정의
      - ref: knowledge/evidence/registry.yaml#presentation-hirsch-activity-space-2014
        supports: 활동공간 확대나 위치만으로 자동 감점하지 않는 상품 경계

  - id: dashboard-13-point-difference
    topic: 대시보드 13%p 차이 설명 (덱 p.3 Edward 사례)
    status: active
    layer: core
    effective_date: 2026-08-10
    approved_position_ko: "13%p 차이는 이 사례의 연간 시뮬레이션 결과입니다. 한 달 Care를 받았다고 자동으로 13%p가 깎이는 규칙이 아닙니다. Care는 검토와 지원을 열고, 연간 할인율은 연간 주행 기록으로 별도 계산합니다."
    approved_position_en: "The 13-point difference is the simulated annual proposal for this case. It is not an automatic penalty for one month of Care. Care triggers review and support. The annual discount is calculated separately from the annual driving record."
    claim_type: team_decision
    must_include:
      - 이 사례의 연간 시뮬레이션 결과
      - Care는 검토와 지원을 여는 신호
      - 연간 할인율은 연간 주행 기록으로 별도 계산
    must_not_say:
      - 13%p를 확정 요율·고정 차감 정책으로 제시
      - 한 달 Care = 13%p 차감이라는 인과
      - 최종 대시보드를 old/legacy 데모로 지칭
    evidence_ref:
      - deck://dashboard-appendix
      - sources/11_V20_결정_기록_0810.md#4-이전-데모-요율의-지위
      - knowledge/history/decision_log.yaml#decision-2026-08-09-care-price-decoupling

  - id: environment-consistency-59-of-60
    topic: 환경 간 실질 판정 일치
    status: active
    layer: deep
    effective_date: 2026-08-09
    approved_position_ko: "점수 판정과 Care 신호를 분리하는 내부 계산 기준으로 보면 60명 중 59명은 세 환경에서 실질 판정이 일치한다. 남은 1명은 통합점수 75점과 Favorable 9개월 기준 부근의 문턱 사례다. 이는 예측 정확도가 아니라 합성 시나리오의 규칙 일관성 결과다."
    claim_type: simulation_result
    must_include:
      - 59/60
      - 문턱 근처 1명
      - 합성 시나리오의 규칙 일관성
    must_not_say:
      - 54/60을 최신 실질 일치율로 제시
      - 대표 표본 또는 예측 정확도
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#5-시뮬레이션-해석-갱신

  - id: business-targets-not-measurements
    topic: 파일럿·가입·유지 목표값
    status: active
    effective_date: 2026-08-10
    approved_position_ko: "500명 파일럿, 자발 가입률 15–20%, 유지율 +2%p는 실측이나 예측이 아니라 파일럿에서 검증할 목표값이다."
    approved_position_en: "The 500-driver pilot, 15–20% voluntary enrollment, and +2 percentage-point retention uplift are targets to validate, not measurements or forecasts."
    claim_type: target
    must_include:
      - 목표값
      - 실측 아님
    must_not_say:
      - 성과
      - 예측치
      - 검증 완료
    evidence_ref:
      - sources/11_V20_결정_기록_0810.md#7-사업-숫자의-지위

  - id: masil-zone-formation
    topic: MASIL Zone 형성
    status: active
    effective_date: 2026-08-10
    approved_position_ko: "MASIL Zone은 행정구역이나 고정 원이 아니라 반복 방문 기록이 만드는 개인 생활권이다. 서로 다른 3일 이상 방문한 점을 ε=260m 시작값으로 거점화하고, 거점별 반경은 max(500m, min(개인 P90, 2km))로 정한다. 지도는 해당 월을 제외한 직전 2개월 기록으로 매달 다시 만든다."
    claim_type: team_decision
    must_include:
      - 3+ distinct visit days
      - ε=260m는 시작값
      - Core 500m · per-anchor P90 · 2km cap
      - rolling 2-month formation
    must_not_say:
      - 행정구역
      - 260m가 논문에서 직접 나온 확정값
      - more than 3 visitings
      - Safe Zone
    evidence_ref:
      - deck://appendix-b
      - presentation-isaacman-2011
      - presentation-zheng-2009
      - presentation-montoliu-gatica-perez-2010

  - id: simulation-validation-boundary
    topic: 합성 시뮬레이션이 검증한 것과 못 한 것
    status: active
    effective_date: 2026-08-10
    approved_position_ko: "60명 로스터를 3환경에 둔 180개 합성 시나리오와 80,032개 이벤트로 계산 재현성, 규칙 실행, Hold·예외 처리, 위치만으로 불이익을 주지 않는지를 시험했다. 실제 사고 예측력, 최종 요율, 손해율 개선, 고객 수용도는 검증하지 않았다."
    claim_type: simulation_result
    must_include:
      - 60 people × 3 environments = 180 scenarios
      - 80,032 synthetic events
      - product logic validation
      - not predictive validation
    must_not_say:
      - 180 drivers
      - representative sample
      - actual premium validated
      - accident reduction proven
    evidence_ref:
      - deck://summary-2
      - deck://appendix-d

  - id: ai-role-and-human-gate
    topic: AI 역할과 사람 결정
    status: active
    effective_date: 2026-08-10
    approved_position_ko: "AI는 합성 이동 맥락 생성과 설명문 작성에 보조적으로 쓰인다. 월 점수와 Care review는 공개된 고정 규칙으로 계산하며, AI가 보험료나 최종 고객 조치를 결정하지 않는다. Care 리포트는 직원 검토와 승인 뒤에만 전달한다."
    claim_type: team_decision
    must_include:
      - AI-assisted
      - fixed rule-based scoring
      - human review and staff approval
    must_not_say:
      - AI가 가중치 또는 보험료를 결정
      - 리포트 자동 발송
    evidence_ref:
      - deck://summary-2
      - deck://dashboard-customer-app

  - id: privacy-minimum-collection
    topic: 위치정보 최소수집
    status: active
    effective_date: 2026-08-10
    approved_position_ko: "운영 입력은 도착지 이벤트와 날짜에 한정하고 경로·궤적은 쓰지 않는다. POI 이름은 마스킹하며, 판정에는 생활권 안팎과 월별 집계값만 전달하는 권한 분리 구조를 지향한다. 법적 적합성은 파일럿 전 별도 검토가 필요하다."
    claim_type: team_decision
    must_include:
      - destination events, not routes
      - POI masking
      - minimum collection
      - legal review before pilot
    must_not_say:
      - 법무 검토 완료
      - 실시간 위치 공유
    evidence_ref:
      - deck://summary-2
      - deck://dashboard-customer-app

  - id: deck-literature-conflicts
    topic: 최종 덱에 남은 문헌 인용 경계
    status: active
    effective_date: 2026-08-10
