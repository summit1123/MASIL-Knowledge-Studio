      - 제안 시작값이며 논문 직접값 아님
      - 추후 k-거리 실측으로 재산정
    must_not_say:
      - 260m가 특정 논문의 직접 수치다
  - topic: 생활권 — 상품 반경 공식과 세 반경의 역할 분리
    approved_position_ko: "거점 확정 후 원 크기는 r_h = max(500m, min(P90_h, 2km))로 따로 정한다. 260m = 점을 묶는 자(탐지) · 500m = 보장(약속) · P90 = 실측(측정) · 2km = 상한 가드레일. 260m는 원의 크기에 들어가지 않는다. 흐름: 점 묶기(260m·3일) → 거점 확정 → 원 씌우기 → 원들의 합집합 = 생활권."
    claim_type: team_decision
    evidence_ref:
      - sources/부록B_해설_팀원용.md 1부 C
    must_include:
      - 원 공식은 500m·P90·2km로만 구성
      - "예시: P90 420m→500m(하한), 800m→800m(실측), 3.1km→2km(상한)"
    must_not_say:
      - eps(260m)를 바꾸면 생활권 원이 커진다
  - topic: 생활권 — 500m 보호 하한의 이유
    approved_position_ko: "500m는 측정이 고객에게 불리한 쪽으로 작동하지 않게 하는 보호 하한. 규칙적인 고객의 P90이 150m로 나오면 길 건너 주차(200m)가 '생활권 밖'이 되는 오염을 막는다. 출처는 국내 원안의 상품 원칙."
    claim_type: team_decision
    evidence_ref:
      - sources/부록B_해설_팀원용.md 파라미터 사전
  - topic: 생활권 — P90을 쓰는 이유 (최댓값·평균 배제)
    approved_position_ko: "P90은 그 거점 방문 거리의 90퍼센타일 — '방문의 90%가 들어오는 반경'. 장날 한 번의 원거리 주차에 원이 4배로 커지지 않게 하기 위해 최댓값·평균을 쓰지 않는다. 개인 실측이라 사람×거점마다 다르다."
    claim_type: team_decision
    evidence_ref:
      - sources/부록B_해설_팀원용.md 파라미터 사전
  - topic: 생활권 — 기준선 관찰 창 2개월 채택 근거 (푸아송 계산)
    layer: deep
    approved_position_ko: "월 2회짜리 뜸한 거점(격주 병원)을 놓치지 않는 최소 창을 계산: 평균 월 2회(λ=2) 푸아송으로 P(N≥3) = 1 − e^(−λT)·[1+λT+(λT)²/2]. 1개월 32.3%(세 번 중 두 번 놓침), 2개월 76.2%(채택), 3개월 93.8%(+17.6%p이나 서비스 시작 한 달 지연). 2개월 = 포착률과 시작 속도의 균형점. 단 76.2%는 실측이 아니라 가정(월 2회·불규칙) 위의 내부 추정이고, 3일 문턱·월 2회를 정해놓고 역산한 것이라 그 두 값 자체가 옳다는 증명은 아니며, 2개월은 유일한 최적값이 아니라 합리적 범위 안의 값(발송 답변서 5번 문장 그대로)."
    claim_type: team_decision
    evidence_ref:
      - sources/부록B_해설_팀원용.md 2부
      - 현장 피드백 답변서(발송본) 5번
      - 건강보험 통계 2022
      - 노인실태조사 2023
      - 소비자원 2024
      - Isaacman 2011
    must_include:
      - 76.2%는 실측 아닌 내부 추정
      - 2개월은 유일한 최적값이 아니라 합리적 범위 안의 값
      - 파일럿 재보정 대상
    must_not_say:
      - 76.2%는 실측 포착률이다
      - 2개월이 수학적 최적값이다
  - topic: "생활권 — '월 2회' 가정의 국내 통계 앵커"
    layer: deep
    approved_position_ko: "'가장 뜸한 생활 거점도 월 2회쯤은 간다'는 가정은 국내 공식 통계 실측 범위 안: 건강보험 통계 2022 — 65세+ 월평균 입내원 3.75일 · 노인실태조사 2023 — 경로당 이용자 주 2.9회 · 소비자원 2024 — 고령운전자 최빈 운전 빈도 주 3~5회(36.7%)."
    claim_type: external_fact
    evidence_ref:
      - 건강보험 통계 2022
      - 노인실태조사 2023
      - 소비자원 2024
  - topic: 생활권 — Isaacman 2011 인용 범위
    approved_position_ko: "Isaacman 2011은 통신 위치데이터로 반복 방문지를 찾은 대표 연구로, 60일 관찰에서 '전체 일수의 5% = 3일' 기준을 썼다 — 우리와 같은 창, 같은 문턱. 단 통신 데이터 연구이지 운전 연구가 아니므로 '단골 지점을 찾는다는 문제 구조가 같아 방법론으로 참고'까지만 말한다."
    claim_type: external_fact
    evidence_ref:
      - Isaacman 2011
      - 출처부록 5장(관찰 창 선례)
    must_include:
      - 통신 데이터 연구이지 운전 연구가 아님
    must_not_say:
      - 운전 데이터 연구가 같은 기준을 검증했다
  - topic: 생활권 — k-거리 재산정 계획 (ε 캘리브레이션)
    approved_position_ko: "판정할 때가 아니라 값을 갱신할 때 한 번 쓰는 정기 캘리브레이션. 파일럿에서 전체 방문점의 '다른 날 방문점 중 두 번째로 가까운 것까지의 거리'(k=2, 3일 규칙에서 자동 유도)를 지역 단위로 모아 분포를 보고, 재방문 산포(수십~이백 m)와 우연 방문(수백 m~수 km) 두 무리 사이의 경계를 ε으로 재산정. 시점: 파일럿(0~6개월) 4~6개월 차 1차 측정(고객 수백 명 × 2~3개월이면 방문점 수만 개로 충분), Scale-up 진입(6개월 차)부터 가입·갱신 고객에 반영, 기존 고객 계약 기간 중 소급 변경 없음, 이후 연 1회 재점검. HDBSCAN과 재는 양은 같으나(core distance = k번째 이웃 거리) HDBSCAN은 점마다·판정마다 달리 쓰고 우리는 전체에서 한 번 재서 모든 고객에게 같은 상수로 쓴다 — '모든 고객에게 같은 문장'이라는 판정 일관성 때문."
    claim_type: future_plan
    evidence_ref:
      - sources/부록B_해설_팀원용.md 보충
      - Ester et al. 1996 (DBSCAN 원논문, k-거리 표준 방법)
    must_include:
      - k=2는 고르는 값이 아니라 3일 규칙에서 유도
      - 판정용 아님 — 1회성 캘리브레이션
      - 기존 고객 소급 변경 없음
  - topic: 데이터생성 — 4단계 체인 전체 구조
    approved_position_ko: 데이터는 사람(문헌 기반 설계) → AI(인물 구조 생성) → 결정론 엔진(숫자 전개) → 통계(유형 분해) 네 단계로 만든다. ① 유형 정의(사람, 문헌 3축 — 요율에 닿는 기준을 AI가 정하지 않는다는 원칙) ② 인물·프로필(AI — 스키마 검증·재시도, 1회 생성 후 캐시 고정, 실존 지명 금지) ③ 이벤트 전개(결정론 엔진 — 시드 고정 sha256, 파라미터는 사람 설정) ④ 위험 유형 분해(TAAS — 표시 전용, 판정 미진입).
    claim_type: team_decision
    evidence_ref:
      - sources/데이터생성_상세정리.md 1절
      - sources/부록D_해설_팀원용.md 2절
    must_include:
      - 요율에 닿는 기준을 AI가 정하지 않는다
  - topic: 데이터생성 — 산출 규모와 파티션
    approved_position_ko: 60명 × 3환경(도심·교외·광역) = 180 시나리오 · 14개월(기준선 2 + 평가 12) · 주행 로그 80,032건 · 파티션 개발 108 / 검증 36 / 홀드아웃 36. 규칙은 어느 파티션에도 적합하지 않았다.
    claim_type: simulation_result
    evidence_ref:
      - sources/데이터생성_상세정리.md 1절·6절
  - topic: 유형 — 6개 페르소나의 설계 원리 (문헌 3축 조합)
    approved_position_ko: "유형은 고령 운전자 문헌에서 반복 확인되는 세 행동 축 — 이동범위 축소(LongROAD: 축소 이동범위 22.6% n=2,990 · 자기규제 1순위 야간 회피 58.8% n=1,557) · 만성 위험행동(CMT UBI 백서 2023 n≈10만: 행동 5분위 최상·최하위 클레임 빈도 약 3배, ⚠전 연령) · 운전 패턴 변화(DRIVES Neurology 2025 n=298: AUC 0.82 · Bayat 2021 n=139) — 의 조합. 각 유형은 '시스템의 어느 부분을 시험하는가'로 존재 이유가 정해지고, 통과해야 할 케이스뿐 아니라 실패해야 할 케이스(대조군)를 처음부터 설계에 포함했다. 인물화(60명)는 NVIDIA Nemotron-Personas의 방법론을 따라 팀이 자체 정의 — 데이터셋을 가져온 것이 아니다."
    claim_type: team_decision
    evidence_ref:
      - sources/데이터생성_상세정리.md 2절
      - sources/부록D_해설_팀원용.md 3절
    must_include:
      - CMT는 전 연령 데이터임을 병기
      - Nemotron은 방법론 자체 정의
    must_not_say:
      - Nemotron 데이터셋을 사용했다
  - topic: 유형 — 기대 vs 판정 실측 전량 (번들 집계)
    approved_position_ko: "① 안전 저주행·자기규제형: 기대 우대 → 실측 우대 27 · 보류 3(sparse 데이터 검증용) / ② 생활권 내 위험행동형: 기대 기본 → 기본 30 / ③ 이동변화 안전유지형(오탐 대조군): 기대 우대 → 우대 30 / ④ 동시변화형: 기대 케어 → 케어 30(점수 축은 기본 25·우대 5 — 케어가 우대를 이김) / ⑤ 복수 생활권형: 기대 우대 → 우대 30 / ⑥ 광역 이동·안정형: 기대 우대 → 우대 26 · 기본 1 · 보류 3(기본 1 = 광역 저밀도 문턱 근접, 통합점수 72~82·우대 월수 8/12 — 벌점 아님). 보류·기본의 존재가 오히려 정직성 카드."
    claim_type: simulation_result
    evidence_ref:
      - sources/부록D_해설_팀원용.md 0절 표
      - 번들 실측(유형별 판정 교차표)
    must_include:
      - ④ 점수 축 기본 25·우대 5
      - ⑥ 기본 1은 벌점 아님
    must_not_say:
      - "③·⑤를 '기본/기본'으로 표기 (시안 오류 — 실측은 30명 전원 우대)"
  - topic: 유형 — ③ 오탐 대조군(이동변화 안전유지형)의 역할과 결과
    approved_position_ko: "역편향 검증 — 이사·가족 돌봄으로 이동만 급변한 안전 운전자가 부당하게 불이익받지 않는지 시험. 페르소나를 미리 정한다고 보장되지 않는 결과라서 순환논증을 끊는 핵심 카드. 실측: 우대 30 전원 · 이동 임계 초과 191 케이스-월에도 케어 발동 0건 — 이 장표에서 가장 강한 두 숫자. '이사해도 불이익 없다'는 최강 실측."
    claim_type: simulation_result
    evidence_ref:
      - sources/부록D_해설_팀원용.md 3절 ③·6절
      - sources/데이터생성_상세정리.md 6절
    must_include:
      - 191 케이스-월 · 케어 0건
  - topic: 유형 — 순환논증 반박 논리 (검증 3조건)
    approved_position_ko: "'페르소나를 먼저 정하니 결과가 예쁘게 나온다'는 지적에 대한 답: 케어형이 케어로 나온 건 증명이 아니고, 케어로 설계 안 한 유형이 케어로 새지 않은 것(0/30)이 증명. 세 조건: ① 판정이 라벨을 모른다(판정 함수는 유형·시나리오 라벨을 입력받지 않음) ② 실패해야 할 케이스가 실패한다(③ 대조군: 이동 임계 초과 191 케이스-월, 케어 0건) ③ 규칙이 데이터에 적합되지 않았다(파티션 108/36/36, 시드 고정 재현)."
    claim_type: team_decision
    evidence_ref:
      - sources/부록D_해설_팀원용.md 1절·6절
      - sources/데이터생성_상세정리.md 6절
  - topic: 데이터생성 — AI의 경계 (만드는 것 / 못 만드는 것)
    approved_position_ko: "AI가 만드는 것: 인물의 생활 구조 — 자주 가는 장소(전원 합성 라벨, 실존 지명 금지 가드), 장소별 방문 비중·방향(bearing)·거리대(band), 패턴 변화 시점(change_month)과 계기 서사. AI가 정하지 않는 것: 방문 빈도·주행거리·위험률의 수치, 판정 규칙과 가중치, 케어 임계 — 전부 사람 설정. 강제 장치: 거리대는 유형 역할로 강제 · 위험 크기는 아키타입 고정 · 캐시 커밋(검사 가능). AI의 다른 역할은 판정 결과를 문장으로 옮기는 리포트 하나뿐."
    claim_type: team_decision
    evidence_ref:
      - sources/데이터생성_상세정리.md 3절
      - sources/부록D_해설_팀원용.md 5절
    must_not_say:
      - AI가 수치·판정 규칙·가중치·케어 임계를 정한다
  - topic: 데이터생성 — 파라미터 원칙 (문헌 회랑)
    approved_position_ko: 문헌이 숫자를 주는 게 아니라 분포를 주고, 우리 값이 그 분포의 어디에 있는지를 표로 제시한다. 자릿수 하나까지의 근거는 주장하지 않는다. 우리 확률값(빈도·위험률)은 경험적 분포가 아니라 설계값임을 인정하고, 문헌 분포에서의 위치로 방어한다.
    claim_type: team_decision
    evidence_ref:
      - sources/데이터생성_상세정리.md 4절
      - sources/부록D_해설_팀원용.md 4절
    must_include:
      - 설계값임을 인정
    must_not_say:
