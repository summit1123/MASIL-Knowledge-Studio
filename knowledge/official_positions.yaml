  - topic: 로드맵 — 캘리브레이션과 eps 재도출
    approved_position_ko: "가중치는 파일럿 경험 손해율로 위험군 식별력·손해율 개선 목표에 재적합하고 채널별 분산으로 신뢰도를 정식 추정한다. 실데이터에서는 지역별 eps를 k-거리 그래프(원논문 표준 휴리스틱)로 재도출(같은 날 중복은 하루로 접은 뒤 무릎점 선택) — '도시냐 농촌이냐' 분류 판단이 '산포 측정'으로 바뀌고 지역 티어는 콜드스타트 초기값만 남는다. 운영 분류는 DEGURBA(인구밀도 1,500/300) 채택. 파라미터 철학: 정할 수 없는 동안은 문헌과 원리로 시작하고, 잴 수 있게 되면 잰다."
