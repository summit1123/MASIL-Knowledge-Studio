    approved_position_ko: "트립 ≠ 방문지 — '집→마트→집'은 트립 2회, 방문지 1곳. 우리 값은 도착지 기준이므로 '고유 목적지'와 비교한다. 국내 통행 통계는 목적통행 기준이고 65세+ 목적통행의 48%가 '귀가'이므로 방문지 ≈ 통행 × 0.52로 환산했다. 해외 코호트는 '주 1회 이상 운전' 등록 요건으로 상향 편향, 국내는 무통행자 포함으로 하향 편향 — '두 범위 사이를 훑는다'고 서술한다."
