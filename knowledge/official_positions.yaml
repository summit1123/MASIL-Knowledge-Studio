  - topic: 10번 — DBSCAN 3층 설계
    approved_position_ko: "밀도 한계는 DBSCAN 원논문(Ester 1996 p.229)이 자인한 문제로, 이를 설계 전제로 3층을 만들었다: ①기준거리 260m(문헌 대역 200~300m 한가운데) — 합성 3환경 엔진값 260/520/1,100m는 지리 축척(×2) 정합 ②밀도 단독으로 거점 불인정('서로 다른 3일' AND, 같은 날 중복 1일 계수) ③원의 크기를 군집 모양에서 분리(중심권 500m + 개인 P90, 상한 2km). 1층이 결과를 떠받치지 않는다 — 전국 단일 260m 재판정 시 판정 변화 사실상 없음(고정 기준 0/180, rolling 3/180 경계)."
    claim_type: team_decision
    evidence_ref:
      - Ester et al. 1996 (DBSCAN KDD-96)
      - Zheng et al. 2009 · Montoliu et al. 2013
      - Isaacman et al. 2011
      - "arXiv:1807.00546"
      - 활동공간 체계적 리뷰 47편 (PMC6737923)
    must_include:
      - "'문헌 기준값 1 + 규칙 1'(임의 숫자 3개 아님)"
      - 실제 안전판은 2·3층
    must_not_say:
      - 260m가 확정된 절대값이다
  - topic: 10번 — 클러스터링 실측 채점표
    approved_position_ko: "60명 로스터 × 3환경 = 180케이스 실측: 과병합률 0.0%(3환경 모두), 정기거점 누락률 1.6/2.4/3.1%(환경당 1~2건), 파편화 3.1%, 존 안정성 IoU 0.943/0.910/0.828, 방문점 커버리지 90.9/90.5/85.9%. 누락률은 HDBSCAN 전 설정에서도 동일(1.6/2.4/3.1) — 누락은 알고리즘이 아니라 관측량에서 발생. 도심 eps를 900m까지 3배 키워도 과병합 0%, 1,100m에서 3.6% 최초 발생 — 환경별로 측정된 안전 구간."
    claim_type: simulation_result
    evidence_ref:
      - data/fixtures/gaip_algorithm_lab.json
    must_include:
      - 무한한 안전이 아니라 측정된 안전 구간이라는 수위
  - topic: 10번 — HDBSCAN 대비 현행 유지
    approved_position_ko: "유리한 쪽으로 말하지 않는다: 적정 설정(min_cluster_size 5/min_samples 3)에서 커버리지·존 안정성은 동급이고 정답 존 모양 적합도는 HDBSCAN이 더 높다(0.879~0.935 대 0.715~0.880). 거점 파편화는 현행이 낮다(3.1% 대 11.8%, 느슨 설정 3/2에서 최대 47.2%). 현행 유지 이유는 성능이 아니라 반경 근거의 출처와 설명가능성 — 260m는 문헌·실측으로 약관·고객 설명이 되지만 '무리 3'은 소표본 밀도 추정이라 같은 설명이 불가. 사람당 점 수백 개가 되는 실데이터 파일럿에서 승격 후보이며 전환 조건까지 정의해 뒀다."
    claim_type: team_decision
    evidence_ref:
      - data/fixtures/gaip_algorithm_lab.json
    must_include:
      - HDBSCAN 우위 지표를 먼저 인정
      - 단, 실험실은 군집 지표까지만 측정하고 판정 재실행은 미포함
    must_not_say:
      - HDBSCAN은 커버리지 72%로 기각
  - topic: 10번 — 심사위원 제안 4건 개별 평가
    approved_position_ko: "ⓐ행렬 균일 밀도 보정: 목적 동의·이방성은 이미 하버사인 미터로 처리, 지역별 행렬 = 지역별 eps의 행렬 표기. ⓑ좌표계 비선형 변환: 타당하나 변환 후 반경이 미터 의미를 잃어 설명·감사 불가, 새 임의 파라미터 발생 — 연속화 버전으로 로드맵 수용. ⓒ비유클리드 공간: 가장 흥미로우나 도로망 거리는 경로 재구성 필요(거버넌스상 폴리라인 미수집) — 파일럿에서 등시선 기반 eps 검토. ⓓrisk-neutral 할인율: 적용 경로 불분명 — 두 해석(①기준선 시간 할인 ②지역 위험 요율 중립화 — 이미 location_penalty 0.0)을 준비하고 심사위원 의도를 여쭙고 반영한다. (확인 필요: ⓓ의 의도)"
    claim_type: team_decision
    evidence_ref:
      - Birant & Kut 2007 (ST-DBSCAN)
    must_include:
      - ⓓ는 되묻는 것이 공식 대응
    must_not_say:
      - risk-neutral 제안을 이해한 척 임의 해석으로 단정
  - topic: 11번 — 가중치 30/30/20/20의 지위
    approved_position_ko: "30/30/20/20은 요율이 아니라 기존 요율체계(마일리지 할인) 위에 얹는 할인 자격 점수의 배분(오버레이)이다. 할증 항목이 코드에 없고(candidate_surcharge_rate_pct 0.0), 하한 0·상한 45%. 실측 180 시나리오 할증 0 전건, 150건이 기존 마일리지 대비 동등 이상 유리, 113건은 보험료 더 낮음 — 가중치 오차의 최대 피해는 '덜 깎임'이지 '더 냄'이 아니다. 네 축은 순보험료 분해에 1:1 대응(노출 30, 빈도율 50=안30+밖20, 장래위험 20). 주장하는 것은 값이 아니라 순서이며, 값은 파일럿 손해율로 재보정될 사전 설계값(prior)이다."
    claim_type: team_decision
    evidence_ref:
      - Candrive/Ozcandrive (Langford et al. 2013)
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    must_include:
      - 노출 30에서 멈춘 이유 = 저주행≠저위험(Candrive)
      - "민감도 969 실측: ±5 이웃 판정 변화 중앙 3·최대 9건"
    must_not_say:
      - AI가 가중치를 선정
      - "사고분포 유도식(80:20×2.5배)"
  - topic: 11번 — 안 30 > 밖 20 = 신뢰도 원리(수위 명시)
    approved_position_ko: "관측 많고 교란 적은 채널에 큰 가중(생활권 안 주행 비중 전건 86.0%·개인 중앙값 89.1%). 미관측 채널은 배점 제외 후 재정규화(PARTIAL_SCORE_COMPONENTS_RENORMALIZED), 커버리지 80% 미만은 판정 유보(INSUFFICIENT_EVIDENCE). 단 뷜만 신뢰도를 적용했다고 말하지 않는다 — Z=n/(n+k)를 수치로 추정한 적 없고 원리를 따른 보수적 근사(연속 z 대신 0/1 두 단)이며, 파일럿 채널별 분산 실측으로 정식 추정에 대체된다. 배분 위치는 회랑의 중간: 비례 35:15(실측 85%면 ~43:7) ↔ 균등 25:25 사이에서 균등 쪽으로 당긴 30:20."
    claim_type: team_decision
    evidence_ref:
      - data/fixtures/gaip_algorithm_lab.json
    must_include:
      - 소비자 보호 방향의 단순화라는 성격
    must_not_say:
      - 뷜만 신뢰도를 적용했다
  - topic: 11번 — 지역 중립성의 수위
    approved_position_ko: "통제 불가 속성(거주지·위치·연령)에 벌점 경로가 없다(location_penalty 0.0, outer_zone_policy context_only_no_location_penalty). 밖 비중을 배점에 섞는 부결안('3층 재구성안' 25/40/35)은 환경별 안 비중 격차(도심 89.7%·교외 87.1%·광역 81.1%) 때문에 실력이 같아도 거주 환경으로 배점이 갈려 부결됐다. 다만 완전 중립이라고 말하지 않는다 — 같은 사람 3환경 실측 케어 60/60 일치·우대 54/60이고, 갈린 6명은 케어 발동 5 + 문턱 효과 1(벌점 아님). 지역 중립성은 이 배분의 목적이 아니라 부수 효과다."
    claim_type: team_decision
    evidence_ref:
      - data/fixtures/gaip_algorithm_lab.json
    must_include:
      - 우대 54/60의 6명 내역 설명 가능해야 함
    must_not_say:
      - 완전 지역 중립
      - 밖 이벤트 ×λ 가중
      - 밖 비중 절대수준 배점
  - topic: 12번 — 사고 심도 비예측
    approved_position_ko: "심도를 예측하지 않는다. 판정 입력은 화이트리스트 8개(decision_feature_contract.allowed_inputs: zone_available, data_coverage_pct, 4축 점수, mobility_change_index, risky_behavior_change_index)로 고정되고 심도·손해액·사고 라벨은 없다. 심도 등장 자리는 셋이고 셋 다 판정 밖: (a)문제 배경(필요성 근거) (b)유형 분해 표시 전용(가중치 교체 후 180건 diff 0) (c)경제성 감도 분석(1.0×/1.2×). 예측하지 않는 이유: 사고 후 결과 변수, 손해액 라벨 부재, 신체 취약성 기반 심도 예측은 인수차별 논란 직결. 문제정의 장표에서 심도 인과 서술을 들어냈고 '300만원' 통계는 원출처 미확인으로 덱 제거 확정."
    claim_type: team_decision
    evidence_ref:
      - ERSO
      - TAAS 2010–2024
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    must_include:
      - "'저희는 사고 심도를 예측하지 않습니다'를 먼저 선언"
      - 요율 영향은 보너스 정지 + 그해 할인 13%p 축소, 하한 0%로 할증 불가
    must_not_say:
      - 생활권 밖 = 사고 심도 증가(판정 근거로)
