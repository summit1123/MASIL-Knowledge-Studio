  - topic: 부록 B — 실측 검증 총괄
    approved_position_ko: 케어 판정 환경 간 일치 60/60 · 우대 54/60(갈린 6명 = 케어 발동 5 + 광역 문턱 근접 1, 설계된 동작) · 과병합 0/60 · 정기 거점 누락 1~2/60 · 오탐 대조군(이동만 급변) 0/30 케어 미발동 · 케어 게이트(이동·행동 동시 급변) 30/30 발동 위반 0 · pytest 254(판정 계약 27)+JS 22(UI–엔진 180건 일치 검증 포함) · 80,032트립 중복 0·이상치 0·18셀×10명·연 주행 중앙값 2,829km · TAAS 가중치 표시 전용 판정 diff 0.
    claim_type: simulation_result
