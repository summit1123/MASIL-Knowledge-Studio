  - topic: 부록 C — 산식·파라미터 전체
    layer: deep
    approved_position_ko: "기준선 2개월(2025-11~12)+평가 12개월(2026-01~12)=14개월. 흐름: 생활권 생성(매달 직전 2개월 재군집, 실패 시 직전 지도 폴백)→존 판정(하버사인, core≤500m 고정/buffer=max(core,min(P90,2,000m))/outer)→월별 집계→4축 점수(주행 브래킷, 안·밖 동일 함수 score=10+90×exp(−rate/12), 패턴=max(0,100−change×100))→통합점수(미관측 축 재정규화, reward≥75, coverage<80 보류)→케어 2단계(감지 trail≥0.25 AND 0.20 / 유지 기준선 대비, 미달 달 자동 해제, 첫 2개월 발동 불가)→연간 판정(reward≥9개월, hold: 유효 달<9, care: ANY)→요율 샌드박스(bonus 1.0~7.0, care 시 −13.0, clip 0~45, surcharge 0.0). 모든 값은 DEFAULT_PRODUCT_RULES 선언 상수, tariff_status = illustrative_economics_sandbox_not_final_tariff."
    claim_type: team_decision
    evidence_ref:
      - 코드 실물 (src/gaip_simulation/engine.py · clustering.py · taas_risk_weights.py · scripts/loss_ratio_counterfactual.py · mobility_profiles.json)
    must_include:
      - 요율 샌드박스는 예시 경제성이지 최종 요율이 아님(tariff_status)
  - topic: 부록 C — 위치가 등장하는 지점 전수
    approved_position_ko: "위치의 역할은 5곳뿐: ①생활권 생성(거점 좌표로 원) ②존 판정(안/밖 채점 칸 배정) ④점수(안·밖 같은 함수, 밖 가중치만 낮음 30 vs 20) ⑥케어(밖 비중의 변화량만, 절대 수준 미사용) ⑤판정(location_penalty=0.0 상수). 밖 주행 0인 달은 out_zone_safe_score=None으로 채점 제외 후 나머지 80 가중치로 재정규화 — 밖에 나가지 않아도, 나가서 안전해도 손해가 없다."
