    approved_position_ko: 그래서 우리는 위치로 벌하지 않는다 → 실제로 안(30)을 밖(20)보다 무겁게, 같은 잣대로 채점한다. location_penalty 0.0이 전 반환 경로에 하드코딩돼 있고 _safety_score 동일 함수가 양쪽에 적용된다. 12개 항목 중 가장 단단한 항목 — 전 고리가 ○ 또는 ◎.
