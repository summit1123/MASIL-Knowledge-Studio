[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "masil-knowledge-mcp"
version = "0.7.2"
description = "FastMCP 2 server for the MASIL presentation knowledge studio"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastmcp>=2.12,<3",
  "python-dotenv>=1.1",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[project.scripts]
masil-mcp = "masil_mcp.server:main"
masil-mcp-check = "masil_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/masil_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
